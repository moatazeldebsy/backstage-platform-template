# Default values for service-template.
# Override in your service's values.yaml.

replicaCount: 2

# Pods must be Running AND passing readiness for this many seconds before they
# receive traffic. Prevents nginx from hitting a pod that just passed its first
# readiness check but isn't fully warm yet.
minReadySeconds: 10

image:
  repository: ""   # Set to your ECR repository URL
  tag: "local"     # Never use "latest" — blocked by deny-latest-tag policy in services-prod
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: "nginx"   # "alb" for AWS, "nginx" for local — override in service's helm-values.yaml
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    # Retry on upstream errors/timeouts so a single slow pod doesn't 503 the user
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout"
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "3"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Health check endpoints (convention).
# Defaults are tuned to survive cold starts on heavier runtimes (JVM, large
# Node bundles) without per-service overrides. Override for services that
# *should* be evicted faster.
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5
  successThreshold: 1

# Grace period given to a terminating pod before SIGTERM. nginx takes ~2 s to
# remove a pod from its upstream list; this sleep ensures no in-flight requests
# are dropped during a rolling update or pod eviction.
lifecycle:
  preStop:
    exec:
      command: ["/bin/sh", "-c", "sleep 5"]

# Argo Rollouts canary strategy — opt-in per service.
# When enabled: renders an Argo Rollout instead of a Deployment and adds a
# canary Service. Requires Argo Rollouts controller + http-error-rate
# ClusterAnalysisTemplate deployed in the cluster.
# Set rollout.enabled: true in the service's helm-values overlay to opt in.
rollout:
  enabled: false

  # canary   — shift traffic gradually, analysing at each step. Default.
  # blueGreen — run the new version alongside the old at full size, cut over in
  #             one step. Prefer it for session-affine or stateful services, when
  #             analysis is expensive, or when instant rollback matters more than
  #             limiting blast radius.
  strategy: canary

  # Thresholds are passed to the ClusterAnalysisTemplate as args rather than
  # being baked into it. The template stays a single cluster-scoped resource --
  # its PromQL carries several hard-won fixes (the status_code label name, the
  # `or vector(0)` guard, clamp_min) and duplicating it per service is how those
  # silently regress -- while the numbers become per-service.
  analysis:
    enabled: true
    templateName: http-error-rate
    clusterScope: true
    errorRateThreshold: "0.01"      # fraction, not percent: 0.01 = 1%
    latencyThresholdSeconds: "0.5"

  canary:
    # Full step list. Leave empty to get the legacy 20 -> analysis -> 50 ->
    # analysis -> 100 sequence built from the three deprecated keys below.
    # An `analysis: {}` entry expands to the templates+args block.
    steps: []
    #  - setWeight: 20
    #  - pause: { duration: 2m }
    #  - analysis: {}
    #  - setWeight: 50
    #  - pause: { duration: 5m }
    #  - analysis: {}

    # DEPRECATED — used only when steps is empty. Kept so existing overlays
    # (services/hello-service/helm-values-local.yaml) keep working unchanged.
    initialWeight: 20         # % of traffic routed to canary pods in step 1
    step1PauseDuration: "2m"  # how long to observe at initialWeight before analysis
    step2PauseDuration: "5m"  # how long to observe at 50% before promoting to 100%

  blueGreen:
    # false means a human promotes via `kubectl argo rollouts promote`. That is
    # the point of blue-green: the new version is fully up and verifiable before
    # any traffic moves.
    autoPromotionEnabled: false
    autoPromotionSeconds: 0
    scaleDownDelaySeconds: 30
    # Blue-green doubles the pod count during promotion. On a single-node local
    # cluster set this to 1 so the preview stack does not evict the platform.
    previewReplicaCount: null
    prePromotionAnalysis: true
    postPromotionAnalysis: false

# HPA is enabled by default so services on the golden path absorb traffic
# spikes without manual scaling. Disable in dev/local overlays (e.g.
# `helm-values-local.yaml`) when running a single replica is fine.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

serviceAccount:
  create: true
  annotations: {}
  name: ""

# RBAC: create a ClusterRole + ClusterRoleBinding for the service account.
# Useful for services that need to query the Kubernetes API (e.g. list deployments).
rbac:
  create: false
  # rules follow the standard ClusterRole rules format.
  rules: []
  # Example for an MCP server that needs to list deployments:
  # rules:
  #   - apiGroups: ["apps"]
  #     resources: ["deployments"]
  #     verbs: ["get", "list", "watch"]

# PodDisruptionBudget — keeps minAvailable pods running during voluntary disruptions
# (node drains, cluster upgrades). Disable only for single-replica dev overlays.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

# Additional labels applied to every pod — use for cost attribution and team ownership.
# Example:
#   team: platform-team
#   cost-center: eng-platform
#   environment: dev
podLabels: {}

backstage:
  # Override the backstage.io/kubernetes-id pod label.
  # Defaults to .Release.Name if empty. Set to the service name (without env suffix)
  # so Backstage K8s plugin can match pods to the component by name.
  kubernetesId: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Contract testing hooks — self-describing + self-testing on every ArgoCD sync.
# PostSync: pulls /openapi.json from the service and runs a compatibility report.
# PreSync: blocks deploy if breaking changes detected (requires fromVersion + toVersion).
contractCheck:
  enabled: false
  mcpServerUrl: "http://contract-mcp-server.services-dev.svc.cluster.local:3003"
  # Pinned rather than :latest — every scaffolded service inherits this chart,
  # so a moving tag means the sync hooks can change under already-deployed
  # services with no change on our side. Bump deliberately; curl ships CVE
  # fixes regularly, so this is worth keeping current.
  image:
    repository: alpine/curl
    tag: "8.21.0"
  # Set checkBreaking: true and provide versions to enable the PreSync blocking check.
  checkBreaking: false
  fromVersion: ""   # currently-deployed version (set in CI: --set contractCheck.fromVersion=1.0.0)
  toVersion: ""     # version being deployed   (set in CI: --set contractCheck.toVersion=2.0.0)

env: []
  # - name: LOG_LEVEL
  #   value: info

envFrom: []
  # - secretRef:
  #     name: my-service-secrets

nodeSelector: {}
tolerations: []
# affinity is built by the chart template using selectorLabels — override here if needed
affinity: {}

# Prometheus ServiceMonitor — enable to have prometheus-operator scrape this service
metrics:
  enabled: true
  path: /metrics
  # Named port the ServiceMonitor scrapes. Use "http" for services that expose
  # /metrics on their main port. Set to "metrics" for sidecar exporters (e.g.
  # nginx-prometheus-exporter on :9113) that add an extraPort named "metrics".
  port: http
  interval: 30s
  scrapeTimeout: 10s

# Datadog APM / unified service tagging — opt-in per service via the enable-datadog-apm
# scaffolder template (backstage/catalog/templates/enable-datadog-apm/). Independent of
# the Prometheus `metrics` block above — see docs/sre-reliability.md "Datadog Infra
# Observability & APM" for why the two collection domains are kept separate.
datadog:
  enabled: false
  env: ""
  service: ""
  version: ""

# Additional sidecar containers injected into the Pod alongside the main container.
# Useful for metrics exporters, log shippers, etc.
# Each entry is a full Kubernetes container spec.
extraContainers: []

# Additional ports added to the Service (and the corresponding container ports
# should be declared inside extraContainers). Used when a sidecar exposes a
# metrics port that needs to be reachable by the ServiceMonitor.
extraPorts: []
