{{- if and .Values.rbac.create .Values.serviceAccount.create -}}
{{/*
  Cluster-scoped resources have no namespace to disambiguate them, so the name
  must be unique per INSTALL, not per service. It used to be plain
  `service-template.fullname`, which every service pins with fullnameOverride —
  so idp-mcp-server in services-dev and idp-mcp-server in services-staging
  rendered the identical ClusterRole name and fought over one object. ArgoCD
  reported it as a SharedResourceWarning and left one Application permanently
  OutOfSync, which surfaced the moment the promotion chain first moved an MCP
  server into staging. Observed 2026-08-16.

  The namespace suffix is what makes it per-install: Deployments, Services and
  ServiceAccounts are namespaced and may keep the shared name.
*/}}
{{- $clusterScopedName := printf "%s-%s" (include "service-template.fullname" .) .Release.Namespace -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $clusterScopedName }}
  labels:
    {{- include "service-template.labels" . | nindent 4 }}
rules:
  {{- toYaml .Values.rbac.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $clusterScopedName }}
  labels:
    {{- include "service-template.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $clusterScopedName }}
subjects:
  - kind: ServiceAccount
    name: {{ include "service-template.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
