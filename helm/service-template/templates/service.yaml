apiVersion: v1
kind: Service
metadata:
  name: {{ include "service-template.fullname" . }}
  labels:
    {{- include "service-template.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  {{- range .Values.extraPorts }}
    - port: {{ .port }}
      targetPort: {{ .targetPort }}
      protocol: {{ .protocol | default "TCP" }}
      name: {{ .name }}
  {{- end }}
  selector:
    {{- include "service-template.selectorLabels" . | nindent 4 }}
{{- if .Values.rollout.enabled }}
---
# Canary service — Argo Rollouts routes a percentage of traffic here during canary steps
apiVersion: v1
kind: Service
metadata:
  name: {{ include "service-template.fullname" . }}-canary
  labels:
    {{- include "service-template.labels" . | nindent 4 }}
    rollout-type: canary
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "service-template.selectorLabels" . | nindent 4 }}
{{- end }}
