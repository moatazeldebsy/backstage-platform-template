{{/*
The capability check is not belt-and-braces — without it, installing this chart
on a cluster that has no prometheus-operator fails the WHOLE release with
`no matches for kind "ServiceMonitor" in version "monitoring.coreos.com/v1"`,
because Helm validates every rendered object against the API server. A monitoring
resource then takes the service down with it.

That is not hypothetical: on 2026-09-04 a cluster brought up with
`bootstrap-local.sh --skip-obs` (no kube-prometheus-stack, so no CRD) failed
every single MCP server deploy this way, and bootstrap-ai.sh reported
"Bootstrap Complete" over the top of it.

Skipping the ServiceMonitor when the CRD is absent loses nothing: there is no
operator to consume it. `metrics.enabled` stays the intent switch — this only
asks whether anything can act on that intent.
*/}}
{{- if and .Values.metrics.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "service-template.fullname" . }}
  labels:
    {{- include "service-template.labels" . | nindent 4 }}
    release: prometheus
spec:
  # Use the plain service name (not the mangled "<release>-service-template"
  # ServiceMonitor name) as the Prometheus `job` label, so Sloth SLO specs
  # (which assume job="<serviceName>") match real metrics regardless of the
  # Helm release name used per environment.
  jobLabel: backstage.io/kubernetes-id
  selector:
    matchLabels:
      {{- include "service-template.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: {{ .Values.metrics.port | default "http" }}
      path: {{ .Values.metrics.path | default "/metrics" }}
      interval: {{ .Values.metrics.interval | default "30s" }}
      scrapeTimeout: {{ .Values.metrics.scrapeTimeout | default "10s" }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
{{- end }}
