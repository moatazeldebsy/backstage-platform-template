    - Pilot Kickoff: shift-left-pilot-kickoff.md
    - Demo Cheatsheet: shift-left-demo-cheatsheet.md
  - Security: security.md
  - Security Scanning (SonarCloud + Snyk): security-scanning.md
  - Demo Runbook: demo-runbook.md
  - Readiness Checklist: readiness-checklist.md
