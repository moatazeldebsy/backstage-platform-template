site_name: Internal Developer Platform
site_description: Golden-path platform for building and deploying services on EKS
repo_url: https://github.com/moatazeldebsy/backstage-platform-template
repo_name: moatazeldebsy/backstage-platform-template
edit_uri: edit/main/docs/

# Theme features and extensions are limited to what mkdocs-material and
# mkdocs-techdocs-core ship, at the versions pinned in ci.yml (techdocs-build)
# and docs.yml. The same mkdocs.yml renders the Backstage Docs tab, so a
# feature that needs an extra pip plugin builds on GitHub Pages but breaks
# TechDocs.
theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra_css:
  - stylesheets/extra.css

plugins:
  - techdocs-core:
      use_material_search: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

