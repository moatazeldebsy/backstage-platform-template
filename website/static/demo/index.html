<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IDP Portal Demo</title>
  <meta name="description" content="Clickable demo of the platform's Backstage portal with fictional data. Not a live platform.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23171717'/%3E%3Cpath d='M16 5l10 5-10 5-10-5z' fill='%237df3e1'/%3E%3Cpath d='M6 15l10 5 10-5M6 20l10 5 10-5' fill='none' stroke='%237df3e1' stroke-width='2.2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css?v=6">
  <script>
    // Apply a saved theme before first paint to avoid a flash.
    try { var t = localStorage.getItem('idp-demo-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <div class="demo-banner" id="banner" role="note">
    <strong>Demo data · not a live platform.</strong>
    <span class="hide-sm">A static mock of the Backstage portal; names and numbers are made up.</span>
    <a href="https://moatazeldebsy.github.io/backstage-platform-template/">Read the docs</a>
    <button type="button" id="theme-btn" data-action="toggle-theme">Dark theme</button>
  </div>
  <div class="app">
    <nav class="sidebar" id="sidebar" aria-label="Main navigation"></nav>
    <div class="scrim" data-action="close-nav"></div>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
  <nav class="mobile-bar" aria-label="Mobile navigation">
    <button type="button" data-action="open-nav" id="menu-btn" aria-controls="sidebar" aria-expanded="false"></button>
    <a href="#/" id="mb-home"></a>
    <button type="button" data-action="open-search" id="mb-search"></button>
  </nav>
  <div id="modal-root"></div>
  <script src="data.js?v=6"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
