<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IDP Platform Demo</title>
  <meta name="description" content="Clickable demo of the Internal Developer Platform with fictional data. Not a live platform.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f3bd6'/%3E%3Cpath d='M9 10h14M9 16h10M9 22h14' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
  <script>
    // Apply a saved theme before first paint to avoid a flash.
    try { var t = localStorage.getItem('idp-demo-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <div class="banner" id="banner" role="note">
    <strong>Demo data · not a live platform.</strong>
    <span class="hide-sm">Every number and name here is made up.</span>
    <a href="https://moatazeldebsy.github.io/backstage-platform-template/">Read the docs</a>
  </div>
  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Main navigation"></nav>
    <div class="scrim" id="scrim" data-action="close-nav"></div>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false" data-action="open-nav"></button>
        <div class="search" role="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M11 11m-7 0a7 7 0 1 0 14 0a7 7 0 1 0-14 0M21 21l-5-5"/></svg>
          <label for="global-search" class="sr-only">Search the platform</label>
          <input id="global-search" type="search" placeholder="Search services, templates, pages…  ( / )" autocomplete="off" aria-controls="search-results" aria-expanded="false">
          <div class="search-results" id="search-results" hidden></div>
        </div>
        <div class="topbar-spacer"></div>
        <button class="icon-btn" id="theme-btn" type="button" aria-label="Toggle dark mode" data-action="toggle-theme"></button>
        <div class="avatar" title="Alex Rivera (platform-team)" aria-hidden="true">AR</div>
      </header>
      <main class="content" id="content" tabindex="-1"></main>
    </div>
  </div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
