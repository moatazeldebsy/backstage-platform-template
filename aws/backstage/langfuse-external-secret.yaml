# ExternalSecret — builds LANGFUSE_BASIC_AUTH for Backstage's /langfuse proxy
# from the project key pair bootstrap-ai.sh mirrors to Secrets Manager
# (idp-mvp/langfuse/project-keys). Applied by bootstrap-ai.sh, not bootstrap.sh:
# that secret only exists once Langfuse is installed, and applying this earlier
# would leave an ExternalSecret stuck in SecretSyncedError on every install
# without the AI stack.
#
# Replaces the `kubectl set env deployment/backstage LANGFUSE_BASIC_AUTH=...`
# bootstrap-ai.sh used to run, which put the credential in plaintext in the
# Deployment spec and was dropped by any re-apply of deployment.yaml (#317).
# deployment.yaml reads this Secret through an optional envFrom, so Backstage
# starts normally when Langfuse is not installed.
#
# Uses the aws-secrets-manager SecretStore from external-secret.yaml (same
# namespace, same IRSA role — terraform/iam.tf grants it read on this path).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-langfuse
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: backstage-langfuse
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # The proxy sends `Authorization: Basic ${LANGFUSE_BASIC_AUTH}`, so this
        # is base64("<public key>:<secret key>"), the same value the
        # langfuse-init Secret yields locally.
        LANGFUSE_BASIC_AUTH: '{{ printf "%s:%s" .LANGFUSE_PUBLIC_KEY .LANGFUSE_SECRET_KEY | b64enc }}'
  dataFrom:
    - extract:
        key: idp-mvp/langfuse/project-keys
