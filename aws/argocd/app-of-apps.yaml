# ArgoCD ApplicationSet — PRIMARY cluster (eu-central-1).
# Hub-spoke model: ArgoCD hub lives in eu-central-1 and targets the primary cluster.
# For standby cluster (us-east-1), see app-of-apps-standby.yaml.
#
# Service discovery:
#   services/<name>/               → legacy / platform-owned services
#   teams/<team>/services/<name>/  → team-owned services (per-team ApplicationSet)
#
# Apply: kubectl apply -f aws/argocd/app-of-apps.yaml -n argocd
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: idp-services
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/moatazeldebsy/backstage-platform-template.git
              revision: HEAD
              directories:
                - path: services/*
                # The following services are AI-stack-only (bootstrap-ai.sh manages them).
                # Excluding them prevents ArgoCD from auto-deploying before the image
                # exists in ECR or required secrets are created.
                - path: services/contract-mcp-server
                  exclude: true
                - path: services/agent-event-router
                  exclude: true
                - path: services/github-mcp-server
                  exclude: true
                - path: services/argocd-mcp-server
                  exclude: true
                - path: services/cost-mcp-server
                  exclude: true
          # Generator 2: one entry per environment
          - list:
              elements:
                - env: dev
                  namespace: services-dev
                  valuesFile: helm-values-aws.yaml
                  region: eu-central-1
  template:
    metadata:
      name: "{{path.basename}}-{{env}}"
      labels:
        environment: "{{env}}"
        service: "{{path.basename}}"
        region: "{{region}}"
    spec:
      project: default
      sources:
        - repoURL: https://github.com/moatazeldebsy/backstage-platform-template.git
          targetRevision: HEAD
          path: helm/service-template
          helm:
            parameters:
              - name: backstage.kubernetesId
                value: "{{path.basename}}"
              - name: global.region
                value: "{{region}}"
            valueFiles:
              - $values/services/{{path.basename}}/{{valuesFile}}
        - repoURL: https://github.com/moatazeldebsy/backstage-platform-template.git
          targetRevision: HEAD
          ref: values
      destination:
        server: https://kubernetes.default.svc   # primary cluster (ArgoCD hub)
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
