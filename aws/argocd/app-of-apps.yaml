# ArgoCD ApplicationSet — EKS cluster (ArgoCD runs in-cluster and targets itself).
#
# Service discovery:
#   services/<name>/               → legacy / platform-owned services
#   teams/<team>/services/<name>/  → team-owned services (per-team ApplicationSet)
#
# Apply: kubectl apply -f aws/argocd/app-of-apps.yaml -n argocd
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: idp-services
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/moatazeldebsy/backstage-platform-template.git
              revision: HEAD
              directories:
                - path: services/*
                # services/mcp-common is a shared TypeScript library (no
                # Dockerfile, nothing to deploy) — not a service. Without this
                # exclusion the generator creates mcp-common-{{env}} anyway,
                # which ArgoCD syncs against the chart's bare defaults
                # (ignoreMissingValueFiles below) and Gatekeeper then rejects
                # for missing cost-allocation labels: a permanently
                # OutOfSync/Degraded Application — the exact failure mode the
                # "services/demo-aws-react reached the cluster as a broken
                # Application" comment in ci.yml warns about. The git
                # directory generator has no Dockerfile-awareness, so unlike
                # ci.yml/build-and-deploy.yml/scripts/lib.sh it must be told
                # explicitly per path.
                - path: services/mcp-common
                  exclude: true
                # No other exclusions. The ten AI/MCP services used to be excluded here
                # because bootstrap-ai.sh helm-installed them directly and two
                # systems cannot own the same release — which meant the platform's
                # own services did not take the GitOps path it sells to users.
                #
                # bootstrap-ai.sh's AWS branch now syncs an existing ArgoCD
                # Application instead of installing, and falls back to Helm only
                # when there is no Application yet. So ArgoCD owns these releases
                # and the bootstrap converges to the same state.
                #
                # Their images are in ECR (built by bootstrap-ai.sh and, since the
                # build matrix was generalised, by CI on any change under
                # services/<name>/), so an Application created here has something
                # to pull.
          # Generator 2: one entry per environment
          - list:
              elements:
                - env: dev
                  namespace: services-dev
                  valuesFile: helm-values-aws.yaml
  template:
    metadata:
      name: "{{path.basename}}-{{env}}"
      labels:
        environment: "{{env}}"
        service: "{{path.basename}}"
    spec:
      project: default
      sources:
        - repoURL: https://github.com/moatazeldebsy/backstage-platform-template.git
          targetRevision: HEAD
          path: helm/service-template
          helm:
            parameters:
              - name: backstage.kubernetesId
                value: "{{path.basename}}"
            # Optional per-service progressive-delivery overlay. A scaffolder
            # skeleton cannot merge into an existing file, which is why the
            # canary-deployment template used to emit a .patch nobody applied --
            # a second, wholly-generated values file is something it *can* write.
            # ignoreMissingValueFiles is mandatory: without it every service that
            # has no such file puts this whole ApplicationSet into ComparisonError.
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/services/{{path.basename}}/{{valuesFile}}
              - $values/services/{{path.basename}}/helm-values-rollout-{{env}}.yaml
        - repoURL: https://github.com/moatazeldebsy/backstage-platform-template.git
          targetRevision: HEAD
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
---
# ArgoCD ApplicationSet — STAGING environment.
#
# Uses a `files` generator (not `directories`) so an Application is only created
# once a service has actually been promoted to staging — i.e. once
# `services/<name>/helm-values-staging.yaml` exists. This avoids ArgoCD trying to
# sync a values file that doesn't exist yet for services still dev-only.
# The file is created by the `promote-to-staging` job in
# .github/workflows/build-and-deploy.yml the first time a service is promoted.
#
# Apply: kubectl apply -f aws/argocd/app-of-apps.yaml -n argocd
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: idp-services-staging
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/moatazeldebsy/backstage-platform-template.git
        revision: HEAD
        files:
          - path: "services/*/helm-values-staging.yaml"
  template:
    metadata:
      name: "{{path[1]}}-staging"
      labels:
        environment: staging
        service: "{{path[1]}}"
    spec:
      project: default
      sources:
        - repoURL: https://github.com/moatazeldebsy/backstage-platform-template.git
          targetRevision: HEAD
          path: helm/service-template
          helm:
            parameters:
              - name: backstage.kubernetesId
                value: "{{path[1]}}"
            # Optional per-service progressive-delivery overlay. A scaffolder
            # skeleton cannot merge into an existing file, which is why the
            # canary-deployment template used to emit a .patch nobody applied --
            # a second, wholly-generated values file is something it *can* write.
            # ignoreMissingValueFiles is mandatory: without it every service that
            # has no such file puts this whole ApplicationSet into ComparisonError.
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/services/{{path[1]}}/helm-values-staging.yaml
              - $values/services/{{path[1]}}/helm-values-rollout-staging.yaml
        - repoURL: https://github.com/moatazeldebsy/backstage-platform-template.git
          targetRevision: HEAD
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: services-staging
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
---
# ArgoCD ApplicationSet — PRODUCTION environment.
#
# Same file-existence gating as staging: only services with
# `services/<name>/helm-values-prod.yaml` get a production Application. That file
# is created by the `promote-to-production` job in
# .github/workflows/build-and-deploy.yml, which only runs after a staging smoke
# test passes and requires a human to merge the promotion PR — see
# docs/sre-reliability.md#multi-environment-gitops-promotion.
#
# Apply: kubectl apply -f aws/argocd/app-of-apps.yaml -n argocd
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: idp-services-prod
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/moatazeldebsy/backstage-platform-template.git
        revision: HEAD
        files:
          - path: "services/*/helm-values-prod.yaml"
  template:
    metadata:
      name: "{{path[1]}}-prod"
      labels:
        environment: prod
        service: "{{path[1]}}"
    spec:
      project: default
      sources:
        - repoURL: https://github.com/moatazeldebsy/backstage-platform-template.git
          targetRevision: HEAD
          path: helm/service-template
          helm:
            parameters:
              - name: backstage.kubernetesId
                value: "{{path[1]}}"
            # Optional per-service progressive-delivery overlay. A scaffolder
            # skeleton cannot merge into an existing file, which is why the
            # canary-deployment template used to emit a .patch nobody applied --
            # a second, wholly-generated values file is something it *can* write.
            # ignoreMissingValueFiles is mandatory: without it every service that
            # has no such file puts this whole ApplicationSet into ComparisonError.
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/services/{{path[1]}}/helm-values-prod.yaml
              - $values/services/{{path[1]}}/helm-values-rollout-prod.yaml
        - repoURL: https://github.com/moatazeldebsy/backstage-platform-template.git
          targetRevision: HEAD
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: services-prod
      syncPolicy:
        automated:
          prune: true
          # No selfHeal in prod: an out-of-band manual rollback (e.g. `argocd app rollback`
          # during an incident) should not be immediately reverted by ArgoCD auto-sync.
          # Re-sync explicitly once the fix is committed.
          selfHeal: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
---
# ArgoCD ApplicationSet — per-service platform resources (AWS only).
#
# Applies the plain manifests scaffolder templates commit next to a service:
#   services/<name>/claims/   Crossplane Claims (s3/rds/kafka/sqs/dynamodb-*-crossplane)
#   services/<name>/secrets/  ExternalSecrets (add-secret, secret-rotation, rds-database)
#
# Nothing applied these before: idp-services only renders helm/service-template
# with the values files, and a chart cannot read raw YAML from the repo, so a
# merged Claim provisioned nothing and a merged ExternalSecret synced nothing.
# One Application per directory keeps a broken claim from blocking a service's
# secrets (and vice versa).
#
# Local Kind has no Crossplane or AWS Secrets Manager store, so there is no
# local counterpart.
#
# prune: true is deliberate — deleting a claim file (e.g. decommissioning a
# service) deletes the AWS resource through its Composition's deletionPolicy,
# the same way removing services/<name>/ removes its workload.
#
# Apply: kubectl apply -f aws/argocd/app-of-apps.yaml -n argocd
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: idp-service-resources
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/moatazeldebsy/backstage-platform-template.git
        revision: HEAD
        directories:
          - path: services/*/claims
          - path: services/*/secrets
  template:
    metadata:
      name: "{{path[1]}}-{{path.basename}}"
      labels:
        service: "{{path[1]}}"
        resource-kind: "{{path.basename}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/moatazeldebsy/backstage-platform-template.git
        targetRevision: HEAD
        path: "{{path}}"
        directory:
          # claims/ also holds each claim's Backstage catalog-info-*.yaml
          # (registered with the catalog, not Kubernetes objects).
          exclude: "catalog-info*.yaml"
      destination:
        server: https://kubernetes.default.svc
        # Every generated manifest sets its own namespace; this is the fallback.
        namespace: services-dev
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # Claim kinds are served by XRDs that crossplane-compositions installs;
          # until then, retry instead of failing the dry run.
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
---
# Team namespaces (#156). One Application per kubernetes/teams/<team>/, written
# by the team-namespace scaffolder template: Namespace, RBAC, quota,
# LimitRange, NetworkPolicy, and optionally the team's SecretStore,
# AlertmanagerConfig, AppProject and per-team ApplicationSet. ArgoCD now owns
# these (drift is corrected) instead of scaffold.yml running `kubectl apply` on
# merge; two field managers on the same objects would conflict.
#
# prune: false on purpose. Pruning would turn "a team directory was deleted
# from git" into "the team's namespace and every workload in it were deleted".
# Removing a team stays a deliberate manual step:
#   kubectl delete application team-<team> -n argocd && kubectl delete ns team-<team>
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: idp-teams
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/moatazeldebsy/backstage-platform-template.git
        revision: HEAD
        directories:
          - path: kubernetes/teams/*
  template:
    metadata:
      name: "team-{{path.basename}}"
      labels:
        idp.io/component: team-namespace
        team: "{{path.basename}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/moatazeldebsy/backstage-platform-template.git
        targetRevision: HEAD
        path: "{{path}}"
      destination:
        server: https://kubernetes.default.svc
        # Every team manifest sets its own namespace (team-<team>, plus argocd
        # for the AppProject/ApplicationSet and monitoring for the Grafana
        # folder); this is only the fallback.
        namespace: "team-{{path.basename}}"
      # The deployer ServiceAccount token Secret has its data filled in by
      # Kubernetes, not git.
      ignoreDifferences:
        - kind: Secret
          jsonPointers:
            - /data
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          # SecretStore / ExternalSecret / AlertmanagerConfig kinds may not be
          # installed yet on a fresh cluster; retry instead of failing.
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
