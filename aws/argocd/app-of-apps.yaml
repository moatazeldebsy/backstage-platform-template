# ArgoCD ApplicationSet — PRIMARY cluster (eu-central-1).
# Hub-spoke model: ArgoCD hub lives in eu-central-1 and targets the primary cluster.
# For standby cluster (us-east-1), see app-of-apps-standby.yaml.
#
# Service discovery:
#   services/<name>/               → legacy / platform-owned services
#   teams/<team>/services/<name>/  → team-owned services (per-team ApplicationSet)
#
# Apply: kubectl apply -f aws/argocd/app-of-apps.yaml -n argocd
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: idp-services
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/moatazeldebsy/backstage-platform-template.git
              revision: HEAD
              directories:
                - path: services/*
                # The following services are AI-stack-only (bootstrap-ai.sh manages them).
                # Excluding them prevents ArgoCD from auto-deploying before the image
                # exists in ECR or required secrets are created.
                - path: services/contract-mcp-server
                  exclude: true
                - path: services/agent-event-router
                  exclude: true
                - path: services/github-mcp-server
                  exclude: true
                - path: services/argocd-mcp-server
                  exclude: true
                - path: services/cost-mcp-server
                  exclude: true
                - path: services/idp-mcp-server
                  exclude: true
                - path: services/qa-mcp-server
                  exclude: true
          # Generator 2: one entry per environment
          - list:
              elements:
                - env: dev
                  namespace: services-dev
                  valuesFile: helm-values-aws.yaml
                  region: eu-central-1
  template:
    metadata:
      name: "{{path.basename}}-{{env}}"
      labels:
        environment: "{{env}}"
        service: "{{path.basename}}"
        region: "{{region}}"
    spec:
      project: default
      sources:
        - repoURL: https://github.com/moatazeldebsy/backstage-platform-template.git
          targetRevision: HEAD
          path: helm/service-template
          helm:
            parameters:
              - name: backstage.kubernetesId
                value: "{{path.basename}}"
              - name: global.region
                value: "{{region}}"
            valueFiles:
              - $values/services/{{path.basename}}/{{valuesFile}}
        - repoURL: https://github.com/moatazeldebsy/backstage-platform-template.git
          targetRevision: HEAD
          ref: values
      destination:
        server: https://kubernetes.default.svc   # primary cluster (ArgoCD hub)
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
---
# ArgoCD ApplicationSet — STAGING environment (primary cluster, eu-central-1).
#
# Uses a `files` generator (not `directories`) so an Application is only created
# once a service has actually been promoted to staging — i.e. once
# `services/<name>/helm-values-staging.yaml` exists. This avoids ArgoCD trying to
# sync a values file that doesn't exist yet for services still dev-only.
# The file is created by the `promote-to-staging` job in
# .github/workflows/build-and-deploy.yml the first time a service is promoted.
#
# Apply: kubectl apply -f aws/argocd/app-of-apps.yaml -n argocd
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: idp-services-staging
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/moatazeldebsy/backstage-platform-template.git
        revision: HEAD
        files:
          - path: "services/*/helm-values-staging.yaml"
  template:
    metadata:
      name: "{{path[1]}}-staging"
      labels:
        environment: staging
        service: "{{path[1]}}"
        region: eu-central-1
    spec:
      project: default
      sources:
        - repoURL: https://github.com/moatazeldebsy/backstage-platform-template.git
          targetRevision: HEAD
          path: helm/service-template
          helm:
            parameters:
              - name: backstage.kubernetesId
                value: "{{path[1]}}"
              - name: global.region
                value: eu-central-1
            valueFiles:
              - $values/services/{{path[1]}}/helm-values-staging.yaml
        - repoURL: https://github.com/moatazeldebsy/backstage-platform-template.git
          targetRevision: HEAD
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: services-staging
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
---
# ArgoCD ApplicationSet — PRODUCTION environment (primary cluster, eu-central-1).
#
# Same file-existence gating as staging: only services with
# `services/<name>/helm-values-prod.yaml` get a production Application. That file
# is created by the `promote-to-production` job in
# .github/workflows/build-and-deploy.yml, which only runs after a staging smoke
# test passes and requires a human to merge the promotion PR — see
# docs/sre-reliability.md#multi-environment-gitops-promotion.
#
# Apply: kubectl apply -f aws/argocd/app-of-apps.yaml -n argocd
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: idp-services-prod
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/moatazeldebsy/backstage-platform-template.git
        revision: HEAD
        files:
          - path: "services/*/helm-values-prod.yaml"
  template:
    metadata:
      name: "{{path[1]}}-prod"
      labels:
        environment: prod
        service: "{{path[1]}}"
        region: eu-central-1
    spec:
      project: default
      sources:
        - repoURL: https://github.com/moatazeldebsy/backstage-platform-template.git
          targetRevision: HEAD
          path: helm/service-template
          helm:
            parameters:
              - name: backstage.kubernetesId
                value: "{{path[1]}}"
              - name: global.region
                value: eu-central-1
            valueFiles:
              - $values/services/{{path[1]}}/helm-values-prod.yaml
        - repoURL: https://github.com/moatazeldebsy/backstage-platform-template.git
          targetRevision: HEAD
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: services-prod
      syncPolicy:
        automated:
          prune: true
          # No selfHeal in prod: an out-of-band manual rollback (e.g. `argocd app rollback`
          # during an incident) should not be immediately reverted by ArgoCD auto-sync.
          # Re-sync explicitly once the fix is committed.
          selfHeal: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
