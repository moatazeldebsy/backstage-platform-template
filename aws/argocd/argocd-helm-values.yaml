# Helm values for ArgoCD install on EKS
# Install: helm upgrade --install argocd argo/argo-cd \
#   --namespace argocd --create-namespace \
#   --values kubernetes/argocd/argocd-helm-values.yaml

global:
  # Single-replica install — scale up for production HA
  replicaCount: 1

  # Empty on purpose. The server Ingress renders its host as
  #   {{ tpl .Values.server.ingress.hostname $ | default .Values.global.domain }}
  # so an unset hostname falls through to global.domain, whose chart default is
  # "argocd.example.com". ALB only routes requests whose Host header matches a rule,
  # so that placeholder made the raw ALB hostname 404. bootstrap.sh used to strip it
  # afterwards with `kubectl patch`, which gave the field manager "kubectl-patch"
  # ownership of .spec.rules — and every subsequent `helm upgrade` then died with
  #   conflict with "kubectl-patch" using networking.k8s.io/v1: .spec.rules
  # making the script non-idempotent: run one succeeded, run two always failed.
  # Setting this empty renders `host: null`, which Kubernetes treats as "match any
  # host" (verified with kubectl apply --dry-run=server), so no patch is needed and
  # Helm keeps sole ownership. Set to a real domain once DNS exists.
  domain: ""

# Resource requests are declared PER COMPONENT below, not once at the top level.
# There used to be a single top-level `resources:` block at the end of this file;
# the argo-cd chart has no such key, so Helm silently dropped it and every ArgoCD
# pod ran with no requests at all — BestEffort QoS, first to be evicted under
# node pressure, and invisible to the scheduler when it bin-packs.
#
# Verify with:
#   helm template argocd argo/argo-cd -f aws/argocd/argocd-helm-values.yaml \
#     | grep -A4 'resources:'

controller:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

server:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      kubernetes.io/ingress.class: alb
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/backend-protocol: HTTP
    hosts: []   # Empty = match any hostname via ALB DNS; set to real domain when DNS is configured
    tls: []
  extraArgs:
    - --insecure   # Remove when TLS is terminated at ALB

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

applicationSet:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

redis:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

notifications:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

dex:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

configs:
  params:
    server.insecure: true   # ALB terminates TLS; ArgoCD server listens on HTTP internally

  # Local user for Backstage (read-only API access)
  cm:
    accounts.backstage: apiKey

  # RBAC: admin can do everything; backstage gets read-only across all apps
  rbac:
    policy.default: role:readonly
    policy.csv: |
      p, role:admin, applications, *, */*, allow
      p, role:admin, clusters, get, *, allow
      p, role:admin, repositories, *, *, allow
      g, argocd-admins, role:admin
      p, role:backstage-read, applications, get, */*, allow
      p, role:backstage-read, clusters, get, *, allow
      p, role:backstage-read, repositories, get, *, allow
      g, backstage, role:backstage-read
