# Argo Rollouts controller — AWS EKS
# helm repo add argo https://argoproj.github.io/argo-helm
# helm upgrade --install argo-rollouts argo/argo-rollouts \
#   -n argo-rollouts --create-namespace \
#   -f aws/argocd/argo-rollouts-values.yaml

dashboard:
  enabled: true
  # Resource limits are REQUIRED here, not optional tuning. The dashboard ships
  # with no resources block, so it lands in BestEffort QoS with no CPU cap, and
  # it busy-loops: observed pinning a full core indefinitely on an idle cluster.
  # BestEffort also makes it the first thing evicted under node pressure, which
  # is the opposite of what you want from a debugging tool.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi
  # Ingress deliberately OFF — the dashboard is an operator tool and its own ALB
  # costs ~$16/mo. Rollout status is visible in the ArgoCD UI and in Backstage;
  # this dashboard is for deep debugging:
  #   kubectl port-forward -n argo-rollouts svc/argo-rollouts-dashboard 3100:3100
  ingress:
    enabled: false
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/backend-protocol: HTTP
    hosts:
      - ""   # match any hostname; set real domain when DNS is ready

controller:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: prometheus
