---
# ClusterSecretStore — AWS Secrets Manager backend for External Secrets Operator.
# This is a cluster-scoped resource; any ExternalSecret in any namespace can
# reference it with: secretStoreRef: { name: aws-secretsmanager, kind: ClusterSecretStore }
#
# The ESO ServiceAccount (external-secrets-sa in namespace external-secrets) is
# annotated with its own IRSA role by bootstrap.sh after terraform apply:
#
#   kubectl annotate serviceaccount external-secrets-sa \
#     -n external-secrets \
#     "eks.amazonaws.com/role-arn=<external_secrets_role_arn>" --overwrite
#
# Because every namespace can use this store, that role (terraform/iam.tf
# external_secrets_irsa) reads only secrets safe for every namespace: today
# idp-mvp/dora-exporter. It is NOT the Backstage role any more — that shared
# role let any namespace sync idp-mvp/backstage. Components with their own
# secrets use a namespaced SecretStore + role (aws/backstage/external-secret.yaml,
# aws/ml-platform/litellm-external-secret.yaml); team services use the per-team
# stores (terraform/iam-team-secret-store.tf).
#
# Apply: kubectl apply -f kubernetes/external-secrets/cluster-secret-store.yaml
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
  labels:
    app.kubernetes.io/component: external-secrets
    app.kubernetes.io/managed-by: bootstrap
spec:
  provider:
    aws:
      service: SecretsManager
      # Region is replaced by setup.sh (us-east-1 → user's region).
      region: "us-east-1"
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
