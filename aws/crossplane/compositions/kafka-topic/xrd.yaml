apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xkafkatopics.idp.platform
spec:
  group: idp.platform
  names:
    kind: XKafkaTopic
    plural: xkafkatopics
  claimNames:
    kind: KafkaTopic
    plural: kafkatopics
  defaultCompositionRef:
    name: xkafkatopic.aws
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [parameters]
              properties:
                parameters:
                  type: object
                  required: [topicName, clusterArn, owner]
                  properties:
                    topicName:
                      type: string
                      description: Kafka topic name.
                      pattern: ^[a-zA-Z0-9._-]{1,249}$
                    clusterArn:
                      type: string
                      description: ARN of the target MSK cluster (provisioned via Terraform).
                    owner:
                      type: string
                    partitions:
                      type: integer
                      default: 6
                      minimum: 1
                    replicationFactor:
                      type: integer
                      default: 3
                      minimum: 1
                    retentionHours:
                      type: integer
                      default: 168
                    cleanupPolicy:
                      type: string
                      enum: [delete, compact]
                      default: delete
                    costCenter:
                      type: string
                      default: engineering
                    team:
                      type: string
                      description: Team name for cost attribution (auto-injected by Kyverno in team-* namespaces).
                      default: ""
                    crossRegionReplication:
                      type: boolean
                      description: Enable MSK Replicator to replicate this topic to replicaRegion. Requires an MSK cluster in the standby region (provisioned via Terraform). Uses last-writer-wins for conflicting offsets.
                      default: false
                    replicaClusterArn:
                      type: string
                      description: ARN of the target MSK cluster in the standby region. Required when crossRegionReplication is true.
                      default: ""
                    replicationStartingPosition:
                      type: string
                      description: Where replication starts for existing topics — LATEST (default, replicate only new messages) or EARLIEST (full replay).
                      enum: [LATEST, EARLIEST]
                      default: LATEST
            status:
              type: object
              properties:
                replicatorArn:
                  type: string
                  description: ARN of the MSK Replicator resource (set when crossRegionReplication is true).
      additionalPrinterColumns:
        - name: TOPIC
          type: string
          jsonPath: .spec.parameters.topicName
        - name: PARTITIONS
          type: integer
          jsonPath: .spec.parameters.partitions
        - name: READY
          type: string
          jsonPath: .status.conditions[?(@.type=='Ready')].status
