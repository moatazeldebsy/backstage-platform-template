# XS3Bucket — the abstract API app teams Claim against. The Composition in
# composition.yaml maps Claim fields to concrete AWS resources.
#
# Why this is opinionated rather than exposing all of provider-aws-s3's
# knobs: scaffolded services get encryption-on, public-access-blocked, and
# cost-attribution tags by default. Teams that need an exotic bucket can
# still create one with raw provider-aws-s3 manifests; the XRD covers the
# 90% case.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xs3buckets.idp.platform
spec:
  group: idp.platform
  names:
    kind: XS3Bucket
    plural: xs3buckets
  claimNames:
    kind: S3Bucket
    plural: s3buckets
  defaultCompositionRef:
    name: xs3bucket.aws
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [parameters]
              properties:
                parameters:
                  type: object
                  required: [bucketName, region, owner]
                  properties:
                    bucketName:
                      type: string
                      description: Globally-unique S3 bucket name.
                      pattern: ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$
                    region:
                      type: string
                      description: AWS region.
                      default: eu-west-1
                    owner:
                      type: string
                      description: Owning team or service (for cost attribution).
                    versioning:
                      type: boolean
                      description: Enable object versioning.
                      default: true
                    costCenter:
                      type: string
                      description: Cost center tag value.
                      default: engineering
                    team:
                      type: string
                      description: Team name for cost attribution (auto-injected by Kyverno in team-* namespaces).
                      default: ""
                    crossRegionReplication:
                      type: boolean
                      description: Enable S3 Cross-Region Replication to replicaRegion. Requires versioning (always enabled when this is true). A Terraform-managed IAM replication role named idp-s3-replication must exist in the account.
                      default: false
                    replicaRegion:
                      type: string
                      description: Destination region for cross-region replication. Only used when crossRegionReplication is true.
                      default: us-east-1
                    multiRegionAccessPoint:
                      type: boolean
                      description: Create an S3 Multi-Region Access Point providing a single hostname that routes to the nearest healthy bucket. Requires crossRegionReplication to be true.
                      default: false
            status:
              type: object
              properties:
                bucketArn:
                  type: string
                  description: ARN of the provisioned bucket.
                replicaBucketArn:
                  type: string
                  description: ARN of the replica bucket in replicaRegion (set when crossRegionReplication is true).
      additionalPrinterColumns:
        - name: BUCKET
          type: string
          jsonPath: .spec.parameters.bucketName
        - name: REGION
          type: string
          jsonPath: .spec.parameters.region
        - name: SYNCED
          type: string
          jsonPath: .status.conditions[?(@.type=='Synced')].status
        - name: READY
          type: string
          jsonPath: .status.conditions[?(@.type=='Ready')].status
