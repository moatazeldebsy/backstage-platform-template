# Default ProviderConfig used by every Composition. Credentials are sourced
# from IRSA (the role ARN annotation set on the provider ServiceAccount by
# DeploymentRuntimeConfig), so no static AWS keys live in the cluster.
apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
  annotations:
    # ProviderConfig's CRD is supplied by the provider-aws-* packages
    # themselves — applying it in the same sync wave as the Provider objects
    # races against package installation and fails with "could not find
    # aws.upbound.io/ProviderConfig CRD". Wave 1 waits for wave 0 (Providers)
    # to be Healthy first.
    argocd.argoproj.io/sync-wave: "1"
spec:
  credentials:
    source: IRSA
