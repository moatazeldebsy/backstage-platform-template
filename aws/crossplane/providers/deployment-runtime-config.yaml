# Shared runtime config for every AWS provider Pod. Annotates the auto-
# generated ServiceAccount with the IRSA role ARN so the provider's AWS SDK
# picks up cluster credentials without static keys.
#
# IRSA_ROLE_ARN stays a placeholder in git ON PURPOSE. The real ARN is
# account-specific, so committing it would hand every clone of this template
# the original author's role — a role they cannot assume, which fails silently:
# the providers still report Healthy (the package installed) while being unable
# to authenticate to AWS.
#
# The value is supplied per-cluster by scripts/bootstrap.sh, which substitutes
# `terraform output crossplane_aws_role_arn` and applies it once the
# DeploymentRuntimeConfig CRD exists. ArgoCD does not revert that patch because
# aws/argocd/crossplane.yaml declares, for this exact resource:
#
#   ignoreDifferences:
#     - kind: DeploymentRuntimeConfig
#       name: provider-aws-irsa
#       jsonPointers: [/spec/serviceAccountTemplate/metadata/annotations]
#   syncOptions: [RespectIgnoreDifferences=true]
#
# So: do not "fix" this by hardcoding an ARN. If the live ServiceAccounts show
# the literal IRSA_ROLE_ARN, the bootstrap substitution never ran against this
# cluster (it is skipped when the CRD is not yet established) — re-run it:
#
#   sed "s|IRSA_ROLE_ARN|$(cd terraform && terraform output -raw crossplane_aws_role_arn)|g" \
#     aws/crossplane/providers/deployment-runtime-config.yaml | kubectl apply -f -
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-aws-irsa
spec:
  serviceAccountTemplate:
    metadata:
      annotations:
        eks.amazonaws.com/role-arn: "IRSA_ROLE_ARN"
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 1Gi
