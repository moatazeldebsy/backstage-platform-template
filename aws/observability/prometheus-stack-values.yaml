# kube-prometheus-stack Helm values for AWS EKS deployment.
# Mirrors local/observability/prometheus-stack-values.yaml with:
#   - ALB ingress (instead of nginx)
#   - gp3 persistent volumes (20% cheaper than gp2)
#   - 3-day Prometheus retention (cost-optimised; use 15d for production)
#   - 5Gi Prometheus storage (within EBS 30Gi free tier)
#   - Grafana IRSA annotation for CloudWatch datasource
#   - All three dashboard ConfigMaps wired (IDP, DORA, QA)
#
# Install:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
#     --namespace monitoring --create-namespace \
#     --values observability/prometheus-stack-values-aws.yaml \
#     --set grafana.adminPassword="${GRAFANA_ADMIN_PASSWORD}"

prometheus:
  ingress:
    enabled: true
    ingressClassName: alb
    # The chart defaults this ingress's pathType to ImplementationSpecific, which
    # the AWS ALB controller renders as an exact-match-only listener rule (only "/"
    # matches — every other path, like /query or /graph, 404s at the ALB itself,
    # before the request ever reaches Prometheus). Prefix matches Grafana's own
    # ingress default and makes the ALB rule a proper wildcard.
    pathType: Prefix
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/backend-protocol: HTTP
    hosts: []   # empty = match any ALB hostname; set to real domain when DNS is configured
    servicePort: 9090
  prometheusSpec:
    retention: 3d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi

    # ── Thanos sidecar (V2 multi-region) ──────────────────────────────────────
    # Enables long-term storage to S3 and cross-region query federation.
    # The thanos-objstore-config Secret is created by the ExternalSecret in
    # aws/observability/thanos/thanos-sidecar-patch.yaml (populated from
    # Secrets Manager by terraform/global/thanos-config.tf).
    thanos:
      image: quay.io/thanos/thanos:v0.36.1
      objectStorageConfig:
        existingSecret:
          name: thanos-objstore-config
          key: objstore.yml
      # Expose gRPC port so Thanos Query can scrape in-memory (recent) blocks
      grpcListenLocal: false
      httpListenLocal: false
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi

alertmanager:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: alb
    # See the comment on prometheus.ingress.pathType above — same ALB
    # exact-match-only bug applies here by chart default.
    pathType: Prefix
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/backend-protocol: HTTP
    hosts: []
  alertmanagerSpec:
    alertmanagerConfigSelector:
      matchLabels:
        app.kubernetes.io/part-of: kube-prometheus-stack
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

grafana:
  # Password set via --set grafana.adminPassword at install time (from Secrets Manager / env var)
  # 1 replica — ALB has no sticky sessions, so multiple replicas cause session routing
  # failures (login succeeds on pod A, next request hits pod B, session not found).
  # To scale out, either enable ALB sticky sessions or configure a Postgres session backend.
  replicas: 1
  serviceAccount:
    annotations:
      # Populated by bootstrap.sh: eks.amazonaws.com/role-arn = grafana_role_arn terraform output
      eks.amazonaws.com/role-arn: "GRAFANA_IRSA_ROLE_ARN"

  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/backend-protocol: HTTP
      alb.ingress.kubernetes.io/success-codes: "200-399"
      alb.ingress.kubernetes.io/healthcheck-path: /api/health
      alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "10"
      alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    hosts: []

  sidecar:
    datasources:
      # kube-prometheus-stack normally auto-provisions a Prometheus datasource
      # (uid: prometheus, isDefault: true) via its own grafana_datasource-labeled
      # ConfigMap. V2 replaces that with the multi-region datasources ConfigMap
      # (aws/observability/grafana-multi-region-datasources.yaml), which sets
      # Thanos as isDefault and re-declares uid: prometheus for dashboard
      # compatibility. Disable the chart's auto datasource so the two
      # grafana_datasource ConfigMaps don't both set isDefault: true (that
      # combination crashes Grafana on startup).
      defaultDatasourceEnabled: false

  # kube-prometheus-stack's auto-provisioned Prometheus datasource is disabled above
  # (see sidecar.datasources). Datasources are instead provisioned via
  # aws/observability/grafana-multi-region-datasources.yaml — do not add a second
  # isDefault entry here.
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources: []

  # Dashboard folder providers — one entry per ConfigMap.
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: idp
          folder: IDP Services
          type: file
          options:
            path: /var/lib/grafana/dashboards/idp
        - name: dora
          folder: DORA Metrics
          type: file
          options:
            path: /var/lib/grafana/dashboards/dora
        - name: qa
          folder: QA Platform
          type: file
          options:
            path: /var/lib/grafana/dashboards/qa
        - name: finops
          folder: FinOps
          type: file
          options:
            path: /var/lib/grafana/dashboards/finops
        - name: sre
          folder: SRE
          type: file
          options:
            path: /var/lib/grafana/dashboards/sre
        - name: ai
          folder: AI Platform
          type: file
          options:
            path: /var/lib/grafana/dashboards/ai

  # ConfigMap names must match what bootstrap.sh creates via kubectl create configmap.
  # Each key must match the provider name above.
  dashboardsConfigMaps:
    idp: grafana-dashboards-idp
    dora: grafana-dashboards-dora
    qa: grafana-qa-dashboard
    finops: grafana-dashboards-finops
    sre: grafana-dashboards-sre
    ai: grafana-dashboards-ai

  # Lenient probes — Grafana can be slow to start when loading dashboard ConfigMaps.
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 30
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 10
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 60
    timeoutSeconds: 30
    periodSeconds: 10
    failureThreshold: 10

  persistence:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

kubeStateMetrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

nodeExporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

# Note: Prometheus Pushgateway is installed as a separate Helm release (not a subchart):
#   helm upgrade --install prometheus-pushgateway prometheus-community/prometheus-pushgateway \
#     --namespace monitoring --set serviceMonitor.enabled=true \
#     --set serviceMonitor.additionalLabels.release=prometheus
