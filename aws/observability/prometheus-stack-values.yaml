# kube-prometheus-stack Helm values for AWS EKS deployment.
# Mirrors local/observability/prometheus-stack-values.yaml with:
#   - ALB ingress (instead of nginx)
#   - gp3 persistent volumes (20% cheaper than gp2)
#   - 3-day Prometheus retention (cost-optimised; use 15d for production)
#   - 20Gi Prometheus storage with a 15GB retentionSize cap
#   - Grafana IRSA annotation for CloudWatch datasource
#   - All three dashboard ConfigMaps wired (IDP, DORA, QA)
#
# Install:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
#     --namespace monitoring --create-namespace \
#     --values observability/prometheus-stack-values-aws.yaml \
#     --set grafana.adminPassword="${GRAFANA_ADMIN_PASSWORD}"

prometheus:
  # Ingress deliberately OFF. (Platform UIs now share one ALB, group
  # idp-platform, one listener port each, so cost is no longer the reason.) Prometheus
  # is an operator tool, not a user-facing surface — Grafana is what people use,
  # and it reads Prometheus in-cluster. Exposing the raw query API to the public
  # internet with no auth was also the weakest link in this stack.
  #
  # Reach it when you need it:
  #   kubectl port-forward -n monitoring svc/prometheus-operated 9090:9090
  #
  # If you later configure domain_name + Route53, switch these back on with real
  # hostnames so they can share a single host-routed ALB.
  ingress:
    enabled: false
    # Kept for the day this is re-enabled: the chart defaults pathType to
    # ImplementationSpecific, which the ALB controller renders as an
    # exact-match-only rule (only "/" matches — /query and /graph 404 at the ALB
    # before reaching Prometheus). Prefix makes it a proper wildcard.
    pathType: Prefix
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/backend-protocol: HTTP
    hosts: []   # empty = match any ALB hostname; set to real domain when DNS is configured
    servicePort: 9090
  prometheusSpec:
    # Tempo's metrics-generator remote-writes span and service-graph metrics to
    # /api/v1/write (aws/observability/tempo-values.yaml). Without the receiver
    # every write 404s and those series never exist.
    enableRemoteWriteReceiver: true
    retention: 3d
    # retentionSize is the load-bearing setting, not retention. With only a time
    # limit, Prometheus happily fills the volume and then stops ingesting
    # ENTIRELY — it keeps reporting every target "up" while writing nothing:
    #
    #   err="write to WAL: log samples: write /prometheus/wal/00000164:
    #        no space left on device"
    #
    # The 5Gi volume filled in under five days and Prometheus went silent for
    # ~3 hours before anyone noticed, because the only symptom was Grafana and
    # the Backstage DORA page showing "no data" — which reads as an exporter
    # problem, not a storage one. Capping below the volume size makes Prometheus
    # drop the oldest blocks instead of wedging. Observed 2026-08-17.
    retentionSize: 15GB
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              # 5Gi held roughly four days of this cluster's series volume and
              # then wedged Prometheus (see retentionSize above). gp3 allows
              # online expansion, so growing this is a patch rather than a
              # rebuild — but a fresh install should start with headroom.
              storage: 20Gi

alertmanager:
  enabled: true
  # Ingress deliberately OFF — operator tool, own ALB, no auth. See the note on
  # prometheus.ingress above. Alerts are delivered by the Slack/PagerDuty
  # receivers configured in Phase 5.8, not by people browsing this UI.
  #   kubectl port-forward -n monitoring svc/alertmanager-operated 9093:9093
  ingress:
    enabled: false
    ingressClassName: alb
    # See the comment on prometheus.ingress.pathType above — same ALB
    # exact-match-only bug applies here by chart default.
    pathType: Prefix
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/backend-protocol: HTTP
    hosts: []
  alertmanagerSpec:
    alertmanagerConfigSelector:
      matchLabels:
        app.kubernetes.io/part-of: kube-prometheus-stack
    # OnNamespaceExceptForAlertmanagerNamespace, not the operator default
    # (OnNamespace). OnNamespace adds a hidden namespace="<config's namespace>"
    # matcher to every AlertmanagerConfig, so the platform routing in
    # observability/alertmanager/alertmanager-config.yaml (namespace: monitoring)
    # only ever matched alerts labelled namespace="monitoring": nothing from
    # services-*, and no SLO burn alert (those carry no namespace label) reached
    # #platform-alerts or agent-event-router (#159). With this strategy the
    # config in Alertmanager's own namespace sees every alert, while a team's
    # AlertmanagerConfig in team-<name> still only sees that namespace's alerts.
    alertmanagerConfigMatcherStrategy:
      type: OnNamespaceExceptForAlertmanagerNamespace
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        # 64Mi left no headroom for an alert storm's notification queue; an
        # OOM-killed Alertmanager drops exactly the alerts that matter.
        memory: 256Mi

grafana:
  # Password set via --set grafana.adminPassword at install time (from Secrets Manager / env var)
  # 1 replica here. With per-pod SQLite a second replica would have its own users
  # and sessions (login on pod A, unknown on pod B). bootstrap.sh layers
  # grafana-db-values.yaml (shared Postgres, terraform/grafana.tf) on every
  # profile, and grafana-ha-values.yaml (2 replicas) on --profile medium|large.
  replicas: 1
  serviceAccount:
    annotations:
      # Populated by bootstrap.sh: eks.amazonaws.com/role-arn = grafana_role_arn terraform output
      eks.amazonaws.com/role-arn: "GRAFANA_IRSA_ROLE_ARN"

  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      # One shared ALB for every platform UI (scripts/lib.sh alb_ingress_url):
      # Grafana is its listener on :3000.
      alb.ingress.kubernetes.io/group.name: idp-platform
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 3000}]'
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/backend-protocol: HTTP
      alb.ingress.kubernetes.io/success-codes: "200-399"
      alb.ingress.kubernetes.io/healthcheck-path: /api/health
      alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "10"
      alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    hosts: []

  sidecar:
    datasources:
      # Let kube-prometheus-stack auto-provision its Prometheus datasource
      # (uid: prometheus, isDefault: true) — the dashboards reference that uid.
      defaultDatasourceEnabled: true

  # Dashboard folder providers — one entry per ConfigMap.
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: idp
          folder: IDP Services
          type: file
          options:
            path: /var/lib/grafana/dashboards/idp
        - name: dora
          folder: DORA Metrics
          type: file
          options:
            path: /var/lib/grafana/dashboards/dora
        - name: qa
          folder: QA Platform
          type: file
          options:
            path: /var/lib/grafana/dashboards/qa
        - name: finops
          folder: FinOps
          type: file
          options:
            path: /var/lib/grafana/dashboards/finops
        - name: sre
          folder: SRE
          type: file
          options:
            path: /var/lib/grafana/dashboards/sre
        - name: ai
          folder: AI Platform
          type: file
          options:
            path: /var/lib/grafana/dashboards/ai

  # ConfigMap names must match what bootstrap.sh creates via kubectl create configmap.
  # Each key must match the provider name above.
  dashboardsConfigMaps:
    idp: grafana-dashboards-idp
    dora: grafana-dashboards-dora
    qa: grafana-qa-dashboard
    finops: grafana-dashboards-finops
    sre: grafana-dashboards-sre
    ai: grafana-dashboards-ai

  # Lenient probes — Grafana can be slow to start when loading dashboard ConfigMaps.
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 30
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 10
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 60
    timeoutSeconds: 30
    periodSeconds: 10
    failureThreshold: 10

  persistence:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

kubeStateMetrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

nodeExporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

# Note: Prometheus Pushgateway is installed as a separate Helm release (not a subchart):
#   helm upgrade --install prometheus-pushgateway prometheus-community/prometheus-pushgateway \
#     --namespace monitoring --set serviceMonitor.enabled=true \
#     --set serviceMonitor.additionalLabels.release=prometheus
