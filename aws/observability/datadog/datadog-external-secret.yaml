# External Secrets for the Datadog Agent — AWS/EKS variant.
#
# Syncs idp-mvp/datadog from AWS Secrets Manager into the datadog-secrets
# Kubernetes Secret consumed by the Datadog Agent Helm chart (datadog-agent-values.yaml).
#
# A dedicated ServiceAccount (datadog-eso-sa) with IRSA is used so that only
# the datadog namespace can read this secret (least-privilege), same pattern
# as aws/kagent/external-secret.yaml.
#
# bootstrap.sh (or the equivalent observability bootstrap step) annotates
# datadog-eso-sa with the IRSA role ARN (datadog_eso_role_arn terraform output)
# after applying this manifest.
#
# AWS_REGION_PLACEHOLDER is substituted at deploy time.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: datadog-eso-sa
  namespace: datadog
  labels:
    app.kubernetes.io/part-of: datadog
  # eks.amazonaws.com/role-arn annotated post-apply with the datadog_eso_role_arn
  # terraform output
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: datadog
spec:
  provider:
    aws:
      service: SecretsManager
      region: AWS_REGION_PLACEHOLDER
      auth:
        jwt:
          serviceAccountRef:
            name: datadog-eso-sa
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: datadog-secrets
  namespace: datadog
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: datadog-secrets
    creationPolicy: Owner
  # Explicit key mapping, NOT `dataFrom: extract`. extract copies the Secrets Manager
  # key names through verbatim (DD_API_KEY / DD_APP_KEY), but the Datadog chart's
  # apiKeyExistingSecret / appKeyExistingSecret look for the fixed key names
  # `api-key` and `app-key`. The mismatch left every agent pod in
  # CreateContainerConfigError with "couldn't find key app-key in Secret
  # datadog/datadog-secrets" — the ExternalSecret itself reported SecretSynced=True,
  # so the sync looked healthy while the chart could never consume it.
  # Observed 2026-08-12.
  data:
    - secretKey: api-key
      remoteRef:
        key: idp-mvp/datadog
        property: DD_API_KEY
    - secretKey: app-key
      remoteRef:
        key: idp-mvp/datadog
        property: DD_APP_KEY
