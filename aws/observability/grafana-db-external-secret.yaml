# External Secret for Grafana's Postgres connection — AWS/EKS only.
#
# Syncs idp-mvp/grafana (terraform/grafana.tf) into the `grafana-db` Secret,
# which grafana-db-values.yaml hands to Grafana via envFromSecret. The
# Secrets Manager keys are already Grafana's env var names (GF_DATABASE_*), so
# dataFrom.extract projects them as-is.
#
# A dedicated ServiceAccount (grafana-eso-sa) with its own IRSA role means only
# the monitoring namespace can read this secret — same pattern as
# aws/observability/datadog/datadog-external-secret.yaml.
#
# bootstrap.sh substitutes AWS_REGION_PLACEHOLDER and annotates grafana-eso-sa
# with the grafana_eso_role_arn Terraform output after applying this.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-eso-sa
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: grafana
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager-grafana
  namespace: monitoring
spec:
  provider:
    aws:
      service: SecretsManager
      region: AWS_REGION_PLACEHOLDER
      auth:
        jwt:
          serviceAccountRef:
            name: grafana-eso-sa
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-db
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager-grafana
    kind: SecretStore
  target:
    name: grafana-db
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: idp-mvp/grafana
