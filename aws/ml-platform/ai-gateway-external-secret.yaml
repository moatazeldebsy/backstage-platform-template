# AI Gateway provider credentials — AWS/EKS variant.
#
# Syncs ANTHROPIC_API_KEY out of the existing `idp-mvp/kagent` Secrets Manager
# entry into the `ai-gateway-llm-keys` Secret the gateway reads. Same source of
# truth as `kagent-anthropic` (aws/kagent/external-secret.yaml) — the key is
# stored once and projected into each namespace that needs it, because
# Kubernetes Secrets are namespace-scoped and the gateway runs in ml-platform
# while KAgent runs in kagent.
#
# No new ServiceAccount or IRSA role: this uses the cluster-scoped
# `aws-secretsmanager` ClusterSecretStore (aws/external-secrets/cluster-secret-store.yaml),
# whose ESO ServiceAccount is already annotated with an IRSA role granting
# secretsmanager:GetSecretValue on idp-mvp/*.
#
# Why this exists in addition to what bootstrap-ai.sh writes: the bootstrap
# creates the same Secret imperatively from $ANTHROPIC_API_KEY so a first
# install works before ESO reconciles. This manifest is what keeps it correct
# afterwards — rotate the key in Secrets Manager and the gateway picks it up on
# the next refresh, instead of serving a stale credential until someone
# remembers to re-run the bootstrap.
#
# Local (Kind) has no ESO and no Secrets Manager; there the bootstrap-created
# Secret is the only copy, which is why the gateway mounts it with
# optional: true rather than depending on this manifest existing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-gateway-llm-keys
  namespace: ml-platform
  labels:
    app: ai-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: ai-gateway-llm-keys
    # Owner, so rotating the value in Secrets Manager overwrites whatever the
    # bootstrap wrote imperatively rather than leaving the two to disagree.
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: idp-mvp/kagent
        property: ANTHROPIC_API_KEY
