# MLflow tracking server — AWS/EKS variant.
#
# Differences from mlflow.yaml (local):
#   - Dedicated ServiceAccount with IRSA for S3 artifact access
#   - EBS PVC (gp3, 1Gi) for the SQLite tracking DB (survives pod restarts)
#   - S3 artifact root: s3://MLFLOW_ARTIFACTS_BUCKET_PLACEHOLDER/artifacts
#     (placeholder substituted by bootstrap-ai.sh --aws via sed before kubectl apply)
#   - ALB ingress instead of nginx
#
# bootstrap-ai.sh --aws also annotates the mlflow ServiceAccount with
# the IRSA role ARN (mlflow_role_arn terraform output) after applying.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlflow
  namespace: ml-platform
  labels:
    app: mlflow
  # eks.amazonaws.com/role-arn annotated by bootstrap-ai.sh --aws
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-db
  namespace: ml-platform
  labels:
    app: mlflow
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: ml-platform
  labels:
    app: mlflow
    backstage.io/kubernetes-id: mlflow
spec:
  replicas: 1
  # The PVC is ReadWriteOnce, so the replacement pod cannot mount the volume
  # while the outgoing one still holds it — a RollingUpdate would deadlock with
  # the new pod stuck ContainerCreating until progressDeadlineSeconds. EBS is
  # strictly single-attach, so this bites harder here than on Kind's local-path
  # provisioner: without it, bootstrap-ai.sh's `rollout status --timeout=180s`
  # fails the whole AWS bootstrap on every re-run.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
        backstage.io/kubernetes-id: mlflow
    spec:
      serviceAccountName: mlflow
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.13.0
          command:
            - mlflow
            - server
            - --host
            - "0.0.0.0"
            - --port
            - "5000"
            - --backend-store-uri
            - sqlite:////mlflow/mlflow.db
            # Proxied artifact serving (--serve-artifacts is on by default) —
            # see the note in kubernetes/ml-platform/mlflow.yaml. On AWS this
            # also matters for credentials: with a bare s3:// artifact root,
            # every client would need its own S3 access, and the scaffolder's
            # training Job runs on the default SA with no IRSA. Routing uploads
            # through this server means only the mlflow SA needs the bucket.
            - --artifacts-destination
            - s3://MLFLOW_ARTIFACTS_BUCKET_PLACEHOLDER/artifacts
            - --workers
            - "1"
            - --gunicorn-opts
            - "--timeout 120 --graceful-timeout 60"
          ports:
            - name: http
              containerPort: 5000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          # timeoutSeconds is set explicitly on every probe below, at the 15s the
          # rest of this platform standardises on (Gatekeeper via
          # scripts/bootstrap-local.sh, Kyverno via local/policies/kyverno-values.yaml
          # — both for exactly this reason). The Kubernetes default is 1s, which is
          # not enough for a single-worker gunicorn app on a 500m CPU limit under
          # load: /health answers, just not within a second. The kubelet then reports
          #   "context deadline exceeded (Client.Timeout exceeded while awaiting headers)"
          # — not "connection refused" — and liveness kills the container roughly
          # every 90s forever. The generous failureThresholds below do not help,
          # because every individual attempt times out.
          #
          # periodSeconds is 20 throughout so timeout stays <= period; the startup
          # budget is unchanged at 5 minutes (20s x 15).
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 15
          # MLflow initialises its backing store on first boot, which on a pod
          # capped at 500m CPU can take well over the ~90s (initialDelay 30 +
          # 3 × period 20) that livenessProbe alone allows — the kubelet then
          # kills it mid-startup and it restart-loops. A startupProbe gives it
          # up to 5 minutes, and liveness does not begin evaluating until
          # startup succeeds, so steady-state failure detection is unchanged.
          startupProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 20
            failureThreshold: 15
            timeoutSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 15
          volumeMounts:
            - name: mlflow-db
              mountPath: /mlflow
      volumes:
        - name: mlflow-db
          persistentVolumeClaim:
            claimName: mlflow-db
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: ml-platform
  labels:
    app: mlflow
spec:
  selector:
    app: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: 5000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mlflow
  namespace: ml-platform
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mlflow
                port:
                  number: 5000
