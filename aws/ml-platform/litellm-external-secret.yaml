# LiteLLM inbound-auth key — AWS/EKS variant.
#
# Syncs LITELLM_MASTER_KEY out of the existing `idp-mvp/kagent` Secrets Manager
# entry (terraform/secrets.tf) into the `litellm-keys` Secret the litellm
# Deployment reads via envFrom. Same reuse decision as ANTHROPIC_API_KEY below:
# one Secrets Manager entry, projected into whichever namespace needs it,
# rather than a second secret to manage and rotate separately.
#
# ANTHROPIC_API_KEY is synced here too (not just LITELLM_MASTER_KEY) because
# LiteLLM itself is now the thing calling Anthropic — kubernetes/ml-platform/ai-gateway.yaml
# no longer reads this key directly once ADR-0008 lands (agentgateway forwards
# to LiteLLM's baseUrl using LITELLM_MASTER_KEY instead).
#
# No new ServiceAccount or IRSA role needed for this secret sync specifically:
# uses the cluster-scoped `aws-secretsmanager` ClusterSecretStore, same one the
# old ai-gateway ExternalSecret used before ADR-0008 (deleted — agentgateway no
# longer reads ANTHROPIC_API_KEY directly). The *separate* litellm
# ServiceAccount in litellm-serviceaccount.yaml is only for Bedrock
# model-invocation calls, which are SigV4/IAM-based and cannot go through
# Secrets Manager at all.
#
# DATABASE_URL is pulled from a SEPARATE Secrets Manager entry (idp-mvp/litellm,
# not idp-mvp/kagent) — added after discovering LiteLLM's virtual keys and
# budget enforcement don't function without a DB ("Not connected to DB!" on
# /ui login). terraform/rds.tf composes the full connection string (host +
# generated password) at apply time, dedicated-RDS-per-component, same
# pattern as Langfuse's own idp-mvp/langfuse secret — not folded into
# idp-mvp/kagent because that one holds provider credentials, not
# infrastructure connection strings.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-keys
  namespace: ml-platform
  labels:
    app: litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: litellm-keys
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: idp-mvp/kagent
        property: ANTHROPIC_API_KEY
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: idp-mvp/kagent
        property: LITELLM_MASTER_KEY
    - secretKey: DATABASE_URL
      remoteRef:
        key: idp-mvp/litellm
        property: DATABASE_URL
