# LiteLLM ServiceAccount — AWS/EKS variant, IRSA-annotated for Bedrock access.
#
# kubernetes/ml-platform/litellm.yaml's Deployment leaves serviceAccountName
# unset (defaults to "default") because Kind has no OIDC provider to federate
# against. On AWS, this ServiceAccount is what the litellm Deployment actually
# runs as — bootstrap-ai.sh patches the Deployment's serviceAccountName to
# "litellm" after applying this file (same two-step pattern used nowhere else
# in ml-platform yet, because ai-gateway never needed its own IRSA role: its
# only AWS credential need was the Anthropic key, synced via
# litellm-external-secret.yaml, not IAM).
#
# role-arn comes from terraform/iam-litellm-bedrock.tf's aws_iam_role.litellm_bedrock
# output. YOUR_AWS_ACCOUNT_ID is substituted by scripts/setup.sh during
# personalisation, same placeholder convention as
# aws/observability/dora/dora-cronjob.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm
  namespace: ml-platform
  labels:
    app: litellm
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::YOUR_AWS_ACCOUNT_ID:role/idp-mvp-litellm-bedrock"
