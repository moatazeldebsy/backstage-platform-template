# IDP Assistant A2A ingress — AWS/EKS variant (AWS Load Balancer Controller / ALB).
# Exposes the KAgent-managed idp-assistant service for direct A2A access.
# No TLS at the ingress level (#310). Internal ALB only — see the annotations.
# Applied by: scripts/bootstrap-ai.sh --aws
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: idp-assistant
  namespace: kagent
  labels:
    app: idp-assistant
  annotations:
    # Internal, not internet-facing: IDP Assistant (A2A) has no authentication of its
    # own, and on the public ALB anyone could reach it. Reach it from inside
    # the VPC (VPN / bastion) or with kubectl port-forward. Ingresses in one
    # ALB group must share a scheme, so the internal UIs get their own group
    # (idp-internal) and listener :8084 there; scripts/lib.sh alb_ingress_url
    # still resolves the hostname.
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/group.name: idp-internal
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 8084}]'
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/proxy-read-timeout: "120"
    alb.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: idp-assistant
                port:
                  number: 8080
