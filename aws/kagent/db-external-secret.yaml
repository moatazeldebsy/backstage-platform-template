# KAgent controller database URL — AWS/EKS only, with aws/kagent/values-rds.yaml.
# Uses the kagent namespace's SecretStore + kagent-eso-sa from
# aws/kagent/external-secret.yaml (its IRSA role can read idp-mvp/kagent-db,
# terraform/iam.tf kagent_eso). Applied by bootstrap-ai.sh --aws before the
# KAgent chart, so the controller's volume has something to mount.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-db
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: kagent-db
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: idp-mvp/kagent-db
        property: url
