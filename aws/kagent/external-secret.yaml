# External Secrets for KAgent — AWS/EKS variant.
#
# Syncs idp-mvp/kagent from AWS Secrets Manager into the kagent-anthropic
# Kubernetes Secret consumed by KAgent's controller and agents.
#
# A dedicated ServiceAccount (kagent-eso-sa) with IRSA is used so that only
# the kagent namespace can read this secret (least-privilege).
#
# bootstrap-ai.sh --aws annotates kagent-eso-sa with the IRSA role ARN
# (kagent_eso_role_arn terraform output) after applying this manifest.
#
# AWS_REGION_PLACEHOLDER is substituted by bootstrap-ai.sh --aws at deploy time.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kagent-eso-sa
  namespace: kagent
  labels:
    app.kubernetes.io/part-of: kagent
  # eks.amazonaws.com/role-arn annotated by bootstrap-ai.sh --aws
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: kagent
spec:
  provider:
    aws:
      service: SecretsManager
      region: AWS_REGION_PLACEHOLDER
      auth:
        jwt:
          serviceAccountRef:
            name: kagent-eso-sa
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-anthropic
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: kagent-anthropic
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: idp-mvp/kagent
---
# Grafana service-account token for the grafana-mcp server. Kept in a separate
# Secret (rather than reusing kagent-anthropic) because the grafana-mcp subchart
# takes a secretRef and mounts the whole Secret with envFrom — pointing it at
# kagent-anthropic would inject ANTHROPIC_API_KEY into the Grafana MCP pod for
# no reason.
#
# The token is a Viewer-role Grafana service account, created once against the
# kube-prometheus-stack Grafana and stored in the same Secrets Manager entry.
# See aws/kagent/values.yaml for why grafana-mcp needs this at all.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-grafana-mcp-token
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: kagent-grafana-mcp-token
    creationPolicy: Owner
  data:
    - secretKey: GRAFANA_SERVICE_ACCOUNT_TOKEN
      remoteRef:
        key: idp-mvp/kagent
        property: GRAFANA_SERVICE_ACCOUNT_TOKEN
