# AlertManager configuration for the IDP platform.
# Uses the AlertmanagerConfig CRD, which kube-prometheus-stack picks up via
# alertmanagerConfigSelector matching label app.kubernetes.io/part-of: kube-prometheus-stack
#
# Prerequisites — create secrets BEFORE applying this file:
#
#   # Slack webhook (required)
#   kubectl create secret generic alertmanager-slack-webhook \
#     --from-literal=webhook-url='https://hooks.slack.com/services/...' \
#     -n monitoring
#
#   # PagerDuty integration key (optional — for on-call paging)
#   kubectl create secret generic alertmanager-pagerduty \
#     --from-literal=integration-key='<your-PagerDuty-Events-API-v2-integration-key>' \
#     -n monitoring
#
# bootstrap-local.sh creates the Slack secret automatically when SLACK_WEBHOOK_URL is set.
# Set PAGERDUTY_INTEGRATION_KEY in local/.env to enable PagerDuty on local clusters.
#
# Apply only this file (secrets are managed separately):
#   kubectl apply -f observability/alertmanager/alertmanager-config.yaml
---
# AlertmanagerConfig CRD — defines routes and receivers.
# Picked up automatically by the Prometheus Operator when alertmanagerConfigSelector: {}.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: idp-slack-routing
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: kube-prometheus-stack
spec:
  route:
    groupBy: ['alertname', 'namespace', 'service']
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    receiver: slack-platform
    # Alertmanager evaluates sibling routes in order and STOPS at the first match
    # whose `continue` is false — and false is the default. The critical and warning
    # Slack routes below used to omit it, which silently terminated every alert
    # before it reached the agent-event-router route: no alert had ever reached the
    # router, so no incident issue was ever opened automatically, and the SLO routes
    # were dead too. Every route here except the last therefore sets continue: true,
    # and ordering runs most-specific first. Observed 2026-08-13.
    routes:
      # SLO burn-rate fast-burn goes out immediately (0s group wait) rather than
      # waiting out the default 30s, and repeats hourly while it burns.
      #
      # This used to page PagerDuty first. That receiver referenced a secret which
      # was never created, and the operator rejects an AlertmanagerConfig wholesale
      # when any receiver's secret is missing — so this file was skipped entirely
      # and *nothing* was delivered: not PagerDuty, not Slack, not the event router.
      # See "Enabling PagerDuty" at the foot of this file. Observed 2026-08-31.
      - matchers:
          - name: category
            value: slo
          - name: severity
            value: critical
        receiver: slack-platform
        groupWait: 0s
        repeatInterval: 1h
        continue: true
      # Critical alerts go to Slack. category != slo keeps them from
      # double-notifying via the SLO route above; `!=` also matches alerts that
      # carry no category label at all, which is the common case.
      - matchers:
          - name: severity
            value: critical
          - name: category
            matchType: "!="
            value: slo
        receiver: slack-platform
        continue: true
      # Warning alerts go to Slack only
      - matchers:
          - name: severity
            value: warning
        receiver: slack-platform
        continue: true
      # All firing alerts are also routed to the event router for agent triage.
      # This MUST stay last: it is the only route that may terminate matching.
      - matchers:
          - name: severity
            matchType: =~
            value: "critical|warning"
        receiver: agent-event-router

  receivers:
    - name: slack-platform
      slackConfigs:
        - apiURL:
            name: alertmanager-slack-webhook
            key: webhook-url
          channel: '#platform-alerts'
          sendResolved: true
          title: '{{ if eq .Status "firing" }}:red_circle:{{ else }}:white_check_mark:{{ end }} [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
          text: |
            *Severity:* {{ .CommonLabels.severity }}
            *Namespace:* {{ .CommonLabels.namespace }}
            {{ range .Alerts }}
            *Summary:* {{ .Annotations.summary }}
            *Runbook:* <{{ .Annotations.runbook_url }}|View Runbook>
            {{ end }}
          footer: 'IDP Platform'

    # ── Enabling PagerDuty ────────────────────────────────────────────────
    # Deliberately absent, not forgotten. A pagerduty receiver referencing a
    # secret that does not exist takes the WHOLE AlertmanagerConfig down with it:
    # the operator logs "skipping alertmanagerconfig" and every route in this file
    # stops delivering. That is a silent, total alerting outage caused by adding
    # an optional integration.
    #
    # To enable it, create the secret FIRST, then add the receiver and its routes:
    #
    #   kubectl create secret generic alertmanager-pagerduty -n monitoring \
    #     --from-literal=integration-key=<Events API v2 key>
    #
    #   # then, in this file, a receiver:
    #   - name: pagerduty-critical
    #     pagerdutyConfigs:
    #       - routingKey:
    #           name: alertmanager-pagerduty
    #           key: integration-key
    #         sendResolved: true
    #
    #   # and a route above, ahead of the matching Slack one, with continue: true
    #
    # After applying, confirm the config was accepted rather than skipped:
    #
    #   kubectl logs -n monitoring deploy/prometheus-kube-prometheus-operator \
    #     | grep -i "skipping alertmanagerconfig"
    #
    # Agent event router — forwards firing alerts to the AI triage agent via A2A,
    # and resolved alerts so it can close out any incident issue it auto-created.
    - name: agent-event-router
      webhookConfigs:
        - url: 'http://agent-event-router.services-dev.svc.cluster.local:3004/webhook/alertmanager'
          sendResolved: true
          # No Authorization header by default, deliberately.
          #
          # This carried a Bearer credential from secret
          # `agent-event-router-webhook-token`, which nothing in this repository
          # ever created — and Alertmanager can only read secrets in its own
          # namespace, so it could not have used the router's own
          # `agent-event-router-secrets` in services-dev either. A missing secret
          # is fatal to the whole AlertmanagerConfig, so this one reference took
          # every route in this file down with it.
          #
          # The router accepts unauthenticated calls when WEBHOOK_TOKEN is unset
          # and says so on startup; it is a ClusterIP service, reachable only from
          # inside the cluster. To authenticate it anyway, create the secret in
          # THIS namespace first, then add the block back:
          #
          #   kubectl create secret generic agent-event-router-webhook-token \
          #     -n monitoring --from-literal=token="$TOKEN"
          #   # and set the same value as webhook-token in
          #   # agent-event-router-secrets (services-dev), which the router reads.
          #
          #   httpConfig:
          #     authorization:
          #       type: Bearer
          #       credentials:
          #         name: agent-event-router-webhook-token
          #         key: token

  inhibitRules:
    - sourceMatch:
        - name: severity
          value: critical
      targetMatch:
        - name: severity
          value: warning
      equal: ['alertname', 'namespace']
