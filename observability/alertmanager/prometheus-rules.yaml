# Prometheus alert rules for IDP platform services
# Applies to all workloads in services, services-dev, services-staging, services-prod namespaces.
#
# Deploy:
#   kubectl apply -f observability/alertmanager/prometheus-rules.yaml
#
# Verify rules are loaded:
#   kubectl get prometheusrules -n monitoring
#   # Port-forward and check: http://localhost:9090/rules
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: idp-platform-rules
  namespace: monitoring
  labels:
    # Must match the ruleSelector in kube-prometheus-stack (release=prometheus by default)
    release: prometheus
    app.kubernetes.io/part-of: kube-prometheus-stack
spec:
  groups:
    # ── Pod health ────────────────────────────────────────────────────────────
    - name: pod-health
      interval: 30s
      rules:
        - alert: PodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{
              namespace=~"services.*"
            }[5m]) > 3
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} ({{ $labels.namespace }}) is crash-looping"
            description: "Container {{ $labels.container }} restarted {{ $value | humanize }} times in the last 5 minutes."
            runbook_url: "https://github.com/moatazeldebsy/backstage-platform-template/blob/main/docs/runbooks/pod-crash-loop.md"

    # ── Resource usage ────────────────────────────────────────────────────────
    - name: resource-usage
      interval: 60s
      rules:
        - alert: HighMemoryUsage
          expr: |
            (
              container_memory_working_set_bytes{
                namespace=~"services.*",
                container!=""
              }
              /
              container_spec_memory_limit_bytes{
                namespace=~"services.*",
                container!=""
              }
            ) > 0.80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage in {{ $labels.namespace }}/{{ $labels.pod }}"
            description: "Container {{ $labels.container }} is using {{ $value | humanizePercentage }} of its memory limit."
            runbook_url: "https://github.com/moatazeldebsy/backstage-platform-template/blob/main/docs/runbooks/high-memory.md"

        - alert: HighMemoryUsageCritical
          expr: |
            (
              container_memory_working_set_bytes{
                namespace=~"services.*",
                container!=""
              }
              /
              container_spec_memory_limit_bytes{
                namespace=~"services.*",
                container!=""
              }
            ) > 0.95
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Critical memory usage in {{ $labels.namespace }}/{{ $labels.pod }} — OOMKill imminent"
            description: "Container {{ $labels.container }} is at {{ $value | humanizePercentage }} of its memory limit."
            runbook_url: "https://github.com/moatazeldebsy/backstage-platform-template/blob/main/docs/runbooks/high-memory.md"

        - alert: HighCPUUsage
          expr: |
            (
              rate(container_cpu_usage_seconds_total{
                namespace=~"services.*",
                container!=""
              }[5m])
              /
              container_spec_cpu_quota{
                namespace=~"services.*",
                container!=""
              }
              * container_spec_cpu_period{
                namespace=~"services.*",
                container!=""
              }
            ) > 0.80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage in {{ $labels.namespace }}/{{ $labels.pod }}"
            description: "Container {{ $labels.container }} is using {{ $value | humanizePercentage }} of its CPU limit."
            runbook_url: "https://github.com/moatazeldebsy/backstage-platform-template/blob/main/docs/runbooks/high-cpu.md"

    # ── Deployment health ──────────────────────────────────────────────────────
    - name: deployment-health
      interval: 60s
      rules:
        - alert: DeploymentReplicasMismatch
          expr: |
            kube_deployment_spec_replicas{namespace=~"services.*"}
            !=
            kube_deployment_status_replicas_available{namespace=~"services.*"}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has mismatched replicas"
            description: "Desired {{ $value }} replicas but not all are available. A deploy may be stuck."
            runbook_url: "https://github.com/moatazeldebsy/backstage-platform-template/blob/main/docs/runbooks/deployment-rollback.md"

    # ── SLO error budget burn-rate ────────────────────────────────────────────
    # Multi-window burn-rate alerts follow the Google SRE book pattern.
    # Fast burn (1h/5h windows) pages immediately; slow burn (6h/3d windows) files a ticket.
    # These complement Sloth-generated rules; this group catches any service exposing
    # slo:sli_error:ratio_rate* recording rules (generated by `sloth generate`).
    - name: slo-burn-rate
      interval: 60s
      rules:
        - alert: SLOErrorBudgetFastBurn
          expr: |
            (
              slo:sli_error:ratio_rate1h{sloth_id!=""} > (14.4 * (1 - slo:objective:ratio{sloth_id!=""}))
            ) and (
              slo:sli_error:ratio_rate5h{sloth_id!=""} > (6 * (1 - slo:objective:ratio{sloth_id!=""}))
            )
          for: 2m
          labels:
            severity: critical
            category: slo
          annotations:
            summary: "Fast error budget burn on {{ $labels.sloth_service }} ({{ $labels.sloth_slo }})"
            description: >-
              Burning error budget at > 14.4× the sustainable rate over the last 1h.
              At this rate the monthly budget will be exhausted in < 50 minutes.
            runbook_url: "https://github.com/moatazeldebsy/backstage-platform-template/blob/main/docs/runbooks/deployment-rollback.md"

        - alert: SLOErrorBudgetSlowBurn
          expr: |
            (
              slo:sli_error:ratio_rate6h{sloth_id!=""} > (6 * (1 - slo:objective:ratio{sloth_id!=""}))
            ) and (
              slo:sli_error:ratio_rate3d{sloth_id!=""} > (1 * (1 - slo:objective:ratio{sloth_id!=""}))
            )
          for: 15m
          labels:
            severity: warning
            category: slo
          annotations:
            summary: "Slow error budget burn on {{ $labels.sloth_service }} ({{ $labels.sloth_slo }})"
            description: >-
              Burning error budget at > 6× the sustainable rate over the last 6h.
              At this rate the monthly budget will be exhausted in < 5 days.
            runbook_url: "https://github.com/moatazeldebsy/backstage-platform-template/blob/main/docs/runbooks/deployment-rollback.md"

    # ── DORA anomaly detection ────────────────────────────────────────────────
    # Alerts when key DORA metrics regress significantly week-over-week.
    - name: dora-anomalies
      interval: 300s
      rules:
        - alert: DORADeployFrequencyDrop
          expr: |
            (
              avg_over_time(dora_deploy_frequency_per_day[1d])
              /
              avg_over_time(dora_deploy_frequency_per_day[7d] offset 1d)
            ) < 0.5
          for: 30m
          labels:
            severity: warning
            category: dora
          annotations:
            summary: "Deploy frequency for {{ $labels.service }} dropped > 50% vs last week"
            description: >-
              Today's deploy frequency is less than half the 7-day average from last week.
              This may indicate a stuck pipeline, team capacity issue, or a release freeze.

        - alert: DORAMTTRSpike
          expr: |
            avg_over_time(dora_mttr_minutes[1d]) > 60
          for: 30m
          labels:
            severity: warning
            category: dora
          annotations:
            summary: "MTTR for {{ $labels.service }} exceeded 60 minutes (24h average)"
            description: >-
              Mean time to restore has exceeded 60 minutes on average over the last 24 hours.
              Review recent incidents and runbook effectiveness.

        - alert: DORAChangeFailureRateHigh
          expr: |
            avg_over_time(dora_change_failure_rate_percent[1d]) > 15
          for: 30m
          labels:
            severity: warning
            category: dora
          annotations:
            summary: "Change Failure Rate for {{ $labels.service }} > 15% (24h average)"
            description: >-
              More than 15% of deployments in the last 24 hours required a hotfix or rollback.
              Consider adding canary deployments or improving pre-deploy testing.

    # ── HTTP error rate ────────────────────────────────────────────────────────
    - name: http-errors
      interval: 30s
      rules:
        - alert: HighHTTP5xxRate
          expr: |
            (
              sum by (namespace, service) (
                rate(http_requests_total{
                  namespace=~"services.*",
                  status=~"5.."
                }[5m])
              )
              /
              sum by (namespace, service) (
                rate(http_requests_total{
                  namespace=~"services.*"
                }[5m])
              )
            ) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "High 5xx error rate on {{ $labels.namespace }}/{{ $labels.service }}"
            description: "{{ $value | humanizePercentage }} of requests are returning 5xx errors."
            runbook_url: "https://github.com/moatazeldebsy/backstage-platform-template/blob/main/docs/runbooks/deployment-rollback.md"

    # ── Team cost budgets ────────────────────────────────────────────────────
    # Source: idp_team_budget_usd_monthly and idp_team_actual_cost_usd_monthly
    # pushed by tech-insights-exporter every 15 minutes from the OpenCost API.
    - name: team-cost-budgets
      interval: 5m
      rules:
        - alert: TeamBudgetWarning
          expr: |
            (
              idp_team_actual_cost_usd_monthly
              /
              idp_team_budget_usd_monthly
            ) > 0.80
          for: 10m
          labels:
            severity: warning
            category: finops
          annotations:
            summary: "Team {{ $labels.team }} has consumed {{ $value | humanizePercentage }} of monthly budget"
            description: >-
              Team {{ $labels.team }} month-to-date Kubernetes spend has crossed 80 % of the
              configured monthly budget. Review workload costs in the OpenCost dashboard or
              the Grafana FinOps tab for this team.
            runbook_url: "https://github.com/moatazeldebsy/backstage-platform-template/blob/main/docs/runbooks/cost-budget-exceeded.md"

        - alert: TeamBudgetExceeded
          expr: |
            (
              idp_team_actual_cost_usd_monthly
              /
              idp_team_budget_usd_monthly
            ) > 1.0
          for: 5m
          labels:
            severity: critical
            category: finops
          annotations:
            summary: "Team {{ $labels.team }} has EXCEEDED monthly budget ({{ $value | humanizePercentage }})"
            description: >-
              Team {{ $labels.team }} has exceeded its monthly Kubernetes budget.
              Current spend is {{ $value | humanizePercentage }} of budget.
              Escalate to the team lead and FinOps channel. Consider scaling down
              non-critical workloads in the team's namespace.
            runbook_url: "https://github.com/moatazeldebsy/backstage-platform-template/blob/main/docs/runbooks/cost-budget-exceeded.md"

    # ── KAgent / MCP tool abuse ───────────────────────────────────────────────
    # Fires when scaffold_service is called at an unusually high rate — possible
    # runaway agent loop or API key misuse.
    - name: kagent-guardrails
      interval: 1m
      rules:
        - alert: ScaffoldServiceHighRate
          expr: |
            increase(mcp_tool_calls_total{tool="scaffold_service"}[10m]) > 5
          for: 2m
          labels:
            severity: warning
            category: ai-ops
          annotations:
            summary: "scaffold_service called >5 times in 10 min — possible agent loop"
            description: >-
              scaffold_service has been called {{ $value }} times in the last 10 minutes.
              Normal usage is 0–2 per user session. Check the KAgent audit log in Loki:
              {app="idp-mcp-server"} |= "[AUDIT]" | json
            runbook_url: "https://github.com/moatazeldebsy/backstage-platform-template/blob/main/docs/runbooks/kagent-guardrails.md"

        - alert: McpToolErrorRateHigh
          expr: |
            (
              increase(mcp_tool_calls_total{outcome="error"}[5m])
              /
              (increase(mcp_tool_calls_total[5m]) > 0)
            ) > 0.5
          for: 3m
          labels:
            severity: warning
            category: ai-ops
          annotations:
            summary: "MCP tool error rate >50 % on {{ $labels.server }}/{{ $labels.tool }}"
            description: >-
              More than half of recent calls to {{ $labels.server }}/{{ $labels.tool }}
              are returning errors. Check for a misconfigured agent, expired API key,
              or breaking change in a downstream service.
            runbook_url: "https://github.com/moatazeldebsy/backstage-platform-template/blob/main/docs/runbooks/kagent-guardrails.md"
