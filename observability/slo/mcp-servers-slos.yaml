# Sloth SLO definitions for the eight MCP servers behind the AI gateway (#314).
# After editing, run ./scripts/generate-slo-rules.sh and commit generated/ (CI
# job slo-drift enforces it). Apply with:
#   kubectl apply -f observability/slo/generated/mcp-servers-slo-rules.yaml
#
# One availability SLO per server, on the shared mcp_tool_calls_total counter
# (labels server/tool/outcome, kept consistent across servers by
# scripts/validate-mcp-metrics.py). outcome="error" is a tool call that threw.
#
# No latency SLO: tool durations range from milliseconds (catalog_search) to
# minutes (scaffold_service), so a per-server latency objective would be
# either always violated or meaningless.
#
# Ticket alerts only (severity: warning), no page. Tool-call volume is low and
# bursty, so one failed call in a quiet hour is a large error ratio; paging on
# that would be noise. The burn-rate alert still opens a ticket-level warning.
# 99% is a starting objective, not a measured one — tighten it once a few weeks
# of real error rates exist.
---
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: idp-mcp-server
  namespace: monitoring
  labels:
    app: idp-mcp-server
    team: platform-team
    release: prometheus
spec:
  service: idp-mcp-server
  labels:
    team: platform-team
  slos:
    - name: tool-call-availability
      objective: 99.0
      description: "99% of idp-mcp-server tool calls complete without an error"
      sli:
        events:
          errorQuery: |
            sum(rate(mcp_tool_calls_total{server="idp-mcp-server", outcome="error"}[{{.window}}])) or vector(0)
          totalQuery: |
            sum(rate(mcp_tool_calls_total{server="idp-mcp-server"}[{{.window}}]))
      alerting:
        name: MCPServerToolErrorBudgetBurn
        labels:
          category: availability
          server: idp-mcp-server
        annotations:
          summary: "idp-mcp-server is burning its tool-call error budget"
        pageAlert:
          disable: true
        ticketAlert:
          labels:
            severity: warning
---
