# Sloth SLO definitions for hello-service
# Apply with: sloth generate -i observability/slo/hello-service-slos.yaml | kubectl apply -f -
# Requires: https://github.com/slok/sloth installed and Prometheus Operator running

apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: hello-service
  namespace: monitoring
  labels:
    app: hello-service
    team: platform-team
    # Prometheus Operator's Prometheus object only picks up PrometheusRules
    # matching ruleSelector.matchLabels (release: prometheus) — without this,
    # sloth's generated rules are applied but silently never evaluated.
    release: prometheus
spec:
  service: hello-service
  labels:
    team: platform-team
    env: production

  slos:
    - name: requests-availability
      objective: 99.5
      description: "99.5% of hello-service HTTP requests must succeed (non-5xx)"
      sli:
        events:
          # Label is `status_code`, not `code` — `code` matches no series, so the
          # error ratio was always empty and the availability SLO never reported.
          # `or vector(0)` keeps a zero-error service at 0 rather than empty.
          errorQuery: |
            sum(rate(http_requests_total{job="hello-service", status_code=~"5.."}[{{.window}}])) or vector(0)
          totalQuery: |
            sum(rate(http_requests_total{job="hello-service"}[{{.window}}]))
      alerting:
        name: HelloServiceHighErrorRate
        labels:
          category: availability
        annotations:
          runbook: "https://github.com/moatazeldebsy/backstage-platform-template/blob/main/docs/runbooks/deployment-rollback.md"
        pageAlert:
          labels:
            severity: critical
        ticketAlert:
          labels:
            severity: warning

    - name: requests-latency
      objective: 99.0
      description: "99% of hello-service requests must complete within 500ms (p99 < 500ms)"
      sli:
        events:
          # Was inverted: the le="0.5" bucket counts requests FASTER than 500ms,
          # i.e. the good events. Using it as errorQuery reported ~100% error
          # budget burn on a healthy service. Errors are requests slower than the
          # threshold: total - (requests within it).
          errorQuery: |
            sum(rate(http_request_duration_seconds_count{job="hello-service"}[{{.window}}]))
            -
            sum(rate(http_request_duration_seconds_bucket{job="hello-service", le="0.5"}[{{.window}}]))
          totalQuery: |
            sum(rate(http_request_duration_seconds_count{job="hello-service"}[{{.window}}]))
      alerting:
        name: HelloServiceHighLatency
        labels:
          category: latency
        annotations:
          runbook: "https://github.com/moatazeldebsy/backstage-platform-template/blob/main/docs/runbooks/high-cpu.md"
        pageAlert:
          labels:
            severity: critical
        ticketAlert:
          labels:
            severity: warning
