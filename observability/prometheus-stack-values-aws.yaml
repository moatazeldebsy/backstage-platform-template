# kube-prometheus-stack Helm values for AWS EKS deployment.
# Mirrors local/observability/prometheus-stack-values.yaml with:
#   - ALB ingress (instead of nginx)
#   - gp2 persistent volumes (EKS default StorageClass)
#   - 15-day Prometheus retention (production-grade)
#   - Grafana IRSA annotation for CloudWatch datasource
#   - All three dashboard ConfigMaps wired (IDP, DORA, QA)
#
# Install:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
#     --namespace monitoring --create-namespace \
#     --values observability/prometheus-stack-values-aws.yaml \
#     --set grafana.adminPassword="${GRAFANA_ADMIN_PASSWORD}"

prometheus:
  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/backend-protocol: HTTP
    hosts: []   # empty = match any ALB hostname; set to real domain when DNS is configured
    servicePort: 9090
  prometheusSpec:
    retention: 15d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

alertmanager:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/backend-protocol: HTTP
    hosts: []
  alertmanagerSpec:
    alertmanagerConfigSelector:
      matchLabels:
        app.kubernetes.io/part-of: kube-prometheus-stack
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

grafana:
  # Password set via --set grafana.adminPassword at install time (from Secrets Manager / env var)
  # HA: 2 replicas so an ALB target is always healthy during rollouts.
  # Persistence is disabled because gp2 is ReadWriteOnce — two replicas cannot share
  # the same PVC. This is safe here: dashboards come from ConfigMaps and datasources
  # from this values file, so Grafana state is fully reproducible from config.
  # User-created dashboards and sessions will be lost on pod restart; if that becomes
  # a requirement, switch to an external Postgres backend (`grafana.database.*`) and
  # re-enable persistence with EFS (ReadWriteMany).
  replicas: 2
  serviceAccount:
    annotations:
      # Populated by bootstrap.sh: eks.amazonaws.com/role-arn = grafana_role_arn terraform output
      eks.amazonaws.com/role-arn: "GRAFANA_IRSA_ROLE_ARN"

  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/backend-protocol: HTTP
      # Mirror local/observability/prometheus-stack-values.yaml: retry on transient
      # 503s so a Grafana restart never surfaces to the user during dashboard reload.
      alb.ingress.kubernetes.io/success-codes: "200-399"
      alb.ingress.kubernetes.io/healthcheck-path: /api/health
      alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "10"
      alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    hosts: []

  # Lenient probes — Grafana can be slow to start when loading dashboard ConfigMaps.
  # Mirrors the local values file to keep behaviour at parity.
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 30
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 10
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 60
    timeoutSeconds: 30
    periodSeconds: 10
    failureThreshold: 10

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://prometheus-operated.monitoring:9090
          isDefault: true
        - name: AlertManager
          uid: alertmanager
          type: alertmanager
          access: proxy
          url: http://prometheus-kube-prometheus-alertmanager.monitoring:9093
          jsonData:
            implementation: prometheus
        - name: CloudWatch
          uid: cloudwatch
          type: cloudwatch
          access: proxy
          jsonData:
            authType: default
            # Region substituted by bootstrap.sh
            defaultRegion: "us-east-1"

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: idp
          folder: IDP Services
          type: file
          options:
            path: /var/lib/grafana/dashboards/idp
        - name: dora
          folder: DORA Metrics
          type: file
          options:
            path: /var/lib/grafana/dashboards/dora
        - name: qa
          folder: QA Platform
          type: file
          options:
            path: /var/lib/grafana/dashboards/qa

  # ConfigMap names must match what bootstrap.sh creates via kubectl create configmap
  dashboardsConfigMaps:
    idp: grafana-dashboards-idp
    dora: grafana-dashboards-dora
    qa: grafana-qa-dashboard

  # Disabled to allow 2 replicas (see note above). gp2 is RWO; enabling persistence
  # would pin the deployment to a single replica.
  persistence:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

kubeStateMetrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

nodeExporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

# Note: Prometheus Pushgateway is installed as a separate Helm release (not a subchart):
#   helm upgrade --install prometheus-pushgateway prometheus-community/prometheus-pushgateway \
#     --namespace monitoring --set serviceMonitor.enabled=true \
#     --set serviceMonitor.additionalLabels.release=prometheus
