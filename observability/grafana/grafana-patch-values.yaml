# Patch values for helm upgrade --reuse-values
# Adds: AlertManager datasource, finops and slo dashboard providers
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: CloudWatch
        uid: cloudwatch
        type: cloudwatch
        access: proxy
        jsonData:
          authType: default
          defaultRegion: us-east-1
        isDefault: true
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-operated.monitoring:9090
      - name: AlertManager
        uid: alertmanager
        type: alertmanager
        access: proxy
        url: http://prometheus-kube-prometheus-alertmanager.monitoring:9093
        jsonData:
          implementation: prometheus

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: idp
        folder: IDP Services
        type: file
        options:
          path: /var/lib/grafana/dashboards/idp
      - name: dora
        folder: DORA Metrics
        type: file
        options:
          path: /var/lib/grafana/dashboards/dora
      - name: finops
        folder: FinOps & Cost
        type: file
        options:
          path: /var/lib/grafana/dashboards/finops
      - name: slo
        folder: SLOs
        type: file
        options:
          path: /var/lib/grafana/dashboards/slo

dashboardsConfigMaps:
  idp: grafana-dashboards-idp
  dora: grafana-dashboards-dora
