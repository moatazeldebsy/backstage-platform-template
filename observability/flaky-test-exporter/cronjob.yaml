apiVersion: batch/v1
kind: CronJob
metadata:
  name: flaky-test-exporter
  namespace: monitoring
  labels:
    app: flaky-test-exporter
    team: platform-team
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: flaky-test-exporter
        spec:
          restartPolicy: OnFailure
          containers:
            - name: exporter
              image: python:3.12-slim
              command:
                - /bin/sh
                - -c
                - |
                  pip install requests --quiet && python /app/exporter.py
              env:
                - name: BACKSTAGE_URL
                  # Substituted per environment by bootstrap.sh (AWS) and
                  # bootstrap-local.sh (Kind). Both apply THIS shared manifest, but
                  # Backstage lives in different places: on Kind it is a Docker
                  # Compose container fronted by a selector-less Service in the
                  # default namespace on :3000, while on EKS it is a real Deployment
                  # in the backstage namespace on :80. The hardcoded local address
                  # left both exporters in CrashLoopBackOff on AWS with
                  #   Failed to resolve 'backstage.default.svc.cluster.local'
                  # Observed 2026-08-13.
                  value: "BACKSTAGE_URL_PLACEHOLDER"
                - name: BACKSTAGE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: backstage-catalog-exporter-token
                      key: token
                      optional: true
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: flaky-test-exporter-github-token
                      key: token
                - name: PUSHGATEWAY_URL
                  value: "http://prometheus-pushgateway.monitoring.svc.cluster.local:9091"
                - name: MODE
                  value: "pushgateway"
                - name: WINDOW_SIZE
                  value: "10"
              volumeMounts:
                - name: exporter-script
                  mountPath: /app
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 384Mi
          volumes:
            - name: exporter-script
              configMap:
                name: flaky-test-exporter-script
# The flaky-test-exporter-script ConfigMap is created separately from the
# real exporter.py + quarantine.py source (see scripts/bootstrap-local.sh / bootstrap.sh):
#   kubectl create configmap flaky-test-exporter-script \
#     --from-file=exporter.py=observability/flaky-test-exporter/exporter.py \
#     --from-file=quarantine.py=observability/flaky-test-exporter/quarantine.py \
#     -n monitoring --dry-run=client -o yaml | kubectl apply -f -
# Do NOT define it here — applying this file would overwrite the real script
# with a placeholder. See also quarantine-cronjob.yaml, which mounts the same
# ConfigMap to run quarantine.py on a daily schedule.
