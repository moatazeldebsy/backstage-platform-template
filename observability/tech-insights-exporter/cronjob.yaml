# Scorecard Metrics Exporter CronJob
# Runs every 30 minutes, queries Backstage catalog, evaluates scorecard checks,
# and publishes pass/fail metrics to CloudWatch namespace: IDP/Scorecards
#
# Deploy:
#   kubectl apply -f observability/tech-insights-exporter/cronjob.yaml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scorecard-exporter
  namespace: monitoring
  annotations:
    # Add the IRSA ARN for CloudWatch PutMetricData (same role as DORA exporter, or create a new one)
    eks.amazonaws.com/role-arn: ""   # Fill in: terraform output dora_exporter_role_arn
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scorecard-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: scorecard-exporter
    app.kubernetes.io/instance: scorecard-exporter
    cost-center: platform
    team: platform-team
    environment: production
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: scorecard-exporter
            app.kubernetes.io/instance: scorecard-exporter
        spec:
          serviceAccountName: scorecard-exporter
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          containers:
            - name: exporter
              image: python:3.13-slim
              command:
                - /bin/sh
                - -c
                - |
                  pip install boto3 --quiet
                  python /app/exporter.py
              env:
                - name: BACKSTAGE_URL
                  value: "http://backstage.backstage.svc.cluster.local:7007"
                - name: AWS_REGION
                  value: "us-east-1"
                - name: DRY_RUN
                  value: "false"
              volumeMounts:
                - name: exporter-script
                  mountPath: /app
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: false  # pip needs write access
          volumes:
            - name: exporter-script
              configMap:
                name: scorecard-exporter-script
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: scorecard-exporter-script
  namespace: monitoring
data:
  exporter.py: |
    # This ConfigMap mounts the exporter script.
    # Keep in sync with observability/tech-insights-exporter/exporter.py
    # For production, build a proper Docker image instead of using this ConfigMap pattern.
    # See observability/tech-insights-exporter/exporter.py for the full script.
