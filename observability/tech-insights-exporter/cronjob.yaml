apiVersion: batch/v1
kind: CronJob
metadata:
  name: tech-insights-exporter
  namespace: monitoring
  labels:
    app: tech-insights-exporter
    team: platform-team
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Fail fast rather than retrying into a wall. These exporters read the
      # Backstage API, which on a plain `bootstrap-local.sh` run (no
      # --start-backstage) is not running at all. Without these two the job
      # inherits backoffLimit=6 and no deadline, so a run against an absent
      # Backstage retries six times and can stay Active indefinitely — burning
      # CPU on a local cluster that has none spare, every 15 minutes. Matches
      # local/observability/dora/dora-cronjob.yaml, which already had them.
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: tech-insights-exporter
        spec:
          restartPolicy: OnFailure
          containers:
            - name: exporter
              image: python:3.12-slim
              command:
                - /bin/sh
                - -c
                - |
                  pip install requests --quiet && python /app/exporter.py
              env:
                - name: BACKSTAGE_URL
                  # Substituted per environment by bootstrap.sh (AWS) and
                  # bootstrap-local.sh (Kind). Both apply THIS shared manifest, but
                  # Backstage lives in different places: on Kind it is a Docker
                  # Compose container fronted by a selector-less Service in the
                  # default namespace on :3000, while on EKS it is a real Deployment
                  # in the backstage namespace on :80. The hardcoded local address
                  # left both exporters in CrashLoopBackOff on AWS with
                  #   Failed to resolve 'backstage.default.svc.cluster.local'
                  # Observed 2026-08-13.
                  value: "BACKSTAGE_URL_PLACEHOLDER"
                - name: BACKSTAGE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: backstage-catalog-exporter-token
                      key: token
                      optional: true
                - name: PUSHGATEWAY_URL
                  value: "http://prometheus-pushgateway.monitoring.svc.cluster.local:9091"
                - name: MODE
                  value: "pushgateway"
                - name: OPENCOST_URL
                  value: "http://opencost.opencost.svc.cluster.local:9003"
                # Override per-team budgets at deploy time if needed:
                #   kubectl create secret generic team-budgets --from-literal=json='{"platform-team":2500}'
                # - name: TEAM_BUDGETS_JSON
                #   valueFrom:
                #     secretKeyRef:
                #       name: team-budgets
                #       key: json
                #       optional: true
              volumeMounts:
                - name: exporter-script
                  mountPath: /app
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
          volumes:
            - name: exporter-script
              configMap:
                name: tech-insights-exporter-script
# The tech-insights-exporter-script ConfigMap is created separately from the
# real exporter.py source (see scripts/bootstrap-local.sh / bootstrap.sh):
#   kubectl create configmap tech-insights-exporter-script \
#     --from-file=exporter.py=observability/tech-insights-exporter/exporter.py \
#     -n monitoring --dry-run=client -o yaml | kubectl apply -f -
# Do NOT define it here — applying this file would overwrite the real script
# with a placeholder.
