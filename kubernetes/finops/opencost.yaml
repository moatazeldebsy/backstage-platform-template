# OpenCost — in-cluster Kubernetes cost visibility
# https://www.opencost.io/
#
# Deploy:
#   kubectl apply -f kubernetes/finops/opencost.yaml
#
# Access UI:
#   kubectl port-forward -n finops svc/opencost-ui 9090
#   open http://localhost:9090
#
# Metrics endpoint (Prometheus scrape):
#   http://opencost.finops.svc.cluster.local:9003/metrics
---
apiVersion: v1
kind: Namespace
metadata:
  name: finops
  labels:
    # OpenCost requires readOnlyRootFilesystem: false (writes /var/configs/aws.json at startup),
    # which is allowed under "baseline" but not "restricted" PSS.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    cost-center: platform
    team: platform-team
    environment: production
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opencost
  namespace: finops
  labels:
    app.kubernetes.io/name: opencost
    app.kubernetes.io/instance: opencost
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opencost
  labels:
    app.kubernetes.io/name: opencost
rules:
  - apiGroups: [""]
    resources: ["configmaps", "deployments", "nodes", "pods", "services",
                "resourcequotas", "replicationcontrollers", "limitranges",
                "persistentvolumeclaims", "persistentvolumes", "namespaces", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opencost
  labels:
    app.kubernetes.io/name: opencost
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opencost
subjects:
  - kind: ServiceAccount
    name: opencost
    namespace: finops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencost
  namespace: finops
  labels:
    app.kubernetes.io/name: opencost
    app.kubernetes.io/instance: opencost
    cost-center: platform
    team: platform-team
    environment: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: opencost
      app.kubernetes.io/name: opencost
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencost
        app.kubernetes.io/instance: opencost
        cost-center: platform
        team: platform-team
        environment: production
    spec:
      serviceAccountName: opencost
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opencost
          image: ghcr.io/opencost/opencost:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9003
              protocol: TCP
          env:
            - name: PROMETHEUS_SERVER_ENDPOINT
              # Points to the kube-prometheus-stack Prometheus service
              value: "http://prometheus-operated.monitoring:9090"
            - name: CLOUD_PROVIDER_API_KEY
              value: "AIzaSyD-9tSrke72PouQMnMX-a7eZSW0jkFMBWY"  # GCP pricing API key (optional for AWS)
            - name: CLUSTER_ID
              value: "idp-mvp"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9003
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9003
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 10
          resources:
            requests:
              cpu: 10m
              memory: 55Mi
            limits:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false  # OpenCost writes /var/configs/aws.json at startup
        # OpenCost UI — serves the web dashboard on port 9090
        - name: opencost-ui
          image: ghcr.io/opencost/opencost-ui:latest
          imagePullPolicy: Always
          ports:
            - name: ui
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
---
apiVersion: v1
kind: Service
metadata:
  name: opencost
  namespace: finops
  labels:
    app.kubernetes.io/name: opencost
    app.kubernetes.io/instance: opencost
spec:
  selector:
    app.kubernetes.io/instance: opencost
    app.kubernetes.io/name: opencost
  ports:
    - name: http
      port: 9003
      targetPort: http
      protocol: TCP
    - name: ui
      port: 9090
      targetPort: ui
      protocol: TCP
---
# ServiceMonitor — tells Prometheus to scrape OpenCost metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: opencost
  namespace: finops
  labels:
    # Must match the serviceMonitorSelector in kube-prometheus-stack
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: opencost
  namespaceSelector:
    matchNames:
      - finops
  endpoints:
    - port: http
      interval: 60s
      path: /metrics
