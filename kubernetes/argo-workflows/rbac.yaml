# RBAC for Argo Workflows to run workflows in ml-platform namespace
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-workflows
  namespace: ml-platform

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-workflows
  namespace: ml-platform
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create", "get"]
- apiGroups: ["argoproj.io"]
  resources: ["workflows", "workflows/finalizers"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "watch", "list"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-workflows
  namespace: ml-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-workflows
subjects:
- kind: ServiceAccount
  name: argo-workflows
  namespace: ml-platform

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-workflows-exec
  namespace: argo-workflows
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-workflows-admin
subjects:
- kind: ServiceAccount
  name: argo-workflows
  namespace: ml-platform

---
# Runner identity for the ml-training and llm-eval WorkflowTemplates.
#
# Separate from the argo-workflows SA above, which is the controller's. Pipeline
# pods run user-authored training code, so they get their own identity with only
# what that code needs: read its ConfigMap, read the MLflow/Langfuse credentials,
# and nothing else. No pod create, no workflow write.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ml-pipeline-runner
  namespace: ml-platform
  annotations:
    # PLACEHOLDER — nothing substitutes this string, because there is no
    # argo_workflows_role_arn Terraform output and no Argo Workflows IAM role
    # (issue #357). install_argo_workflows() strips this annotation on AWS
    # rather than leave a literal that reads as a configured role; it only
    # sets a real value once the Terraform output exists. Inert on local.
    eks.amazonaws.com/role-arn: "REPLACE_WITH_ARGO_WORKFLOWS_ROLE_ARN"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ml-pipeline-runner
  namespace: ml-platform
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  # Argo's executor reports step status back through the workflow's own pod
  # resource; without this the steps run but never report outputs.
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ml-pipeline-runner
  namespace: ml-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ml-pipeline-runner
subjects:
  - kind: ServiceAccount
    name: ml-pipeline-runner
    namespace: ml-platform
