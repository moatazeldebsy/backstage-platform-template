# NOTE: Do NOT apply this file manually. The ALB ingress for Prometheus is already
# created by the kube-prometheus-stack Helm chart via observability/prometheus-stack-values-aws.yaml.
# Applying this file would create a duplicate Ingress object and cause ALB conflicts.
#
# This file is kept as a reference for the ingress spec. To customise, edit the
# prometheus.ingress section in observability/prometheus-stack-values-aws.yaml.
#
# hosts: [] — matches any hostname; use ALB DNS directly until Route53 is configured.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus
  namespace: monitoring
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus-kube-prometheus-prometheus
                port:
                  number: 9090
