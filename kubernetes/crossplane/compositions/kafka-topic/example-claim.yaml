apiVersion: idp.platform/v1alpha1
kind: KafkaTopic
metadata:
  name: orders-events
  namespace: services-dev
spec:
  parameters:
    topicName: orders.events.v1
    # ARN of the MSK cluster created by Terraform (terraform/msk.tf or similar).
    # Wire this from a ConfigMap or hard-code per environment.
    clusterArn: arn:aws:kafka:eu-west-1:000000000000:cluster/idp/REPLACE_ME
    owner: orders-team
    partitions: 6
    replicationFactor: 3
    retentionHours: 168
    cleanupPolicy: delete
    costCenter: eng-orders
