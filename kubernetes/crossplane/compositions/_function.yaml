# Patch-and-transform function used by every Composition in this repo. One
# install is enough; the Function resource is namespaced to the package
# system, not per-Composition.
apiVersion: pkg.crossplane.io/v1beta1
kind: Function
metadata:
  name: function-patch-and-transform
spec:
  package: xpkg.upbound.io/crossplane-contrib/function-patch-and-transform:v0.7.0
