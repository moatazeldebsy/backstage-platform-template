# Grafana dashboard ConfigMap for AI Platform observability.
# Provisioned via dashboardsConfigMaps.ai in grafana-helm-values.yaml.
#
# To apply: kubectl apply -f kubernetes/monitoring/grafana-ai-dashboard-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-ai
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: kube-prometheus-stack
data:
  ai-platform.json: |
    {
      "title": "AI Platform Observability",
      "uid": "ai-platform",
      "tags": [
        "ai",
        "agents",
        "mcp"
      ],
      "timezone": "browser",
      "schemaVersion": 38,
      "panels": [
        {
          "id": 1,
          "title": "MCP Tool Calls (Total)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(increase(mcp_tool_calls_total[5m]))",
              "refId": "A",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "MCP Tool Calls by Server",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "targets": [
            {
              "expr": "rate(mcp_tool_calls_total[5m]) by (job)",
              "refId": "A",
              "legendFormat": "{{job}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 3,
          "title": "MCP Tool Latency (P95)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, rate(mcp_tool_duration_seconds_bucket[5m])) by (job)",
              "refId": "A",
              "legendFormat": "{{job}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 4,
          "title": "MCP Tool Call Errors",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(increase(mcp_tool_calls_total{error=\"true\"}[5m]))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "Tool Calls by MCP Server (1h)",
          "type": "piechart",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(increase(mcp_tool_calls_total[1h])) by (job)",
              "refId": "A",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "id": 6,
          "title": "MCP Tool Latency Distribution (P50/P95/P99)",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 12
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, rate(mcp_tool_duration_seconds_bucket[5m])) by (job)",
              "refId": "A",
              "legendFormat": "{{job}} P50"
            },
            {
              "expr": "histogram_quantile(0.95, rate(mcp_tool_duration_seconds_bucket[5m])) by (job)",
              "refId": "B",
              "legendFormat": "{{job}} P95"
            },
            {
              "expr": "histogram_quantile(0.99, rate(mcp_tool_duration_seconds_bucket[5m])) by (job)",
              "refId": "C",
              "legendFormat": "{{job}} P99"
            }
          ]
        }
      ],
      "refresh": "30s",
      "templating": {
        "list": []
      }
    }
