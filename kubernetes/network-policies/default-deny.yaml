# Default-deny ingress for every workload namespace (dev/staging/prod + the
# single-cluster `services` namespace used by local/Kind). Same allow rules as
# kubernetes/teams/*/network-policy.yaml: same-namespace traffic, Prometheus
# scraping, the ingress controller (kube-system or ingress-nginx namespace),
# and MCP tool calls from the kagent and ml-platform namespaces (ports 3001-3010)
# are permitted; everything else is denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: services
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
    # Allow KAgent agents to reach the MCP tool servers hosted here.
    # ml-platform is listed alongside kagent because the AI Gateway
    # (kubernetes/ml-platform/ai-gateway.yaml, opt-in via --gateway) multiplexes
    # these same servers and runs there. Without it the gateway comes up Ready
    # and serves an empty tool list — failureMode: failOpen turns a blocked
    # target into a missing tool, not an error.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kagent
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ml-platform
      ports:
        - protocol: TCP
          port: 3001
        - protocol: TCP
          port: 3002
        - protocol: TCP
          port: 3003
        - protocol: TCP
          port: 3005
        - protocol: TCP
          port: 3006
        - protocol: TCP
          port: 3007
        # 3008 incident-mcp-server, 3010 security-mcp-server — both ADP-phase
        # servers (bootstrap-ai.sh --adp). They were added after this allowlist
        # was written, so incident-agent and security-agent tool calls were
        # denied wherever these policies are enforced.
        - protocol: TCP
          port: 3008
        - protocol: TCP
          port: 3010
