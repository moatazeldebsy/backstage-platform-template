# Default-deny ingress for every workload namespace (dev/staging/prod + the
# single-cluster `services` namespace used by local/Kind). Same allow rules as
# kubernetes/teams/*/network-policy.yaml: same-namespace traffic, Prometheus
# scraping, and the ingress controller are permitted; everything else is denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: services
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
---
