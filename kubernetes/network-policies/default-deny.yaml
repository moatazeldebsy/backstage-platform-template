# Default-deny ingress for every workload namespace (dev/staging/prod + the
# single-cluster `services` namespace used by local/Kind). Same allow rules as
# kubernetes/teams/*/network-policy.yaml: same-namespace traffic, Prometheus
# scraping, the ingress controller (kube-system or ingress-nginx namespace),
# and KAgent MCP tool calls (kagent namespace, ports 3001-3007) are permitted;
# everything else is denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: services
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
    # Allow KAgent agents to reach the MCP tool servers hosted here
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kagent
      ports:
        - protocol: TCP
          port: 3001
        - protocol: TCP
          port: 3002
        - protocol: TCP
          port: 3003
        - protocol: TCP
          port: 3005
        - protocol: TCP
          port: 3006
        - protocol: TCP
          port: 3007
---
