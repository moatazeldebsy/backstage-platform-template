apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-data
  namespace: ml-platform
  labels:
    app: mlflow
spec:
  accessModes:
    - ReadWriteOnce
  # No storageClassName: bind whatever the cluster's default class is. On Kind
  # that is `standard` (rancher.io/local-path); naming it explicitly would break
  # on any local cluster that names its default class differently.
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: ml-platform
  labels:
    app: mlflow
    backstage.io/kubernetes-id: mlflow
spec:
  replicas: 1
  # The PVC is ReadWriteOnce, so the replacement pod cannot mount the volume
  # while the outgoing one still holds it — a RollingUpdate would deadlock with
  # the new pod stuck ContainerCreating until progressDeadlineSeconds.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
        backstage.io/kubernetes-id: mlflow
    spec:
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.13.0
          command:
            - mlflow
            - server
            - --host
            - "0.0.0.0"
            - --port
            - "5000"
            - --backend-store-uri
            - sqlite:////mlflow/mlflow.db
            # Proxied artifact serving (--serve-artifacts is on by default).
            # Do NOT set --default-artifact-root to a path here: that makes the
            # experiment's artifact root a bare local path, which *clients*
            # resolve against their own filesystem. A training pod would then
            # write the model into its own container and exit — log_model()
            # reports success and the artifact is silently lost. With
            # --artifacts-destination the root stays mlflow-artifacts:/, so
            # clients upload through this server, which owns the storage.
            - --artifacts-destination
            - /mlflow/artifacts
            - --workers
            - "1"
            - --gunicorn-opts
            - "--timeout 120 --graceful-timeout 60"
          ports:
            - name: http
              containerPort: 5000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          # timeoutSeconds is set explicitly on every probe below, at the 15s the
          # rest of this platform standardises on (Gatekeeper via
          # scripts/bootstrap-local.sh, Kyverno via local/policies/kyverno-values.yaml
          # — both for exactly this reason). The Kubernetes default is 1s, which is
          # not enough for a single-worker gunicorn app on a 500m CPU limit when the
          # node is loaded: /health answers, just not within a second. The kubelet
          # then reports
          #   "context deadline exceeded (Client.Timeout exceeded while awaiting headers)"
          # — not "connection refused" — and liveness kills the container roughly
          # every 90s forever. The generous failureThresholds below do not help,
          # because every individual attempt times out.
          #
          # periodSeconds is 20 throughout so timeout stays <= period; the startup
          # budget is unchanged at 5 minutes (20s x 15).
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 15
          # MLflow initialises its backing store on first boot, which on a
          # resource-constrained local cluster can take well over the ~90s
          # (initialDelay 30 + 3 × period 20) that livenessProbe alone allowed —
          # the kubelet then killed it mid-startup and it restart-looped. A
          # startupProbe gives it up to 5 minutes to come up, and liveness does
          # not begin evaluating until startup succeeds, so steady-state
          # failure detection is unchanged.
          startupProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 20
            failureThreshold: 15
            timeoutSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 15
          volumeMounts:
            - name: mlflow-data
              mountPath: /mlflow
      volumes:
        - name: mlflow-data
          persistentVolumeClaim:
            claimName: mlflow-data
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: ml-platform
  labels:
    app: mlflow
spec:
  selector:
    app: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: 5000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mlflow
  namespace: ml-platform
spec:
  ingressClassName: nginx
  rules:
    - host: mlflow.idp.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mlflow
                port:
                  number: 5000
