# MLflow Helm values for local Kind deployment
# Chart: community-charts/mlflow  (helm repo add community-charts https://community-charts.github.io/helm-charts)
#
# Local storage: SQLite DB + local PV for artifacts.
# AWS: swap backendStore and artifactRoot for PostgreSQL + S3.

replicaCount: 1

image:
  repository: ghcr.io/mlflow/mlflow
  tag: v2.13.0
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5000

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
  hosts:
    - host: mlflow.idp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ── Backend store (local: SQLite file on PV) ─────────────────────────────────
backendStore:
  databaseMigration: true
  sqlite:
    enabled: true
    path: /mlflow/db/mlflow.db

# ── Artifact store (local: shared PV; AWS: s3://<bucket>/mlflow) ─────────────
artifactRoot: /mlflow/artifacts

# ── Persistent volume for DB + artifacts ─────────────────────────────────────
persistence:
  enabled: true
  # storageClass: "" uses the cluster default provisioner.
  # Kind 0.20+ uses "local-path"; older Kind uses "standard".
  # Leave empty to always use whatever the cluster default is.
  storageClass: ""
  size: 5Gi
  mountPath: /mlflow

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# MLflow v2 does NOT expose a Prometheus /metrics endpoint.
# Scraping is handled via Prometheus pod annotations on ML serving APIs, not MLflow itself.
podAnnotations: {}

securityContext:
  runAsNonRoot: false  # MLflow official image runs as root; override with custom image if needed
