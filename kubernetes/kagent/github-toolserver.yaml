apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: github-mcp-server
  namespace: kagent
spec:
  description: "GitHub MCP server — get PR diffs, post PR comments, and check CI status"
  url: http://github-mcp-server.services-dev.svc.cluster.local:3005/mcp
  protocol: STREAMABLE_HTTP
  timeout: 30s
