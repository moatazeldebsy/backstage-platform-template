apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: github-mcp-server
  namespace: kagent
spec:
  description: "GitHub MCP server — get PR diffs, post PR comments, check CI status, and approve/request-changes on PR reviews (dry-run by default until the HiTL approval gate lands — see docs/agentic-platform.md Phase 4)"
  url: http://github-mcp-server.services-dev.svc.cluster.local:3005/mcp
  protocol: STREAMABLE_HTTP
  timeout: 30s
