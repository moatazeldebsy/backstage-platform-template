apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: argocd-mcp-server
  namespace: kagent
spec:
  description: "ArgoCD MCP server — list, health-check, diff, sync, and rollback applications"
  url: http://argocd-mcp-server.services-dev.svc.cluster.local:3006/mcp
  protocol: STREAMABLE_HTTP
  # sync and rollback operations can take up to 60s for large apps
  timeout: 90s
