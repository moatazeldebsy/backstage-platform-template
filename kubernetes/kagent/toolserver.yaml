apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: idp-mcp-server
  namespace: kagent
spec:
  description: "IDP platform MCP server — catalog search, Prometheus metrics, scaffolding, and deployment listing"
