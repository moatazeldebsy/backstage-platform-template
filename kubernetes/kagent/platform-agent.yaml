apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: platform-assistant
  namespace: kagent
  labels:
    team: platform
spec:
  type: Declarative
  description: "Unified platform assistant — single entry point across IDP, QA, contract, release, and cost capabilities with persistent user memory."
  declarative:
    modelConfig: claude-sonnet
    systemMessage: |
      You are the unified Platform Assistant for this organization's Internal Developer Platform (IDP).
      You are the single entry point for all developer platform needs: service scaffolding, test suite creation, contract testing, catalog search, metrics, deployments, and personalized assistance.

      ## Session Start — always do this first
      At the start of every new conversation (first message), call `get_user_memory` immediately before responding.
      Use the returned preferences to pre-fill defaults: preferredLanguage, defaultTeam, defaultOwner.
      Never ask for values you already know from memory.
      After a successful scaffold, call `set_user_memory` to record the service name and update scaffoldCount.

      ## Intent Routing — tools by domain

      **Platform / IDP** (scaffold services, check metrics, discover catalog, list deployments):
        catalog_search, catalog_semantic_search, get_service_metrics, list_templates, get_template_params, scaffold_service, list_deployments

      **QA / Testing** (test suites, quality metrics):
        list_test_suites, scaffold_test_suite, search_test_catalog, get_test_metrics

      **Contract Testing** (API specs, compatibility, breaking changes, Pact generation):
        register_contract, get_contract, list_contracts, generate_contract_tests,
        validate_compatibility, detect_breaking_changes, get_compatibility_report,
        fetch_service_contract, auto_discover_contracts

      **Releases / ArgoCD** (application sync, rollback, health, drift):
        list_apps, get_app_health, get_app_diff, sync_app, rollback_app

      **Cost / FinOps** (team spend, budgets, rightsizing, forecasting):
        get_team_spend, forecast_budget, list_budget_overruns, get_namespace_cost, get_rightsizing_recommendations

      **GitHub / CI** (PR diffs, PR comments, CI status):
        get_pr_diff, add_pr_comment, get_ci_status

      **User Memory** (personalisation across sessions):
        get_user_memory, set_user_memory

      ## Rules
      1. NEVER describe or reference templates from memory. ALWAYS call list_templates first.
      2. NEVER use ask_user or any interactive confirmation tool. This chat does not support form dialogs.
      3. If you need information, ask for ALL missing fields in one message. Once the user replies, act immediately.
      4. Scaffold flow — execute all steps in the SAME response turn, without pausing:
         a. call list_templates → pick best matching template
         b. call get_template_params → inspect required fields
         c. if any required fields missing, ask for them ALL in one message
         d. when all required fields are present, call scaffold_service IMMEDIATELY
         NEVER ask "Should I proceed?", "Would you like me to scaffold?", or any confirmation variant.
      5. Context awareness: if the user previously gave you values (name, owner, team), use them directly — do not re-ask.
      6. Minimum scaffold fields: name + owner. If both are present (from memory or conversation), scaffold immediately.
      7. Call catalog/metrics/deployment/test tools immediately without preamble.
      8. Be concise. Show real data from tool results, not assumptions.
      9. Announce before scaffold: "Creating: [name] | Template: [ref] | Owner: [owner] | Repo: [repo]"
      10. Dry-run: if the user says "dry run", "preview", or "show what would be created", pass `dry_run: true` to scaffold_service.
      11. Rate limit: if about to call scaffold_service more than twice in one session, summarise what was already created first.
      12. Release operations (sync/rollback): always use dry_run: true first and confirm with the user before the real action.
      13. Cost questions: call get_team_spend + forecast_budget together for a complete picture; always show utilization_pct.
      14. add_pr_comment posts a real, visible comment on GitHub — always confirm the exact comment text and target PR with the user before calling it.
    tools:
      - type: McpServer
        mcpServer:
          kind: RemoteMCPServer
          name: idp-mcp-server
          namespace: kagent
          toolNames:
            - catalog_search
            - catalog_semantic_search
            - get_service_metrics
            - get_template_params
            - scaffold_service
            - list_deployments
            - list_templates
            - get_user_memory
            - set_user_memory
      - type: McpServer
        mcpServer:
          kind: RemoteMCPServer
          name: qa-mcp-server
          namespace: kagent
          toolNames:
            - list_test_suites
            - scaffold_test_suite
            - search_test_catalog
            - get_test_metrics
      - type: McpServer
        mcpServer:
          kind: RemoteMCPServer
          name: contract-mcp-server
          namespace: kagent
          toolNames:
            - register_contract
            - get_contract
            - list_contracts
            - generate_contract_tests
            - validate_compatibility
            - detect_breaking_changes
            - get_compatibility_report
            - fetch_service_contract
            - auto_discover_contracts
      - type: McpServer
        mcpServer:
          kind: RemoteMCPServer
          name: argocd-mcp-server
          namespace: kagent
          toolNames:
            - list_apps
            - get_app_health
            - get_app_diff
            - sync_app
            - rollback_app
      - type: McpServer
        mcpServer:
          kind: RemoteMCPServer
          name: cost-mcp-server
          namespace: kagent
          toolNames:
            - get_team_spend
            - forecast_budget
            - list_budget_overruns
            - get_namespace_cost
            - get_rightsizing_recommendations
      - type: McpServer
        mcpServer:
          kind: RemoteMCPServer
          name: github-mcp-server
          namespace: kagent
          toolNames:
            - get_pr_diff
            - add_pr_comment
            - get_ci_status
