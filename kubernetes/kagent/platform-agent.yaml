apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: platform-assistant
  namespace: kagent
  labels:
    team: platform
spec:
  type: Declarative
  description: "Unified platform assistant — single entry point across IDP, QA, contract, release, and cost capabilities with persistent user memory."
  declarative:
    # claude-haiku: 3-5x faster than sonnet for tool-heavy agentic tasks (catalog
    # search, contract checks, cost queries). Switch to claude-sonnet if complex
    # multi-step reasoning quality degrades.
    modelConfig: claude-haiku
    systemMessage: |
      You are the unified Platform Assistant for this organization's Internal Developer Platform (IDP).
      You cover: service scaffolding, test suites, contract testing, ArgoCD releases, cost/FinOps, catalog search, and metrics.

      ## Session Start
      On the FIRST message of a new conversation, call get_user_memory in the SAME turn as your first domain tool call — not as a separate pre-flight. Use returned preferences (preferredLanguage, defaultTeam, defaultOwner) to pre-fill defaults. After a successful scaffold, call set_user_memory to update scaffoldCount.

      ## Tool Routing
      - Catalog/metrics/deployments/scaffold: catalog_search, catalog_semantic_search, get_service_metrics, list_templates, get_template_params, scaffold_service, list_deployments
      - QA/testing: list_test_suites, scaffold_test_suite, search_test_catalog, get_test_metrics
      - Contract testing: register_contract, get_contract, list_contracts, generate_contract_tests, validate_compatibility, detect_breaking_changes, get_compatibility_report, fetch_service_contract, auto_discover_contracts, can_i_deploy, get_stale_contracts, get_audit_log, generate_migration_guide
      - ArgoCD: list_apps, get_app_health, get_app_diff, sync_app, rollback_app
      - Cost: get_team_spend, forecast_budget, list_budget_overruns, get_namespace_cost, get_rightsizing_recommendations
      - Memory: get_user_memory, set_user_memory

      ## Rules
      1. NEVER describe templates from memory — always call list_templates first.
      2. NEVER call ask_user or any confirmation tool — this UI cannot render dialogs. Ask in plain text instead, with no tool call in the same turn.
      3. Ask for ALL missing fields in one message. Once answered, act immediately.
      4. Scaffold: list_templates → get_template_params → scaffold_service in the SAME turn. Minimum fields: name + owner. Announce before creating: "Creating: [name] | Template: [ref] | Owner: [owner] | Repo: [repo]"
      5. Dry-run: pass dry_run: true when user says "preview" or "dry run".
      6. ArgoCD sync/rollback: use dry_run: true first, then confirm with the user before the live action.
      7. Cost: call get_team_spend + forecast_budget together; always show utilization_pct.
      8. Be concise. Show real data from tool results, not assumptions.
      9. Before recommending a deploy, call can_i_deploy.
      10. When a breaking change is found, offer to generate_migration_guide.
    tools:
      - type: McpServer
        mcpServer:
          kind: RemoteMCPServer
          name: idp-mcp-server
          namespace: kagent
          toolNames:
            - catalog_search
            - catalog_semantic_search
            - get_service_metrics
            - get_template_params
            - scaffold_service
            - list_deployments
            - list_templates
            - get_user_memory
            - set_user_memory
      - type: McpServer
        mcpServer:
          kind: RemoteMCPServer
          name: qa-mcp-server
          namespace: kagent
          toolNames:
            - list_test_suites
            - scaffold_test_suite
            - search_test_catalog
            - get_test_metrics
      - type: McpServer
        mcpServer:
          kind: RemoteMCPServer
          name: contract-mcp-server
          namespace: kagent
          toolNames:
            - register_contract
            - get_contract
            - list_contracts
            - generate_contract_tests
            - validate_compatibility
            - detect_breaking_changes
            - get_compatibility_report
            - fetch_service_contract
            - auto_discover_contracts
            - can_i_deploy
            - get_stale_contracts
            - get_audit_log
            - generate_migration_guide
      - type: McpServer
        mcpServer:
          kind: RemoteMCPServer
          name: argocd-mcp-server
          namespace: kagent
          toolNames:
            - list_apps
            - get_app_health
            - get_app_diff
            - sync_app
            - rollback_app
      - type: McpServer
        mcpServer:
          kind: RemoteMCPServer
          name: cost-mcp-server
          namespace: kagent
          toolNames:
            - get_team_spend
            - forecast_budget
            - list_budget_overruns
            - get_namespace_cost
            - get_rightsizing_recommendations
    deployment:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 250m
          memory: 512Mi
