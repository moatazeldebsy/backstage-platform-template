# Grants the idp-mcp-server service account (in services-dev namespace) read/write
# access to ConfigMaps in the kagent namespace for persistent user memory storage.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: idp-mcp-server-memory
  namespace: kagent
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: idp-mcp-server-memory
  namespace: kagent
subjects:
  - kind: ServiceAccount
    name: idp-mcp-server
    namespace: services-dev
roleRef:
  kind: Role
  name: idp-mcp-server-memory
  apiGroup: rbac.authorization.k8s.io
