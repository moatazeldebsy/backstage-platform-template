# AnalysisTemplate — HTTP error rate + latency gate for canary deployments.
# Referenced by Rollout resources via spec.strategy.canary.analysis.templates.
# Runs every 30s during canary steps; fails fast if error budget is burning.
#
# Deploy: kubectl apply -f kubernetes/argo-rollouts/analysis-template.yaml -n services-dev
---
apiVersion: argoproj.io/v1alpha1
kind: ClusterAnalysisTemplate
metadata:
  name: http-error-rate
spec:
  args:
    - name: service-name
    - name: namespace
      value: services-dev
    # Defaults deliberately equal the values these conditions used to hardcode, so
    # a Rollout that passes no args behaves exactly as before. The golden-path
    # chart passes them from values.rollout.analysis so the numbers can be
    # per-service without forking this template -- its PromQL below carries
    # several hard-won fixes and duplicating it per service is how those regress.
    - name: error-rate-threshold
      value: "0.01"
    - name: latency-threshold
      value: "0.5"
  metrics:
    - name: error-rate
      interval: 30s
      # Fail if more than 1% of requests are 5xx over the last 5 minutes
      failureCondition: result[0] > {{args.error-rate-threshold}}
      # count is mandatory for a metric used in a canary *step* analysis: without
      # it the metric runs indefinitely and Argo Rollouts rejects the Rollout with
      # InvalidSpec, leaving the service with no pods at all.
      # 3 measurements x 30s interval = 90s per analysis step.
      count: 3
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
          # The label is `status_code`, not `status` — that is what the golden-path
          # chart's services actually emit. With `status` the 5xx selector matched
          # nothing, so the numerator was always empty.
          #
          # `or vector(0)` is required for the healthy case: a service with zero
          # 5xx has no matching series at all, so the division returned an empty
          # result rather than 0. Argo Rollouts treats an empty result as
          # Inconclusive, which pauses the canary indefinitely — a correctly
          # behaving service could never be promoted.
          #
          # clamp_min on the denominator avoids a divide-by-zero (also empty) in
          # the window before any traffic has been scraped.
          query: |
            (
              sum(rate(http_requests_total{
                namespace="{{args.namespace}}",
                service="{{args.service-name}}",
                status_code=~"5.."
              }[5m])) or vector(0)
            )
            /
            clamp_min(
              sum(rate(http_requests_total{
                namespace="{{args.namespace}}",
                service="{{args.service-name}}"
              }[5m])), 0.001
            )

    - name: p99-latency
      interval: 30s
      # Fail if p99 latency exceeds 500ms over the last 5 minutes
      failureCondition: result[0] > {{args.latency-threshold}}
      # See the note on error-rate above — count is required for step analyses.
      count: 3
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
          # `or vector(0)` for the same reason as error-rate above: with no
          # scraped samples histogram_quantile yields an empty result, which
          # Argo Rollouts scores Inconclusive and the canary stalls. No traffic
          # means nothing to judge, so treat it as passing rather than blocking.
          #
          # NOTE: 0.5s is a production threshold. On a resource-constrained local
          # Kind cluster p99 is routinely above it (~0.8s observed), because the
          # only traffic is health probes landing in coarse histogram buckets. A
          # canary demo run locally can legitimately trip this gate and roll back.
          query: |
            histogram_quantile(0.99,
              sum by (le) (
                rate(http_request_duration_seconds_bucket{
                  namespace="{{args.namespace}}",
                  service="{{args.service-name}}"
                }[5m])
              )
            ) or vector(0)
