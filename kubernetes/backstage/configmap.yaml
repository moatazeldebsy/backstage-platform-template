# ── backstage-base-config ─────────────────────────────────────────────────────
# Contains all non-URL settings. Catalog locations are intentionally absent here
# so the production config can own them with GitHub URLs (works on EKS without
# any catalog volume mount).
apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-base-config
  namespace: backstage
data:
  app-config.yaml: |
    app:
      title: IDP Developer Portal
      baseUrl: http://localhost:3000
      packages: all
      extensions:
        - page:catalog:
            config:
              path: /

    organization:
      name: My Organization

    backend:
      baseUrl: http://localhost:7007
      listen:
        port: 7007
      csp:
        connect-src: ["'self'", 'http:', 'https:']
        upgrade-insecure-requests: false
      cors:
        origin: http://localhost:3000
        methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
        credentials: true
      auth:
        dangerouslyDisableDefaultAuthPolicy: true
      database:
        client: pg
        connection:
          host: ${POSTGRES_HOST}
          port: ${POSTGRES_PORT}
          user: ${POSTGRES_USER}
          password: ${POSTGRES_PASSWORD}
          ssl:
            rejectUnauthorized: false

    integrations:
      github:
        - host: github.com
          token: ${GITHUB_TOKEN}

    techdocs:
      builder: 'local'
      generator:
        runIn: 'local'
      publisher:
        type: 'awsS3'
        awsS3:
          bucketName: ${TECHDOCS_S3_BUCKET_NAME}
          region: ${AWS_REGION}

    auth:
      environment: production
      session:
        secret: ${AUTH_SESSION_SECRET:-backstage-session-secret}
      providers:
        guest: {}
        github:
          production:
            clientId: ${AUTH_GITHUB_CLIENT_ID}
            clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
            signIn:
              resolvers:
                - resolver: usernameMatchingUserEntityName
                  dangerouslyAllowSignInWithoutUserInCatalog: true
                - resolver: emailMatchingUserEntityProfileEmail
                  dangerouslyAllowSignInWithoutUserInCatalog: true

    grafana:
      domain: /api/proxy/grafana/api
      unifiedAlerting: false

    scaffolder:
      defaultAuthor:
        name: IDP Bot
        email: idp-bot@example.com
      defaultCommitMessage: "chore: scaffold service via IDP"

    reading:
      allow:
        - host: raw.githubusercontent.com
        - host: github.com

    kubernetes:
      serviceLocatorMethod:
        type: 'multiTenant'
      clusterLocatorMethods:
        - type: 'config'
          clusters:
            - url: ${K8S_CLUSTER_URL}
              name: idp-mvp
              authProvider: 'serviceAccount'
              skipTLSVerify: true
              skipMetricsLookup: false
              serviceAccountToken: ${K8S_SERVICE_ACCOUNT_TOKEN}
---
# ── backstage-config (production overrides) ───────────────────────────────────
# Sets the real ALB URL and all catalog locations as GitHub URLs.
# Using GitHub URLs means templates are always in sync with the main branch —
# no image rebuild or volume mount needed when templates change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-config
  namespace: backstage
data:
  app-config.production.yaml: |
    app:
      # Patched by bootstrap.sh after ALB is provisioned
      baseUrl: http://BACKSTAGE_ALB_URL
      extensions:
        - page:kubernetes:
            disabled: true

    backend:
      baseUrl: http://BACKSTAGE_ALB_URL
      cors:
        origin: http://BACKSTAGE_ALB_URL
      auth:
        externalAccess:
          - type: static
            options:
              token: ${BACKSTAGE_CATALOG_TOKEN}
              subject: catalog-exporter

    proxy:
      endpoints:
        /opencost:
          target: http://opencost.opencost.svc.cluster.local:9003
          changeOrigin: true
          pathRewrite:
            ^/api/proxy/opencost: ''
        /grafana/api:
          target: http://prometheus-grafana.monitoring.svc.cluster.local:80
          changeOrigin: true
        /prometheus/api:
          target: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
          changeOrigin: true
        /argocd/api:
          target: http://argocd-server.argocd.svc.cluster.local:80
          changeOrigin: true
          allowedHeaders: ['Authorization']
        /kagent:
          target: http://kagent-controller.kagent.svc.cluster.local:8080
          changeOrigin: true

    techRadar:
      url: https://raw.githubusercontent.com/moatazeldebsy/backstage-platform-template/main/backstage/catalog/tech-radar.json

    catalog:
      import:
        entityFilename: catalog-info.yaml
        pullRequestBranchName: backstage-integration
      rules:
        - allow: [Component, System, API, Resource, Location, Template, User, Group]
      locations:
        # ── Service templates ────────────────────────────────────────────────
