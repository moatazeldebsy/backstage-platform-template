          target: https://github.com/moatazeldebsy/backstage-platform-template/blob/main/backstage/catalog/templates/nodejs-service/template.yaml
          rules:
            - allow: [Template]
        - type: url
          target: https://github.com/moatazeldebsy/backstage-platform-template/blob/main/backstage/catalog/templates/python-service/template.yaml
          rules:
            - allow: [Template]
        - type: url
          target: https://github.com/moatazeldebsy/backstage-platform-template/blob/main/backstage/catalog/templates/go-service/template.yaml
          rules:
            - allow: [Template]
        - type: url
          target: https://github.com/moatazeldebsy/backstage-platform-template/blob/main/backstage/catalog/templates/react-frontend/template.yaml
          rules:
            - allow: [Template]
        # ── Infrastructure & cloud resource templates ────────────────────────
