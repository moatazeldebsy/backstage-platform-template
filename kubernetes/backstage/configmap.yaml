# ── backstage-base-config ─────────────────────────────────────────────────────
# Mirrors backstage/app-config.yaml (the env-agnostic shared base).
# Keep in sync with that file. Future: generate via:
#   kubectl create configmap backstage-base-config \
#     --from-file=app-config.yaml=backstage/app-config.yaml \
#     -n backstage --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-base-config
  namespace: backstage
data:
  app-config.yaml: |
    app:
      title: IDP Developer Portal
      packages: all
      # The custom platform-home page extension (packages/app/src/extensions.tsx)
      # owns path: / — do NOT also point page:catalog at / here, the two
      # conflict and whichever wins leaves the other's nav item dead-ending on
      # the same page. Catalog keeps its own default path (/catalog).

    organization:
      name: My Organization

    backend:
      csp:
        connect-src: ["'self'", 'http:', 'https:']
        upgrade-insecure-requests: false
      cors:
        methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
        credentials: true
      auth:
        keys:
          - secret: ${BACKSTAGE_AUTH_SECRET:-dev-secret-change-in-production}
      database:
        client: pg
        connection:
          host: ${POSTGRES_HOST}
          port: ${POSTGRES_PORT}
          user: ${POSTGRES_USER}
          password: ${POSTGRES_PASSWORD}
          ssl:
            rejectUnauthorized: false
        knexConfig:
          pool:
            min: 3
            max: 20
            acquireTimeoutMillis: 60000
            idleTimeoutMillis: 30000

    integrations:
      github:
        - host: github.com
          token: ${GITHUB_TOKEN}

    techdocs:
      builder: 'local'
      generator:
        runIn: 'local'
      publisher:
        type: 'local'

    auth:
      providers:
        guest: {}
        github:
          development:
            clientId: ${AUTH_GITHUB_CLIENT_ID:-not-configured}
            clientSecret: ${AUTH_GITHUB_CLIENT_SECRET:-not-configured}
            signIn:
              resolvers:
                - resolver: usernameMatchingUserEntityName
                  dangerouslyAllowSignInWithoutUserInCatalog: true
                - resolver: emailMatchingUserEntityProfileEmail
                  dangerouslyAllowSignInWithoutUserInCatalog: true

    scaffolder:
      defaultAuthor:
        name: IDP Bot
        email: idp-bot@example.com
      defaultCommitMessage: "chore: scaffold service via IDP"

    kubernetes:
      serviceLocatorMethod:
        type: 'multiTenant'
      clusterLocatorMethods:
        - type: 'config'
          clusters:
            - url: ${K8S_CLUSTER_URL}
              name: idp-mvp
              authProvider: 'serviceAccount'
              skipTLSVerify: true
              skipMetricsLookup: true
              serviceAccountToken: ${K8S_SERVICE_ACCOUNT_TOKEN}

    techInsights:
      factRetrievers:
        idp-entity-facts:
          cadence: '*/30 * * * *'
        entityMetadataFactRetriever:
          cadence: '5-59/30 * * * *'
        entityOwnershipFactRetriever:
          cadence: '10-59/30 * * * *'

    ragSearch:
      voyageApiKey: ${VOYAGE_API_KEY}
      indexIntervalMinutes: 30
      externalSources: []
---
# ── backstage-config (AWS overrides) ─────────────────────────────────────────
# Mirrors backstage/app-config.aws.yaml (AWS/EKS-specific overrides).
# bootstrap.sh patches BACKSTAGE_ALB_URL after the ALB is provisioned.
# Keep in sync with that file. Future: generate via:
#   kubectl create configmap backstage-config \
#     --from-file=app-config.aws.yaml=backstage/app-config.aws.yaml \
#     -n backstage --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-config
  namespace: backstage
data:
  app-config.aws.yaml: |
    app:
      # Patched by bootstrap.sh after ALB is provisioned
      baseUrl: http://BACKSTAGE_ALB_URL
      extensions:
        - page:kubernetes:
            disabled: true

    backend:
      baseUrl: http://BACKSTAGE_ALB_URL
      listen: ':7007'
      cors:
        origin: http://BACKSTAGE_ALB_URL
      auth:
        externalAccess:
          - type: static
            options:
              token: ${BACKSTAGE_CATALOG_TOKEN}
              subject: catalog-exporter
      database:
        connection:
          ssl:
            # RDS certs are signed by Amazon's own CA, not a public trust root — verifying
            # against the default trust store fails with "self-signed certificate in
            # certificate chain" even though the connection is genuinely TLS-encrypted.
            # For production, fetch https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem,
            # mount it, and set rejectUnauthorized: true with `ca: <path>` instead.
            rejectUnauthorized: false

    auth:
      environment: production
      session:
        secret: ${AUTH_SESSION_SECRET}
      providers:
        guest:
          dangerouslyAllowOutsideDevelopment: true
        github:
          production:
            clientId: ${AUTH_GITHUB_CLIENT_ID}
            clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
            signIn:
              resolvers:
                - resolver: usernameMatchingUserEntityName
                  dangerouslyAllowSignInWithoutUserInCatalog: true
                - resolver: emailMatchingUserEntityProfileEmail
                  dangerouslyAllowSignInWithoutUserInCatalog: true

    proxy:
      endpoints:
        /opencost:
          target: http://opencost.opencost.svc.cluster.local:9003
          changeOrigin: true
          pathRewrite:
            ^/api/proxy/opencost: ''
        /grafana/api:
          target: http://prometheus-grafana.monitoring.svc.cluster.local:80
          changeOrigin: true
          headers:
            Authorization: Bearer ${GRAFANA_TOKEN}
        /prometheus:
          target: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
          changeOrigin: true
          pathRewrite:
            '^/api/proxy/prometheus': ''
        /argocd:
          target: http://argocd-server.argocd.svc.cluster.local:80
          changeOrigin: true
          headers:
            Authorization: Bearer ${ARGOCD_AUTH_TOKEN}
        /kagent:
          target: http://kagent-ui.kagent.svc.cluster.local:8080
          changeOrigin: true
          pathRewrite:
            ^/api/proxy/kagent: ''
        /sonarcloud:
          target: https://sonarcloud.io
          allowedMethods: ['GET']
          changeOrigin: true
          headers:
            Authorization: Bearer ${SONAR_TOKEN}
        /snyk:
          target: https://api.snyk.io
          allowedMethods: ['GET']
          changeOrigin: true
          headers:
            Authorization: token ${SNYK_TOKEN}

    # Browser-facing "open in new tab" links — patched by bootstrap.sh
    # (ArgoCD, Grafana) and bootstrap-ai.sh --aws (KAgent) once each
    # Ingress's ALB hostname is known. See backstage/app-config.aws.yaml.
    externalLinks:
      argocd: http://ARGOCD_ALB_URL
      grafana: http://GRAFANA_ALB_URL
      kagent: http://KAGENT_ALB_URL

    techRadar:
      url: https://raw.githubusercontent.com/moatazeldebsy/backstage-platform-template/main/backstage/catalog/tech-radar.json

    techdocs:
      publisher:
        type: 'awsS3'
        awsS3:
          bucketName: ${TECHDOCS_S3_BUCKET_NAME}
          region: ${AWS_REGION}

    catalog:
      import:
        entityFilename: catalog-info.yaml
        pullRequestBranchName: backstage-integration
      rules:
        - allow: [Component, System, API, Resource, Location, Template, User, Group]
      locations:
        # ── Service templates ────────────────────────────────────────────────
        - type: url
          target: https://github.com/moatazeldebsy/backstage-platform-template/blob/main/backstage/catalog/templates/nodejs-service/template.yaml
          rules:
            - allow: [Template]
        - type: url
          target: https://github.com/moatazeldebsy/backstage-platform-template/blob/main/backstage/catalog/templates/python-service/template.yaml
          rules:
            - allow: [Template]
        - type: url
          target: https://github.com/moatazeldebsy/backstage-platform-template/blob/main/backstage/catalog/templates/go-service/template.yaml
          rules:
            - allow: [Template]
        - type: url
          target: https://github.com/moatazeldebsy/backstage-platform-template/blob/main/backstage/catalog/templates/react-frontend/template.yaml
          rules:
            - allow: [Template]
        # ── Infrastructure & cloud resource templates ─────────────────────────
