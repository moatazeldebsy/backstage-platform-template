# Write access for Backstage in the ml-platform namespace.
#
# The base `backstage-read` ClusterRole (rbac.yaml / get-k8s-credentials.sh) is
# deliberately read-only, but two scaffolder actions in the Backstage backend
# shell out to `kubectl apply` against ml-platform and need to create objects:
#
#   idpRunTrainingJob    -> ConfigMap + Job  (mlflow-experiment template)
#   idpDeployModelServer -> ConfigMap, Deployment, Service, Ingress,
#                           ServiceMonitor, HorizontalPodAutoscaler
#
# Scope is a namespaced Role on purpose — this grants nothing outside
# ml-platform. Both service-account identities are bound because the SA differs
# by deployment target: in-cluster Backstage (AWS/EKS) runs as
# backstage/backstage, while local Kind runs Backstage on the host with a token
# for default/backstage minted by scripts/get-k8s-credentials.sh.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-mlplatform
  namespace: ml-platform
  labels:
    managed-by: idp-backstage
rules:
  - apiGroups: [""]
    resources: [configmaps, services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [monitoring.coreos.com]
    resources: [servicemonitors]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-mlplatform
  namespace: ml-platform
  labels:
    managed-by: idp-backstage
subjects:
  # In-cluster Backstage (AWS/EKS, and Kind if Backstage is run in-cluster).
  - kind: ServiceAccount
    name: backstage
    namespace: backstage
  # Local Kind: Backstage runs on the host with a token for this SA.
  - kind: ServiceAccount
    name: backstage
    namespace: default
roleRef:
  kind: Role
  name: backstage-mlplatform
  apiGroup: rbac.authorization.k8s.io
