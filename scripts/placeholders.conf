# scripts/placeholders.conf
# Single source of truth for first-clone personalisation.
#
# Format (pipe-delimited, 6 columns):
#   VAR_NAME | PLACEHOLDER | DEFAULT | LITERAL | PROMPT | REQUIRED
#
#   VAR_NAME     — shell variable name + key in .idp-config.env
#   PLACEHOLDER  — literal token in source files (e.g. YOUR_GITHUB_ORG)
#   DEFAULT      — value shown as the prompt default (blank = no default).
#                  Used ONLY for the prompt; NOT replaced in files.
#   LITERAL      — hardcoded value to ALSO replace via sed (blank = none).
#                  Use this when source files still contain the literal value
#                  alongside the placeholder. Leave BLANK when the literal
#                  could collide with valid enum/list entries (e.g. us-east-1
#                  appears in region enums of scaffold templates).
#   PROMPT       — question shown to the user.
#   REQUIRED     — yes/no. If yes, blank input aborts setup.
#
# Adding a new row picks up automatically in both setup.sh and bootstrap-local.sh.
GITHUB_ORG     | YOUR_GITHUB_ORG     |                                                              |                             | GitHub org or username (e.g. acme-corp)         | yes
DISPLAY_NAME   | YOUR_DISPLAY_NAME   |                                                              |                             | Your full display name (Backstage catalog user) | no
AWS_ACCOUNT_ID | YOUR_AWS_ACCOUNT_ID |                                                              |                             | AWS Account ID (12 digits, blank to skip)       | no
AWS_REGION     | YOUR_AWS_REGION     | us-east-1                                                    |                             | AWS Region                                      | no
CLUSTER_NAME   | YOUR_CLUSTER_NAME   | idp-mvp                                                      | idp-mvp                     | EKS / Kind cluster name                         | no
PLATFORM_REPO  | YOUR_REPO           | backstage-platform-template                                  | backstage-platform-template | Platform repo name (this repo)                  | no
CONTACT_EMAIL  | YOUR_CONTACT_EMAIL  | idp-bot@example.com                                          | idp-bot@example.com         | Platform contact email                          | no
DOCS_REPO_URL  | YOUR_DOCS_REPO_URL  | https://github.com/YOUR_GITHUB_ORG/backstage-platform-template |                             | Docs site repo URL (mkdocs.yml)                 | no
PACTFLOW_ORG   | YOUR_PACTFLOW_ORG   |                                                              |                             | PactFlow org slug (blank to reuse GitHub org)   | no
