# Local development overrides — safe defaults when credentials are not configured.
# Merged on top of app-config.yaml at runtime.
# To enable a feature, set the relevant env vars in local/backstage/.env

app:
  baseUrl: http://backstage.idp.local
  # Disable the kubernetes standalone page — it requires an entity context
  # and crashes with "Entity context is not available" when accessed directly.
  # Kubernetes info is still available via entity tabs in the catalog.
  # catalog-graph plugin is fully removed from App.tsx (showed no data locally).
  extensions:
    - page:catalog:
        config:
          path: /
    - page:kubernetes:
        disabled: true

    # Uncomment to hide AI features in this environment:
    # - custom-pages/page:ai-assistant:
    #     disabled: true
    # - custom-pages/nav-item:ai-assistant:
    #     disabled: true
    # - custom-pages/page:ai-search:
    #     disabled: true
    # - custom-pages/nav-item:ai-search:
    #     disabled: true

backend:
  # All traffic (frontend + API) is served through port 3000 (docker port mapping)
  baseUrl: http://backstage.idp.local
  listen:
    port: 3000
  cors:
    origin: http://backstage.idp.local
  database:
    connection:
      ssl: false   # local Postgres container has no SSL; override the production default
  auth:
    # Permission policy is enforced: guests get read-only access (catalog browse,
    # TechDocs, template view) but cannot run scaffolder templates or delete entities.
    # Authenticated GitHub users get full access.
    # Set to true to temporarily bypass all permission checks (e.g. local debugging).
    dangerouslyDisableDefaultAuthPolicy: false
    # externalAccess static token allows the catalog-exporter CronJob (in-cluster) to
    # query the Backstage catalog API without a user session. Set the same value in the
    # 'backstage-catalog-exporter-token' Kubernetes Secret.
    externalAccess:
      - type: static
        options:
          token: "local-catalog-exporter-token"
          subject: catalog-exporter
  reading:
    allow:
      - host: raw.githubusercontent.com  # used when GITHUB_TOKEN is set (production)
      - host: localhost:3000              # allows http://localhost:3000/... for locally served static assets

# Auth — enable guest provider so the UI works without GitHub OAuth credentials.
auth:
  environment: development
  providers:
    guest:
      # NODE_ENV is not set to "development" in the Docker container, so the guest
      # provider requires this flag to allow sign-in on non-development NODE_ENV.
      dangerouslyAllowOutsideDevelopment: true
    github:
      development:
        signIn:
          resolvers:
            # Match GitHub login against entity name (works with private/no email)
            - resolver: usernameMatchingUserEntityName
              dangerouslyAllowSignInWithoutUserInCatalog: true

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN:-local-dev-no-github}

# Override the OpenCost proxy target — in-cluster DNS is not reachable from Docker;
# use the ingress hostname that is mapped to host-gateway in docker-compose extra_hosts.
proxy:
  endpoints:
    /opencost:
      target: http://opencost.idp.local
      allowedMethods: ['GET']
      changeOrigin: true
    /prometheus:
      target: http://prometheus.idp.local
      allowedMethods: ['GET']
      changeOrigin: true
    /grafana/api:
      target: http://grafana.idp.local
      allowedMethods: ['GET']
      changeOrigin: true
      headers:
        Authorization: Bearer ${GRAFANA_TOKEN}
    /kagent:
      target: http://kagent.idp.local
      allowedMethods: ['GET', 'POST', 'HEAD']
      changeOrigin: true
      pathRewrite:
        '^/api/proxy/kagent': ''
      # A2A agent turns can take 60–180s (cold start + chained MCP tool calls).
      # Node.js http-proxy-middleware default is ~60s; raise to match ingress.
      timeout: 300000
    /contract-mcp:
      target: http://contract-mcp-server.idp.local
      allowedMethods: ['GET', 'POST']
      changeOrigin: true
    # External SaaS — same endpoints in local and AWS. Empty token = 401 from upstream,
    # which the Security entity tab renders gracefully as "Unable to load…".
    /sonarcloud:
      target: https://sonarcloud.io
      allowedMethods: ['GET']
      changeOrigin: true
      headers:
        Authorization: Bearer ${SONAR_TOKEN}
    /snyk:
      target: https://api.snyk.io
      allowedMethods: ['GET']
      changeOrigin: true
      headers:
        Authorization: token ${SNYK_TOKEN}
    /pagerduty:
      target: https://api.pagerduty.com
      allowedMethods: ['GET', 'POST']
      changeOrigin: true
      headers:
        Authorization: Token token=${PAGERDUTY_TOKEN}
        Accept: application/vnd.pagerduty+json;version=2
    /jira:
      target: ${JIRA_URL:-https://your-company.atlassian.net}
      allowedMethods: ['GET']
      changeOrigin: true
      headers:
        Authorization: Basic ${JIRA_TOKEN}
        Accept: application/json
    /github-copilot:
      target: https://api.github.com
      allowedMethods: ['GET']
      changeOrigin: true
      headers:
        Authorization: Bearer ${GITHUB_TOKEN}
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"

# Serve tech radar directly from the bind-mounted catalog volume via file:// URI.
# Using file:// avoids the Brotli compression that the static HTTP server applies,
# which causes the tech-radar UrlReader to fail with "Failed to parse JSON".
# The catalog directory is mounted at /catalog inside the container.
techRadar:
  url: http://localhost:3000/tech-radar.json

permission:
  enabled: true

techdocs:
  # Builder/generator already match the base config (local). Only the publisher
  # differs from prod: store generated docs on the container filesystem
  # instead of S3 so local doesn't need AWS credentials.
  publisher:
    type: 'local'
