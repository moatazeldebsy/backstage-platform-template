# AWS/EKS-specific overrides — merged on top of app-config.yaml in production.
# bootstrap.sh patches BACKSTAGE_ALB_URL with the real ALB hostname after provisioning.

app:
  baseUrl: http://BACKSTAGE_ALB_URL
  extensions:
    - page:catalog:
        config:
          path: /
    - page:kubernetes:
        disabled: true

backend:
  baseUrl: http://BACKSTAGE_ALB_URL
  listen: ':7007'
  cors:
    origin: http://BACKSTAGE_ALB_URL
  auth:
    externalAccess:
      - type: static
        options:
          token: ${BACKSTAGE_CATALOG_TOKEN}
          subject: catalog-exporter

auth:
  environment: production
  session:
    secret: ${AUTH_SESSION_SECRET:-backstage-session-secret}
  providers:
    guest:
      dangerouslyAllowOutsideDevelopment: true
    github:
      production:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: usernameMatchingUserEntityName
              dangerouslyAllowSignInWithoutUserInCatalog: true
            - resolver: emailMatchingUserEntityProfileEmail
              dangerouslyAllowSignInWithoutUserInCatalog: true

proxy:
  endpoints:
    /opencost:
      target: http://opencost.opencost.svc.cluster.local:9003
      changeOrigin: true
      pathRewrite:
        '^/api/proxy/opencost': ''
    /grafana/api:
      target: http://prometheus-grafana.monitoring.svc.cluster.local:80
      changeOrigin: true
    /prometheus/api:
      target: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
      changeOrigin: true
    /argocd/api:
      target: http://argocd-server.argocd.svc.cluster.local:80
      changeOrigin: true
      allowedHeaders: ['Authorization']
    /kagent:
      target: http://kagent-ui.kagent.svc.cluster.local:8080
      changeOrigin: true
      pathRewrite:
        '^/api/proxy/kagent': ''

techRadar:
  url: https://raw.githubusercontent.com/moatazeldebsy/backstage-platform-template/main/backstage/catalog/tech-radar.json

techdocs:
  publisher:
    type: 'awsS3'
    awsS3:
      bucketName: ${TECHDOCS_S3_BUCKET_NAME}
      region: ${AWS_REGION}

