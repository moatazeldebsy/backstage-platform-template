# AWS/EKS-specific overrides — merged on top of app-config.yaml in production.
# bootstrap.sh patches BACKSTAGE_ALB_URL with the real ALB hostname after provisioning.

app:
  baseUrl: http://BACKSTAGE_ALB_URL
  extensions:
    - page:kubernetes:
        disabled: true

backend:
  baseUrl: http://BACKSTAGE_ALB_URL
  listen: ':7007'
  cors:
    origin: http://BACKSTAGE_ALB_URL
  auth:
    externalAccess:
      - type: static
        options:
          token: ${BACKSTAGE_CATALOG_TOKEN}
          subject: catalog-exporter
  database:
    connection:
      ssl:
        # RDS certs are signed by Amazon's own CA, not a public trust root. bootstrap.sh
        # downloads https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem and
        # mounts it into the rds-ca-bundle ConfigMap at the path below (see deployment.yaml).
        rejectUnauthorized: true
        ca: /config/rds-ca-bundle.pem

auth:
  environment: production
  session:
    secret: ${AUTH_SESSION_SECRET}
  providers:
    github:
      production:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: usernameMatchingUserEntityName
              dangerouslyAllowSignInWithoutUserInCatalog: true
            - resolver: emailMatchingUserEntityProfileEmail
              dangerouslyAllowSignInWithoutUserInCatalog: true

proxy:
  endpoints:
    /opencost:
      target: http://opencost.opencost.svc.cluster.local:9003
      changeOrigin: true
      pathRewrite:
        '^/api/proxy/opencost': ''
    /grafana/api:
      target: http://prometheus-grafana.monitoring.svc.cluster.local:80
      changeOrigin: true
      headers:
        Authorization: Bearer ${GRAFANA_TOKEN}
    /prometheus:
      target: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
      changeOrigin: true
      pathRewrite:
        '^/api/proxy/prometheus': ''
    /argocd:
      target: http://argocd-server.argocd.svc.cluster.local:80
      changeOrigin: true
      headers:
        Authorization: Bearer ${ARGOCD_AUTH_TOKEN}
    /kagent:
      target: http://kagent-ui.kagent.svc.cluster.local:8080
      changeOrigin: true
      pathRewrite:
        '^/api/proxy/kagent': ''
    # External SaaS — same endpoints in local and AWS. Tokens are loaded via
    # External Secrets from AWS Secrets Manager (see aws/external-secrets/backstage.yaml).
    /sonarcloud:
      target: https://sonarcloud.io
      allowedMethods: ['GET']
      changeOrigin: true
      headers:
        Authorization: Bearer ${SONAR_TOKEN}
    /snyk:
      target: https://api.snyk.io
      allowedMethods: ['GET']
      changeOrigin: true
      headers:
        Authorization: token ${SNYK_TOKEN}
    /github-code-scanning:
      target: https://api.github.com
      allowedMethods: ['GET']
      changeOrigin: true
      headers:
        Authorization: Bearer ${GITHUB_TOKEN}
        Accept: application/vnd.github+json
    /pagerduty:
      target: https://api.pagerduty.com
      allowedMethods: ['GET', 'POST']
      changeOrigin: true
      headers:
        Authorization: Token token=${PAGERDUTY_TOKEN}
        Accept: application/vnd.pagerduty+json;version=2
    /jira:
      target: ${JIRA_URL:-https://your-company.atlassian.net}
      allowedMethods: ['GET']
      changeOrigin: true
      headers:
        Authorization: Basic ${JIRA_TOKEN}
        Accept: application/json
    /github-copilot:
      target: https://api.github.com
      allowedMethods: ['GET']
      changeOrigin: true
      headers:
        Authorization: Bearer ${GITHUB_TOKEN}
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"

# Browser-facing "open in new tab" links for the custom ArgoCD/Grafana/KAgent
# pages — distinct from the in-cluster `proxy:` targets above. ALB hostnames
# aren't known until each Ingress is provisioned, so these start as placeholders
# and get sed-substituted with the real ALB DNS names by scripts/bootstrap.sh
# (ArgoCD + Grafana, once their Ingresses are up) and scripts/bootstrap-ai.sh
# --aws (KAgent, once its Ingress is up) — same pattern as BACKSTAGE_ALB_URL
# below. Until substituted, the links 404 rather than silently pointing at the
# wrong place.
externalLinks:
  argocd: http://ARGOCD_ALB_URL
  grafana: http://GRAFANA_ALB_URL
  kagent: http://KAGENT_ALB_URL

# GitHub App integration — replaces the personal access token used in app-config.yaml.
# Higher rate limits (5 000 req/hr per installation vs 5 000/hr per PAT globally),
# no rotation needed, works on personal accounts and orgs.
#
# Setup (one-time):
#   1. Create the App: github.com/settings/apps/new (personal) or
#      github.com/organizations/<org>/settings/apps/new (org).
#      Required permissions: Contents=Read, Pull requests=Write, Members=Read, Metadata=Read.
#   2. Generate a private key and note the App ID.
#   3. Install the App on the platform repo (and any team repos you want Backstage to access).
#   4. Store secrets in AWS Secrets Manager under idp-mvp/:
#        idp-mvp/GITHUB_APP_ID           → numeric App ID
#        idp-mvp/GITHUB_APP_CLIENT_ID    → OAuth client ID
#        idp-mvp/GITHUB_APP_CLIENT_SECRET→ OAuth client secret
#        idp-mvp/GITHUB_APP_PRIVATE_KEY  → full PEM content (newlines preserved)
#        idp-mvp/GITHUB_APP_WEBHOOK_SECRET → webhook secret (can be empty)
#   5. Remove the legacy GITHUB_TOKEN secret once confirmed working.
integrations:
  github:
    - host: github.com
      apps:
        - appId: ${GITHUB_APP_ID}
          clientId: ${GITHUB_APP_CLIENT_ID}
          clientSecret: ${GITHUB_APP_CLIENT_SECRET}
          webhookSecret: ${GITHUB_APP_WEBHOOK_SECRET}
          privateKey: ${GITHUB_APP_PRIVATE_KEY}

techRadar:
  url: https://raw.githubusercontent.com/moatazeldebsy/backstage-platform-template/main/backstage/catalog/tech-radar.json

techdocs:
  publisher:
    type: 'awsS3'
    awsS3:
      bucketName: ${TECHDOCS_S3_BUCKET_NAME}
      region: ${AWS_REGION}

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location, Template, User, Group, Domain]
  locations:
    # ── Templates (all tiers) ──────────────────────────────────────────────────
    # Single entry — all templates indexed in backstage/catalog/all-templates.yaml.
    # To add a template: add one line there; no app-config edit needed.
    - type: url
      target: https://github.com/moatazeldebsy/backstage-platform-template/blob/main/backstage/catalog/all-templates.yaml
      rules:
        - allow: [Template, Location]
    # ── Platform entities ─────────────────────────────────────────────────────
    - type: url
      target: https://github.com/moatazeldebsy/backstage-platform-template/blob/main/catalog-info.yaml
      rules:
        - allow: [System]
    - type: url
      target: https://github.com/moatazeldebsy/backstage-platform-template/blob/main/backstage/catalog/catalog-info.yaml
      rules:
        - allow: [Component, System, User, Group]
    # Team Group entities auto-created by the team-namespace scaffold template
    - type: url
      target: https://github.com/moatazeldebsy/backstage-platform-template/blob/main/backstage/catalog/groups
      rules:
        - allow: [Group]
    # Domain + System entities — one file per business domain
    - type: url
      target: https://github.com/moatazeldebsy/backstage-platform-template/blob/main/backstage/catalog/domains/platform.yaml
      rules:
        - allow: [Domain, System]
    - type: url
      target: https://github.com/moatazeldebsy/backstage-platform-template/blob/main/backstage/catalog/domains/engineering.yaml
      rules:
        - allow: [Domain, System]
    - type: url
      target: https://github.com/moatazeldebsy/backstage-platform-template/blob/main/backstage/catalog/domains/mobile.yaml
      rules:
        - allow: [Domain, System]
    - type: url
      target: https://github.com/moatazeldebsy/backstage-platform-template/blob/main/backstage/catalog/domains/ai-ml.yaml
      rules:
        - allow: [Domain, System]
    - type: url
      target: https://github.com/moatazeldebsy/backstage-platform-template/blob/main/backstage/catalog/domains/quality.yaml
      rules:
        - allow: [Domain, System]
    - type: url
      target: https://github.com/moatazeldebsy/backstage-platform-template/blob/main/backstage/catalog/apis/hello-service-api.yaml
      rules:
        - allow: [API]
    - type: url
      target: https://github.com/moatazeldebsy/backstage-platform-template/blob/main/backstage/catalog/services/hello-service/catalog-info.yaml
      rules:
        - allow: [Component]
    - type: url
      target: https://github.com/moatazeldebsy/backstage-platform-template/blob/main/backstage/catalog/services/idp-assistant/catalog-info.yaml
      rules:
        - allow: [Component]
    - type: url
      target: https://github.com/moatazeldebsy/backstage-platform-template/blob/main/backstage/catalog/services/contract-mcp-server/catalog-info.yaml
      rules:
        - allow: [Component]
    # ── Mobile Platform catalog ───────────────────────────────────────────────
    - type: url
      target: https://github.com/moatazeldebsy/backstage-platform-template/blob/main/backstage/catalog/mobile-catalog.yaml
      rules:
        - allow: [Component]
    # ── QA Platform catalog ───────────────────────────────────────────────────
    - type: url
      target: https://github.com/moatazeldebsy/backstage-platform-template/blob/main/backstage/catalog/qa-catalog.yaml
      rules:
        - allow: [Component, Group, User, Resource]
    # ── AI / ML Platform ──────────────────────────────────────────────────────
    - type: url
      target: https://github.com/moatazeldebsy/backstage-platform-template/blob/main/backstage/catalog/resources/ai-platform.yaml
      rules:
        - allow: [Resource, Component]
    - type: url
      target: https://github.com/moatazeldebsy/backstage-platform-template/blob/main/services/idp-mcp-server/catalog-info.yaml
      rules:
        - allow: [Component]
    - type: url
      target: https://github.com/moatazeldebsy/backstage-platform-template/blob/main/services/idp-mcp-server/api.yaml
      rules:
        - allow: [API]
    - type: url
      target: https://github.com/moatazeldebsy/backstage-platform-template/blob/main/services/qa-mcp-server/catalog-info.yaml
      rules:
        - allow: [Component]
    - type: url
      target: https://github.com/moatazeldebsy/backstage-platform-template/blob/main/test-suites/test-deepeval/catalog-info.yaml
      rules:
        - allow: [Component]

  providers:
    github:
      idpOrg:
        organization: moatazeldebsy
        catalogPath: /catalog-info.yaml
        filters:
          branch: main
          topic:
            include: [idp]
        schedule:
          frequency: { minutes: 15 }
          timeout: { minutes: 3 }

    # GitHub org sync — automatically imports User and Group entities from the GitHub
    # organisation so teams don't need to maintain User/Group YAML manually.
    # Members, team memberships, and avatars stay in sync with GitHub at the schedule below.
    githubOrg:
      idpOrgSync:
        id: idpOrgSync
        githubUrl: https://github.com
        orgs:
          - name: moatazeldebsy
        schedule:
          frequency: { minutes: 30 }
          timeout: { minutes: 5 }

# Backstage permission framework.
# Requires @backstage/plugin-permission-backend and a policy plugin in packages/backend.
# In production this enforces read-only access for guests and restricts scaffolder
# template execution to authenticated GitHub org members.
#
# To enable: install the permission backend plugin, then set enabled: true here.
# See: https://backstage.io/docs/permissions/getting-started
# ── Multi-cluster Kubernetes plugin (V2) ─────────────────────────────────────
# Shows pods, deployments, and services from both EKS clusters on entity pages.
# The `backstage.io/kubernetes-id` annotation on the entity matches against
# the label selector on Kubernetes objects (set by the Helm chart).
#
# Auth: uses service account tokens stored in Secrets Manager (populated by
# register-argocd-cluster.sh which creates argocd-manager — reuse that SA or
# create a dedicated backstage-k8s-reader SA with read-only ClusterRole).
kubernetes:
  serviceLocatorMethod:
    type: multiTenant    # show resources from all clusters the entity label matches
  clusterLocatorMethods:
    - type: config
      clusters:
        # caData comes from terraform/secrets.tf (K8S_CLUSTER_CA_DATA, sourced from
        # module.eks.cluster_certificate_authority_data) — verifies the EKS API server
        # cert instead of skipping TLS validation.
        - name: eks-us-east-1
          url: ${K8S_CLUSTER_URL}
          authProvider: serviceAccount
          serviceAccountToken: ${K8S_SERVICE_ACCOUNT_TOKEN}
          skipTLSVerify: false
          caData: ${K8S_CLUSTER_CA_DATA}
          customResources:
            - group: argoproj.io
              apiVersion: v1alpha1
              plural: rollouts
            - group: idp.platform
              apiVersion: v1alpha1
              plural: s3buckets
            - group: idp.platform
              apiVersion: v1alpha1
              plural: dynamotables
            - group: kagent.dev
              apiVersion: v1alpha1
              plural: agents

permission:
  enabled: true
  # Policy: allow all for authenticated users; deny for unauthenticated (guest).
  # Replace with a custom OPA/Cedar policy plugin for fine-grained team RBAC.
  # The minimal policy below blocks the scaffolder for unauthenticated users,
  # which is the highest-risk default at org scale.
  #
  # To add team-scoped template visibility (item 7 from the scaling checklist),
  # implement a custom PolicyDecision that checks the user's Backstage Group
  # membership against the template's spec.owner before allowing execution.
  #
  # Ref: packages/backend/src/plugins/permission.ts (add this file)
  #   import { createRouter } from '@backstage/plugin-permission-backend';
  #   import { AuthorizeResult } from '@backstage/plugin-permission-common';
  #   export default async function createPlugin(env) {
  #     return createRouter({
  #       config: env.config,
  #       logger: env.logger,
  #       discovery: env.discovery,
  #       identity: env.identity,
  #       policy: {
  #         async handle(request, user) {
  #           if (!user) return { result: AuthorizeResult.DENY };
  #           return { result: AuthorizeResult.ALLOW };
  #         }
  #       }
  #     });
  #   }
