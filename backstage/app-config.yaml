    - type: file
      target: /catalog/templates/zap-dast-suite/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: /catalog/templates/enable-security-scanning/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: /catalog/templates/datadog-synthetic-suite/template.yaml
      rules:
