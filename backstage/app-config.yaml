    # contract-mcp-server component intentionally hidden from the catalog.
    # - type: file
    #   target: /catalog/services/contract-mcp-server/catalog-info.yaml
    #   rules:
    #     - allow: [Component]
    # ── AI / ML / MCP Platform ───────────────────────────────────────────────
    - type: file
      target: /catalog/templates/ai-agent-kagent/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: /catalog/templates/mlflow-experiment/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: /catalog/templates/mcp-server/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: /catalog/templates/deepeval-llm-eval-suite/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: /catalog/templates/model-serving-api/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: /catalog/resources/ai-platform.yaml
      rules:
        - allow: [Resource, Component]
    - type: file
      target: /catalog/resources/argo-workflows.yaml
      rules:
        - allow: [Resource]
    - type: file
      target: /services/idp-mcp-server/catalog-info.yaml
      rules:
        - allow: [Component]
    - type: file
      target: /services/idp-mcp-server/api.yaml
      rules:
        - allow: [API]
    # ── QA MCP Server ────────────────────────────────────────────────────────
    - type: file
      target: /services/qa-mcp-server/catalog-info.yaml
      rules:
        - allow: [Component]
    # ── LLM Eval suite ───────────────────────────────────────────────────────
    - type: file
      target: /test-suites/test-deepeval/catalog-info.yaml
      rules:
        - allow: [Component]
    # ── Scaffolded ML experiments (written at scaffold-time by idp:run-training-job) ──
    - type: file
      target: /catalog/ml-experiments/*/catalog-info.yaml
      rules:
        - allow: [Component]

  # GitHub org auto-discovery — finds repos tagged with the `idp` topic that
  # contain a catalog-info.yaml. Scaffolded services are tagged automatically;
  # add the `idp` topic to any pre-existing repo you want imported. Limiting
  # discovery by topic avoids scanning every fork/archived/tooling repo in the
  # org every 15 minutes (GitHub API rate-limit pressure).
  # Requires GITHUB_TOKEN with read:org + repo scopes in local/.env.
  providers:
    github:
      idpOrg:
        organization: moatazeldebsy
        catalogPath: /catalog-info.yaml
        filters:
          branch: main
          topic:
            include: [idp]
        schedule:
          frequency: { minutes: 15 }
          timeout: { minutes: 3 }
        # Auto-delete catalog entities whose source repo no longer carries the
        # idp topic (e.g. after decommissioning removes the topic). Without this,
        # stale entities persist as orphans and their TechDocs reappear on fresh installs.
        orphanStrategy: delete

kubernetes:
  serviceLocatorMethod:
    type: 'multiTenant'
  clusterLocatorMethods:
    - type: 'config'
      clusters:
        - url: ${K8S_CLUSTER_URL}
          name: idp-mvp
          authProvider: 'serviceAccount'
          skipTLSVerify: true
          # Set to true to skip the metrics-server hop (faster page loads, but
          # CPU/memory columns on the K8s tab will show "unknown").
          skipMetricsLookup: false
          serviceAccountToken: ${K8S_SERVICE_ACCOUNT_TOKEN}

techRadar:
  url: https://raw.githubusercontent.com/moatazeldebsy/backstage-platform-template/main/backstage/catalog/tech-radar.json

# Tech Insights — developer scorecard fact collection.
#
# The 11-check Bronze/Silver/Gold scorecard is rendered by a custom entity-page
# tab ("Scorecard") wired in backstage/app/packages/app/src/extensions.tsx.
# That tab computes checks client-side from each entity's annotations.
#
# This config registers the fact retrievers themselves so the same facts are
# also written to the Tech Insights backend DB, where the exporter
# (observability/tech-insights-exporter) pushes them to Pushgateway/CloudWatch.
techInsights:
  # Cadences are staggered so all three retrievers don't write to the DB at the
  # same minute — spreading the load across the 30-minute window.
  factRetrievers:
    idp-entity-facts:
      cadence: '*/30 * * * *'
    entityMetadataFactRetriever:
      cadence: '5-59/30 * * * *'
    entityOwnershipFactRetriever:
      cadence: '10-59/30 * * * *'

ragSearch:
  voyageApiKey: ${VOYAGE_API_KEY}
  indexIntervalMinutes: 30
  externalSources: []

# Proxy endpoints are env-specific:
#   local → app-config.local.yaml  (*.idp.local ingress hostnames)
#   AWS   → app-config.aws.yaml    (*.svc.cluster.local DNS)


