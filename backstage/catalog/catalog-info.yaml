# System entity is registered via /catalog-info.yaml (repo root, uses dir:.)
# hello-service is registered via /services/hello-service/catalog-info.yaml (co-located, uses dir:.)
---
# ── ML Platform Resources ─────────────────────────────────────────────────────
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: mlflow
  title: MLflow Experiment Tracker
  description: >
    Tracks ML experiments, parameters, metrics, and model artifacts.
    Local: http://mlflow.idp.local  |  Chart: community-charts/mlflow v2.13.0
  annotations:
    backstage.io/techdocs-ref: dir:.
  tags:
    - ml-platform
    - mlflow
    - experiment-tracking
  links:
    - url: http://mlflow.idp.local
      title: MLflow UI (local)
      icon: dashboard
spec:
  type: ml-platform
  lifecycle: production
  owner: platform-team
  system: internal-developer-platform
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: argo-workflows
  title: Argo Workflows Orchestrator
  description: >
    Kubernetes-native workflow engine for ML training jobs and data pipelines.
    Local: http://argo-workflows.idp.local  |  Chart: argo/argo-workflows
  annotations:
    backstage.io/techdocs-ref: dir:.
  tags:
    - ml-platform
    - argo-workflows
    - orchestration
  links:
    - url: http://argo-workflows.idp.local
      title: Argo Workflows UI (local)
      icon: dashboard
spec:
  type: ml-platform
  lifecycle: production
  owner: platform-team
  system: internal-developer-platform