apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-team
  description: Platform engineering team — owns the IDP infrastructure and golden paths
spec:
  type: team
  profile:
    displayName: Platform Team
    email: platform@idp.local
  children:
    - ml-team
    - data-team
    - qa-team
  members:
    - YOUR_GITHUB_ORG
    - guest
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: ml-team
  description: Machine Learning & AI team — model serving, training jobs, AI agents
  tags:
    - ml
    - ai
spec:
  type: team
  profile:
    displayName: ML Team
    email: ml-team@idp.local
  parent: platform-team
  children: []
  members:
    - ml-engineer
    - ai-researcher
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: data-team
  description: Data Engineering team — experiment tracking, data pipelines, MLflow
  tags:
    - data
    - mlflow
spec:
  type: team
  profile:
    displayName: Data Team
    email: data-team@idp.local
  parent: platform-team
  children: []
  members:
    - data-engineer
