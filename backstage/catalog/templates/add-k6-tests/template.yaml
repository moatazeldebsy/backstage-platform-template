apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: add-k6-tests
  title: Add k6 Performance Tests to Existing Service
  description: >
    Injects k6 smoke, load, and stress test scripts plus a CI/CD workflow into an existing
    service repo by opening a PR. No new repo is created.
  tags:
    - testing
    - performance
    - k6
    - load-testing
    - self-service
    - addon
  links:
    - title: k6 Docs
      url: https://k6.io/docs
      icon: docs
spec:
  owner: qa-team
  type: service

  parameters:
    - title: Which service should get performance tests?
      required:
        - serviceEntity
        - targetServiceUrl
        - confirmNoTests
      properties:
        serviceEntity:
          title: Service
          type: string
          description: Pick a registered service from the catalog
          ui:field: EntityPicker
          ui:autofocus: true
          ui:options:
            catalogFilter:
              kind: Component
            defaultKind: Component
            defaultNamespace: default
        githubOrg:
          title: GitHub organisation
          type: string
          default: YOUR_GITHUB_ORG
          description: GitHub org that owns the service repo
        targetServiceUrl:
          title: Service base URL
          type: string
          description: Base URL k6 will target (e.g. http://my-api.idp.local or https://api.example.com)
          default: http://hello-service.idp.local
        confirmNoTests:
          title: >
            I confirm this repo does NOT already contain a tests/ folder with k6 scripts
            or .github/workflows/idp-k6-tests.yml.
            Running this template on a repo with existing k6 setup will overwrite those files.
          type: boolean
          const: true
          default: false
          ui:widget: checkbox

    - title: Thresholds & schedule
      properties:
        p95LatencyThresholdMs:
          title: p95 latency threshold (ms)
          type: integer
          description: Test fails if p95 response time exceeds this value
          default: 500
          minimum: 100
        errorRateThreshold:
          title: Error rate threshold (%)
          type: number
          description: Test fails if HTTP error rate exceeds this percentage
          default: 1
          minimum: 0
          maximum: 100
        peakVus:
          title: Peak virtual users
          type: integer
          description: Number of concurrent virtual users at peak load
          default: 50
          minimum: 1
        runSchedule:
          title: Scheduled run (cron)
          type: string
          description: When to run load/stress tests automatically (UTC)
          default: '0 3 * * 1-5'
          enum:
            - '0 3 * * 1-5'
            - '0 3 * * *'
            - '0 */12 * * *'
          enumNames:
            - Weekdays at 03:00 UTC
            - Daily at 03:00 UTC
            - Every 12 hours

  steps:
    - id: fetch-skeleton
      name: Render k6 scripts and CI workflow
      action: fetch:template
      input:
        url: ./skeleton
        values:
          repoName: ${{ (parameters.serviceEntity | parseEntityRef).name }}
          targetServiceUrl: ${{ parameters.targetServiceUrl }}
          p95LatencyThresholdMs: ${{ parameters.p95LatencyThresholdMs }}
          errorRateThreshold: ${{ parameters.errorRateThreshold }}
          peakVus: ${{ parameters.peakVus }}
          runSchedule: ${{ parameters.runSchedule }}

    - id: pr
      name: Open pull request in service repo
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=${{ (parameters.serviceEntity | parseEntityRef).name }}&owner=${{ parameters.githubOrg }}
        branchName: idp/add-k6-tests
        title: "test: add k6 performance test scaffolding [IDP golden path]"
        description: |
          ## Add k6 Performance Tests — IDP Golden Path

          This PR was generated by the **Add k6 Performance Tests** Backstage template.

          ### What's included

          | File | Purpose |
          |------|---------|
          | `.github/workflows/idp-k6-tests.yml` | CI job — smoke on PR, load+stress on schedule |
          | `tests/smoke.js` | 1 VU × 30s — verifies `/healthz` is alive |
          | `tests/load.js` | Ramping load up to ${{ parameters.peakVus }} VUs over 5 min |
          | `tests/stress.js` | Pushes to ${{ parameters.peakVus }}×3 VUs to find the breaking point |

          ### Thresholds

          | Metric | Threshold |
          |--------|-----------|
          | p95 latency | ≤ ${{ parameters.p95LatencyThresholdMs }}ms |
          | HTTP error rate | ≤ ${{ parameters.errorRateThreshold }}% |
          | Peak VUs | ${{ parameters.peakVus }} |

          ### Target URL

          Tests point to: `${{ parameters.targetServiceUrl }}`

          Override per-run via `workflow_dispatch` → `base_url` input.

          ### Next steps after merging

          1. Review thresholds in `tests/load.js` and adjust for your SLOs.
          2. Set `PUSHGATEWAY_URL` as a GitHub secret to push metrics to Prometheus.
          3. Smoke tests run on every PR; load+stress run on schedule (`${{ parameters.runSchedule }}`).
        commitMessage: "test: add k6 performance test scaffolding (IDP golden path)"

  output:
    links:
      - title: Pull Request
        url: ${{ steps.pr.output.remoteUrl }}
    text:
      - title: Next steps
        content: |
          PR opened in **${{ parameters.githubOrg }}/${{ (parameters.serviceEntity | parseEntityRef).name }}**.

          1. Merge the PR.
          2. Smoke tests run automatically on every PR (fast, 1 VU).
          3. Full load + stress tests run on schedule: `${{ parameters.runSchedule }}`.
          4. Results are uploaded as CI artifacts (30 days retention).
