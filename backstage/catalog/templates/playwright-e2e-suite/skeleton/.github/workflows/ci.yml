name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '${{ values.runSchedule }}'
  workflow_dispatch:
    inputs:
      base_url:
        description: "Override base URL (default: ${{ values.targetServiceUrl }})"
        required: false
        default: ""

concurrency:
  group: e2e-${{ '${{ github.ref }}' }}
  cancel-in-progress: true

jobs:
  test:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
          # If triggered via workflow_dispatch with a URL override, use it.
          # Otherwise playwright.config.ts falls back to the baked-in target URL.
          BASE_URL: ${{ '${{ inputs.base_url }}' }}
          CI: 'true'

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ '${{ github.run_number }}' }}
          path: playwright-report/
          retention-days: 30

      - name: Push QA metrics to Prometheus Pushgateway
        if: always()
        env:
          PUSHGATEWAY_URL: ${{ '${{ secrets.PUSHGATEWAY_URL }}' }}
          SUITE_NAME: '${{ values.name }}'
        run: |
          if [ -z "$PUSHGATEWAY_URL" ]; then exit 0; fi
          PASS=$(grep -c '"status":"passed"' test-results/results.json 2>/dev/null || echo 0)
          FAIL=$(grep -c '"status":"failed"' test-results/results.json 2>/dev/null || echo 0)
          TOTAL=$((PASS + FAIL))
          RATE=$([ "$TOTAL" -gt 0 ] && echo "scale=4; $PASS / $TOTAL" | bc || echo 0)
          cat <<EOF | curl --data-binary @- "${PUSHGATEWAY_URL}/metrics/job/e2e/suite/${SUITE_NAME}"
          # TYPE e2e_tests_total gauge
          e2e_tests_total{suite="${SUITE_NAME}",result="passed"} ${PASS}
          e2e_tests_total{suite="${SUITE_NAME}",result="failed"} ${FAIL}
          # TYPE e2e_pass_rate gauge
          e2e_pass_rate{suite="${SUITE_NAME}"} ${RATE}
          EOF
