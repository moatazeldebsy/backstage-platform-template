name: Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: '${{ values.baseUrl }}'
    steps:
      - uses: actions/checkout@v4

      - name: Pre-flight — skip if BASE_URL is not reachable
        id: preflight
        run: |
          if [ -z "${BASE_URL}" ] || [ "${BASE_URL}" = "http://localhost:3000" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::BASE_URL not configured — first-run skip."
            exit 0
          fi
          if ! curl -fsS --max-time 5 "${BASE_URL%/}/" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::BASE_URL (${BASE_URL}) not reachable from runner — skipping."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.skip != 'true'
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.preflight.outputs.skip != 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.preflight.outputs.skip != 'true'
        run: npx playwright install --with-deps

      - name: Run E2E tests
        if: steps.preflight.outputs.skip != 'true'
        run: npx playwright test
        env:
          CI: 'true'

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
{%- if values.cloudGrid === 'lambdatest' %}

  # Runs after the runner-local suite and only on main, so cloud minutes are
  # spent confirming a merge rather than on every push. Credentials arrive as
  # repository secrets via the platform's idp:repo:set-secrets action; the grid
  # endpoint itself is built in playwright.config.ts.
  e2e-lambdatest:
    runs-on: ubuntu-latest
    needs: e2e
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    env:
      BASE_URL: '${{ values.baseUrl }}'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run E2E tests on LambdaTest
        run: npx playwright test
        env:
          CI: 'true'
          LT_USERNAME: ${{ '${{ secrets.LT_USERNAME }}' }}
          LT_ACCESS_KEY: ${{ '${{ secrets.LT_ACCESS_KEY }}' }}

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-lambdatest
          path: playwright-report/
          retention-days: 30
{%- endif %}
