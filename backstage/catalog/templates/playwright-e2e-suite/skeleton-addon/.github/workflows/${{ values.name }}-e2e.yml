name: ${{ values.name }} Playwright E2E

on:
  push:
    branches: [main]
    paths:
      - 'test-suites/${{ values.name }}/**'
  pull_request:
    branches: [main]
    paths:
      - 'test-suites/${{ values.name }}/**'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: '${{ values.baseUrl }}'
    defaults:
      run:
        working-directory: test-suites/${{ values.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Pre-flight — skip if BASE_URL is not reachable
        id: preflight
        working-directory: .
        run: |
          if [ -z "${BASE_URL}" ] || [ "${BASE_URL}" = "http://localhost:3000" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::BASE_URL not configured — first-run skip."
            exit 0
          fi
          if ! curl -fsS --max-time 5 "${BASE_URL%/}/" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::BASE_URL (${BASE_URL}) not reachable from runner — skipping."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.skip != 'true'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: test-suites/${{ values.name }}/package-lock.json

      - name: Install dependencies
        if: steps.preflight.outputs.skip != 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.preflight.outputs.skip != 'true'
        run: npx playwright install --with-deps

      - name: Run E2E tests
        if: steps.preflight.outputs.skip != 'true'
        run: npx playwright test
        env:
          CI: 'true'

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ values.name }}
          path: test-suites/${{ values.name }}/playwright-report/
          retention-days: 30
{%- if values.cloudGrid !== 'none' %}

  # Runs after the runner-local suite and only on main, so cloud minutes are
  # spent confirming a merge rather than every push. Credentials arrive as
  # repository secrets via the platform's idp:repo:set-secrets action.
  e2e-cloud-grid:
    name: E2E on ${{ values.cloudGrid }}
    runs-on: ubuntu-latest
    needs: e2e
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    env:
      BASE_URL: '${{ values.baseUrl }}'
    defaults:
      run:
        working-directory: test-suites/${{ values.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: test-suites/${{ values.name }}/package-lock.json

      - name: Install dependencies
        run: npm ci
{%- if values.cloudGrid === 'sauce-labs' %}

      # Sauce has no Playwright CDP endpoint, so the suite is shipped to Sauce
      # VMs by its CLI rather than connected to from here.
      - name: Run E2E on Sauce Labs
        run: |
          set -euo pipefail
          curl -sSL https://saucelabs.github.io/saucectl/install | bash -s -- -b .
          ./saucectl run --config .sauce/config.yml
        env:
          SAUCE_USERNAME: ${{ '${{ secrets.SAUCE_USERNAME }}' }}
          SAUCE_ACCESS_KEY: ${{ '${{ secrets.SAUCE_ACCESS_KEY }}' }}
{%- else %}

      - name: Run E2E on ${{ values.cloudGrid }}
        run: npx playwright test
        env:
          CI: 'true'
{%- if values.cloudGrid === 'lambdatest' %}
          LT_USERNAME: ${{ '${{ secrets.LT_USERNAME }}' }}
          LT_ACCESS_KEY: ${{ '${{ secrets.LT_ACCESS_KEY }}' }}
{%- else %}
          BROWSERSTACK_USERNAME: ${{ '${{ secrets.BROWSERSTACK_USERNAME }}' }}
          BROWSERSTACK_ACCESS_KEY: ${{ '${{ secrets.BROWSERSTACK_ACCESS_KEY }}' }}
{%- endif %}
{%- endif %}

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-cloud-grid-${{ values.name }}
          path: test-suites/${{ values.name }}/playwright-report/
          retention-days: 30
{%- endif %}
