name: Datadog Synthetic Tests

# Requires DD_API_KEY and DD_APP_KEY repo secrets and a Datadog account;
# run on demand or on a schedule rather than every push.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

env:
  DATADOG_SITE: '${{ values.datadogSite }}'
  # Set DD_API_KEY and DD_APP_KEY as repository secrets in GitHub settings
  DD_API_KEY: ${{ '${{ secrets.DD_API_KEY }}' }}
  DD_APP_KEY: ${{ '${{ secrets.DD_APP_KEY }}' }}

jobs:
  synthetics:
    name: Run Synthetic Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Check Datadog credentials
        run: |
          if [ -z "${DD_API_KEY}" ] || [ -z "${DD_APP_KEY}" ]; then
            echo "::notice::DD_API_KEY/DD_APP_KEY not configured — skipping synthetic tests."
            exit 0
          fi

      - name: Install dependencies
        if: env.DD_API_KEY != '' && env.DD_APP_KEY != ''
        run: npm ci

      - name: Run Datadog Synthetic Tests
        if: env.DD_API_KEY != '' && env.DD_APP_KEY != ''
        run: npm test
