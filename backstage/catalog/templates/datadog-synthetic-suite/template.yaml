apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: datadog-synthetic-suite
  title: Datadog Synthetic Test Suite
  description: Scaffold Datadog synthetic monitoring tests (API and browser) with CI-triggered execution
  tags:
    - datadog
    - synthetic
    - monitoring
    - qa
spec:
  owner: qa-team
  type: test-suite

  parameters:
    - title: Suite Details
      required:
        - name
        - description
        - owner
        - targetService
      properties:
        name:
          title: Suite Name
          type: string
          description: Unique name for this synthetic suite (lowercase, hyphens only)
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
          ui:autofocus: true
        description:
          title: Description
          type: string
        owner:
          title: Owner
          type: string
          description: Team or user owning this suite
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        targetService:
          title: Target Service
          type: string
          description: The service this synthetic suite monitors
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: Component

    - title: Datadog Configuration
      required:
        - datadogSite
      properties:
        targetUrl:
          title: Service URL
          type: string
          description: Public or internal URL of the service to monitor
          default: 'https://example.idp.local'
        datadogSite:
          title: Datadog Site
          type: string
          description: Your Datadog site region
          default: datadoghq.eu
          enum:
            - datadoghq.com
            - datadoghq.eu
            - us3.datadoghq.com
            - us5.datadoghq.com
            - ap1.datadoghq.com
        testTypes:
          title: Test Types
          type: array
          description: Types of synthetic tests to scaffold
          items:
            type: string
            enum:
              - api
              - browser
          default:
            - api
          ui:widget: checkboxes
        locations:
          title: Test Locations
          type: array
          description: Datadog managed locations to run tests from
          items:
            type: string
            enum:
              - aws:eu-west-1
              - aws:us-east-1
              - aws:us-west-2
              - aws:ap-southeast-1
          default:
            - aws:eu-west-1
            - aws:us-east-1
          ui:widget: checkboxes

    - title: Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: GitHub Repository
          type: string
          ui:field: RepoUrlPicker
          ui:help: "Repository name must not already exist on GitHub."
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - moatazeldebsy

  steps:
    - id: fetch-template
      name: Fetch Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          targetService: ${{ parameters.targetService }}
          targetUrl: ${{ parameters.targetUrl }}
          datadogSite: ${{ parameters.datadogSite }}
          testTypes: ${{ parameters.testTypes }}
          locations: ${{ parameters.locations }}
          githubOrg: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          repoName: ${{ (parameters.repoUrl | parseRepoUrl).repo }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        gitCommitMessage: "chore: initial scaffold via IDP"
        topics:
          - datadog
          - synthetic-monitoring
          - qa

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
