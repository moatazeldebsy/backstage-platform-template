name: Contract Check

on:
  pull_request:
    paths:
      - 'openapi.yaml'
      - 'openapi.json'
      - 'app.rb'

jobs:
  contract-check:
    name: Contract validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    env:
      CONTRACT_SERVER: ${{ '${{ vars.CONTRACT_SERVER_URL }}' }}
      SERVICE_NAME: ${{ values.name }}
      SPEC_PATH: openapi.yaml
      PR_NUMBER: ${{ '${{ github.event.pull_request.number }}' }}
      GIT_SHA: ${{ '${{ github.sha }}' }}

    steps:
      - uses: actions/checkout@v4

      - name: Check OpenAPI spec exists
        run: |
          if [ ! -f "$SPEC_PATH" ]; then
            echo "No OpenAPI spec found at $SPEC_PATH — skipping contract check"
            echo "SKIP_CONTRACT_CHECK=true" >> "$GITHUB_ENV"
          fi
          if [ -z "$CONTRACT_SERVER" ]; then
            echo "CONTRACT_SERVER_URL repo variable not set — skipping contract check"
            echo "SKIP_CONTRACT_CHECK=true" >> "$GITHUB_ENV"
          fi

      - name: Fetch previous spec version
        if: env.SKIP_CONTRACT_CHECK != 'true'
        env:
          CONTRACT_TOKEN: ${{ '${{ secrets.CONTRACT_TOKEN }}' }}
        run: |
          PREV_RESPONSE=$(curl -sf \
            -H "X-Api-Key: $CONTRACT_TOKEN" \
            "$CONTRACT_SERVER/api/contracts/$SERVICE_NAME" || echo '{}')
          PREV_VERSION=$(echo "$PREV_RESPONSE" | jq -r '.version // empty')
          echo "PREV_VERSION=${PREV_VERSION}" >> "$GITHUB_ENV"
          echo "Previous registered version: ${PREV_VERSION:-none}"

      - name: Register PR contract
        if: env.SKIP_CONTRACT_CHECK != 'true'
        env:
          CONTRACT_TOKEN: ${{ '${{ secrets.CONTRACT_TOKEN }}' }}
        run: |
          NEW_VERSION="pr-${PR_NUMBER}-${GIT_SHA}"
          echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "$CONTRACT_SERVER/api/contracts/$SERVICE_NAME/$NEW_VERSION" \
            -H "X-Api-Key: $CONTRACT_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@$SPEC_PATH")

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Failed to register contract (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "Contract registered as $SERVICE_NAME@$NEW_VERSION"

      - name: Detect breaking changes
        if: env.SKIP_CONTRACT_CHECK != 'true' && env.PREV_VERSION != ''
        run: |
          # The contract server responds 422 (not 200) when breaking changes
          # are found, so -f can't be used here — it would abort before the
          # JSON body (which we need to parse either way) is ever read.
          RESULT=$(curl -s -X POST \
            "$CONTRACT_SERVER/api/breaking-changes" \
            -H "Content-Type: application/json" \
            -d "{\"service_name\":\"$SERVICE_NAME\",\"from_version\":\"$PREV_VERSION\",\"to_version\":\"$NEW_VERSION\"}")

          BREAKING_COUNT=$(echo "$RESULT" | jq '.breaking | length')
          echo "BREAKING_COUNT=${BREAKING_COUNT}" >> "$GITHUB_ENV"
          {
            echo "BREAKING_RESULT<<EOF_BREAKING"
            echo "$RESULT"
            echo "EOF_BREAKING"
          } >> "$GITHUB_ENV"

          if [ "$BREAKING_COUNT" -gt 0 ]; then
            echo "BREAKING_DETECTED=true" >> "$GITHUB_ENV"
          fi

      - name: Post PR comment
        if: env.SKIP_CONTRACT_CHECK != 'true'
        uses: actions/github-script@v7
        env:
          BREAKING_RESULT: ${{ '${{ env.BREAKING_RESULT }}' }}
          BREAKING_COUNT: ${{ '${{ env.BREAKING_COUNT }}' }}
          PREV_VERSION: ${{ '${{ env.PREV_VERSION }}' }}
          NEW_VERSION: ${{ '${{ env.NEW_VERSION }}' }}
          SERVICE_NAME: ${{ values.name }}
          CONTRACT_SERVER: ${{ '${{ env.CONTRACT_SERVER }}' }}
        with:
          script: |
            const breakingResult = JSON.parse(process.env.BREAKING_RESULT || '{}');
            const breakingCount = parseInt(process.env.BREAKING_COUNT || '0');
            const prevVersion = process.env.PREV_VERSION;
            const serviceName = process.env.SERVICE_NAME;
            const contractServer = process.env.CONTRACT_SERVER;

            let comment = `## 📋 Contract Check — \`${serviceName}\`\n\n`;

            if (prevVersion) {
              if (breakingCount === 0) {
                comment += `✅ No breaking changes detected.\n`;
              } else {
                comment += `❌ **${breakingCount} breaking change(s) detected:**\n`;
                for (const change of (breakingResult.breaking || [])) {
                  comment += `- \`${change.type}\`: ${change.detail}\n`;
                }
              }
            } else {
              comment += `> ℹ️ No previous version registered — first-time contract registration.\n`;
            }

            comment += `\n<sub>Checked by [contract-mcp-server](${contractServer})</sub>`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment,
            });

      - name: Generate migration guide
        if: env.BREAKING_DETECTED == 'true'
        run: |
          curl -sf -X POST "$CONTRACT_SERVER/api/migration-guide" \
            -H "Content-Type: application/json" \
            -d "{\"service_name\":\"$SERVICE_NAME\",\"from_version\":\"$PREV_VERSION\",\"to_version\":\"$NEW_VERSION\"}" \
            -o migration-guide.md \
            || echo "Warning: migration guide generation failed (non-blocking)"

      - name: Post migration guide as PR comment
        if: env.BREAKING_DETECTED == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let guide = '_Migration guide unavailable — see workflow logs._';
            try { guide = fs.readFileSync('migration-guide.md', 'utf8'); } catch {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🚧 Migration Guide\n\n${guide}`,
            });

      - name: Fail if breaking changes detected
        if: env.BREAKING_DETECTED == 'true'
        run: |
          echo "Breaking changes detected in $SERVICE_NAME — merge blocked."
          echo "See the migration guide posted above."
          exit 1
