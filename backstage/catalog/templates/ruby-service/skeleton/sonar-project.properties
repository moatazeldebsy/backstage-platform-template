sonar.projectKey=${{ values.githubOrg }}_${{ values.repoName }}
sonar.organization=${{ values.githubOrg }}
sonar.projectName=${{ values.name }}
sonar.host.url=https://sonarcloud.io

sonar.sources=.
sonar.inclusions=app.rb
sonar.tests=spec
sonar.exclusions=**/vendor/**,**/spec/**

sonar.ruby.coverage.reportPaths=coverage/coverage.json

sonar.sourceEncoding=UTF-8
