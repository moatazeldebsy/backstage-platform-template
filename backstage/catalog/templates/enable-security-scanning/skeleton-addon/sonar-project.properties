sonar.projectKey=${{ values.sonarProjectKey }}
sonar.organization=${{ values.sonarOrganization }}
sonar.projectName=${{ values.targetService }}
sonar.host.url=https://sonarcloud.io

# Adjust paths to match your project structure.
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/vendor/**,**/.venv/**,**/__pycache__/**,**/coverage/**,**/dist/**,**/build/**

sonar.sourceEncoding=UTF-8
