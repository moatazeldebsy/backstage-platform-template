apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: add-secret
  title: Add Secret to Service
  description: Self-service secret provisioning — stores a secret in AWS Secrets Manager and opens a PR adding the ExternalSecret manifest to your service repo.
  tags:
    - secrets
    - security
    - self-service
    - aws
spec:
  owner: platform-team
  type: service

  parameters:
    - title: Which service needs this secret?
      required:
        - serviceName
        - githubOrg
        - repoName
      properties:
        serviceName:
          title: Service name
          type: string
          description: Must match the catalog service name (e.g. payments-api)
          ui:autofocus: true
        githubOrg:
          title: GitHub organisation
          type: string
          default: YOUR_GITHUB_ORG
        repoName:
          title: Service repository
          type: string
          description: GitHub repo where the ExternalSecret manifest PR will be opened

    - title: Secret details
      required:
        - secretKey
        - secretValue
      properties:
        secretKey:
          title: Environment variable name
          type: string
          description: Name of the env var injected into the pod (e.g. STRIPE_API_KEY, DATABASE_URL)
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
        secretValue:
          title: Secret value
          type: string
          description: The sensitive value — stored encrypted in AWS Secrets Manager, never logged
          ui:widget: password
        awsRegion:
          title: AWS region
          type: string
          default: us-east-1

  steps:
    - id: provision
      name: Create secret in AWS Secrets Manager
      action: idp:provision-secret
      input:
        serviceName: ${{ parameters.serviceName }}
        secretKey: ${{ parameters.secretKey }}
        secretValue: ${{ parameters.secretValue }}
        awsRegion: ${{ parameters.awsRegion }}

    - id: fetch
      name: Render ExternalSecret manifest
      action: fetch:template
      input:
        url: ./skeleton
        values:
          serviceName: ${{ parameters.serviceName }}
          secretKey: ${{ parameters.secretKey }}
          secretPath: ${{ steps.provision.output.secretPath }}

    - id: pr
      name: Open pull request in service repo
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=${{ parameters.repoName }}&owner=${{ parameters.githubOrg }}
        branchName: idp/add-secret-${{ parameters.secretKey | lower | replace("_", "-") }}
        title: "feat(secrets): add ${{ parameters.secretKey }} ExternalSecret for ${{ parameters.serviceName }}"
        description: |
          Auto-generated by Backstage IDP scaffolder.

          Adds an ExternalSecret manifest that injects `${{ parameters.secretKey }}` from AWS Secrets Manager
          into the `${{ parameters.serviceName }}-secrets` Kubernetes Secret.

          Secret path: `${{ steps.provision.output.secretPath }}`
          Secret ARN:  `${{ steps.provision.output.secretArn }}`

          **After merging:** restart the deployment to pick up the new secret:
          ```bash
          kubectl rollout restart deployment/${{ parameters.serviceName }} -n services
          ```
        targetPath: k8s/secrets
        commitMessage: "chore: add ExternalSecret for ${{ parameters.secretKey }}"

  output:
    links:
      - title: Pull Request
        url: ${{ steps.pr.output.remoteUrl }}
    text:
      - title: Secret details
        content: |
          **AWS secret path:** `${{ steps.provision.output.secretPath }}`
          **ARN:** `${{ steps.provision.output.secretArn }}`

          Merge the PR, then restart your deployment:
          ```bash
          kubectl rollout restart deployment/${{ parameters.serviceName }} -n services
          ```
