name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

env:
  SERVICE_NAME: ${{ values.name }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  quality:
    name: Lint + Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check (node --check)
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Format check (prettier)
        run: |
          npx --yes prettier --check "src/**/*.{js,json}" || \
            { echo "Run 'npx prettier --write src' locally and commit."; exit 1; }

      - name: npm audit (high+critical, prod deps only)
        run: npm audit --audit-level=high --omit=dev

      - name: Trivy filesystem scan (deps + secrets)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scanners: 'vuln,secret,misconfig'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

  test:
    name: Test + Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage (70% threshold)
        run: |
          npm test -- \
            --passWithNoTests \
            --coverage \
            --coverageReporters=lcov \
            --coverageReporters=text-summary \
            --coverageReporters=cobertura \
            --coverageThreshold='{"global":{"lines":70,"statements":70,"functions":70,"branches":60}}' \
            --reporters=default \
            --reporters=jest-junit || \
            { echo "Coverage below 70% — add tests or adjust the threshold in package.json."; exit 1; }
        env:
          JEST_JUNIT_OUTPUT_FILE: junit.xml

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            junit.xml
          retention-days: 7

      - name: Build Docker image (smoke check)
        run: docker build -t ${{ '${{ env.SERVICE_NAME }}' }}:ci .

      - name: Smoke-test container
        run: |
          docker run -d --name svc -p ${{ values.port }}:${{ values.port }} \
            -e PORT=${{ values.port }} \
            ${{ '${{ env.SERVICE_NAME }}' }}:ci
          sleep 3
          curl -sf --retry 5 --retry-delay 2 --retry-connrefused \
            http://localhost:${{ values.port }}/healthz
          curl -sf --retry 5 --retry-delay 2 --retry-connrefused \
            http://localhost:${{ values.port }}/ready
          docker stop svc && docker rm svc

  publish:
    needs: [test, quality]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ '${{ github.actor }}' }}
          password: ${{ '${{ secrets.GITHUB_TOKEN }}' }}

      - name: Build and push image
        id: build
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE=ghcr.io/${{ values.githubOrg }}/${{ values.name }}
          docker build -t ${IMAGE}:${SHORT_SHA} -t ${IMAGE}:latest .
          docker push ${IMAGE}:${SHORT_SHA}
          docker push ${IMAGE}:latest
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Update image tag in platform repo
        env:
          GH_TOKEN: ${{ '${{ secrets.GH_PAT }}' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT not set — platform repo image tag update skipped"
            exit 0
          fi
          git config --global user.email "ci@idp.platform"
          git config --global user.name "IDP CI Bot"
          PLATFORM_DIR=$(mktemp -d)
          git clone https://x-access-token:${GH_TOKEN}@github.com/${{ values.githubOrg }}/backstage-platform-template.git "$PLATFORM_DIR"
          cd "$PLATFORM_DIR"
          VALUES_FILE="services/${{ values.name }}/helm-values-aws.yaml"
          if [ -f "${VALUES_FILE}" ]; then
            sed -i "s|^  tag: .*|  tag: \"${SHORT_SHA}\"|" "${VALUES_FILE}"
            git add "${VALUES_FILE}"
            git diff --cached --quiet || git commit -m "chore: bump ${{ values.name }} image to ${SHORT_SHA} [skip ci]"
            git push
          else
            echo "Values file not found at ${VALUES_FILE} — merge the Platform GitOps PR first"
          fi
