name: Publish

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  PLATFORM: "${{ values.platform }}"

{% if values.platform === 'android' or values.platform === 'multiplatform' %}
jobs:
  test-and-publish-android:
    name: Test + Publish (Android/Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run tests
        run: ./gradlew test

      - name: Publish to GitHub Packages (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ '${{ secrets.GITHUB_TOKEN }}' }}
          GITHUB_ACTOR: ${{ '${{ github.actor }}' }}
        run: ./gradlew publish

{% elif values.platform === 'ios' %}
jobs:
  test-and-release-ios:
    name: Test + Release (iOS Swift Package)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Run tests
        run: swift test --parallel

      - name: Validate SPM manifest
        run: swift package dump-package

      - name: Create GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

{% elif values.platform === 'flutter' %}
jobs:
  test-and-publish-flutter:
    name: Test + Publish (Flutter/Dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Analyze
        run: flutter analyze

      - name: Dry-run publish (PR only)
        if: github.event_name == 'pull_request'
        run: flutter pub publish --dry-run

      - name: Publish to pub.dev (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: flutter pub publish --force
        env:
          PUB_CREDENTIALS: ${{ '${{ secrets.PUB_CREDENTIALS }}' }}

{% endif %}
