name: Performance Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TARGET_URL: '${{ values.targetUrl }}'
  SUITE_NAME: '${{ values.name }}'

jobs:
  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pre-flight — skip if TARGET_URL is not reachable
        id: preflight
        run: |
          if [ -z "${TARGET_URL}" ] || [ "${TARGET_URL}" = "http://localhost:3000" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::TARGET_URL not configured — first-run skip."
            exit 0
          fi
          if ! curl -fsS --max-time 5 "${TARGET_URL%/}/" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::TARGET_URL (${TARGET_URL}) not reachable from runner — skipping."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Run k6 smoke test
        if: steps.preflight.outputs.skip != 'true'
        uses: grafana/k6-action@v0.3.0
        with:
          filename: tests/smoke.js

  load:
    name: Load Test
    runs-on: ubuntu-latest
    needs: smoke
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Pre-flight — skip if TARGET_URL is not reachable
        id: preflight
        run: |
          if [ -z "${TARGET_URL}" ] || [ "${TARGET_URL}" = "http://localhost:3000" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::TARGET_URL not configured — skipping load test."
            exit 0
          fi
          if ! curl -fsS --max-time 5 "${TARGET_URL%/}/" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::TARGET_URL (${TARGET_URL}) not reachable from runner — skipping."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Run k6 load test
        if: steps.preflight.outputs.skip != 'true'
        uses: grafana/k6-action@v0.3.0
        with:
          filename: tests/load.js

      - name: Push timestamp metric to Prometheus Pushgateway
        if: always()
        env:
          PUSHGW: ${{ '${{ secrets.PUSHGATEWAY_URL }}' }}
        run: |
          ADDR="${PUSHGW:-http://localhost:9091}"
          printf 'k6_suite_last_run_timestamp %s\n' "$(date +%s)" | \
            curl -s --data-binary @- "${ADDR}/metrics/job/k6/suite/${SUITE_NAME}" || true
