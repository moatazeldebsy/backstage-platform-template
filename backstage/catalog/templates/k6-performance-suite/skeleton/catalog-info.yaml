apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  title: ${{ values.name }} Performance Suite
  description: ${{ values.description }}
  annotations:
    github.com/project-slug: ${{ values.githubOrg }}/${{ values.name }}
    backstage.io/techdocs-ref: dir:.
  tags:
    - k6
    - performance
    - load-testing
    - qa
spec:
  type: performance-test-suite
  lifecycle: production
  owner: ${{ values.owner }}
  system: internal-developer-platform
