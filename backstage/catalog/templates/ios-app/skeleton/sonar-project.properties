sonar.projectKey=${{ values.githubOrg }}_${{ values.repoName }}
sonar.organization=${{ values.githubOrg }}
sonar.projectName=${{ values.name }}
sonar.projectVersion=1.0.0

sonar.sources=Sources
sonar.tests=Tests

sonar.swift.coverage.reportPaths=.build/coverage/lcov.info
sonar.swift.swiftlint.reportPaths=build/swiftlint.json

sonar.exclusions=\
  **/.build/**,\
  **/DerivedData/**,\
  **/Pods/**,\
  **/*.generated.swift
