apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: canary-deployment
  title: Enable Canary Deployments
  description: >
    Opts an existing service into Argo Rollouts canary deployments.
    Configures traffic splitting steps, auto-rollback on error-rate spike,
    and opens a PR updating the service's helm-values overlay.
  tags:
    - sre
    - progressive-delivery
    - canary
    - argo-rollouts
spec:
  owner: platform-team
  type: service

  parameters:
    - title: Target service
      required:
        - serviceName
        - environment
      properties:
        serviceName:
          title: Service name
          type: string
          description: Name of the service to opt into canary (must exist in services/)
          ui:autofocus: true
        environment:
          title: Environment
          type: string
          description: Which environment's values file to update
          default: aws
          enum:
            - aws
            - staging
            - prod
          enumNames:
            - Dev (helm-values-aws.yaml)
            - Staging (helm-values-staging.yaml)
            - Production (helm-values.yaml)

    - title: Canary traffic steps
      required:
        - initialWeight
        - step1PauseDuration
        - step2PauseDuration
      properties:
        initialWeight:
          title: Initial canary traffic weight (%)
          type: integer
          description: "% of traffic routed to canary pods in step 1. Recommended: 20"
          default: 20
          minimum: 5
          maximum: 50
        step1PauseDuration:
          title: Step 1 pause duration
          type: string
          description: "How long to observe at initial weight before analysis. E.g. 2m, 5m"
          default: "2m"
        step2PauseDuration:
          title: Step 2 pause duration (50% traffic)
          type: string
          description: "How long to observe at 50% traffic before full promotion. E.g. 5m, 10m"
          default: "5m"

    - title: Auto-rollback thresholds
      properties:
        errorRateThreshold:
          title: Max error rate (%)
          type: number
          description: "Auto-rollback if HTTP 5xx exceeds this threshold during canary steps"
          default: 1.0
        latencyThresholdMs:
          title: Max p99 latency (ms)
          type: integer
          description: "Auto-rollback if p99 latency exceeds this threshold during canary steps"
          default: 500

  steps:
    - id: fetch
      name: Generate values overlay patch
      action: fetch:template
      input:
        url: ./skeleton
        values:
          serviceName: ${{ parameters.serviceName }}
          environment: ${{ parameters.environment }}
          initialWeight: ${{ parameters.initialWeight }}
          step1PauseDuration: ${{ parameters.step1PauseDuration }}
          step2PauseDuration: ${{ parameters.step2PauseDuration }}

    - id: pr
      name: Open pull request
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=backstage-platform-template&owner=moatazeldebsy
        branchName: canary/${{ parameters.serviceName }}-${{ parameters.environment }}
        title: "feat(canary): enable Argo Rollouts for ${{ parameters.serviceName }} (${{ parameters.environment }})"
        description: |
          ## Enable Canary Deployments for `${{ parameters.serviceName }}`

          Generated by the **Enable Canary Deployments** Backstage template.

          ### Traffic strategy
          - Step 1: **${{ parameters.initialWeight }}%** canary traffic → pause ${{ parameters.step1PauseDuration }} → HTTP error rate analysis
          - Step 2: **50%** canary traffic → pause ${{ parameters.step2PauseDuration }} → HTTP error rate analysis
          - Step 3: **100%** (auto-promote if both analysis steps pass)

          ### Auto-rollback conditions
          - HTTP 5xx > ${{ parameters.errorRateThreshold }}% during analysis → automatic rollback
          - p99 latency > ${{ parameters.latencyThresholdMs }}ms during analysis → automatic rollback

          ### Prerequisites
          Ensure Argo Rollouts controller is running:
          ```bash
          kubectl get pods -n argo-rollouts
          ```

          ### After merge
          ArgoCD will sync the updated values file. The next image tag push will trigger
          a `Rollout` instead of a `Deployment`. Monitor progress:
          ```bash
          kubectl argo rollouts get rollout ${{ parameters.serviceName }} -n services-dev --watch
          ```
        targetBranchName: main

  output:
    links:
      - title: Pull Request
        url: ${{ steps.pr.output.remoteUrl }}
      - title: Argo Rollouts docs
        url: https://argoproj.github.io/argo-rollouts/features/canary/
