# Progressive delivery overlay for ${{ values.serviceName }} (${{ values.environment }}).
# Generated by the 'Enable Progressive Delivery' Backstage template.
#
# This is a complete values file, not a patch. The ArgoCD ApplicationSets list it
# as a second, optional valueFile alongside helm-values-${{ values.environment }}.yaml
# (with ignoreMissingValueFiles: true), so merging this PR is all it takes —
# nothing has to be hand-merged into the existing overlay.
rollout:
  enabled: true
  strategy: ${{ values.strategy }}
{%- if values.strategy == 'canary' %}
  canary:
    initialWeight: ${{ values.initialWeight }}
    step1PauseDuration: "${{ values.step1PauseDuration }}"
    step2PauseDuration: "${{ values.step2PauseDuration }}"
{%- else %}
  blueGreen:
    # false keeps a human in the loop: the new version comes up fully and is
    # reachable on the -preview Service before any live traffic moves.
    autoPromotionEnabled: ${{ values.autoPromotionEnabled }}
    scaleDownDelaySeconds: 30
    prePromotionAnalysis: true
{%- endif %}
  analysis:
    enabled: true
    # Fractions, not percentages — the form takes a percent and converts here, so
    # the chart and the ClusterAnalysisTemplate never have to guess which unit
    # they were handed.
    errorRateThreshold: "${{ (values.errorRateThreshold / 100) }}"
    latencyThresholdSeconds: "${{ (values.latencyThresholdMs / 1000) }}"

# HPA remains active and targets the Rollout resource automatically.
# PodDisruptionBudget remains active (minAvailable: 1).
