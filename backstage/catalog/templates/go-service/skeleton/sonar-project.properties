sonar.projectKey=${{ values.githubOrg }}_${{ values.name }}
sonar.organization=${{ values.githubOrg }}
sonar.projectName=${{ values.name }}

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go,**/vendor/**

# Coverage report from go test -coverprofile=coverage.out
sonar.go.coverage.reportPaths=coverage.out
