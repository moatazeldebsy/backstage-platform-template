name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

env:
  SERVICE_NAME: ${{ values.name }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  COVERAGE_MIN: '70'
  # Optional security tooling — empty values cause the related CI steps to skip.
  SONAR_TOKEN: ${{ '${{ secrets.SONAR_TOKEN }}' }}
  SNYK_TOKEN: ${{ '${{ secrets.SNYK_TOKEN }}' }}

jobs:
  quality:
    name: Lint + Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Newest 1.26 patch, not go.mod's minimum: a pinned toolchain fails
          # govulncheck as soon as the next stdlib security fix ships (every
          # fresh repo did). go.mod says `go 1.26` rather than a patch because
          # golangci-lint refuses a module targeting a newer Go than the one it
          # was built with. Move off a minor once Go stops patching it (two
          # releases back) — its stdlib CVEs then have no fix to resolve to.
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: govulncheck (Go module vulnerabilities)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # SonarCloud + Snyk run only when tokens are configured, and are non-blocking
      # (continue-on-error) so a service builds green before the SonarCloud/Snyk org +
      # project exist. See docs/security-scanning.md for one-time setup.
      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ '${{ secrets.GITHUB_TOKEN }}' }}
          SONAR_TOKEN: ${{ '${{ secrets.SONAR_TOKEN }}' }}

      - name: Snyk dependency scan
        if: env.SNYK_TOKEN != ''
        continue-on-error: true
        uses: snyk/actions/golang@master
        env:
          SNYK_TOKEN: ${{ '${{ secrets.SNYK_TOKEN }}' }}
        with:
          args: --severity-threshold=high

      - name: Snyk monitor (main only)
        if: env.SNYK_TOKEN != '' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        uses: snyk/actions/golang@master
        env:
          SNYK_TOKEN: ${{ '${{ secrets.SNYK_TOKEN }}' }}
        with:
          command: monitor

      - name: Trivy filesystem scan (deps + secrets)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scanners: 'vuln,secret,misconfig'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

  test:
    name: Test + Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Newest 1.26 patch, not go.mod's minimum: a pinned toolchain fails
          # govulncheck as soon as the next stdlib security fix ships (every
          # fresh repo did). go.mod says `go 1.26` rather than a patch because
          # golangci-lint refuses a module targeting a newer Go than the one it
          # was built with. Move off a minor once Go stops patching it (two
          # releases back) — its stdlib CVEs then have no fix to resolve to.
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Download dependencies
        run: |
          go mod download
          go mod verify

      - name: Run tests with coverage
        run: go test ./src/... -coverprofile=coverage.out -covermode=atomic -v 2>&1 | tee test.out

      - name: Enforce coverage threshold (${{ '${{ env.COVERAGE_MIN }}' }}%)
        run: |
          COV=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Coverage: $COV%"
          awk -v cov="$COV" -v min="${{ '${{ env.COVERAGE_MIN }}' }}" \
            'BEGIN { if (cov+0 < min+0) { print "FAIL: coverage "cov"% < "min"%"; exit 1 } }'

      - name: Generate JUnit report
        if: always()
        run: |
          go install github.com/jstemmer/go-junit-report/v2@latest
          go-junit-report -in test.out -out junit.xml || true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage.out
            junit.xml
          retention-days: 7

      - name: Build Docker image (smoke check)
        run: docker build -t ${{ '${{ env.SERVICE_NAME }}' }}:ci .

      - name: Smoke-test container
        run: |
          docker run -d --name svc -p ${{ values.port }}:${{ values.port }} \
            -e PORT=${{ values.port }} \
            ${{ '${{ env.SERVICE_NAME }}' }}:ci
          sleep 3
          curl -sf --retry 5 --retry-delay 2 --retry-connrefused \
            http://localhost:${{ values.port }}/healthz
          curl -sf --retry 5 --retry-delay 2 --retry-connrefused \
            http://localhost:${{ values.port }}/ready
          docker stop svc && docker rm svc

  publish:
    needs: [test, quality]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write  # OIDC, to assume AWS_ROLE_ARN for the ECR push
    env:
      AWS_ROLE_ARN: ${{ '${{ secrets.AWS_ROLE_ARN }}' }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ '${{ github.actor }}' }}
          password: ${{ '${{ secrets.GITHUB_TOKEN }}' }}

      - name: Build and push image
        id: build
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE=ghcr.io/${{ values.githubOrg }}/${{ values.repoName }}
          docker build -t ${IMAGE}:${SHORT_SHA} -t ${IMAGE}:latest .
          docker push ${IMAGE}:${SHORT_SHA}
          docker push ${IMAGE}:latest
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"

      # AWS: ArgoCD deploys this service from its ECR repository (the image the
      # platform repo's services/${{ values.name }}/helm-values-aws.yaml names), so the
      # image goes there too. A repo scaffolded for AWS has AWS_ROLE_ARN: a role
      # only this repo's main branch can assume, allowed to push only to that
      # repository. Without it (a local scaffold) these steps skip.
      - name: Configure AWS credentials (ECR push)
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ '${{ env.AWS_ROLE_ARN }}' }}
          aws-region: ${{ values.awsRegion }}

      - name: Log in to ECR
        id: ecr
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        if: env.AWS_ROLE_ARN != ''
        run: |
          IMAGE=ghcr.io/${{ values.githubOrg }}/${{ values.repoName }}
          ECR_IMAGE=${{ '${{ steps.ecr.outputs.registry }}' }}/${{ values.ecrRepository }}
          for tag in "${SHORT_SHA}" latest; do
            docker tag "${IMAGE}:${tag}" "${ECR_IMAGE}:${tag}"
            docker push "${ECR_IMAGE}:${tag}"
          done

      - name: Update image tag in platform repo
        env:
          GH_TOKEN: ${{ '${{ secrets.GH_PAT }}' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT not set — platform repo image tag update skipped"
            exit 0
          fi
          git config --global user.email "ci@idp.platform"
          git config --global user.name "IDP CI Bot"
          PLATFORM_DIR=$(mktemp -d)
          git clone https://x-access-token:${GH_TOKEN}@github.com/${{ values.githubOrg }}/backstage-platform-template.git "$PLATFORM_DIR"
          cd "$PLATFORM_DIR"
          VALUES_FILE="services/${{ values.name }}/helm-values-aws.yaml"
          if [ -f "${VALUES_FILE}" ]; then
            sed -i "s|^  tag: .*|  tag: \"${SHORT_SHA}\"|" "${VALUES_FILE}"
            git add "${VALUES_FILE}"
            git diff --cached --quiet || git commit -m "chore: bump ${{ values.name }} image to ${SHORT_SHA} [skip ci]"
            git push
          else
            echo "Values file not found at ${VALUES_FILE} — merge the Platform GitOps PR first"
          fi
