apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: decommission-service
  annotations:
    backstage.io/techdocs-ref: dir:.
  title: Decommission Service
  description: |
    Remove a service from the IDP. This template allows GitHub organization admins to:
    - Archive a service repo on GitHub (freezes it as read-only, reversible)
    - Permanently delete a service repo on GitHub (irreversible)
    - Automatically unregister the service from the Backstage catalog
    - Open a PR removing services/<name>/ from the platform repo, so ArgoCD stops deploying it

    **Warning**: Deletion is permanent and cannot be undone. Archive if you want to preserve history.
  tags:
    - admin
    - decommission
    - dangerous
    - v1
    - blessed
spec:
  owner: platform-team
  type: service

  parameters:
    - title: Select Service to Decommission
      required:
        - entityRef
      properties:
        entityRef:
          title: Service
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              - kind: Component

    - title: Choose Action
      required:
        - action
      properties:
        action:
          title: Decommission Action
          type: string
          enum: [archive, delete]
          enumNames:
            - 'Archive — freeze repo read-only on GitHub (reversible)'
            - 'Delete — permanently remove repo from GitHub (IRREVERSIBLE)'
          default: archive
          description: |
            **Archive** (recommended): Marks the repo as read-only on GitHub. Can be un-archived later if needed.

            **Delete** (dangerous): Permanently removes the repo from GitHub and cannot be recovered.

    - title: Confirm Decommissioning
      description: |
        **WARNING**: This action cannot be fully undone for "Delete".

        To proceed, type the exact service name below.
      required:
        - confirmationText
      properties:
        confirmationText:
          title: Confirm by typing the service name
          type: string
          ui:autofocus: true

  steps:
    - id: decommission
      name: Decommission Service
      action: idp:decommission-service
      input:
        entityRef: ${{ parameters.entityRef }}
        action: ${{ parameters.action }}
        confirmationText: ${{ parameters.confirmationText }}
        platformRepo: moatazeldebsy/backstage-platform-template

    # The idp-services ApplicationSet deploys every services/<name>/ directory
    # in the platform repo, independently of the service's own GitHub repo or
    # catalog entity. Skipping this leaves ArgoCD running a service Backstage no
    # longer knows about. Merging the PR drops the generated Application
    # (prune: true) and its workloads.
    - id: remove-gitops
      name: Open PR removing services/${{ parameters.confirmationText }}/
      if: ${{ steps.decommission.output.gitopsFiles.length > 0 }}
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=backstage-platform-template&owner=moatazeldebsy
        title: "chore: decommission ${{ parameters.confirmationText }}"
        branchName: chore/decommission-${{ parameters.confirmationText }}
        description: |
          Removes `services/${{ parameters.confirmationText }}/` from the platform repo.

          The service was decommissioned via the Backstage `decommission-service`
          template (${{ parameters.action }}). Once merged, the `idp-services`
          ApplicationSet prunes its ArgoCD Application and workloads.
        filesToDelete: ${{ steps.decommission.output.gitopsFiles }}

  output:
    links:
      - title: GitOps removal PR
        if: ${{ steps['remove-gitops'].output.remoteUrl }}
        url: ${{ steps['remove-gitops'].output.remoteUrl }}
    text:
      - title: Decommission Result
        content: ${{ steps.decommission.output.summary }}
