apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: mcp-server
  title: MCP Server (kmcp)
  description: Scaffold a Model Context Protocol server managed by the kmcp Kubernetes controller. Defines an MCPServer CRD — the controller auto-deploys it as a pod in the kagent namespace.
  tags:
    - mcp
    - ai
    - kagent
    - kmcp
    - typescript
    - local
    - aws
    - v1
    - advanced
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  owner: platform-team
  type: template

  parameters:
    - title: Server Details
      required: [name, description, owner]
      properties:
        name:
          title: Server Name
          type: string
          description: Lowercase alphanumeric with hyphens (e.g. my-mcp-server)
          pattern: '^[a-z][a-z0-9-]{2,40}$'
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: What tools does this MCP server expose?
          maxLength: 200
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group

    - title: Server Config
      properties:
        port:
          title: Port
          type: integer
          default: 3001
          description: Port the MCP server listens on
        language:
          title: Language
          type: string
          enum: [typescript, python]
          enumNames: ['TypeScript', 'Python']
          default: typescript
        enableAuth:
          title: Require API key authentication
          type: boolean
          default: false
        pagerdutyServiceId:
          title: PagerDuty Service ID
          type: string
          description: "Optional. Find this in PagerDuty under Services → your service → ID. Example: P1ABC23"
          ui:help: "Leave blank if not using PagerDuty."

    - title: Repository
      required: [repoUrl]
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - moatazeldebsy

  steps:
    # Resolve the platform URLs for THIS environment. The skeleton used to
    # hardcode *.idp.local, so every service scaffolded on AWS got catalog
    # links pointing at DNS that only resolves on a laptop.
    - id: platform-urls
      name: Resolve Platform URLs
      action: idp:platform-urls

    - id: fetch
      name: Generate MCP server scaffold
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          # `| default(...)` mirrors the parameter's own schema default. RJSF only
          # submits a page's fields once that page has been visited, so clicking
          # straight past an all-optional step sends nothing for it — the scaffolder
          # then renders `${{ values.port }}` as an empty string. That produced a bare
          # `EXPOSE` in the generated Dockerfile and every scaffolded repo's first CI
          # run died with "EXPOSE requires at least one argument". Observed 2026-08-17.
          port: ${{ parameters.port | default(3001) }}
          language: ${{ parameters.language }}
          enableAuth: ${{ parameters.enableAuth }}
          pagerdutyServiceId: ${{ parameters.pagerdutyServiceId }}
          repoName: ${{ parameters.repoUrl | parseRepoUrl | pick('repo') }}
          kagentUrl: ${{ steps["platform-urls"].output.kagent }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: MCP Server — ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        gitCommitMessage: "chore: scaffold MCP server via IDP"
        topics:
          - mcp
          - kagent
          - idp

    - id: secrets
      name: Set CI secrets
      action: idp:repo:set-secrets
      input:
        repoUrl: ${{ parameters.repoUrl }}
        secrets: {}

    - id: deploy
      name: Deploy MCPServer to Kubernetes
      action: idp:deploy-mcp-server
      input:
        name: ${{ parameters.name }}
        port: ${{ parameters.port | default(3001) }}
        repoName: ${{ parameters.repoUrl | parseRepoUrl | pick('repo') }}
        repoOwner: ${{ parameters.repoUrl | parseRepoUrl | pick('owner') }}
        # Deploy the image the scaffold commit will produce, rather than the
        # mutable :latest. The action shortens this to 8 chars to match the
        # tag the generated CI pushes (TAG="${GITHUB_SHA::8}"), and falls back
        # to :latest if publish did not report a commit.
        commitSha: ${{ steps.publish.output.commitHash }}

    - id: catalog
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Catalog Entity
        icon: catalog
        entityRef: ${{ steps.catalog.output.entityRef }}
      - title: KAgent UI
        url: ${{ steps.deploy.output.agentUrl }}
        icon: dashboard
