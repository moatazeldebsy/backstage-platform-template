apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ values.description }}
  annotations:
    backstage.io/kubernetes-id: ${{ values.name }}
    backstage.io/techdocs-ref: dir:.
    # Drives the Langfuse entity tab. These components also match the tab
    # filter on spec.type, but the annotation is what lets it filter traces
    # to this service rather than showing demo data.
    langfuse.com/service-name: ${{ values.name }}
    pagerduty.com/service-id: "${{ values.pagerdutyServiceId }}"
  tags:
    - mcp
    - ai
    - kagent
    - ${{ values.language }}
  links:
    - url: ${{ values.kagentUrl }}
      title: KAgent UI
spec:
  type: mcp-server
  lifecycle: experimental
  owner: ${{ values.owner }}
  system: idp-platform
  dependsOn:
    - resource:kagent
