apiVersion: idp.platform/v1alpha1
kind: KafkaTopic
metadata:
  name: ${{ values.topicName }}
  namespace: services-dev
  labels:
    idp.platform/owner-service: ${{ values.ownerService }}
spec:
  parameters:
    topicName: ${{ values.topicName }}
    clusterArn: ${{ values.clusterArn }}
    owner: ${{ values.owner }}
    partitions: ${{ values.partitions }}
    replicationFactor: ${{ values.replicationFactor }}
    retentionHours: ${{ values.retentionHours }}
    cleanupPolicy: ${{ values.cleanupPolicy }}
    costCenter: ${{ values.costCenter }}
