apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: ${{ values.topicName }}
  description: Kafka topic ${{ values.topicName }} (partitions=${{ values.partitions }}, retention=${{ values.retentionHours }}h) — managed by Crossplane
  annotations:
    backstage.io/managed-by-location: url:https://github.com/YOUR_GITHUB_ORG/backstage-platform-template/blob/main/services/${{ values.ownerService }}/claims/${{ values.topicName }}.yaml
  labels:
    provisioner: crossplane
  tags:
    - kafka
    - msk
    - streaming
    - aws
    - crossplane
spec:
  type: topic
  owner: ${{ values.owner }}
  system: internal-developer-platform
  dependencyOf:
    - component:${{ values.ownerService }}
