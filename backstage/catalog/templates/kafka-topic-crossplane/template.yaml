apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: kafka-topic-crossplane
  title: Kafka Topic (Crossplane)
  description: |
    Create a Kafka topic on the existing MSK cluster via a Crossplane Claim.
    The cluster itself is Terraform-managed; topic lifecycle (partitions,
    retention, cleanup policy) lives in Git per topic.
  tags:
    - kafka
    - msk
    - streaming
    - aws
    - crossplane
spec:
  owner: platform-team
  type: resource

  parameters:
    - title: Configure
      required: [topicName, clusterArn, ownerService, owner]
      properties:
        topicName:
          title: Topic name
          type: string
          pattern: '^[a-zA-Z0-9._-]{1,249}$'
          ui:autofocus: true
        ownerService:
          title: Owning service
          type: string
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
        clusterArn:
          title: MSK cluster ARN
          type: string
          description: ARN of the target MSK cluster (provisioned via Terraform).
          pattern: '^arn:aws:kafka:'
          ui:help: 'Find it in the AWS Console → Amazon MSK → Clusters, or run: aws kafka list-clusters --query "ClusterInfoList[*].ClusterArn" --output text'
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        partitions:
          title: Partitions
          type: integer
          default: 6
          minimum: 1
        replicationFactor:
          title: Replication factor
          type: integer
          default: 3
          minimum: 1
        retentionHours:
          title: Retention (hours)
          type: integer
          default: 168
        cleanupPolicy:
          title: Cleanup policy
          type: string
          default: delete
          enum: [delete, compact]
        costCenter:
          title: Cost center
          type: string
          default: engineering

    - title: Review
      properties:
        repoUrl:
          title: Platform repo
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts: [github.com]
            allowedOwners: [YOUR_GITHUB_ORG]
            allowedRepos: [backstage-platform-template]

  steps:
    - id: fetch-template
      name: Generate Crossplane Claim
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: services/${{ parameters.ownerService }}/claims
        values:
          topicName: ${{ parameters.topicName }}
          ownerService: ${{ parameters.ownerService }}
          clusterArn: ${{ parameters.clusterArn }}
          owner: ${{ parameters.owner }}
          partitions: ${{ parameters.partitions }}
          replicationFactor: ${{ parameters.replicationFactor }}
          retentionHours: ${{ parameters.retentionHours }}
          cleanupPolicy: ${{ parameters.cleanupPolicy }}
          costCenter: ${{ parameters.costCenter }}

    - id: open-pr
      name: Open PR to register Crossplane Claim
      action: publish:github:pull-request
      continueOnError: true
      input:
        repoUrl: ${{ parameters.repoUrl }}
        title: "feat(infra): Kafka topic ${{ parameters.topicName }} via Crossplane"
        branchName: crossplane/kafka/${{ parameters.topicName }}
        description: |
          Adds a `KafkaTopic` Crossplane Claim at
          `services/${{ parameters.ownerService }}/claims/${{ parameters.topicName }}.yaml`.

          | Parameter | Value |
          |---|---|
          | Topic | `${{ parameters.topicName }}` |
          | Cluster ARN | `${{ parameters.clusterArn }}` |
          | Partitions | `${{ parameters.partitions }}` |
          | Replication | `${{ parameters.replicationFactor }}` |
          | Retention | `${{ parameters.retentionHours }} h` |
          | Cleanup | `${{ parameters.cleanupPolicy }}` |

          **After merge:** ArgoCD syncs, Crossplane creates the topic (~15 s). Check status:

          ```bash
          kubectl get kafkatopic ${{ parameters.topicName }} -n services-dev -w
          ```
        targetBranchName: main

  output:
    links:
      - title: Pull Request
        url: ${{ steps['open-pr'].output.remoteUrl }}
    text:
      - title: Next steps
        content: |
          1. Merge the PR. ArgoCD syncs the Claim within ~1 min.
          2. Kafka topic provisions in ~15 s. Watch with `kubectl get kafkatopic ${{ parameters.topicName }} -n services-dev -w`.
          3. Use the MSK bootstrap brokers from `aws kafka get-bootstrap-brokers --cluster-arn ${{ parameters.clusterArn }}` in your service config.
