replicaCount: 1

image:
  repository: ghcr.io/${{ values.githubOrg }}/${{ values.name }}
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: ${{ values.port }}

ingress:
  enabled: true
  className: "alb"
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "${{ values.port }}"
  prometheus.io/path: "/metrics"

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

env:
  - name: LOG_LEVEL
    value: info
  - name: ENVIRONMENT
    value: production
  - name: LLM_PROVIDER
    value: "${{ values.llmProvider }}"
  - name: LLM_MODEL
    value: "${{ values.llmModel }}"
  - name: MLFLOW_TRACKING_URI
    value: "http://mlflow.ml-platform.svc.cluster.local:5000"
  - name: MLFLOW_EXPERIMENT
    value: "${{ values.name }}"
  # Set OPENAI_API_KEY via ExternalSecret if llmProvider=openai
  # - name: OPENAI_API_KEY
  #   valueFrom:
  #     secretKeyRef:
  #       name: ${{ values.name }}-secrets
  #       key: OPENAI_API_KEY

labels:
  backstage.io/kubernetes-id: ${{ values.name }}
  cost-center: ${{ values.costCenter }}
  app-type: ai-agent
