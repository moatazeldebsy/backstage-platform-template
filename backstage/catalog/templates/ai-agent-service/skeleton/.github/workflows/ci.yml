name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ '${{ github.repository }}' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Run tests
        run: pytest tests/ -v --tb=short

  docker:
    name: Build & Smoke-test Docker image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.source=${{ '${{ github.server_url }}' }}/${{ '${{ github.repository }}' }}" \
            -t $IMAGE_NAME:${{ '${{ github.sha }}' }} \
            -t $IMAGE_NAME:latest \
            .

      - name: Smoke-test — healthz
        run: |
          docker run -d --name svc \
            -e LLM_PROVIDER=stub \
            -e MLFLOW_TRACKING_URI=file:///tmp/mlruns \
            -p ${{ values.port }}:${{ values.port }} \
            $IMAGE_NAME:${{ '${{ github.sha }}' }}
          sleep 5
          curl --retry 10 --retry-delay 2 --retry-connrefused --fail \
            http://localhost:${{ values.port }}/healthz
          curl --retry 5 --retry-delay 2 --retry-connrefused --fail \
            http://localhost:${{ values.port }}/ready
          docker logs svc
          docker rm -f svc

      - name: Push to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ '${{ secrets.GITHUB_TOKEN }}' }}" | docker login ghcr.io -u ${{ '${{ github.actor }}' }} --password-stdin
          docker push $IMAGE_NAME:${{ '${{ github.sha }}' }}
          docker push $IMAGE_NAME:latest
