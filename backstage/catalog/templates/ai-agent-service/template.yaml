apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: ai-agent-service
  title: AI Agent Service
  description: >
    Scaffold a production-ready Agentic AI service using LangGraph + FastAPI.
    Includes /invoke, /healthz, /ready, /metrics endpoints; MLflow trace logging;
    Prometheus metrics; and full GitOps deployment via Helm.
  tags:
    - python
    - ai
    - agent
    - langgraph
    - fastapi
    - golden-path
spec:
  owner: ml-team
  type: service

  parameters:
    - title: Service Details
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: Service Name
          type: string
          description: Unique name for the agent service (lowercase, hyphens only)
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: What does this agent do?
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group

    - title: Agent Configuration
      properties:
        llmProvider:
          title: LLM Provider
          type: string
          description: Default LLM backend — can be overridden at runtime via LLM_PROVIDER env var
          default: ollama
          enum:
            - ollama
            - openai
          enumNames:
            - Ollama (local, no API key required)
            - OpenAI (requires OPENAI_API_KEY secret)
        llmModel:
          title: LLM Model
          type: string
          description: >
            Model name. For Ollama: llama3, mistral, etc.
            For OpenAI: gpt-4o-mini, gpt-4o, etc.
          default: llama3
        tools:
          title: Built-in Tools
          type: array
          description: Tool stubs pre-wired into the agent — extend them in tools.py
          items:
            type: string
            enum:
              - web_search
              - k8s_lookup
              - mlflow_query
              - calculator
          uniqueItems: true
          default:
            - web_search
            - calculator
          ui:widget: checkboxes
        port:
          title: Container Port
          type: integer
          default: 8080
        costCenter:
          title: Cost Center
          type: string
          description: "Team cost center code (e.g. eng-platform, eng-ai)"
          default: eng-ai

    - title: Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: GitHub Repository
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - YOUR_GITHUB_ORG

  steps:
    - id: fetch-template
      name: Fetch Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          llmProvider: ${{ parameters.llmProvider }}
          llmModel: ${{ parameters.llmModel }}
          tools: ${{ parameters.tools }}
          port: ${{ parameters.port }}
          costCenter: ${{ parameters.costCenter }}
          githubOrg: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          repoName: ${{ (parameters.repoUrl | parseRepoUrl).repo }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        gitCommitMessage: "chore: scaffold AI agent service via IDP"
        topics:
          - python
          - ai-agent
          - langgraph
          - idp-service

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
      - title: Grafana — Agent Dashboard
        url: http://grafana.idp.local/d/idp-ai-agent
        icon: dashboard
      - title: MLflow Traces
        url: http://mlflow.idp.local
        icon: dashboard
