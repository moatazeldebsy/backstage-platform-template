apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: add-unit-tests
  title: Add Unit Tests to Existing Service
  description: >
    Injects unit test scaffolding (test stubs + coverage CI job) into an existing service repo
    by opening a PR. Supports Node.js, Python, and Go. No new repo is created.
  tags:
    - testing
    - unit-tests
    - coverage
    - self-service
    - addon
  links:
    - title: Testing Golden Path Docs
      url: https://github.com/YOUR_GITHUB_ORG/idp-mvp/blob/main/docs/testing.md
      icon: docs
spec:
  owner: qa-team
  type: service

  parameters:
    - title: Which service should get unit tests?
      required:
        - serviceEntity
        - language
        - confirmNoTests
      properties:
        serviceEntity:
          title: Service
          type: string
          description: Pick a registered service from the catalog
          ui:field: EntityPicker
          ui:autofocus: true
          ui:options:
            catalogFilter:
              kind: Component
            defaultKind: Component
            defaultNamespace: default
        githubOrg:
          title: GitHub organisation
          type: string
          default: YOUR_GITHUB_ORG
          description: GitHub org that owns the service repo
        language:
          title: Service language
          type: string
          description: Runtime used by the service — determines which test framework and stubs are generated
          enum:
            - nodejs
            - python
            - go
          enumNames:
            - Node.js (Jest)
            - Python (pytest)
            - Go (go test)
        confirmNoTests:
          title: >
            I confirm this repo does NOT already contain a tests/ folder,
            *.test.* / *.spec.* files, or .github/workflows/idp-unit-tests.yml.
            Running this template on a repo with existing test setup will overwrite those files.
          type: boolean
          const: true
          default: false
          ui:widget: checkbox

    - title: Coverage settings
      properties:
        coverageThreshold:
          title: Coverage threshold (%)
          type: integer
          description: CI fails if line coverage drops below this percentage (Python only)
          default: 70
          minimum: 0
          maximum: 100

  steps:
    - id: fetch-skeleton
      name: Render test stubs and CI workflow
      action: fetch:template
      input:
        url: ./skeleton-${{ parameters.language }}
        values:
          repoName: ${{ (parameters.serviceEntity | parseEntityRef).name }}
          language: ${{ parameters.language }}
          coverageThreshold: ${{ parameters.coverageThreshold }}

    - id: pr
      name: Open pull request in service repo
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=${{ (parameters.serviceEntity | parseEntityRef).name }}&owner=${{ parameters.githubOrg }}
        branchName: idp/add-unit-tests
        title: "test: add unit test scaffolding [IDP golden path]"
        description: |
          ## Add Unit Tests — IDP Golden Path

          This PR was generated by the **Add Unit Tests** Backstage template.

          ### What's included

          - `.github/workflows/idp-unit-tests.yml` — dedicated CI job that runs tests and uploads a coverage report on every push/PR
          - Test stub file(s) in `tests/` — replace the placeholder with real tests

          ### Language: `${{ parameters.language }}`

          | Framework | Command |
          |-----------|---------|
          | Node.js | `npm test -- --passWithNoTests --coverage` |
          | Python | `pytest tests/ --cov=. --cov-fail-under=${{ parameters.coverageThreshold }}` |
          | Go | `go test ./... -coverprofile=coverage.out` |

          ### Next steps after merging

          1. Replace the placeholder test(s) with real assertions.
          2. Ensure `${{ parameters.coverageThreshold }}%` line coverage is maintained (Python).
          3. Optionally add `SONAR_TOKEN` as a GitHub secret to enable SonarCloud analysis.
        commitMessage: "test: add unit test scaffolding (IDP golden path)"

  output:
    links:
      - title: Pull Request
        url: ${{ steps.pr.output.remoteUrl }}
    text:
      - title: Next steps
        content: |
          PR opened in **${{ parameters.githubOrg }}/${{ (parameters.serviceEntity | parseEntityRef).name }}**.

          1. Review and merge the PR.
          2. Replace placeholder tests with real assertions.
          3. The `idp-unit-tests` CI job runs on every push and PR automatically.
