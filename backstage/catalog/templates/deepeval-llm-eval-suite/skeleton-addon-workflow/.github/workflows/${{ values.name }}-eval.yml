name: LLM Eval (${{ values.name }})

# Add-to-existing mode: the suite lives in eval-suites/${{ values.name }}/, but
# GitHub only runs workflows from the repository root — the copy that used to
# be written inside the suite directory never ran.
on:
  push:
    branches: [main]
    paths:
      - 'eval-suites/${{ values.name }}/**'
      - '.github/workflows/${{ values.name }}-eval.yml'
  pull_request:
    branches: [main]
    paths:
      - 'eval-suites/${{ values.name }}/**'
      - '.github/workflows/${{ values.name }}-eval.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: ${{ '${{ github.workflow }}-${{ github.ref }}' }}
  cancel-in-progress: true

jobs:
  deepeval:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: eval-suites/${{ values.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: eval-suites/${{ values.name }}/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run DeepEval suite
        env:
          ANTHROPIC_API_KEY: ${{ '${{ secrets.ANTHROPIC_API_KEY }}' }}
          DEEPEVAL_TELEMETRY_OPT_OUT: 'YES'
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::notice::ANTHROPIC_API_KEY not configured — skipping LLM eval (first-run safe)."
            exit 0
          fi
          mkdir -p results
          deepeval test run tests/eval_agent.py \
            --exit-on-first-failure \
            --junitxml=results/report.xml \
            --html=results/report.html \
            --self-contained-html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepeval-report-${{ values.name }}
          path: eval-suites/${{ values.name }}/results/
          if-no-files-found: ignore
          retention-days: 30
