apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ values.description }}
  annotations:
    github.com/project-slug: ${{ values.githubOrg }}/${{ values.repoName }}
spec:
  type: test-suite
  lifecycle: experimental
  owner: ${{ values.owner }}
  {%- if values.targetAgent %}
  dependsOn:
    - ${{ values.targetAgent }}
  {%- endif %}
