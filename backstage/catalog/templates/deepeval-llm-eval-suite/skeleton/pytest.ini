[pytest]
# Eval cases are eval_*.py, not test_*.py. Added to an existing service repo
# (eval-suites/<name>/), this suite sits inside that service's own pytest run,
# which collects test_*.py from the whole repo: it tried to run these LLM evals
# (they need deepeval and an API key) and failed the service's test job.
python_files = eval_*.py
testpaths = tests
