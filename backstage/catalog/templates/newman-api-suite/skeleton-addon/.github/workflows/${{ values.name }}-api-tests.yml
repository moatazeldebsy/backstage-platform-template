name: ${{ values.name }} Newman API Tests

on:
  push:
    branches: [main]
    paths:
      - 'test-suites/${{ values.name }}/**'
  pull_request:
    branches: [main]
    paths:
      - 'test-suites/${{ values.name }}/**'

env:
  BASE_URL: '${{ values.baseUrl }}'

jobs:
  api-tests:
    name: API Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test-suites/${{ values.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Pre-flight — skip if BASE_URL is not reachable
        id: preflight
        working-directory: .
        run: |
          if [ -z "${BASE_URL}" ] || [ "${BASE_URL}" = "http://localhost:3000" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::BASE_URL not configured — first-run skip."
            exit 0
          fi
          if ! curl -fsS --max-time 5 "${BASE_URL%/}/" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::BASE_URL (${BASE_URL}) not reachable from runner — skipping."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.skip != 'true'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: test-suites/${{ values.name }}/package-lock.json

      - name: Install dependencies
        if: steps.preflight.outputs.skip != 'true'
        run: npm ci

      - name: Run Newman collection
        if: steps.preflight.outputs.skip != 'true'
        run: npm test

      - name: Upload JUnit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-results-${{ values.name }}
          path: test-suites/${{ values.name }}/reports/results.xml
          retention-days: 30

      - name: Publish Test Results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: test-suites/${{ values.name }}/reports/results.xml
          check_name: Newman API Tests (${{ values.name }})
