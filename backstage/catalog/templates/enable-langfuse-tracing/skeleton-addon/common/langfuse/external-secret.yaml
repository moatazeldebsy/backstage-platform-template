# AWS-ONLY alternative to the label mechanism.
#
# `./scripts/bootstrap-ai.sh --langfuse-keys-only` pushes the Langfuse project
# keys into labelled namespaces. If you would rather have them pulled through
# GitOps, commit this manifest instead and let External Secrets reconcile it.
# Both produce the same secret/langfuse-otel, so use one or the other — not both.
#
# This does NOT work locally: External Secrets is installed by scripts/bootstrap.sh
# (AWS) and is not part of the Kind bootstrap. On a local cluster, use the label.
#
# The source secret is mirrored to Secrets Manager by bootstrap-ai.sh whenever
# Langfuse is deployed with --aws.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: langfuse-otel
  namespace: ${{ values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: langfuse-otel
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: idp-mvp/langfuse/project-keys
