apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: MLflow experiment — ${{ values.experimentName }}
  annotations:
    github.com/project-slug: ${{ values.githubOrg }}/${{ values.repoName }}
    backstage.io/techdocs-ref: dir:.
    backstage.io/kubernetes-id: ${{ values.name }}
    backstage.io/kubernetes-namespace: ml-platform
    idp.io/quality-gates: "coverage,static-analysis,vuln-scan"
    sonarcloud.io/project-key: "${{ values.githubOrg }}_${{ values.repoName }}"
    sonarcloud.io/organization: "${{ values.githubOrg }}"
    snyk.io/org-slug: "${{ values.githubOrg }}"
    jira/project-key: "${{ values.jiraProjectKey }}"
  tags:
    - ml
    - mlflow
    - ${{ values.framework }}
    - python
  links:
    - url: ${{ values.mlflowUrl }}
      title: MLflow UI
spec:
  type: ml-experiment
  lifecycle: experimental
  owner: ${{ values.owner }}
  system: idp-platform
  dependsOn:
    - resource:mlflow
