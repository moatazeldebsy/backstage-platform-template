apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: mlflow-experiment
  title: ML Experiment (MLflow)
  description: Scaffold a Python ML experiment with MLflow tracking, model registry, and CI/CD. Deploys a training job that logs metrics and registers the model in MLflow.
  tags:
    - ml
    - mlflow
    - python
    - training
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  owner: platform-team
  type: template

  parameters:
    - title: Experiment Details
      required: [name, experimentName, owner]
      properties:
        name:
          title: Repository Name
          type: string
          description: Lowercase alphanumeric with hyphens (e.g. churn-prediction)
          pattern: '^[a-z][a-z0-9-]{2,40}$'
          ui:autofocus: true
        experimentName:
          title: MLflow Experiment Name
          type: string
          description: Name shown in MLflow UI (can include spaces)
          default: My Experiment
        owner:
          title: Owner
          type: string
          description: Team owning this experiment
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group

    - title: ML Framework
      properties:
        framework:
          title: ML Framework
          type: string
          enum: [sklearn, pytorch, xgboost, tensorflow]
          enumNames:
            - 'scikit-learn'
            - 'PyTorch'
            - 'XGBoost'
            - 'TensorFlow'
          default: sklearn
        pythonVersion:
          title: Python Version
          type: string
          enum: ['3.11', '3.12']
          default: '3.11'
        registerModel:
          title: Register model in MLflow Model Registry
          type: boolean
          default: true

    - title: Repository
      required: [repoUrl]
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch
      name: Generate experiment scaffold
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          experimentName: ${{ parameters.experimentName }}
          owner: ${{ parameters.owner }}
          framework: ${{ parameters.framework }}
          pythonVersion: ${{ parameters.pythonVersion }}
          registerModel: ${{ parameters.registerModel }}
          repoName: ${{ parameters.repoUrl | parseRepoUrl | pick('repo') }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: MLflow experiment — ${{ parameters.experimentName }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        gitCommitMessage: "chore: scaffold ML experiment via IDP"
        topics:
          - mlflow
          - ml-experiment
          - idp

    - id: secrets
      name: Set CI secrets
      action: idp:repo:set-secrets
      continueOnError: true
      input:
        repoUrl: ${{ parameters.repoUrl }}
        secrets:
          MLFLOW_TRACKING_URI: http://mlflow.ml-platform.svc.cluster.local:5000

    - id: train
      name: Run Initial Training Job
      action: idp:run-training-job
      input:
        name: ${{ parameters.name }}
        experimentName: ${{ parameters.experimentName }}
        framework: ${{ parameters.framework }}
        pythonVersion: ${{ parameters.pythonVersion }}

    - id: catalog
      name: Register in catalog
      action: catalog:register
      continueOnError: true
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Catalog Entity
        icon: catalog
        entityRef: ${{ steps.catalog.output.entityRef }}
      - title: MLflow UI
        url: http://mlflow.idp.local
        icon: dashboard
