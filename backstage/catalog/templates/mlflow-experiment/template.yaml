apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: mlflow-experiment
  title: ML Experiment (MLflow)
  description: Run a Python ML training job with MLflow tracking. Scaffolds the experiment locally and submits a Kubernetes Job to the ml-platform namespace. Results appear in the MLflow UI.
  tags:
    - ml
    - mlflow
    - python
    - training
    - local
    - aws
    - v1
    - advanced
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  owner: platform-team
  type: template

  parameters:
    - title: Experiment Details
      required: [name, experimentName, owner]
      properties:
        name:
          title: Experiment ID
          type: string
          description: Lowercase alphanumeric with hyphens (e.g. churn-prediction) — used as the Kubernetes Job name
          pattern: '^[a-z][a-z0-9-]{2,40}$'
          ui:autofocus: true
        experimentName:
          title: MLflow Experiment Name
          type: string
          description: Name shown in MLflow UI (can include spaces)
          default: My Experiment
        owner:
          title: Owner
          type: string
          description: Team owning this experiment
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group

    - title: ML Framework
      properties:
        framework:
          title: ML Framework
          type: string
          enum: [sklearn, pytorch, xgboost, tensorflow]
          enumNames:
            - 'scikit-learn (recommended for local)'
            - 'PyTorch'
            - 'XGBoost'
            - 'TensorFlow'
          default: sklearn
        pythonVersion:
          title: Python Version
          type: string
          enum: ['3.11', '3.12']
          default: '3.11'
        registerModel:
          title: Register model in MLflow Model Registry
          type: boolean
          default: true
        pagerdutyServiceId:
          title: PagerDuty Service ID
          type: string
          description: "Optional. Find this in PagerDuty under Services → your service → ID. Example: P1ABC23"
          ui:help: "Leave blank if not using PagerDuty."

    - title: Repository
      required: [repoUrl]
      properties:
        repoUrl:
          title: Repository Location
          type: string
          description: GitHub repository to store the experiment code
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - moatazeldebsy

  steps:
    # Resolve the platform URLs for THIS environment. The skeleton used to
    # hardcode *.idp.local, so every service scaffolded on AWS got catalog
    # links pointing at DNS that only resolves on a laptop.
    - id: platform-urls
      name: Resolve Platform URLs
      action: idp:platform-urls

    - id: fetch
      name: Generate experiment scaffold
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          experimentName: ${{ parameters.experimentName }}
          owner: ${{ parameters.owner }}
          pagerdutyServiceId: ${{ parameters.pagerdutyServiceId }}
          jiraProjectKey: ${{ parameters.jiraProjectKey }}
          framework: ${{ parameters.framework }}
          pythonVersion: ${{ parameters.pythonVersion }}
          registerModel: ${{ parameters.registerModel }}
          repoName: ${{ parameters.repoUrl | parseRepoUrl | pick('repo') }}
          mlflowUrl: ${{ steps["platform-urls"].output.mlflow }}
          backstageUrl: ${{ steps["platform-urls"].output.backstage }}
          grafanaUrl: ${{ steps["platform-urls"].output.grafana }}
          # The skeleton builds github.com/project-slug from githubOrg/repoName.
          # Without this the org renders empty, the annotation becomes
          # "/<repo>", and the entity page fetches api.github.com/repos//<repo>,
          # which fails preflight and surfaces as a "Failed to fetch" toast.
          # Must come from the repo URL, not parameters.owner — that is a
          # Backstage group ref (group:default/ml-team), not a GitHub org.
          githubOrg: ${{ parameters.repoUrl | parseRepoUrl | pick('owner') }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: 'ML Experiment — ${{ parameters.experimentName }}'
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        gitCommitMessage: 'chore: scaffold ML experiment via IDP'
        topics:
          - ml
          - mlflow
          - ${{ parameters.framework }}
          - idp

    - id: train
      name: Run Initial Training Job
      action: idp:run-training-job
      input:
        name: ${{ parameters.name }}
        experimentName: ${{ parameters.experimentName }}
        framework: ${{ parameters.framework }}
        pythonVersion: ${{ parameters.pythonVersion }}
        registerModel: ${{ parameters.registerModel }}

    # Registration runs LAST on purpose. A failing step aborts the whole task —
    # there is no per-step "continue on error" in Backstage — and catalog:register
    # is the most failure-prone step here (it validates the rendered entity, needs a
    # token, and talks to two services). Failing last leaves fully scaffolded output
    # that only needs re-registering, instead of skipping the steps below.
    - id: catalog
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
        icon: github
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps.catalog.output.entityRef }}
      - title: MLflow UI
        url: ${{ steps.train.output.mlflowUrl }}
        icon: dashboard
