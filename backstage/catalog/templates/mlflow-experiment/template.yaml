apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: mlflow-experiment
  title: MLflow Experiment
  description: >
    Register an MLflow experiment in the Backstage catalog so it appears on the
    service graph alongside the models and training jobs that use it.
    No code repository is created — this is a catalog-only entity.
  tags:
    - ml
    - mlflow
    - experiment-tracking
spec:
  owner: data-team
  type: ml-experiment

  parameters:
    - title: Experiment Details
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: Experiment Name
          type: string
          description: Matches the MLflow experiment name (use same casing)
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: What is this experiment tracking?
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        lifecycle:
          title: Lifecycle
          type: string
          default: experimental
          enum:
            - experimental
            - production
            - deprecated
          enumNames:
            - Experimental
            - Production
            - Deprecated
        costCenter:
          title: Cost Center
          type: string
          default: eng-ml

    - title: Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: GitHub Repository
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - YOUR_GITHUB_ORG

  steps:
    - id: fetch-template
      name: Generate Catalog Entity
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          lifecycle: ${{ parameters.lifecycle }}
          costCenter: ${{ parameters.costCenter }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: "MLflow experiment tracking entity: ${{ parameters.name }}"
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        gitCommitMessage: "chore: initial scaffold via IDP (mlflow-experiment)"
        topics:
          - ml
          - mlflow
          - experiment-tracking
          - idp-catalog

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
      - title: MLflow UI
        url: http://mlflow.idp.local
        icon: dashboard
