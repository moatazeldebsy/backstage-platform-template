apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: ml-training-job
  title: ML Training Job
  description: >
    Scaffold an ML training job that runs on Argo Workflows, tracks experiments
    in MLflow, and pushes Docker images to GHCR via GitHub Actions CI.
  tags:
    - python
    - ml
    - training
    - argo-workflows
    - mlflow
    - golden-path
spec:
  owner: ml-team
  type: ml-training-job

  parameters:
    - title: Job Details
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: Job Name
          type: string
          description: Unique job name (lowercase, hyphens only)
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
          ui:autofocus: true
        description:
          title: Description
          type: string
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group

    - title: ML Configuration
      properties:
        modelFramework:
          title: Model Framework
          type: string
          description: Primary ML framework
          default: sklearn
          enum:
            - sklearn
            - pytorch
            - tensorflow
            - xgboost
            - custom
          enumNames:
            - scikit-learn
            - PyTorch
            - TensorFlow
            - XGBoost
            - Custom
        mlflowExperiment:
          title: MLflow Experiment Name
          type: string
          description: MLflow experiment name for tracking runs
          default: "${{ parameters.name }}"
        schedule:
          title: Cron Schedule (optional)
          type: string
          description: "Argo CronWorkflow schedule (e.g. '0 2 * * *' for 2am daily). Leave empty for manual-only."
          default: ""
        costCenter:
          title: Cost Center
          type: string
          default: eng-ml

    - title: Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: GitHub Repository
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - YOUR_GITHUB_ORG

  steps:
    - id: fetch-template
      name: Fetch Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          modelFramework: ${{ parameters.modelFramework }}
          mlflowExperiment: ${{ parameters.mlflowExperiment }}
          schedule: ${{ parameters.schedule }}
          costCenter: ${{ parameters.costCenter }}
          githubOrg: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          repoName: ${{ (parameters.repoUrl | parseRepoUrl).repo }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        gitCommitMessage: "chore: initial scaffold via IDP (ml-training-job)"
        topics:
          - python
          - ml-training
          - argo-workflows
          - idp-service

    - id: set-repo-secrets
      name: Configure CI/CD Secrets
      action: idp:repo:set-secrets
      input:
        repoUrl: ${{ steps.publish.output.remoteUrl }}
        secrets:
          AWS_ROLE_ARN: "arn:aws:iam::YOUR_AWS_ACCOUNT_ID:role/idp-mvp-github-actions"

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
      - title: Argo Workflows UI
        url: http://argo-workflows.idp.local
        icon: dashboard
      - title: MLflow UI
        url: http://mlflow.idp.local
        icon: dashboard
