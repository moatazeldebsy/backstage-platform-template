# AWS/EKS values for the platform's ArgoCD ApplicationSet.
#
# The filename matters: aws/argocd/app-of-apps.yaml sets
# `valuesFile: helm-values-aws.yaml` for the dev tier, so a service whose
# directory lacks this exact name is deployed with bare chart defaults. The
# templates used to emit helm-values-dev.yaml, which nothing reads — every
# scaffolded service therefore opened a GitOps PR that CI rejected with
# "has no helm-values-aws.yaml", and would have mis-deployed if merged.
# Observed 2026-08-17.

replicaCount: 2

image:
  # Set by the provision-ecr scaffolder step. Empty when the service was
  # scaffolded with deployTarget=local, in which case this file is inert
  # until someone fills it in — it still has to exist for the
  # ApplicationSet to find it.
  repository: ${{ values.ecrRepositoryUri }}
  tag: "latest"
  pullPolicy: Always

service:
  port: 80
  targetPort: ${{ values.port }}

ingress:
  # Disabled by default. An ALB Ingress provisions a dedicated load balancer at
  # ~$16/mo, and most services only ever need in-cluster reachability via
  # <name>.<namespace>.svc.cluster.local. Turn this on when the service really
  # does need to take public traffic -- and read
  # docs/DEPLOYMENT_GUIDE.md#consolidating-albs first if you are adding several.
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/ssl-redirect: false
  # The chart iterates ingress.hosts[].paths[]. A top-level `paths:` key is
  # silently ignored and `hosts: []` renders an Ingress with NO rules -- an ALB
  # that provisions, bills, and routes nothing. Keep paths nested under a host.
  hosts:
    - host: ""   # match any hostname; reach it on the ALB's own DNS name
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 512Mi

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "${{ values.port }}"
  prometheus.io/path: "/metrics"

podLabels:
  team: "${{ values.owner | replace('group:default/', '') | replace('user:default/', '') | replace(':', '-') | replace('/', '-') }}"
  cost-center: "${{ values.costCenter }}"
  environment: dev
  app.kubernetes.io/part-of: internal-developer-platform

metrics:
  enabled: true

# See helm-values-local.yaml for what each secret is and who creates it.
envFrom:
  - secretRef:
      name: ${{ values.name }}-secrets
      optional: true
  - secretRef:
      name: langfuse-otel
      optional: true

env:
  - name: LOG_LEVEL
    value: info
  - name: ENVIRONMENT
    value: dev
  - name: OTEL_SERVICE_NAME
    value: "${{ values.name }}"
  - name: LANGFUSE_CAPTURE_IO
    value: "${{ values.captureIo }}"
  - name: LANGFUSE_SAMPLE_RATE
    value: "${{ values.sampleRate }}"

labels:
  backstage.io/kubernetes-id: ${{ values.name }}
