replicaCount: 1

image:
  repository: ghcr.io/${{ values.githubOrg }}/${{ values.repoName }}
  tag: "latest"
  pullPolicy: Always

service:
  port: 80
  targetPort: ${{ values.port }}

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: ${{ values.name }}.idp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 512Mi

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "${{ values.port }}"
  prometheus.io/path: "/metrics"

podLabels:
  team: "${{ values.owner | replace('group:default/', '') | replace('user:default/', '') | replace(':', '-') | replace('/', '-') }}"
  cost-center: ${{ values.costCenter }}
  environment: dev

metrics:
  enabled: true

# See helm-values-local.yaml for what each of these secrets is and who creates it.
envFrom:
  - secretRef:
      name: ${{ values.name }}-secrets
      optional: true
  - secretRef:
      name: langfuse-otel
      optional: true

env:
  # Which model backend the graph uses. anthropic is the default so the golden
  # path works before anybody tunes a small model; ollama points at the shared
  # in-cluster server and needs no API key (bootstrap-ai.sh --ollama).
  - name: MODEL_BACKEND
    value: "${{ values.modelBackend }}"
  - name: MODEL_NAME
    value: "${{ values.model }}"
  # MCP servers the graph loads tools from. Service DNS rather than ALB
  # hostnames: reachable in-cluster, no dependency on an ingress existing.
  - name: MCP_NAMESPACE
    value: "services-dev"
  # A graph that can loop needs a hard stop; a small model that keeps deciding
  # "not good enough" would otherwise run until something kills it.
  - name: AGENT_MAX_ITERATIONS
    value: "3"
  - name: LOG_LEVEL
    value: info
  - name: ENVIRONMENT
    value: dev
  - name: OTEL_SERVICE_NAME
    value: "${{ values.name }}"
  - name: LANGFUSE_CAPTURE_IO
    value: "${{ values.captureIo }}"
  - name: LANGFUSE_SAMPLE_RATE
    value: "${{ values.sampleRate }}"

labels:
  backstage.io/kubernetes-id: ${{ values.name }}
