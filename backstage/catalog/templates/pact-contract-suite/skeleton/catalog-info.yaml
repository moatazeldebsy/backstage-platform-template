apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  title: ${{ values.name }} Contract Suite
  description: ${{ values.description }}
  annotations:
    github.com/project-slug: ${{ values.githubOrg }}/${{ values.name }}
    backstage.io/techdocs-ref: dir:.
  tags:
    - pact
    - contract-testing
    - consumer-driven
    - qa
spec:
  type: contract-test-suite
  lifecycle: production
  owner: ${{ values.owner }}
  system: internal-developer-platform
