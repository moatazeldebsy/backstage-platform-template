apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: pact-contract-suite
  title: Pact Contract Test Suite
  description: >
    Golden Path for consumer-driven contract testing with Pact.
    Scaffolds consumer and provider contracts, a CI workflow with Pact Broker publishing,
    and registers the suite in the catalog under the QA team.
  tags:
    - qa
    - pact
    - contract-testing
    - consumer-driven
    - golden-path
  links:
    - title: Pact Docs
      url: https://docs.pact.io
      icon: docs
spec:
  owner: qa-team
  type: contract-test-suite

  parameters:
    - title: Suite details
      required:
        - name
        - consumerName
        - providerName
        - providerBaseUrl
        - description
      properties:
        name:
          title: Suite name
          type: string
          description: Slug for repo and catalog entry (e.g. checkout-payment-contracts)
          pattern: '^[a-z0-9-]+$'
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: Which consumer-provider relationship does this suite cover?
        consumerName:
          title: Consumer service name
          type: string
          description: The service that calls the API (e.g. checkout-service)
        providerName:
          title: Provider service name
          type: string
          description: The service that exposes the API (e.g. payment-service)
        providerBaseUrl:
          title: Provider base URL
          type: string
          description: URL of the provider service for verification (e.g. http://payment-service.idp.local)
          default: http://hello-service.idp.local
        language:
          title: Language
          type: string
          description: Test language
          default: javascript
          enum:
            - javascript
            - python
          enumNames:
            - JavaScript (Jest + @pact-foundation/pact)
            - Python (pytest-pact)

    - title: Ownership & publication
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
        owner:
          title: Owner
          type: string
          description: Backstage group or user that owns this suite
          default: qa-team
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group

  steps:
    - id: fetch-template
      name: Fetch skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          consumerName: ${{ parameters.consumerName }}
          providerName: ${{ parameters.providerName }}
          providerBaseUrl: ${{ parameters.providerBaseUrl }}
          language: ${{ parameters.language }}
          owner: ${{ parameters.owner }}
          repoUrl: ${{ parameters.repoUrl }}
          githubOrg: ${{ parameters.repoUrl | parseRepoUrl | pick('owner') }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: private

    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
