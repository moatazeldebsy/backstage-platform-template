# ExternalSecret — pulls DATABASE_URL from AWS Secrets Manager into a K8s Secret.
# After the db-init Job runs successfully, the platform will store credentials at:
#   idp-mvp/services/${{ values.serviceName }}/database
#
# Inject into your service by adding to helm-values.yaml:
#   envFrom:
#     - secretRef:
#         name: ${{ values.serviceName }}-db-secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ${{ values.serviceName }}-db-secret
  namespace: services
  labels:
    service: ${{ values.serviceName }}
    managed-by: idp-backstage
spec:
  refreshInterval: 30m
  secretStoreRef:
    name: aws-secrets-store
    kind: ClusterSecretStore
  target:
    name: ${{ values.serviceName }}-db-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/${{ values.databaseName }}"
  dataFrom:
    - extract:
        key: idp-mvp/services/${{ values.serviceName }}/database
