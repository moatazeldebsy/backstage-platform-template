apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ${{ values.serviceName }}-db-credentials
  namespace: services
  labels:
    app.kubernetes.io/name: ${{ values.serviceName }}
    app.kubernetes.io/managed-by: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ${{ values.serviceName }}-db-secret
    creationPolicy: Owner
    template:
      data:
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}:5432/${{ values.dbName }}"
  data:
    - secretKey: username
      remoteRef:
        key: idp-mvp/${{ values.serviceName }}/db-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: idp-mvp/${{ values.serviceName }}/db-credentials
        property: password
    - secretKey: host
      remoteRef:
        key: idp-mvp/${{ values.serviceName }}/db-credentials
        property: host
