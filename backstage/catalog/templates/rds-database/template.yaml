apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: rds-database
  title: Provision Database for Service
  description: Self-service database provisioning — creates a dedicated Postgres database and user on the shared RDS instance. Credentials are stored in Secrets Manager and injected via ExternalSecret.
  tags:
    - database
    - postgres
    - aws
    - self-service
spec:
  owner: platform-team
  type: infrastructure

  parameters:
    - title: Service details
      required:
        - serviceName
        - githubOrg
        - repoName
        - ownerTeam
      properties:
        serviceName:
          title: Service name
          type: string
          description: Must match your Backstage catalog service name (e.g. payments-api)
          ui:autofocus: true
        ownerTeam:
          title: Owner team
          type: string
          description: Backstage group that owns this service
        githubOrg:
          title: GitHub organisation
          type: string
          default: moatazeldebsy
        repoName:
          title: Service repository
          type: string
          description: GitHub repo where the DB manifests PR will be opened

    - title: Database configuration
      properties:
        databaseName:
          title: Database name
          type: string
          description: Name of the Postgres database (defaults to service name)
        awsRegion:
          title: AWS region
          type: string
          default: us-east-1

  steps:
    - id: fetch
      name: Render DB manifests
      action: fetch:template
      input:
        url: ./skeleton
        values:
          serviceName: ${{ parameters.serviceName }}
          databaseName: ${{ parameters.databaseName or parameters.serviceName | replace("-", "_") }}
          ownerTeam: ${{ parameters.ownerTeam }}
          awsRegion: ${{ parameters.awsRegion }}

    - id: pr
      name: Open pull request in service repo
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=${{ parameters.repoName }}&owner=${{ parameters.githubOrg }}
        branchName: idp/provision-database-${{ parameters.serviceName }}
        title: "feat(database): provision Postgres database for ${{ parameters.serviceName }}"
        description: |
          Auto-generated by Backstage IDP scaffolder.

          Adds:
          - `k8s/database/db-init-job.yaml` — one-time Job that creates the database and user on the shared RDS instance
          - `k8s/database/external-secret.yaml` — ExternalSecret that injects `DATABASE_URL` from Secrets Manager

          **After merging:**
          1. Apply the manifests: `kubectl apply -f k8s/database/ -n services`
          2. The init Job runs once; verify with: `kubectl logs job/db-init-${{ parameters.serviceName }} -n services`
          3. Add `DATABASE_URL` to your `helm-values.yaml` under `envFrom.secretRef.name: ${{ parameters.serviceName }}-db-secret`
        targetPath: k8s/database
        commitMessage: "chore: scaffold database manifests for ${{ parameters.serviceName }}"

  output:
    links:
      - title: Pull Request
        url: ${{ steps.pr.output.remoteUrl }}
    text:
      - title: Next steps
        content: |
          1. Merge the PR
          2. Apply: `kubectl apply -f k8s/database/ -n services`
          3. Monitor the init job: `kubectl logs -f job/db-init-${{ parameters.serviceName }} -n services`
          4. Add to `helm-values.yaml`:
             ```yaml
             envFrom:
               - secretRef:
                   name: ${{ parameters.serviceName }}-db-secret
             ```
