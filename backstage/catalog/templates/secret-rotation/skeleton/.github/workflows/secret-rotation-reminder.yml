name: Rotate secret reminder — ${{ values.serviceName }}/${{ values.secretKey }}

on:
  schedule:
    {% if values.rotationSchedule == '30 days' %}
    - cron: '0 9 1,15 * *'
    {% elif values.rotationSchedule == '60 days' %}
    - cron: '0 9 1 */2 *'
    {% elif values.rotationSchedule == '180 days' %}
    - cron: '0 9 1 1,7 *'
    {% else %}
    - cron: '0 9 1 */3 *'
    {% endif %}
  workflow_dispatch: {}

jobs:
  open-reminder:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open rotation reminder issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Rotate secret: ${{ values.secretKey }} (${{ values.serviceName }})',
              labels: ['security', 'secret-rotation'],
              body: [
                'This is a scheduled reminder (every ${{ values.rotationSchedule }}) to rotate the',
                '`${{ values.secretKey }}` secret owned by ${{ values.owner }}.',
                '',
                '**Secrets Manager path:** `${{ values.secretPathPrefix }}/${{ values.serviceName }}/${{ values.secretKey }}`',
                '',
                'To rotate:',
                '```bash',
                'aws secretsmanager put-secret-value \\',
                '  --secret-id ${{ values.secretPathPrefix }}/${{ values.serviceName }} \\',
                '  --secret-string \'{"${{ values.secretKey }}":"NEW_VALUE"}\' \\',
                '  --region ${{ values.awsRegion }}',
                '```',
                '',
                'The ExternalSecret CRD will pick up the new value on its next refresh (within 1h).',
              ].join('\n'),
            });
