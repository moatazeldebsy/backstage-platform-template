apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ${{ values.serviceName }}-${{ values.secretKey | lower | replace('_', '-') }}
  # services-dev: where the idp-services ApplicationSet runs this service on
  # AWS. This used to be `services`, where no service pod runs.
  namespace: services-dev
  labels:
    app.kubernetes.io/name: ${{ values.serviceName }}
    app.kubernetes.io/managed-by: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    # One Secret per key: two ExternalSecrets both claiming `Owner` of a shared
    # <service>-secrets Secret conflict, so a service's second secret failed.
    name: ${{ values.serviceName }}-${{ values.secretKey | lower | replace('_', '-') }}
    creationPolicy: Owner
  data:
    - secretKey: ${{ values.secretKey }}
      remoteRef:
        key: ${{ values.secretPathPrefix }}/${{ values.serviceName }}/${{ values.secretKey }}
