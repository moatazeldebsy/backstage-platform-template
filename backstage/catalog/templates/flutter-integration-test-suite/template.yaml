apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: flutter-integration-test-suite
  annotations:
    backstage.io/techdocs-ref: dir:.
  title: Flutter Integration Test Suite
  description: Add Flutter integration tests to an existing Flutter app. Tests run on Firebase Test Lab via GitHub Actions.
  tags:
    - flutter
    - mobile
    - testing
    - integration
    - qa
spec:
  owner: qa-team
  type: test-suite

  parameters:
    - title: Suite Details
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: Suite Name
          type: string
          description: Unique name for this test suite (lowercase, hyphens only)
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
          ui:autofocus: true
        description:
          title: Description
          type: string
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        targetService:
          title: Target Flutter App
          type: string
          description: The Flutter app this test suite targets
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              - kind: Component
                spec.type: mobile
        targetRepoUrl:
          title: Flutter App Repository
          type: string
          description: The existing Flutter app repo to open the PR against
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - moatazeldebsy

    - title: Test Configuration
      properties:
        testRunner:
          title: Test Runner
          type: string
          default: local-emulator
          enum:
            - local-emulator
            - firebase-test-lab
          enumNames:
            - 'Local Emulator (GitHub Actions emulator)'
            - 'Firebase Test Lab (real devices in the cloud)'
        firebaseProjectId:
          title: Firebase Project ID
          type: string
          description: "Required for Firebase Test Lab. Find in Firebase Console → Project Settings."
          ui:help: "Leave blank for local emulator."
        jiraProjectKey:
          title: Jira Project Key
          type: string
          description: "Optional."
          ui:help: "Leave blank if not using Jira."

  steps:
    - id: fetch-template-addon
      name: Fetch Integration Test Files
      action: fetch:template
      input:
        url: ./skeleton-addon
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          targetService: ${{ parameters.targetService }}
          testRunner: ${{ parameters.testRunner }}
          firebaseProjectId: ${{ parameters.firebaseProjectId }}
          jiraProjectKey: ${{ parameters.jiraProjectKey }}
          githubOrg: ${{ (parameters.targetRepoUrl | parseRepoUrl).owner }}
          repoName: ${{ (parameters.targetRepoUrl | parseRepoUrl).repo }}

    - id: publish-pr
      name: Open Pull Request on Flutter App Repo
      action: publish:github:pull-request
      continueOnError: true
      input:
        repoUrl: ${{ parameters.targetRepoUrl }}
        title: 'test: add ${{ parameters.name }} Flutter integration tests'
        branchName: feat/add-${{ parameters.name }}-integration-tests
        description: |
          ## Add ${{ parameters.name }} Flutter Integration Tests

          Adds integration tests targeting `${{ parameters.targetService }}`.

          **What's included:**
          - Integration tests under `integration_test/${{ parameters.name }}/`
          - GitHub Actions CI workflow at `.github/workflows/${{ parameters.name }}-integration.yml`
          - Backstage catalog entry

          **Test runner:** ${{ parameters.testRunner }}

          After merging, register the catalog entry via Backstage → Register existing component.

          > Scaffolded via the IDP QA Platform
        sourcePath: .

  output:
    links:
      - title: Pull Request
        url: ${{ steps['publish-pr'].output.remoteUrl }}
