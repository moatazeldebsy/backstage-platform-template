apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: add-e2e-tests
  title: Add E2E Tests to Existing Service
  description: >
    Injects Playwright E2E test scaffolding (smoke + API test stubs, config, and CI job)
    into an existing service repo by opening a PR. No new repo is created.
  tags:
    - testing
    - e2e
    - playwright
    - self-service
    - addon
  links:
    - title: Playwright Docs
      url: https://playwright.dev/docs/intro
      icon: docs
spec:
  owner: qa-team
  type: service

  parameters:
    - title: Which service should get E2E tests?
      required:
        - serviceEntity
        - targetServiceUrl
        - confirmNoTests
      properties:
        serviceEntity:
          title: Service
          type: string
          description: Pick a registered service from the catalog
          ui:field: EntityPicker
          ui:autofocus: true
          ui:options:
            catalogFilter:
              kind: Component
            defaultKind: Component
            defaultNamespace: default
        githubOrg:
          title: GitHub organisation
          type: string
          default: moatazeldebsy
          description: GitHub org that owns the service repo
        targetServiceUrl:
          title: Service base URL
          type: string
          description: Base URL the E2E tests will target (e.g. http://my-api.idp.local or https://api.example.com)
          default: http://hello-service.idp.local
        confirmNoTests:
          title: >
            I confirm this repo does NOT already contain a tests/ folder,
            playwright.config.ts, or .github/workflows/idp-e2e-tests.yml.
            Running this template on a repo with existing E2E setup will overwrite those files.
          type: boolean
          const: true
          default: false
          ui:widget: checkbox

    - title: Schedule & settings
      properties:
        runSchedule:
          title: Scheduled run
          type: string
          description: When to run E2E tests automatically (UTC)
          default: '0 6 * * 1-5'
          enum:
            - '0 6 * * 1-5'
            - '0 6 * * *'
            - '0 */6 * * *'
          enumNames:
            - Weekdays at 06:00 UTC
            - Daily at 06:00 UTC
            - Every 6 hours

  steps:
    - id: fetch-skeleton
      name: Render Playwright config and CI workflow
      action: fetch:template
      input:
        url: ./skeleton
        values:
          repoName: ${{ (parameters.serviceEntity | parseEntityRef).name }}
          targetServiceUrl: ${{ parameters.targetServiceUrl }}
          runSchedule: ${{ parameters.runSchedule }}

    - id: pr
      name: Open pull request in service repo
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=${{ (parameters.serviceEntity | parseEntityRef).name }}&owner=${{ parameters.githubOrg }}
        branchName: idp/add-e2e-tests
        title: "test: add Playwright E2E test scaffolding [IDP golden path]"
        description: |
          ## Add E2E Tests — IDP Golden Path

          This PR was generated by the **Add E2E Tests** Backstage template.

          ### What's included

          | File | Purpose |
          |------|---------|
          | `.github/workflows/idp-e2e-tests.yml` | CI job — runs on push/PR/schedule, uploads HTML report |
          | `playwright.config.ts` | Playwright configuration (base URL, reporters, retry settings) |
          | `tests/smoke.spec.ts` | Smoke tests — `/healthz`, `/ready`, `/metrics` |
          | `tests/api.spec.ts` | API contract tests — root endpoint, response time |
          | `package.json` | Playwright dependency |

          ### Target URL

          Tests point to: `${{ parameters.targetServiceUrl }}`

          Override per-run via `workflow_dispatch` → `base_url` input.

          ### Next steps after merging

          1. `npm install` to pull in `@playwright/test`.
          2. Extend `tests/smoke.spec.ts` and `tests/api.spec.ts` with service-specific assertions.
          3. Set `PUSHGATEWAY_URL` as a GitHub secret to push pass/fail metrics to Prometheus.
        commitMessage: "test: add Playwright E2E scaffolding (IDP golden path)"

  output:
    links:
      - title: Pull Request
        url: ${{ steps.pr.output.remoteUrl }}
    text:
      - title: Next steps
        content: |
          PR opened in **${{ parameters.githubOrg }}/${{ (parameters.serviceEntity | parseEntityRef).name }}**.

          1. Merge the PR and run `npm install` in the repo root.
          2. Extend the test stubs with service-specific assertions.
          3. E2E tests run on every push/PR and on schedule (`${{ parameters.runSchedule }}`).
