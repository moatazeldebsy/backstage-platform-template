name: ${{ values.name }} Integration Tests

on:
  push:
    branches: [main]
    paths:
      - 'test-suites/${{ values.name }}/**'
  pull_request:
    branches: [main]
    paths:
      - 'test-suites/${{ values.name }}/**'

# action-junit-report creates a check run; with the default token permissions
# that failed ("Resource not accessible by integration") and so did the job.
permissions:
  contents: read
  checks: write

jobs:
  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test-suites/${{ values.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'  # testcontainers 12 → undici 8 needs Node >= 22.19
          cache: 'npm'
          cache-dependency-path: test-suites/${{ values.name }}/package.json

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Run integration tests
        run: npm test

      - name: Upload JUnit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results-${{ values.name }}
          path: test-suites/${{ values.name }}/reports/junit.xml
          retention-days: 30

      - name: Publish Test Results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: test-suites/${{ values.name }}/reports/junit.xml
          check_name: ${{ values.name }} Integration Tests
