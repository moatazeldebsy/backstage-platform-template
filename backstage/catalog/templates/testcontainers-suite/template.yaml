apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: testcontainers-suite
  title: Testcontainers Integration Test Suite
  description: Scaffold a Testcontainers integration test suite that spins up real dependencies (DB, cache, queues) in CI
  tags:
    - testcontainers
    - integration-testing
    - testing
    - qa
spec:
  owner: qa-team
  type: test-suite

  parameters:
    - title: Suite Details
      required:
        - name
        - description
        - owner
        - targetService
      properties:
        name:
          title: Suite Name
          type: string
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
          ui:autofocus: true
        description:
          title: Description
          type: string
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        targetService:
          title: Target Service
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: Component

    - title: Configuration
      properties:
        containers:
          title: Dependency Containers
          type: array
          description: Real services to spin up during tests
          items:
            type: string
            enum:
              - postgres
              - mysql
              - redis
              - rabbitmq
              - kafka
              - mongodb
          default:
            - postgres
          ui:widget: checkboxes
        testRunner:
          title: Test Runner
          type: string
          default: jest
          enum:
            - jest
            - vitest
            - mocha
          enumNames:
            - 'Jest'
            - 'Vitest'
            - 'Mocha'

    - title: Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: GitHub Repository
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - moatazeldebsy

  steps:
    - id: fetch-template
      name: Fetch Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          targetService: ${{ parameters.targetService }}
          containers: ${{ parameters.containers }}
          testRunner: ${{ parameters.testRunner }}
          githubOrg: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          repoName: ${{ (parameters.repoUrl | parseRepoUrl).repo }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        gitCommitMessage: "chore: initial scaffold via IDP"
        topics:
          - testcontainers
          - integration-testing
          - qa

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
