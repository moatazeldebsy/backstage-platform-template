replicaCount: 1

image:
  repository: localhost:5003/${{ values.name }}
  tag: "local"
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: ${{ values.port }}

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
  hosts:
    - host: ${{ values.name }}.idp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

podLabels:
  team: "${{ values.owner | replace('group:default/', '') | replace('user:default/', '') | replace(':', '-') | replace('/', '-') }}"
  cost-center: "${{ values.costCenter }}"
  environment: local
  app.kubernetes.io/part-of: internal-developer-platform

labels:
  backstage.io/kubernetes-id: ${{ values.name }}
