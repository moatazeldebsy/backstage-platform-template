apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: flutter-app
  annotations:
    backstage.io/techdocs-ref: dir:.
  title: Flutter App (Dart)
  description: Scaffold a production-ready Flutter app with Dart, multi-platform support (Android/iOS/Web), GitHub Actions CI/CD, Fastlane, and optional Firebase integration
  tags:
    - flutter
    - dart
    - mobile
    - golden-path
    - local
    - aws
    - v1
    - advanced
spec:
  owner: platform-team
  type: mobile

  parameters:
    - title: App Details
      required:
        - name
        - description
        - owner
        - packageName
      properties:
        name:
          title: App Name
          type: string
          description: Unique app name (lowercase, hyphens only)
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
          ui:autofocus: true
        description:
          title: Description
          type: string
        owner:
          title: Owner
          type: string
          description: Team or user owning this app
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        packageName:
          title: Flutter Package Name
          type: string
          description: "Reverse-domain package name (e.g. com.mycompany.myapp)"
          pattern: '^[a-z][a-z0-9]*(\.[a-z][a-z0-9]*)+$'
          ui:help: "Used as the Android/iOS bundle ID. Example: com.acme.myapp"

    - title: Platform & Features
      properties:
        platforms:
          title: Target Platforms
          type: array
          items:
            type: string
            enum:
              - android
              - ios
              - web
          uniqueItems: true
          default:
            - android
          ui:widget: checkboxes
          ui:options:
            inline: true
        enableWebDeploy:
          title: Deploy Flutter Web to Kubernetes
          type: boolean
          default: false
          description: "Build Flutter Web and deploy it to the platform K8s cluster via Helm (requires Web platform selected)"
        enableFirebase:
          title: Enable Firebase
          type: boolean
          default: false
          description: "Add Firebase Crashlytics + Analytics to the project"
        minSdk:
          title: Minimum Android SDK Version
          type: integer
          default: 26
          enum:
            - 26
            - 28
            - 33
          enumNames:
            - 'API 26 (Android 8.0 Oreo)'
            - 'API 28 (Android 9.0 Pie)'
            - 'API 33 (Android 13)'
          description: "Android API level the Flutter app targets. The platform floor for the min-SDK scorecard check is 24."
        appSizeBudgetMb:
          title: App Size Budget (MB)
          type: integer
          default: 80
          description: "Binary size ceiling for this app, in MB. Surfaced as the app-size-budget scorecard check and a starting point for size regression alerts."
        costCenter:
          title: Cost Center
          type: string
          description: "Team cost center code (e.g. eng-mobile)"
          default: eng-mobile
        pagerdutyServiceId:
          title: PagerDuty Service ID
          type: string
          description: "Optional."
          ui:help: "Leave blank if not using PagerDuty."
        jiraProjectKey:
          title: Jira Project Key
          type: string
          description: "Optional."
          ui:help: "Leave blank if not using Jira."

    - title: Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: GitHub Repository
          type: string
          ui:field: RepoUrlPicker
          ui:help: "Repository name must not already exist on GitHub."
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - moatazeldebsy

    # The AWS-only inputs live under `dependencies` so they are not rendered at

    # all when Local is selected. They used to be shown unconditionally with

    # "(AWS only)" in the title and "Leave blank for local deployments" in the

    # help — which reads like a required field you are being told to skip, and

    # asks somebody deploying to Kind for an IAM role ARN.

    - title: Deployment Target

      required:

        - deployTarget

      properties:

        deployTarget:

          title: Where will this service run?

          type: string

          default: local

          enum: [local, aws]

          enumNames: ['Local (Kind / Rancher Desktop)', 'AWS (EKS)']

          ui:widget: radio

      dependencies:

        deployTarget:

          oneOf:

            # Local: nothing further to ask.

            - properties:

                deployTarget:

                  enum: [local]

            - properties:

                deployTarget:

                  enum: [aws]

                awsRoleArn:

                  title: AWS IAM Role ARN for CI/CD

                  type: string

                  description: >-

                    The OIDC role GitHub Actions assumes to push images to ECR.

                    Get it from the platform repo with:

                    cd terraform && terraform output -raw github_actions_role_arn

                  # Fails at the form rather than three minutes into the first CI

                  # run with an opaque STS error.

                  pattern: '^arn:aws:iam::[0-9]{12}:role/.+$'

                  ui:help: "terraform output -raw github_actions_role_arn"

                  ui:placeholder: 'arn:aws:iam::123456789012:role/idp-mvp-github-actions'

                clusterName:

                  title: Cluster Name

                  type: string

                  default: idp-mvp

                  description: "Matches the ECR repo naming used by CI: <clusterName>/<serviceName>"

                  ui:help: "The cluster_name you set in terraform.tfvars during setup."

                awsRegion:

                  title: AWS Region

                  type: string

                  default: us-east-1

                  ui:help: "Must match the region the cluster and its ECR repos live in."

              required:

                - awsRoleArn

                - clusterName

                - awsRegion

  steps:
    # Resolve the platform URLs for THIS environment. The skeleton used to
    # hardcode *.idp.local, so every service scaffolded on AWS got catalog
    # links pointing at DNS that only resolves on a laptop.
    - id: platform-urls
      name: Resolve Platform URLs
      action: idp:platform-urls

    - id: fetch-template
      name: Fetch Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          packageName: ${{ parameters.packageName }}
          platforms: ${{ parameters.platforms }}
          enableWebDeploy: ${{ parameters.enableWebDeploy }}
          enableFirebase: ${{ parameters.enableFirebase }}
          minSdk: ${{ parameters.minSdk | default(26) }}
          appSizeBudgetMb: ${{ parameters.appSizeBudgetMb | default(80) }}
          # `| default(...)` mirrors the parameter's own schema default. RJSF only
          # submits a page's fields once that page has been visited, so clicking
          # straight past an all-optional step sends nothing for it — the scaffolder
          # then renders `${{ values.port }}` as an empty string. That produced a bare
          # `EXPOSE` in the generated Dockerfile and every scaffolded repo's first CI
          # run died with "EXPOSE requires at least one argument". Observed 2026-08-17.
          costCenter: ${{ parameters.costCenter | default("eng-mobile") }}
          pagerdutyServiceId: ${{ parameters.pagerdutyServiceId }}
          jiraProjectKey: ${{ parameters.jiraProjectKey }}
          githubOrg: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          repoName: ${{ (parameters.repoUrl | parseRepoUrl).repo }}
          port: ${{ parameters.port }}
          grafanaUrl: ${{ steps["platform-urls"].output.grafana }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        gitCommitMessage: "chore: initial scaffold via IDP"
        topics:
          - flutter
          - dart
          - mobile
          - idp-app

    - id: fetch-platform-values
      name: Prepare Platform GitOps Values
      if: ${{ parameters.enableWebDeploy }}
      action: fetch:template
      input:
        url: ./platform-values
        targetPath: ./platform-values
        values:
          name: ${{ parameters.name }}
          githubOrg: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          repoName: ${{ (parameters.repoUrl | parseRepoUrl).repo }}
          port: ${{ parameters.port }}
          owner: ${{ parameters.owner }}
          costCenter: ${{ parameters.costCenter | default("eng-mobile") }}
          # Full ECR URI from the provision-ecr step. That step is guarded on
          # deployTarget == 'aws', so this renders empty for a local scaffold —
          # helm-values-aws.yaml still has to exist for the ApplicationSet.
          ecrRepositoryUri: ${{ steps['provision-ecr'].output.repositoryUri }}

    - id: platform-pr
      name: Open Platform GitOps PR (Flutter Web)
      if: ${{ parameters.enableWebDeploy }}
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=backstage-platform-template&owner=moatazeldebsy
        title: "feat: onboard ${{ parameters.name }} Flutter Web to GitOps"
        branchName: feat/onboard-${{ parameters.name }}-web
        description: |
          Adds `services/${{ parameters.name }}/` (Flutter Web) to the platform repo.

          ArgoCD ApplicationSet will auto-discover and deploy the web build
          to `services-dev` namespace once merged.
        sourcePath: ./platform-values
        targetPath: services/${{ parameters.name }}

    - id: set-repo-secrets
      name: Configure CI/CD Secrets
      if: ${{ parameters.enableWebDeploy && parameters.deployTarget === 'aws' }}
      action: idp:repo:set-secrets
      input:
        repoUrl: ${{ steps.publish.output.remoteUrl }}
        secrets:
          AWS_ROLE_ARN: ${{ parameters.awsRoleArn }}

    - id: seed-image
      name: Seed placeholder web image in local registry
      if: ${{ parameters.enableWebDeploy && parameters.deployTarget === 'local' }}
      action: idp:seed-image
      input:
        serviceName: ${{ parameters.name }}

    # Registration runs LAST on purpose. A failing step aborts the whole task —
    # there is no per-step "continue on error" in Backstage — and catalog:register
    # is the most failure-prone step here (it validates the rendered entity, needs a
    # token, and talks to two services). Failing last leaves a fully scaffolded
    # service that only needs re-registering, instead of skipping the steps below.
    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
      - title: Open Platform GitOps PR (Web)
        url: ${{ steps['platform-pr'].output.remoteUrl }}
