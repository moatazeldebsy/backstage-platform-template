name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.27.0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  SONAR_TOKEN: ${{ '${{ secrets.SONAR_TOKEN }}' }}
  SNYK_TOKEN: ${{ '${{ secrets.SNYK_TOKEN }}' }}

jobs:
  analyze:
    name: Analyze + Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ '${{ env.FLUTTER_VERSION }}' }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format code
        run: dart format .

      - name: Analyze project
        run: flutter analyze

      - name: Trivy filesystem scan (deps + secrets)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scanners: 'vuln,secret,misconfig'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ '${{ secrets.GITHUB_TOKEN }}' }}
          SONAR_TOKEN: ${{ '${{ secrets.SONAR_TOKEN }}' }}

      - name: Snyk dependency scan
        if: env.SNYK_TOKEN != ''
        continue-on-error: true
        run: |
          npm install -g snyk
          snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ '${{ secrets.SNYK_TOKEN }}' }}

  test:
    name: Unit + Widget Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ '${{ env.FLUTTER_VERSION }}' }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

{%- if 'android' in values.platforms %}
  # Only for apps that target Android.
  build-android:
    name: Build Android APK
    needs: [analyze, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ '${{ env.FLUTTER_VERSION }}' }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
{%- endif %}

{%- if 'ios' in values.platforms %}
  # Only for apps that target iOS. Unsigned: a new repo has no signing
  # certificates yet — the mobile-code-signing template adds those.
  build-ios:
    name: Build iOS (unsigned)
    needs: [analyze, test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ '${{ env.FLUTTER_VERSION }}' }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS app (no code signing)
        run: flutter build ios --debug --no-codesign

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: build/ios/iphoneos/Runner.app
          retention-days: 14
{%- endif %}

{%- if 'web' in values.platforms %}
  # Only for apps that target the web.
  build-web:
    name: Build Flutter Web
    needs: [analyze, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ '${{ env.FLUTTER_VERSION }}' }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/
          retention-days: 14
{%- endif %}

{%- if values.enableWebDeploy and 'web' in values.platforms %}
  # Only when Flutter Web is deployed to the cluster: builds skeleton-web's Dockerfile.
  publish-web:
    name: Build & Push Web Docker Image
    needs: [build-web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write  # OIDC, to assume AWS_ROLE_ARN for the ECR push
    env:
      AWS_ROLE_ARN: ${{ '${{ secrets.AWS_ROLE_ARN }}' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ '${{ env.FLUTTER_VERSION }}' }}
          channel: stable
          cache: true

      - name: Build Web
        run: flutter pub get && flutter build web --release

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ '${{ github.actor }}' }}
          password: ${{ '${{ secrets.GITHUB_TOKEN }}' }}

      - name: Build and push Docker image
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE=ghcr.io/${{ values.githubOrg }}/${{ values.repoName }}
          docker build -t ${IMAGE}:${SHORT_SHA} -t ${IMAGE}:latest .
          docker push ${IMAGE}:${SHORT_SHA}
          docker push ${IMAGE}:latest
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"

      # AWS: ArgoCD deploys this service from its ECR repository (the image the
      # platform repo's services/${{ values.name }}/helm-values-aws.yaml names), so the
      # image goes there too. A repo scaffolded for AWS has AWS_ROLE_ARN: a role
      # only this repo's main branch can assume, allowed to push only to that
      # repository. Without it (a local scaffold) these steps skip.
      - name: Configure AWS credentials (ECR push)
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ '${{ env.AWS_ROLE_ARN }}' }}
          aws-region: ${{ values.awsRegion }}

      - name: Log in to ECR
        id: ecr
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        if: env.AWS_ROLE_ARN != ''
        run: |
          IMAGE=ghcr.io/${{ values.githubOrg }}/${{ values.repoName }}
          ECR_IMAGE=${{ '${{ steps.ecr.outputs.registry }}' }}/${{ values.ecrRepository }}
          for tag in "${SHORT_SHA}" latest; do
            docker tag "${IMAGE}:${tag}" "${ECR_IMAGE}:${tag}"
            docker push "${ECR_IMAGE}:${tag}"
          done
{%- endif %}

