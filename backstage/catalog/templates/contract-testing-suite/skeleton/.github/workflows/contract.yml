name: Contract Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CONSUMER_NAME: '${{ values.consumerName }}'
  PROVIDER_NAME: '${{ values.providerName }}'
  PACT_BROKER_URL: '${{ values.pactBrokerUrl }}'
  PROVIDER_BASE_URL: '${{ values.providerBaseUrl }}'
  CONTRACT_MCP_SERVER_URL: '${{ values.contractMcpServerUrl }}'

jobs:
  consumer:
    name: Consumer Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run consumer Pact tests
        run: npm test

      - name: Register contract spec with IDP contract registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if [ -z "${CONTRACT_MCP_SERVER_URL}" ]; then
            echo "CONTRACT_MCP_SERVER_URL not set — skipping registration"
            exit 0
          fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "${CONTRACT_MCP_SERVER_URL}/api/contracts/${CONSUMER_NAME}/${SHORT_SHA}" \
            -H "Content-Type: application/json" \
            --data-binary "@contract/openapi.yaml")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Contract registered for ${CONSUMER_NAME}@${SHORT_SHA}"
          else
            echo "Warning: contract registration failed (HTTP $HTTP_STATUS) — non-blocking"
          fi

      - name: Publish pacts to broker
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          PACT_BROKER_TOKEN: ${{ '${{ secrets.PACT_BROKER_TOKEN }}' }}
        run: |
          if [ -z "${PACT_BROKER_TOKEN}" ]; then
            echo "PACT_BROKER_TOKEN not set — skipping publish"
            exit 0
          fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          npx pact-broker publish ./pacts \
            --consumer-app-version="${SHORT_SHA}" \
            --broker-base-url="${PACT_BROKER_URL}" \
            --broker-token="${PACT_BROKER_TOKEN}" \
            --tag=main

  provider-verify:
    name: Provider Verification
    runs-on: ubuntu-latest
    needs: consumer
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify provider against published pact
        env:
          PACT_BROKER_TOKEN: ${{ '${{ secrets.PACT_BROKER_TOKEN }}' }}
        run: |
          if [ -z "${PACT_BROKER_TOKEN}" ]; then
            echo "PACT_BROKER_TOKEN not set — skipping provider verification"
            exit 0
          fi
          npm run verify

  deploy-gate:
    name: Deployment Gate (can-i-deploy)
    runs-on: ubuntu-latest
    needs: provider-verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Check can-i-deploy before rolling out
        run: |
          if [ -z "${CONTRACT_MCP_SERVER_URL}" ]; then
            echo "CONTRACT_MCP_SERVER_URL not set — skipping deploy gate"
            exit 0
          fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            "${CONTRACT_MCP_SERVER_URL}/api/can-i-deploy/${PROVIDER_NAME}/${SHORT_SHA}")
          cat response.json
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ can-i-deploy reports it is NOT safe to deploy ${PROVIDER_NAME}@${SHORT_SHA}"
            exit 1
          fi
          echo "✅ Safe to deploy ${PROVIDER_NAME}@${SHORT_SHA}"
      # Wire your actual deployment step after this gate (e.g. kubectl apply, ArgoCD sync, helm upgrade).
