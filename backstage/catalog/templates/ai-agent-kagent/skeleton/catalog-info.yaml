apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ values.description }}
  tags:
    - ai
    - agent
    - kagent
  annotations:
    github.com/project-slug: ${{ values.githubOrg }}/${{ values.repoName }}
    backstage.io/techdocs-ref: dir:.
    backstage.io/kubernetes-id: ${{ values.name }}
    backstage.io/kubernetes-namespace: kagent
    grafana/alert-label-selector: "service=${{ values.name }}"
    idp.io/quality-gates: "coverage,static-analysis,vuln-scan"
    sonarcloud.io/project-key: "${{ values.githubOrg }}_${{ values.repoName }}"
    sonarcloud.io/organization: "${{ values.githubOrg }}"
    snyk.io/org-slug: "${{ values.githubOrg }}"
    pagerduty.com/service-id: "${{ values.pagerdutyServiceId }}"
    jira/project-key: "${{ values.jiraProjectKey }}"
  links:
    - url: http://kagent.idp.local
      title: KAgent UI
spec:
  type: ai-agent
  lifecycle: experimental
  owner: ${{ values.owner }}
  system: idp-platform
  dependsOn:
    - resource:kagent
    - resource:claude-api
