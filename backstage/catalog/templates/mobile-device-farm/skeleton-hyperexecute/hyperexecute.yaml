# LambdaTest HyperExecute — orchestrates and shards ${{ values.repoName }}'s
# mobile suite instead of the platform uploading a build and polling for it.
# Driven by `./hyperexecute --config hyperexecute.yaml` in
# .github/workflows/device-farm.yml. Generated by the mobile-device-farm
# scaffolder template; safe to edit.
---
version: "0.2"
runson: {% if values.platform === 'ios' %}mac{% else %}linux{% endif %}

# Credentials come from the environment. They are injected as repository secrets
# by the platform (idp:repo:set-secrets), so there is nothing to set here.
autosplit: true
retryOnFailure: true
maxRetries: 2

# Concurrency tracks the device-coverage tier chosen in the scaffolder so the
# wall-clock estimates on the wizard stay honest.
concurrency: {% if values.deviceCoverage === 'high' %}5{% elif values.deviceCoverage === 'medium' %}3{% else %}1{% endif %}

env:
  PLATFORM: "${{ values.platform }}"
  TEST_FRAMEWORK: "${{ values.testFramework }}"

pre:
{%- if values.platform === 'flutter' %}
  - flutter pub get
  - pushd android && flutter build apk --debug && ./gradlew app:assembleAndroidTest && popd
{%- elif values.platform === 'android' %}
  - cd android && ./gradlew assembleDebug assembleDebugAndroidTest
{%- else %}
  - xcodebuild build-for-testing -scheme "${{ values.repoName }}" -destination "generic/platform=iOS" -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO
{%- endif %}

# One task per device. HyperExecute fans these out across the grid itself.
testDiscovery:
  type: raw
  mode: static
  command: cat device-matrix/lambdatest/${{ values.deviceCoverage }}.json | jq -r '.{% if values.platform === 'ios' %}ios{% else %}android{% endif %}[]'

testRunnerCommand: echo "running on $test"

report: true
partialReports: true
