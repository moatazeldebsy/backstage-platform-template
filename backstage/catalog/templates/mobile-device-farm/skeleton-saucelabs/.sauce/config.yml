# Sauce Labs saucectl configuration for ${{ values.repoName }}.
#
# Unlike the other three providers, Sauce Labs is driven by its own CLI rather
# than a REST call from the workflow — saucectl owns the device list, so this
# file is the device matrix for Sauce. There is deliberately no
# device-matrix/saucelabs/ directory; edit the `devices:` block below instead.
#
# Generated by the mobile-device-farm scaffolder template; safe to edit.
apiVersion: v1alpha
kind: {% if values.platform === 'ios' %}xcuitest{% else %}espresso{% endif %}

sauce:
  region: us-west-1
  # Matches the coverage tier chosen in the scaffolder so the wizard's
  # wall-clock estimates stay honest.
  concurrency: {% if values.deviceCoverage === 'high' %}5{% elif values.deviceCoverage === 'medium' %}3{% else %}1{% endif %}
  metadata:
    tags:
      - ${{ values.repoName }}
      - idp-device-farm

{% if values.platform === 'ios' %}
xcuitest:
  app: ./app.ipa
  testApp: ./tests.zip
{% else %}
espresso:
  app: ./android/app/build/outputs/apk/debug/app-debug.apk
  testApp: ./android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
{% endif %}

suites:
  - name: ${{ values.repoName }} — ${{ values.deviceCoverage }} coverage
{% if values.platform === 'ios' %}
    devices:
      - name: "iPhone 14"
        platformVersion: "16"
{%- if values.deviceCoverage !== 'low' %}
      - name: "iPhone 13"
        platformVersion: "15"
      - name: "iPhone 12"
        platformVersion: "14"
{%- endif %}
{%- if values.deviceCoverage === 'high' %}
      - name: "iPhone 15"
        platformVersion: "17"
      - name: "iPad Air 4"
        platformVersion: "14"
{%- endif %}
{% else %}
    devices:
      - name: "Google Pixel 6"
        platformVersion: "13"
{%- if values.deviceCoverage !== 'low' %}
      - name: "Samsung Galaxy S21"
        platformVersion: "12"
      - name: "Xiaomi Redmi Note 9"
        platformVersion: "10"
{%- endif %}
{%- if values.deviceCoverage === 'high' %}
      - name: "Google Pixel 7"
        platformVersion: "13"
      - name: "Samsung Galaxy Tab S8"
        platformVersion: "12"
{%- endif %}
{% endif %}

artifacts:
  download:
    when: always
    match:
      - "*.xml"
    directory: ./sauce-results/
