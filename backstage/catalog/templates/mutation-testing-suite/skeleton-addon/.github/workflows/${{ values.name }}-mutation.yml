name: ${{ values.name }} Mutation Tests

# Stryker has nothing to mutate until source code is wired up; run on
# demand or weekly schedule once the suite has real production code paths.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'

jobs:
  mutation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test-suites/${{ values.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: test-suites/${{ values.name }}/package.json

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      # Mutation testing mutates the code in this repo and re-runs its tests. A
      # freshly scaffolded suite has the Stryker config but no code yet, so skip
      # with a notice instead of failing until there is something to mutate.
      - name: Check there is code to mutate
        id: code
        run: |
          if git ls-files -- '*.js' '*.ts' '*.mjs' '*.cjs' | grep -vE '(^|/)(stryker\.config|jest\.config|\.mocharc|jasmine)\.' | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Mutation tests skipped::No JavaScript/TypeScript source to mutate yet. Add your code and its tests (or use add-to-existing mode to run Stryker in the service repo), then re-run."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Stryker mutation tests
        if: steps.code.outputs.present == 'true'
        run: npm test

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-report-${{ values.name }}
          path: test-suites/${{ values.name }}/reports/mutation/
          retention-days: 30
