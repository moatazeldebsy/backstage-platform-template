name: ${{ values.name }} Visual Regression Tests

on:
  push:
    branches: [main]
    paths:
      - 'test-suites/${{ values.name }}/**'
  pull_request:
    branches: [main]
    paths:
      - 'test-suites/${{ values.name }}/**'

env:
  BASE_URL: '${{ values.baseUrl }}'

jobs:
  visual:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test-suites/${{ values.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Pre-flight — skip if BASE_URL is not reachable
        id: preflight
        working-directory: .
        run: |
          if [ -z "${BASE_URL}" ] || [ "${BASE_URL}" = "http://localhost:3000" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::BASE_URL not configured — first-run skip."
            exit 0
          fi
          if ! curl -fsS --max-time 5 "${BASE_URL%/}/" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::BASE_URL (${BASE_URL}) not reachable from runner — skipping."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.skip != 'true'
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: test-suites/${{ values.name }}/package.json

      - if: steps.preflight.outputs.skip != 'true'
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
{%- if values.cloudGrid === 'none' %}
      - if: steps.preflight.outputs.skip != 'true'
        run: npx playwright install chromium --with-deps
{%- endif %}

      # A cloud grid replaces the runner-local run rather than adding a second
      # job: a screenshot baseline captured on one renderer will not match
      # another, so the suite must run in exactly one place.
{%- if values.cloudGrid === 'sauce-labs' %}
      - name: Run visual regression tests on Sauce Labs
        if: steps.preflight.outputs.skip != 'true'
        run: |
          set -euo pipefail
          curl -sSL https://saucelabs.github.io/saucectl/install | bash -s -- -b .
          ./saucectl run --config .sauce/config.yml
        env:
          SAUCE_USERNAME: ${{ '${{ secrets.SAUCE_USERNAME }}' }}
          SAUCE_ACCESS_KEY: ${{ '${{ secrets.SAUCE_ACCESS_KEY }}' }}
{%- else %}
      # There is nothing to compare against until a baseline is committed, so
      # the first run used to fail on every screenshot ("A snapshot doesn't
      # exist"). Without one, capture it instead and hand it back to commit.
      - name: Run visual regression tests
        id: visual
        if: steps.preflight.outputs.skip != 'true'
        run: |
          if compgen -G "tests/*-snapshots" >/dev/null; then
            npm test
          else
            echo "::notice::No baseline screenshots yet — captured them instead of comparing. Download the visual-baseline-${{ values.name }} artifact and commit its tests/*-snapshots/ directory to start comparing."
            npm test -- --update-snapshots
            echo "baseline=created" >> "$GITHUB_OUTPUT"
          fi
{%- if values.cloudGrid === 'lambdatest' %}
        env:
          LT_USERNAME: ${{ '${{ secrets.LT_USERNAME }}' }}
          LT_ACCESS_KEY: ${{ '${{ secrets.LT_ACCESS_KEY }}' }}
{%- elif values.cloudGrid === 'browserstack' %}
        env:
          BROWSERSTACK_USERNAME: ${{ '${{ secrets.BROWSERSTACK_USERNAME }}' }}
          BROWSERSTACK_ACCESS_KEY: ${{ '${{ secrets.BROWSERSTACK_ACCESS_KEY }}' }}
{%- endif %}
{%- endif %}

      - name: Upload new baseline
        uses: actions/upload-artifact@v4
        if: steps.visual.outputs.baseline == 'created'
        with:
          name: visual-baseline-${{ values.name }}
          path: test-suites/${{ values.name }}/tests/*-snapshots/
          retention-days: 30

      - name: Upload diff artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff-${{ values.name }}
          path: test-suites/${{ values.name }}/test-results/
          retention-days: 7
