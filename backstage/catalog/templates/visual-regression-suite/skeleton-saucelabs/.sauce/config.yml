# Sauce Labs saucectl configuration for ${{ values.name }}.
#
# Sauce Labs has no Playwright CDP endpoint, so unlike LambdaTest and
# BrowserStack it cannot be reached through `connectOptions` in
# playwright.config.ts. saucectl uploads the suite and runs it on Sauce VMs
# using the project's own Playwright config instead — which is why
# playwright.config.ts is left in its plain local-runner form for this provider.
#
# Generated by the scaffolder template; safe to edit.
apiVersion: v1alpha
kind: playwright

sauce:
  region: us-west-1
  concurrency: 2
  metadata:
    tags:
      - ${{ values.name }}
      - idp-cloud-grid

playwright:
  version: 1.44.0
  configFile: playwright.config.ts

rootDir: ./

suites:
  - name: ${{ values.name }} — chromium
    platformName: "Windows 11"
    params:
      browserName: chromium
      project: chromium
    env:
      BASE_URL: ${{ values.baseUrl }}
  - name: ${{ values.name }} — webkit
    platformName: "macOS 13"
    params:
      browserName: webkit
      project: webkit
    env:
      BASE_URL: ${{ values.baseUrl }}

artifacts:
  download:
    when: always
    match:
      - "*.xml"
    directory: ./sauce-results/
