name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

env:
  APP_NAME: ${{ values.name }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  quality:
    name: Lint + Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Format check (prettier)
        run: |
          npx --yes prettier --check "src/**/*.{ts,tsx,js,jsx,json,css}" || \
            { echo "Run 'npx prettier --write src' locally and commit."; exit 1; }

      - name: npm audit (high+critical, prod deps only)
        run: npm audit --audit-level=high --omit=dev

      - name: Trivy filesystem scan (deps + secrets)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scanners: 'vuln,secret,misconfig'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

  test:
    name: Test + Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage (70% threshold)
        run: |
          npx vitest run \
            --coverage \
            --coverage.provider=v8 \
            --coverage.reporter=text-summary \
            --coverage.reporter=lcov \
            --coverage.reporter=cobertura \
            --coverage.thresholds.lines=70 \
            --coverage.thresholds.statements=70 \
            --coverage.thresholds.functions=70 \
            --coverage.thresholds.branches=60 \
            --reporter=default \
            --reporter=junit \
            --outputFile.junit=junit.xml

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            junit.xml
          retention-days: 7

      - name: Build
        run: npm run build

      - name: Build Docker image (smoke check)
        run: docker build -t ${{ '${{ env.APP_NAME }}' }}:ci .

      - name: Smoke-test container
        run: |
          docker run -d --name app -p 8080:8080 ${{ '${{ env.APP_NAME }}' }}:ci
          sleep 3
          curl -sf --retry 5 --retry-delay 2 --retry-connrefused \
            http://localhost:8080/healthz
          curl -sf --retry 5 --retry-delay 2 --retry-connrefused \
            http://localhost:8080/ready
          docker stop app && docker rm app

  publish:
    needs: [test, quality]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write  # OIDC, to assume AWS_ROLE_ARN for the ECR push
    env:
      AWS_ROLE_ARN: ${{ '${{ secrets.AWS_ROLE_ARN }}' }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ '${{ github.actor }}' }}
          password: ${{ '${{ secrets.GITHUB_TOKEN }}' }}

      - name: Build and push image
        id: build
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE=ghcr.io/${{ values.githubOrg }}/${{ values.repoName }}
          docker build -t ${IMAGE}:${SHORT_SHA} -t ${IMAGE}:latest .
          docker push ${IMAGE}:${SHORT_SHA}
          docker push ${IMAGE}:latest
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"

      # AWS: ArgoCD deploys this service from its ECR repository (the image the
      # platform repo's services/${{ values.name }}/helm-values-aws.yaml names), so the
      # image goes there too. A repo scaffolded for AWS has AWS_ROLE_ARN: a role
      # only this repo's main branch can assume, allowed to push only to that
      # repository. Without it (a local scaffold) these steps skip.
      - name: Configure AWS credentials (ECR push)
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ '${{ env.AWS_ROLE_ARN }}' }}
          aws-region: ${{ values.awsRegion }}

      - name: Log in to ECR
        id: ecr
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        if: env.AWS_ROLE_ARN != ''
        run: |
          IMAGE=ghcr.io/${{ values.githubOrg }}/${{ values.repoName }}
          ECR_IMAGE=${{ '${{ steps.ecr.outputs.registry }}' }}/${{ values.ecrRepository }}
          for tag in "${SHORT_SHA}" latest; do
            docker tag "${IMAGE}:${tag}" "${ECR_IMAGE}:${tag}"
            docker push "${ECR_IMAGE}:${tag}"
          done

      - name: Update image tag in platform repo
        env:
          GH_TOKEN: ${{ '${{ secrets.GH_PAT }}' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT not set — platform repo image tag update skipped"
            exit 0
          fi
          git config --global user.email "ci@idp.platform"
          git config --global user.name "IDP CI Bot"
          PLATFORM_DIR=$(mktemp -d)
          git clone https://x-access-token:${GH_TOKEN}@github.com/${{ values.githubOrg }}/backstage-platform-template.git "$PLATFORM_DIR"
          cd "$PLATFORM_DIR"
          VALUES_FILE="services/${{ values.name }}/helm-values-aws.yaml"
          if [ -f "${VALUES_FILE}" ]; then
            sed -i "s|^  tag: .*|  tag: \"${SHORT_SHA}\"|" "${VALUES_FILE}"
            git add "${VALUES_FILE}"
            git diff --cached --quiet || git commit -m "chore: bump ${{ values.name }} image to ${SHORT_SHA} [skip ci]"
            git push
          else
            echo "Values file not found at ${VALUES_FILE} — merge the Platform GitOps PR first"
          fi
