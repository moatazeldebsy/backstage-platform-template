replicaCount: 1

image:
  repository: localhost:5003/${{ values.name }}
  tag: "local"
  pullPolicy: IfNotPresent

service:
  port: 80
  # nginx in this app's image listens on 8080 (Dockerfile EXPOSE, nginx.conf).
  # This used to be the template value `port`, which the template never passes here,
  # so it rendered empty and the Deployment was rejected ("containerPort:
  # Required value") — every React app's local ArgoCD Application failed.
  targetPort: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
  hosts:
    - host: ${{ values.name }}.idp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 64Mi

# No prometheus.io/* annotations: nginx here serves no /metrics (stub_status is
# localhost-only), and the exporter sidecar lives in the app repo's own values,
# which ArgoCD does not read. They used to point Prometheus at an empty port.

podLabels:
  team: "${{ values.owner | replace('group:default/', '') | replace('user:default/', '') | replace(':', '-') | replace('/', '-') }}"
  cost-center: "${{ values.costCenter }}"
  environment: local
  app.kubernetes.io/part-of: internal-developer-platform

metrics:
  enabled: true

env:
  - name: LOG_LEVEL
    value: debug
  - name: ENVIRONMENT
    value: local

labels:
  backstage.io/kubernetes-id: ${{ values.name }}
