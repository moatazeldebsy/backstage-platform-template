# Incremental-build tooling for JVM services — see docs/monorepo-build-tooling.md.
# Local build cache: skips re-executing tasks whose inputs haven't changed.
org.gradle.caching=true
# Parallel execution across independent subprojects/tasks.
org.gradle.parallel=true
# Persistent daemon reduces JVM startup cost across local `gradle` invocations
# (CI already disables this per-invocation via --no-daemon in ci.yml/Dockerfile).
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx2g
