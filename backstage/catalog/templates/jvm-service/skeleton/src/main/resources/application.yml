server:
  port: ${{ values.port }}

spring:
  application:
    name: ${{ values.name }}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${{ values.name }}

logging:
  level:
    root: INFO
