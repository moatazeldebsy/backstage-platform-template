name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Vitest Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run vitest with coverage + JUnit
        run: npx vitest run --coverage --reporter=junit --outputFile=test-results.xml

      - name: Enforce coverage threshold (${{ values.coverageThreshold }}%)
        run: |
          # vitest writes coverage-summary.json under ./coverage/
          node -e "
            const s = require('./coverage/coverage-summary.json').total.lines.pct;
            const t = ${{ values.coverageThreshold }};
            if (s < t) { console.error('FAIL: coverage ' + s + '% < threshold ' + t + '%'); process.exit(1); }
            console.log('PASS: coverage ' + s + '% >= ' + t + '%');
          "

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            coverage/
          retention-days: 7
