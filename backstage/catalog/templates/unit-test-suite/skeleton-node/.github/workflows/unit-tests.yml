name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Coverage gate is advisory on first run so the CI goes green before tests
  # catch up to the configured threshold. Delete this line once your suite
  # consistently meets ${{ values.coverageThreshold }}% to enforce it.
  COVERAGE_ADVISORY: 'true'

jobs:
  unit:
    name: Vitest Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run vitest with coverage + JUnit
        run: npx vitest run --coverage --reporter=junit --outputFile=test-results.xml

      - name: Enforce coverage threshold (${{ values.coverageThreshold }}%)
        run: |
          if [ ! -f ./coverage/coverage-summary.json ]; then
            echo "::notice::No coverage summary produced — skipping coverage gate."
            exit 0
          fi
          # vitest writes coverage-summary.json under ./coverage/
          node -e "
            const s = require('./coverage/coverage-summary.json').total.lines.pct;
            const t = ${{ values.coverageThreshold }};
            if (s < t) {
              if (process.env.COVERAGE_ADVISORY === 'true') {
                console.log('::warning::coverage ' + s + '% < threshold ' + t + '% (advisory — remove COVERAGE_ADVISORY from workflow env to enforce)');
                process.exit(0);
              }
              console.error('FAIL: coverage ' + s + '% < threshold ' + t + '%');
              process.exit(1);
            }
            console.log('PASS: coverage ' + s + '% >= ' + t + '%');
          "

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            coverage/
          retention-days: 7
