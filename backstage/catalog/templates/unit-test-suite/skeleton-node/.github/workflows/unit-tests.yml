name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Coverage gate is advisory on first run so the CI goes green before tests
  # catch up to the configured threshold. Delete this line once your suite
  # consistently meets ${{ values.coverageThreshold }}% to enforce it.
  COVERAGE_ADVISORY: 'true'

jobs:
  unit:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      # Runs the repo's own tests with the runner it already uses. This used to
      # assume Vitest (and ship a vitest.config.ts over any existing one), so on
      # a Jest repo — the golden-path nodejs-service — it could not even start.
      - name: Detect test runner
        id: runner
        run: |
          runner=$(node -e "
            const p = require('./package.json');
            const d = { ...p.dependencies, ...p.devDependencies };
            console.log(d.vitest ? 'vitest' : d.jest ? 'jest' : '');
          ")
          if [ -z "$runner" ]; then
            echo "::notice::No Jest or Vitest in package.json — using Vitest. Add it as a devDependency and write tests under src/."
            npm install --no-save --no-audit --no-fund vitest
            runner=vitest
          fi
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "Test runner: $runner"

      - name: Run Jest with coverage + JUnit
        if: steps.runner.outputs.runner == 'jest'
        run: |
          npm install --no-save --no-audit --no-fund jest-junit
          npx jest --ci --passWithNoTests \
            --coverage --coverageDirectory=coverage \
            --coverageReporters=json-summary --coverageReporters=text \
            --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_FILE: test-results.xml

      - name: Run Vitest with coverage + JUnit
        if: steps.runner.outputs.runner == 'vitest'
        run: |
          # The coverage provider must match the installed Vitest version.
          npm install --no-save --no-audit --no-fund "@vitest/coverage-v8@$(node -p "require('vitest/package.json').version")"
          npx vitest run --passWithNoTests \
            --coverage.enabled --coverage.provider=v8 --coverage.reportsDirectory=coverage \
            --coverage.reporter=json-summary --coverage.reporter=text \
            --reporter=default --reporter=junit --outputFile.junit=test-results.xml

      - name: Enforce coverage threshold (${{ values.coverageThreshold }}%)
        run: |
          if [ ! -f ./coverage/coverage-summary.json ]; then
            echo "::notice::No coverage summary produced — skipping coverage gate."
            exit 0
          fi
          node -e "
            const s = require('./coverage/coverage-summary.json').total.lines.pct;
            const t = ${{ values.coverageThreshold }};
            if (s < t) {
              if (process.env.COVERAGE_ADVISORY === 'true') {
                console.log('::warning::coverage ' + s + '% < threshold ' + t + '% (advisory — remove COVERAGE_ADVISORY from workflow env to enforce)');
                process.exit(0);
              }
              console.error('FAIL: coverage ' + s + '% < threshold ' + t + '%');
              process.exit(1);
            }
            console.log('PASS: coverage ' + s + '% >= ' + t + '%');
          "

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            coverage/
          if-no-files-found: ignore
          retention-days: 7
