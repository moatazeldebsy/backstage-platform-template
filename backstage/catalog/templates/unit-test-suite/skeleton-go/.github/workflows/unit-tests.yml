name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Coverage gate is advisory on first run so the CI goes green before tests
  # catch up to the configured threshold. Delete this line once your suite
  # consistently meets ${{ values.coverageThreshold }}% to enforce it.
  COVERAGE_ADVISORY: 'true'

jobs:
  unit:
    name: Go Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install go-junit-report
        run: go install github.com/jstemmer/go-junit-report/v2@latest

      - name: Run tests with coverage
        run: |
          set -o pipefail
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./... 2>&1 \
            | tee /tmp/go-test.log
          go-junit-report -in /tmp/go-test.log -out test-results.xml || true

      - name: Enforce coverage threshold (${{ values.coverageThreshold }}%)
        run: |
          if [ ! -f coverage.out ]; then
            echo "::notice::No coverage profile produced — skipping coverage gate."
            exit 0
          fi
          COVERAGE=$(go tool cover -func=coverage.out | awk '/total:/ {print substr($3, 1, length($3)-1)}')
          echo "Total coverage: ${COVERAGE}%"
          if awk -v c="$COVERAGE" -v t=${{ values.coverageThreshold }} 'BEGIN { exit !(c+0 < t+0) }'; then
            if [ "${COVERAGE_ADVISORY:-false}" = "true" ]; then
              echo "::warning::coverage ${COVERAGE}% < threshold ${{ values.coverageThreshold }}% (advisory — remove COVERAGE_ADVISORY from workflow env to enforce)"
              exit 0
            fi
            echo "FAIL: coverage ${COVERAGE}% < threshold ${{ values.coverageThreshold }}%"
            exit 1
          fi
          echo "PASS: coverage ${COVERAGE}% >= ${{ values.coverageThreshold }}%"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.out
          retention-days: 7
