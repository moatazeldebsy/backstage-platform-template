name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Go Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install go-junit-report
        run: go install github.com/jstemmer/go-junit-report/v2@latest

      - name: Run tests with coverage
        run: |
          set -o pipefail
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./... 2>&1 \
            | tee /tmp/go-test.log
          go-junit-report -in /tmp/go-test.log -out test-results.xml || true

      - name: Enforce coverage threshold (${{ values.coverageThreshold }}%)
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | awk '/total:/ {print substr($3, 1, length($3)-1)}')
          echo "Total coverage: ${COVERAGE}%"
          awk -v c="$COVERAGE" -v t=${{ values.coverageThreshold }} 'BEGIN { if (c+0 < t+0) { print "FAIL: coverage " c "% < threshold " t "%"; exit 1 } else { print "PASS"; exit 0 } }'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.out
          retention-days: 7
