name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: pytest Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install -r requirements-dev.txt 2>/dev/null || true
          pip install pytest pytest-cov pytest-junitxml

      - name: Run pytest with coverage + JUnit
        run: |
          pytest --cov=. --cov-report=term --cov-report=xml --cov-report=html \
                 --junitxml=test-results.xml \
                 --cov-fail-under=${{ values.coverageThreshold }} \
                 tests/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml
            htmlcov/
          retention-days: 7
