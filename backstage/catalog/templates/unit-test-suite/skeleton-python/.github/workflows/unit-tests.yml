name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Coverage gate is advisory on first run so the CI goes green before tests
  # catch up to the configured threshold. Delete this line once your suite
  # consistently meets ${{ values.coverageThreshold }}% to enforce it.
  COVERAGE_ADVISORY: 'true'

jobs:
  unit:
    name: pytest Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The service's own dependencies, however it declares them. The
          # golden-path python-service only has requirements.txt, which this
          # step never installed, so every test failed on its first import.
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" || pip install -e .; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          # JUnit output is built into pytest (--junitxml); there is no
          # pytest-junitxml package, and asking pip for it failed the job.
          pip install pytest pytest-cov

      - name: Run pytest with coverage + JUnit
        run: |
          # On first run (COVERAGE_ADVISORY=true) the coverage gate is downgraded
          # to a warning so a brownfield repo doesn't fail before tests catch up.
          set +e
          pytest --cov=. --cov-report=term --cov-report=xml --cov-report=html \
                 --junitxml=test-results.xml \
                 --cov-fail-under=${{ values.coverageThreshold }} \
                 tests/
          STATUS=$?
          set -e
          # pytest exits 2 when --cov-fail-under is the only failure
          if [ "$STATUS" -eq 0 ]; then exit 0; fi
          if [ "$STATUS" -eq 2 ] && [ "${COVERAGE_ADVISORY:-false}" = "true" ]; then
            echo "::warning::coverage below threshold ${{ values.coverageThreshold }}% (advisory — remove COVERAGE_ADVISORY from workflow env to enforce)"
            exit 0
          fi
          exit "$STATUS"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml
            htmlcov/
          retention-days: 7
