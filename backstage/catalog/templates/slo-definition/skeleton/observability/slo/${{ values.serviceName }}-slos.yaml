# Sloth SLO definitions for ${{ values.serviceName }}
# Generated by the 'Define Service SLOs' Backstage template.
#
# No Sloth operator runs in-cluster, so this file is not read at runtime. Generate
# the PrometheusRule (the slo-drift CI check fails until it is committed):
#   ./scripts/generate-slo-rules.sh
# Apply with:
#   kubectl apply -f observability/slo/generated/${{ values.serviceName }}-slo-rules.yaml

apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: ${{ values.serviceName }}
  namespace: monitoring
  labels:
    app: ${{ values.serviceName }}
    team: ${{ values.team }}
    # Prometheus Operator's Prometheus object only picks up PrometheusRules
    # matching ruleSelector.matchLabels (release: prometheus) — without this,
    # sloth's generated rules are applied but silently never evaluated.
    release: prometheus
spec:
  service: ${{ values.serviceName }}
  labels:
    team: ${{ values.team }}
    env: production

  slos:
    - name: requests-availability
      objective: ${{ values.availabilityObjective }}
      description: "${{ values.availabilityObjective }}% of ${{ values.serviceName }} HTTP requests must succeed (non-5xx)"
      sli:
        events:
          errorQuery: |
            sum(rate(http_requests_total{job="${{ values.httpMetricJob }}", code=~"5.."}[{{.window}}]))
          totalQuery: |
            sum(rate(http_requests_total{job="${{ values.httpMetricJob }}"}[{{.window}}]))
      alerting:
        name: ${{ values.serviceName | capitalize }}HighErrorRate
        labels:
          category: availability
          team: ${{ values.team }}
        annotations:
          runbook: "${{ values.runbookUrl }}"
          {% if values.pagerdutyServiceId %}
          pagerduty_service_id: "${{ values.pagerdutyServiceId }}"
          {% endif %}
        pageAlert:
          labels:
            severity: critical
        ticketAlert:
          labels:
            severity: warning

    - name: requests-latency
      objective: ${{ values.latencyObjective }}
      description: "${{ values.latencyObjective }}% of ${{ values.serviceName }} requests must complete within ${{ values.latencyThresholdMs }}ms"
      sli:
        events:
          errorQuery: |
            sum(rate(http_request_duration_seconds_bucket{job="${{ values.httpMetricJob }}", le="${{ values.latencyThresholdSeconds }}"}[{{.window}}]))
          totalQuery: |
            sum(rate(http_request_duration_seconds_count{job="${{ values.httpMetricJob }}"}[{{.window}}]))
      alerting:
        name: ${{ values.serviceName | capitalize }}HighLatency
        labels:
          category: latency
          team: ${{ values.team }}
        annotations:
          runbook: "${{ values.runbookUrl }}"
        pageAlert:
          labels:
            severity: critical
        ticketAlert:
          labels:
            severity: warning
