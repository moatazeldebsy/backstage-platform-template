sonar.projectKey=${{ values.githubOrg }}_${{ values.repoName }}
sonar.organization=${{ values.githubOrg }}
sonar.projectName=${{ values.name }}
sonar.host.url=https://sonarcloud.io

sonar.sources=src
sonar.tests=tests
sonar.exclusions=**/__pycache__/**,**/.venv/**,**/tests/**

sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=junit.xml

sonar.sourceEncoding=UTF-8
