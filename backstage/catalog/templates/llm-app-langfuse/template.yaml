apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: llm-app-langfuse
  annotations:
    backstage.io/techdocs-ref: dir:.
    idp.io/experience-level: intermediate
    idp.io/topic: golden-path
    idp.io/tutorial-type: template
  title: LLM App (Python + Langfuse)
  description: >
    Scaffold a Python FastAPI service that calls Claude and reports every model call to the
    platform's Langfuse instance — prompt, completion, token counts, cost and latency. Ships with
    the telemetry module already wired, Helm values for local and AWS, CI with a coverage gate, and
    the catalog annotation that lights up the Langfuse tab on the entity page.
  tags:
    - llm
    - ai
    - langfuse
    - python
    - fastapi
    - golden-path
    - local
    - aws
    - v1
    - blessed
spec:
  owner: platform-team
  type: service

  parameters:
    - title: Service Details
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: Service Name
          type: string
          description: Unique service name (lowercase, hyphens only)
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
          ui:autofocus: true
        description:
          title: Description
          type: string
        owner:
          title: Owner
          type: string
          description: Team or user owning this service
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group

    - title: Model & Tracing
      properties:
        model:
          title: Claude Model
          type: string
          default: claude-opus-5
          description: >
            Opus 5 is the current default for complex work. Sonnet 5 trades some capability for
            cost; Haiku 4.5 is for simple, latency-sensitive calls.
          enum:
            - claude-opus-5
            - claude-sonnet-5
            - claude-haiku-4-5
          enumNames:
            - Claude Opus 5 (most capable)
            - Claude Sonnet 5 (balanced)
            - Claude Haiku 4.5 (fastest, cheapest)
        effort:
          title: Effort Level
          type: string
          default: medium
          description: >
            How much the model thinks before answering. Raise it for hard reasoning, lower it for
            latency-sensitive endpoints.
          enum: [low, medium, high, xhigh, max]
        captureIo:
          title: Capture prompt and completion text in traces
          type: boolean
          description: >
            Records the actual prompts and model outputs on each Langfuse span. Leave OFF unless
            you are certain the service never handles personal or otherwise sensitive data.
          default: false
        sampleRate:
          title: Trace sample rate
          type: number
          description: Fraction of root traces to record, 0.0–1.0.
          default: 1.0
          minimum: 0
          maximum: 1

    - title: Infrastructure
      properties:
        port:
          title: Container Port
          type: integer
          default: 8000
        costCenter:
          title: Cost Center
          type: string
          description: "Team cost center code for OpenCost attribution (e.g. eng-platform, eng-product)"
          default: eng-platform

    - title: Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: GitHub Repository
          type: string
          ui:field: RepoUrlPicker
          ui:help: "Repository name must not already exist on GitHub. If you get a 'name already exists' error, choose a different name."
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - moatazeldebsy

    - title: Deployment Target
      properties:
        deployTarget:
          title: Where will this service run?
          type: string
          default: local
          enum: [local, aws]
          enumNames: ['Local (Kind / Rancher Desktop)', 'AWS (EKS)']
          ui:widget: radio
        awsRoleArn:
          title: AWS IAM Role ARN for CI/CD (AWS only)
          type: string
          description: "OIDC role ARN used by GitHub Actions to push images to ECR."
          ui:help: "Leave blank for local deployments."
        clusterName:
          title: Cluster Name (AWS only)
          type: string
          default: idp-mvp
        awsRegion:
          title: AWS Region (AWS only)
          type: string
          default: us-east-1
          ui:help: "Leave blank for local deployments."

  steps:
    - id: fetch-template
      name: Fetch Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          port: ${{ parameters.port }}
          model: ${{ parameters.model }}
          effort: ${{ parameters.effort }}
          captureIo: ${{ parameters.captureIo }}
          sampleRate: ${{ parameters.sampleRate }}
          costCenter: ${{ parameters.costCenter }}
          githubOrg: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          repoName: ${{ (parameters.repoUrl | parseRepoUrl).repo }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        gitCommitMessage: "chore: initial scaffold via IDP"
        topics:
          - python
          - llm
          - langfuse
          - idp-service

    - id: provision-ecr
      name: Provision ECR Repository
      if: ${{ parameters.deployTarget === 'aws' }}
      action: idp:provision-ecr
      continueOnError: true
      input:
        serviceName: ${{ parameters.name }}
        clusterName: ${{ parameters.clusterName }}
        awsRegion: ${{ parameters.awsRegion }}

    - id: set-repo-secrets
      name: Configure CI/CD Secrets
      action: idp:repo:set-secrets
      input:
        repoUrl: ${{ steps.publish.output.remoteUrl }}
        secrets:
          AWS_ROLE_ARN: ${{ parameters.awsRoleArn }}

    - id: register
      name: Register in Catalog
      action: catalog:register
      continueOnError: true
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

    - id: register-local
      name: Register in Local Catalog (fallback when no GitHub token)
      if: ${{ parameters.deployTarget === 'local' }}
      action: idp:catalog-register-local
      input:
        entityName: ${{ parameters.name }}
        entityKind: Component
        entityType: service
        owner: ${{ parameters.owner }}
        description: ${{ parameters.description }}
        annotations:
          backstage.io/source-location: ${{ parameters.repoUrl }}
          backstage.io/techdocs-ref: dir:.
          langfuse.com/service-name: ${{ parameters.name }}

    - id: fetch-platform-values
      name: Prepare Platform GitOps Values
      action: fetch:template
      input:
        url: ./platform-values
        targetPath: ./platform-values
        values:
          name: ${{ parameters.name }}
          githubOrg: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          repoName: ${{ (parameters.repoUrl | parseRepoUrl).repo }}
          port: ${{ parameters.port }}
          owner: ${{ parameters.owner }}
          costCenter: ${{ parameters.costCenter }}
          captureIo: ${{ parameters.captureIo }}
          sampleRate: ${{ parameters.sampleRate }}

    - id: platform-pr
      name: Open Platform GitOps PR
      action: publish:github:pull-request
      continueOnError: true
      input:
        repoUrl: github.com?repo=backstage-platform-template&owner=moatazeldebsy
        title: "feat: onboard ${{ parameters.name }} to GitOps"
        branchName: feat/onboard-${{ parameters.name }}
        description: |
          Adds `services/${{ parameters.name }}/` to the platform repo.

          ArgoCD ApplicationSet auto-discovers and deploys this service to the `services-dev`
          namespace once merged. That namespace is already labelled `idp.io/langfuse=enabled`, so
          the service picks up `secret/langfuse-otel` and starts tracing on first rollout.
        sourcePath: ./platform-values
        targetPath: services/${{ parameters.name }}

    - id: seed-image
      name: Seed placeholder image in local registry
      if: ${{ parameters.deployTarget === 'local' }}
      action: idp:seed-image
      input:
        serviceName: ${{ parameters.name }}

  output:
    text:
      - title: Before it will answer a request
        content: |
          The service needs an Anthropic API key. It is **not** created for you — create it once
          in the target namespace:

          ```
          kubectl create secret generic ${{ parameters.name }}-secrets \
            --namespace services-dev \
            --from-literal=ANTHROPIC_API_KEY=sk-ant-...
          ```

          Langfuse credentials are separate and already handled: `services-dev` carries the
          `idp.io/langfuse=enabled` label, so `./scripts/bootstrap-ai.sh --langfuse-keys-only`
          puts `secret/langfuse-otel` there. Both are mounted with `optional: true`, so the pod
          starts either way — it just answers 500s without the API key, and traces nothing
          without Langfuse.
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
      - title: Open Platform GitOps PR
        url: ${{ steps['platform-pr'].output.remoteUrl }}
      - title: AI Observability (Langfuse)
        url: /langfuse
