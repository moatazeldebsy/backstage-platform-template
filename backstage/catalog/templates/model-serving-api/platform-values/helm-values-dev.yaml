replicaCount: 1

image:
  repository: localhost:5003/${{ values.name }}
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: ${{ values.port }}

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: ${{ values.name }}-dev.idp.local
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  - name: LOG_LEVEL
    value: debug
  - name: ENVIRONMENT
    value: dev
  - name: MLFLOW_TRACKING_URI
    value: "http://mlflow.ml-platform.svc.cluster.local:5000"
  - name: MODEL_URI
    value: ""  # Set to models:/<name>/Production after registering a model

podLabels:
  team: "${{ values.owner | replace('group:default/', '') | replace('user:default/', '') }}"
  cost-center: "${{ values.costCenter }}"
  environment: dev
  app.kubernetes.io/part-of: internal-developer-platform
  ml/framework: "${{ values.modelFramework }}"
