apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: 'Model serving API for ${{ values.modelName }} on ${{ values.target }} infrastructure'
  tags:
    - ai
    - model-serving
    - inference
    - llm
    - ${{ values.target }}
  links:
    - title: Model Server Logs
      url: https://github.com/${{ values.githubOrg }}/${{ values.repoName }}/actions
    - title: API Documentation
      url: https://github.com/${{ values.githubOrg }}/${{ values.repoName }}#readme
  annotations:
    github.com/project-slug: ${{ values.githubOrg }}/${{ values.repoName }}
    backstage.io/techdocs-ref: dir:.
    backstage.io/kubernetes-id: ${{ values.name }}
    backstage.io/kubernetes-namespace: ml-platform
    grafana/alert-label-selector: "service=${{ values.name }}"
    idp.io/quality-gates: "coverage,static-analysis,vuln-scan,llm-eval"
    idp.io/model-name: ${{ values.modelName }}
    idp.io/deployment-target: ${{ values.target }}
    sonarcloud.io/project-key: "${{ values.githubOrg }}_${{ values.repoName }}"
    sonarcloud.io/organization: "${{ values.githubOrg }}"
    snyk.io/org-slug: "${{ values.githubOrg }}"
    pagerduty.com/service-id: "${{ values.pagerdutyServiceId }}"
    jira/project-key: "${{ values.jiraProjectKey }}"

spec:
  type: service
  lifecycle: production
  owner: ${{ values.owner }}
  system: idp-platform
  dependsOn:
    - 'resource:mlflow'
    - 'resource:kagent'

  providesApis:
    - ${{ values.name }}-prediction-api

---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: ${{ values.name }}-prediction-api
  title: ${{ values.name }} Prediction API
  description: REST API for ${{ values.modelName }} model predictions
spec:
  type: openapi
  lifecycle: production
  owner: ${{ values.owner }}
  system: idp-platform
  definition: |
    openapi: 3.0.0
    info:
      title: ${{ values.name }} Prediction API
      version: 1.0.0
      description: REST API for ${{ values.modelName }} model predictions
    servers:
      - url: http://${{ values.name }}.idp.local
    paths:
      /v1/completions:
        post:
          summary: Generate text completions
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    prompt:
                      type: string
                    max_tokens:
                      type: integer
                      default: 100
                  required: [prompt]
          responses:
            '200':
              description: Successful response
      /health:
        get:
          summary: Health check
          responses:
            '200':
              description: Service is healthy
      /metrics:
        get:
          summary: Prometheus metrics
          responses:
            '200':
              description: Metrics in Prometheus format
