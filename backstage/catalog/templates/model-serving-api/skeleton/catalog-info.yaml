apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: 'Model serving API for ${{ values.modelName }} on ${{ values.target }} infrastructure'
  tags:
    - ai
    - model-serving
    - inference
    - llm
    - ${{ values.modelName }}
    - ${{ values.target }}
  links:
    - title: Model Server Logs
      url: https://github.com/${{ values.owner }}/${{ values.repoName }}/actions
    - title: API Documentation
      url: /docs
  annotations:
    backstage.io/kubernetes-id: ${{ values.name }}
    idp.io/quality-gates: coverage,static-analysis,vuln-scan,llm-eval

spec:
  type: service
  lifecycle: production
  owner: ${{ values.owner }}
  dependsOn:
    - 'resource:mlflow'
    - 'resource:kagent'

  providesApis:
    - model-prediction-api
    - model-health-api

---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: model-prediction-api
  title: Model Prediction API
  description: REST API for model predictions
spec:
  type: openapi
  lifecycle: production
  owner: ${{ values.owner }}
  definition: |
    openapi: 3.0.0
    info:
      title: Model Prediction API
      version: 1.0.0
      description: REST API for ${{ values.modelName }} model predictions
    servers:
      - url: http://${{ values.name }}.idp.local
    paths:
      /v1/completions:
        post:
          summary: Generate text completions
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    prompt:
                      type: string
                      description: Input prompt
                    max_tokens:
                      type: integer
                      description: Maximum tokens to generate
                      default: 100
                  required: [prompt]
          responses:
            '200':
              description: Successful response
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      choices:
                        type: array
                        items:
                          type: object
                          properties:
                            text:
                              type: string

      /health:
        get:
          summary: Health check endpoint
          responses:
            '200':
              description: Service is healthy

      /readyz:
        get:
          summary: Readiness probe
          responses:
            '200':
              description: Service is ready

---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: model-health-api
  title: Model Health API
  description: Health and metrics endpoints
spec:
  type: openapi
  lifecycle: production
  owner: ${{ values.owner }}
