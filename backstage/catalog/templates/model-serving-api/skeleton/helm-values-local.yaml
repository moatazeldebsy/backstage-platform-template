replicaCount: 1

image:
  repository: localhost:5003/${{ values.name }}
  tag: "local"
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: ${{ values.port }}

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: ${{ values.name }}.idp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "${{ values.port }}"
  prometheus.io/path: "/metrics"

env:
  - name: LOG_LEVEL
    value: debug
  - name: ENVIRONMENT
    value: local
  - name: MLFLOW_TRACKING_URI
    value: "http://mlflow.ml-platform.svc.cluster.local:5000"
  - name: MODEL_URI
    value: ""  # Set to models:/${{ values.name }}/Production after registering a model

labels:
  backstage.io/kubernetes-id: ${{ values.name }}
