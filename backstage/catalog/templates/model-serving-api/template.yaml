apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: model-serving-api
  title: ML Model Serving API
  description: >
    Scaffold a FastAPI model-serving service with /v1/predict, /healthz,
    /ready, /metrics, MLflow model loading, and full GitOps deployment.
  tags:
    - python
    - fastapi
    - ml
    - model-serving
    - golden-path
spec:
  owner: ml-team
  type: service

  parameters:
    - title: Service Details
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: Service Name
          type: string
          description: Unique name for the serving API (lowercase, hyphens only)
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
          ui:autofocus: true
        description:
          title: Description
          type: string
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group

    - title: ML Configuration
      properties:
        modelFramework:
          title: Model Framework
          type: string
          description: Primary ML framework used by this model
          default: sklearn
          enum:
            - sklearn
            - pytorch
            - tensorflow
            - xgboost
            - custom
          enumNames:
            - scikit-learn
            - PyTorch
            - TensorFlow
            - XGBoost
            - Custom (bring your own)
        mlflowExperiment:
          title: MLflow Experiment Name
          type: string
          description: MLflow experiment to link this service to (optional)
          default: ""
        port:
          title: Container Port
          type: integer
          default: 8000
        costCenter:
          title: Cost Center
          type: string
          description: "Team cost center code (e.g. eng-platform, eng-ml)"
          default: eng-ml

    - title: Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: GitHub Repository
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - YOUR_GITHUB_ORG

  steps:
    - id: fetch-template
      name: Fetch Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          port: ${{ parameters.port }}
          modelFramework: ${{ parameters.modelFramework }}
          mlflowExperiment: ${{ parameters.mlflowExperiment }}
          costCenter: ${{ parameters.costCenter }}
          githubOrg: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          repoName: ${{ (parameters.repoUrl | parseRepoUrl).repo }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        gitCommitMessage: "chore: initial scaffold via IDP (model-serving-api)"
        topics:
          - python
          - fastapi
          - ml-serving
          - idp-service

    - id: set-repo-secrets
      name: Configure CI/CD Secrets
      action: idp:repo:set-secrets
      input:
        repoUrl: ${{ steps.publish.output.remoteUrl }}
        secrets:
          AWS_ROLE_ARN: "arn:aws:iam::YOUR_AWS_ACCOUNT_ID:role/idp-mvp-github-actions"

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

    - id: register-api
      name: Register API in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/api-info.yaml'

    - id: fetch-platform-values
      name: Prepare Platform GitOps Values
      action: fetch:template
      input:
        url: ./platform-values
        targetPath: ./platform-values
        values:
          name: ${{ parameters.name }}
          githubOrg: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          port: ${{ parameters.port }}
          owner: ${{ parameters.owner }}
          costCenter: ${{ parameters.costCenter }}

    - id: platform-pr
      name: Open Platform GitOps PR
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=idp-mvp&owner=YOUR_GITHUB_ORG
        title: "feat: onboard ML model serving API ${{ parameters.name }}"
        branchName: feat/onboard-${{ parameters.name }}
        description: |
          Adds `services/${{ parameters.name }}/` to the platform repo.

          ArgoCD ApplicationSet will auto-discover and deploy this model serving
          service to `services-dev` namespace once merged.
        sourcePath: ./platform-values
        targetPath: services/${{ parameters.name }}

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
      - title: Open API
        icon: code
        entityRef: ${{ steps.register-api.output.entityRef }}
      - title: Open Platform GitOps PR
        url: ${{ steps['platform-pr'].output.remoteUrl }}
      - title: MLflow UI
        url: http://mlflow.idp.local
        icon: dashboard
