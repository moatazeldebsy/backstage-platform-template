apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: model-serving-api
  title: Model Serving API
  description: Deploy an ML model as a REST API using Ollama (local) or vLLM (AWS). Serve open-source LLMs for inference with auto-scaling and health probes.
  tags:
    - ai
    - ml
    - serving
    - inference
    - llm
    - ollama
    - vllm
    - v1
    - advanced
  annotations:
    backstage.io/techdocs-ref: dir:.

spec:
  owner: platform-team
  type: service

  parameters:
    - title: Model Server Details
      required: [name, owner]
      properties:
        name:
          title: Model Server Name
          type: string
          description: Lowercase alphanumeric with hyphens (e.g., my-model-server)
          pattern: '^[a-z][a-z0-9-]{2,30}$'
          ui:autofocus: true
        modelName:
          title: Model Name
          type: string
          description: Which model to serve — all run as a lightweight mock API for local demo
          default: phi
          enum:
            - phi
            - tinyllama
            - gemma
          enumNames:
            - 'Phi-3 Mini (Microsoft, 3.8B — fastest)'
            - 'TinyLlama (1.1B — smallest)'
            - 'Gemma 2B (Google, 2B — balanced)'
        owner:
          title: Owner
          type: string
          description: Team owning this model server
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        target:
          title: Deployment Target
          type: string
          description: 'local: Ollama on Kind, aws: vLLM on EKS with GPU'
          enum:
            - local
            - aws
          enumNames:
            - 'Local (Kind, Ollama)'
            - 'AWS EKS (vLLM, GPU)'
          default: local
        pagerdutyServiceId:
          title: PagerDuty Service ID
          type: string
          description: "Optional. Find this in PagerDuty under Services → your service → ID. Example: P1ABC23"
          ui:help: "Leave blank if not using PagerDuty."

    - title: Repository
      required: [repoUrl]
      properties:
        repoUrl:
          title: Repository Location
          type: string
          description: GitHub repository for this model server
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - moatazeldebsy

  steps:
    - id: fetch
      name: Generate model server skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          modelName: ${{ parameters.modelName }}
          owner: ${{ parameters.owner }}
          target: ${{ parameters.target }}
          pagerdutyServiceId: ${{ parameters.pagerdutyServiceId }}
          jiraProjectKey: ${{ parameters.jiraProjectKey }}
          repoName: ${{ parameters.repoUrl | parseRepoUrl | pick('repo') }}
          # The skeleton previously built project-slug from `owner`, which is a
          # Backstage group ref — it produced a slug like
          # "group:default/ml-team/<repo>" and the entity page 404'd against
          # api.github.com. See the note in mlflow-experiment/template.yaml.
          githubOrg: ${{ parameters.repoUrl | parseRepoUrl | pick('owner') }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: 'Model Serving API — ${{ parameters.modelName }} on ${{ parameters.target }}'
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        gitCommitMessage: 'chore: scaffold model serving API via IDP'
        topics:
          - model-serving
          - inference
          - llm
          - idp
          - ${{ parameters.target }}

    - id: deploy
      name: Deploy Model Server
      action: idp:deploy-model-server
      input:
        name: ${{ parameters.name }}
        modelName: ${{ parameters.modelName }}
        target: ${{ parameters.target }}

    # Registration runs LAST on purpose. A failing step aborts the whole task —
    # there is no per-step "continue on error" in Backstage — and catalog:register
    # is the most failure-prone step here (it validates the rendered entity, needs a
    # token, and talks to two services). Failing last leaves fully scaffolded output
    # that only needs re-registering, instead of skipping the steps below.
    - id: catalog
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Catalog Entity
        icon: catalog
        entityRef: ${{ steps.catalog.output.entityRef }}
      - title: Model Server
        url: ${{ steps.deploy.output.serverUrl }}
        icon: dashboard
