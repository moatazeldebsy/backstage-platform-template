{% if values.iamRoleArn %}
# Namespace-scoped SecretStore for team ${{ values.teamName }}.
# Uses IRSA: the ESO ServiceAccount below is annotated with the team's IAM role.
# The role must allow secretsmanager:GetSecretValue on /${{ values.teamName }}/* in Secrets Manager.
# To create the IAM role, run:
#   terraform apply -var="team_name=${{ values.teamName }}" -target=module.team_secret_store
apiVersion: v1
kind: ServiceAccount
metadata:
  name: team-${{ values.teamName }}-eso-sa
  namespace: team-${{ values.teamName }}
  labels:
    team: ${{ values.teamName }}
    managed-by: idp-backstage
  annotations:
    eks.amazonaws.com/role-arn: ${{ values.iamRoleArn }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: team-${{ values.teamName }}-secrets
  namespace: team-${{ values.teamName }}
  labels:
    team: ${{ values.teamName }}
    managed-by: idp-backstage
spec:
  provider:
    aws:
      service: SecretsManager
      region: ${{ values.awsRegion }}
      auth:
        jwt:
          serviceAccountRef:
            name: team-${{ values.teamName }}-eso-sa
            namespace: team-${{ values.teamName }}
{% endif %}
