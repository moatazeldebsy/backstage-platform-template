apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: team-namespace
  annotations:
    backstage.io/techdocs-ref: dir:.
  title: Provision Team Namespace
  description: >-
    Self-service team onboarding — creates a Kubernetes namespace, RBAC bindings,
    ArgoCD project, resource quotas, and a Backstage Group entity in one step.
    Choose a sizing tier (Small / Medium / Large) and quotas are applied automatically.
  tags:
    - platform
    - kubernetes
    - onboarding
    - self-service
    - local
    - aws
spec:
  owner: platform-team
  type: infrastructure

  parameters:
    - title: Team Information
      required:
        - teamName
        - ownerGroup
        - costCenter
      properties:
        teamName:
          title: Team name
          type: string
          description: Lowercase, alphanumeric + hyphens (e.g. payments, auth-team)
          pattern: '^[a-z][a-z0-9-]{1,28}[a-z0-9]$'
          ui:autofocus: true
        ownerGroup:
          title: Owner group
          type: string
          description: Backstage group that owns this namespace
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        costCenter:
          title: Cost center
          type: string
          description: Billing tag applied to all resources (e.g. CC-1234)
        githubTeam:
          title: GitHub team slug (optional)
          type: string
          description: >-
            GitHub team whose members will be listed in the Backstage Group entity
            (e.g. payments-team). Leave blank to manage members manually.

    - title: Sizing Tier
      properties:
        tier:
          title: Team tier
          type: string
          default: small
          description: >-
            Controls resource quotas enforced in the namespace.
            Small: 4 CPU / 8Gi. Medium: 16 CPU / 32Gi. Large: LimitRange defaults only.
          enum:
            - small
            - medium
            - large
          enumNames:
            - 'Small  — ≤ 25 teams / ≤ 150 engineers  (4 CPU · 8Gi · 30 pods)'
            - 'Medium — 26–75 teams / 150–750 engineers (16 CPU · 32Gi · 100 pods)'
            - 'Large  — 75+ teams / 750+ engineers      (LimitRange defaults · no hard cap)'

    - title: Platform repo
      required:
        - githubOrg
        - platformRepo
      properties:
        githubOrg:
          title: GitHub organisation
          type: string
          default: moatazeldebsy
        platformRepo:
          title: Platform repo
          type: string
          default: backstage-platform-template
          description: The IDP platform repo where team manifests will be committed

  steps:
    - id: fetch-k8s
      name: Render Kubernetes manifests
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: kubernetes/teams/${{ parameters.teamName }}
        values:
          teamName: ${{ parameters.teamName }}
          ownerGroup: ${{ parameters.ownerGroup }}
          costCenter: ${{ parameters.costCenter }}
          tier: ${{ parameters.tier }}

    - id: fetch-catalog
      name: Render Backstage Group entity
      action: fetch:template
      input:
        url: ./catalog-skeleton
        targetPath: backstage/catalog/groups
        values:
          teamName: ${{ parameters.teamName }}
          ownerGroup: ${{ parameters.ownerGroup }}
          githubOrg: ${{ parameters.githubOrg }}
          platformRepo: ${{ parameters.platformRepo }}
          githubTeam: ${{ parameters.githubTeam }}

    - id: publish
      name: Publish to platform repo
      action: publish:github:pull-request
      continueOnError: true
      input:
        repoUrl: github.com?repo=${{ parameters.platformRepo }}&owner=${{ parameters.githubOrg }}
        branchName: team/${{ parameters.teamName }}-namespace
        title: "feat(platform): provision namespace and catalog entry for team ${{ parameters.teamName }}"
        description: |
          Auto-generated by Backstage IDP scaffolder.

          Creates namespace `team-${{ parameters.teamName }}` with:
          - Restricted Pod Security Standards
          - Sizing tier: `${{ parameters.tier }}` (quota enforced by Kyverno policy)
          - LimitRange: default container requests/limits
          - NetworkPolicy: deny-all ingress (allow same-namespace + monitoring)
          - RBAC: idp-developer RoleBinding + deployer ServiceAccount
          - ArgoCD AppProject scoped to this namespace

          Also registers `${{ parameters.teamName }}` as a Backstage Group entity under
          `backstage/catalog/groups/${{ parameters.teamName }}.yaml` — no manual catalog
          registration required after merge.

          Merge this PR to apply the namespace to the cluster via CI.
        commitMessage: "chore(platform): scaffold namespace and catalog entry for team ${{ parameters.teamName }}"

  output:
    links:
      - title: Pull Request
        url: ${{ steps.publish.output.remoteUrl }}
    text:
      - title: Next steps
        content: |
          1. Review and merge the PR — CI will `kubectl apply` the manifests automatically.
          2. Once merged, the team `${{ parameters.teamName }}` will appear in the Backstage
             catalog automatically (no manual registration needed).
          3. Share the deployer ServiceAccount token with your team:
             ```bash
             kubectl get secret team-${{ parameters.teamName }}-deployer-token \
               -n team-${{ parameters.teamName }} \
               -o jsonpath='{.data.token}' | base64 -d
             ```
