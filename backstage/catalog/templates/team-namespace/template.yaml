apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: team-namespace
  annotations:
    backstage.io/techdocs-ref: dir:.
  title: Provision Team Namespace
  description: >-
    Self-service team onboarding — creates a GitHub Org Team, a Kubernetes namespace,
    RBAC bindings, ArgoCD project, and resource quotas in one step. The Backstage
    Group entity follows automatically from GitHub Org sync. Choose a sizing tier
    (Small / Medium / Large) and quotas are applied automatically.
  tags:
    - platform
    - kubernetes
    - onboarding
    - self-service
    - local
    - aws
    - v1
    - blessed
spec:
  owner: platform-team
  type: infrastructure

  parameters:
    - title: Team Information
      required:
        - teamName
        - ownerGroup
        - costCenter
      properties:
        teamName:
          title: Team name
          type: string
          description: Lowercase, alphanumeric + hyphens (e.g. payments, auth-team)
          pattern: '^[a-z][a-z0-9-]{1,28}[a-z0-9]$'
          ui:autofocus: true
        ownerGroup:
          title: Owner group
          type: string
          description: Backstage group that owns this namespace
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        costCenter:
          title: Cost center
          type: string
          description: Billing tag applied to all resources (e.g. CC-1234)
        initialMembers:
          title: Initial team members (optional)
          type: array
          items:
            type: string
          description: >-
            GitHub logins to add to the new GitHub team immediately. The Backstage
            Group entity is synced automatically from this team's real membership
            (catalog.providers.githubOrg) — there's nothing further to manage here.

    - title: Sizing Tier
      properties:
        tier:
          title: Team tier
          type: string
          default: small
          description: >-
            Controls resource quotas enforced in the namespace.
            Small: 4 CPU / 8Gi. Medium: 16 CPU / 32Gi. Large: LimitRange defaults only.
          enum:
            - small
            - medium
            - large
          enumNames:
            - 'Small  — ≤ 25 teams / ≤ 150 engineers  (4 CPU · 8Gi · 30 pods)'
            - 'Medium — 26–75 teams / 150–750 engineers (16 CPU · 32Gi · 100 pods)'
            - 'Large  — 75+ teams / 750+ engineers      (LimitRange defaults · no hard cap)'

    - title: Platform repo
      required:
        - githubOrg
        - platformRepo
        - teamsOrg
      properties:
        githubOrg:
          title: GitHub organisation (platform repo)
          type: string
          default: moatazeldebsy
          description: >-
            Owner of the platform repo (${{ parameters.platformRepo }}) that this
            template's PR gets opened against. Not necessarily the same account as
            "GitHub organisation for teams" below — this repo can live in a personal
            account while teams live in a separate GitHub Org.
        teamsOrg:
          title: GitHub organisation (teams)
          type: string
          default: platform-demo-idp
          description: >-
            The GitHub Org where the new team is actually created — must match
            catalog.providers.githubOrg in app-config.yaml/app-config.aws.yaml, or the
            resulting Group entity won't sync into the catalog.
        platformRepo:
          title: Platform repo
          type: string
          default: backstage-platform-template
          description: The IDP platform repo where team manifests will be committed
        awsRegion:
          title: AWS region
          type: string
          default: us-east-1
          description: AWS region for the per-team SecretStore (must match the cluster region)
        iamRoleArn:
          title: ESO IAM role ARN (optional)
          type: string
          description: >-
            IRSA role ARN for the team's External Secrets ServiceAccount.
            Format: arn:aws:iam::<account>:role/team-<name>-eso.
            Leave blank to skip creating the SecretStore (add it later via terraform/iam-team-secret-store.tf).
          pattern: '^(arn:aws:iam::[0-9]{12}:role/.+)?$'

  steps:
    - id: create-github-team
      name: Create GitHub team
      action: idp:github:team-create
      input:
        org: ${{ parameters.teamsOrg }}
        teamName: ${{ parameters.teamName }}
        description: Team ${{ parameters.teamName }} — provisioned via IDP team-namespace template
        parentTeamSlug: ${{ parameters.ownerGroup }}
        initialMembers: ${{ parameters.initialMembers }}
        platformRepo: ${{ parameters.platformRepo }}

    - id: fetch-k8s
      name: Render Kubernetes manifests
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: kubernetes/teams/${{ parameters.teamName }}
        values:
          teamName: ${{ parameters.teamName }}
          ownerGroup: ${{ parameters.ownerGroup }}
          costCenter: ${{ parameters.costCenter }}
          tier: ${{ parameters.tier }}
          githubOrg: ${{ parameters.githubOrg }}
          platformRepo: ${{ parameters.platformRepo }}
          awsRegion: ${{ parameters.awsRegion }}
          iamRoleArn: ${{ parameters.iamRoleArn }}

    - id: publish
      name: Publish to platform repo
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=${{ parameters.platformRepo }}&owner=${{ parameters.githubOrg }}
        branchName: team/${{ parameters.teamName }}-namespace
        title: "feat(platform): provision namespace for team ${{ parameters.teamName }}"
        description: |
          Auto-generated by Backstage IDP scaffolder.

          GitHub team `${{ steps.create-github-team.output.teamSlug }}` was created (or
          reused) directly via the GitHub API — see ${{ steps.create-github-team.output.teamUrl }}.
          Members added: ${{ steps.create-github-team.output.membersAdded }}.

          This PR creates namespace `team-${{ parameters.teamName }}` with:
          - Restricted Pod Security Standards
          - Sizing tier: `${{ parameters.tier }}` (quota enforced by Kyverno policy)
          - LimitRange: default container requests/limits
          - NetworkPolicy: deny-all ingress (allow same-namespace + monitoring)
          - RBAC: idp-developer RoleBinding + deployer ServiceAccount
          - ArgoCD AppProject + ApplicationSet scoped to this namespace
          - Per-team SecretStore (AWS Secrets Manager, path `/${{ parameters.teamName }}/`)

          The Backstage Group entity for this team is **not** part of this PR — it
          appears automatically in the catalog once the GitHub Org sync
          (catalog.providers.githubOrg) next runs (every 30 min on AWS; trigger a
          manual refresh from the catalog UI to see it sooner).

          Merge this PR to apply the namespace to the cluster via CI.
        commitMessage: "chore(platform): scaffold namespace for team ${{ parameters.teamName }}"

  output:
    links:
      - title: Pull Request
        url: ${{ steps.publish.output.remoteUrl }}
      - title: GitHub Team
        url: ${{ steps.create-github-team.output.teamUrl }}
    text:
      - title: Next steps
        content: |
          1. The GitHub team `${{ steps.create-github-team.output.teamSlug }}` already
             exists — add/remove members directly in GitHub, membership stays in sync.
          2. Review and merge the PR — CI will `kubectl apply` the manifests automatically.
          3. The team `${{ parameters.teamName }}` will appear as a Backstage Group after
             the next catalog sync (no manual registration needed).
          4. Share the deployer ServiceAccount token with your team:
             ```bash
             kubectl get secret team-${{ parameters.teamName }}-deployer-token \
               -n team-${{ parameters.teamName }} \
               -o jsonpath='{.data.token}' | base64 -d
             ```
