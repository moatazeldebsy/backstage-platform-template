# Project-wide Gradle settings — the defaults Android Studio generates.
#
# android.useAndroidX is required: the app depends on AndroidX (Compose, the
# activity library), and without it every Gradle task failed with
# "contains AndroidX dependencies, but the android.useAndroidX property is not
# enabled" — lint and unit tests never ran on a freshly scaffolded app.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
