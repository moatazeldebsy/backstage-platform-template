name: ${{ values.name }} Appium Mobile Tests

{%- if values.deviceFarm === 'local-emulator' %}
# Hosted GitHub runners have no mobile device grid, so the local-emulator
# variant runs only on demand or on a schedule.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'
{%- else %}
# A cloud device farm supplies the devices, which is exactly the constraint that
# kept this workflow on a weekly cron — so the cloud variants run per pull
# request as well.
on:
  workflow_dispatch:
  pull_request:
    branches: ['**']
  schedule:
    - cron: '0 4 * * 1'
{%- endif %}

env:
  APPIUM_SERVER: '${{ values.appiumServer }}'
  PLATFORM: '${{ values.platform }}'
  # wdio.config.ts falls back to the value baked in at scaffold time, but setting
  # it explicitly keeps the workflow readable and lets a re-run override it.
  DEVICE_FARM: '${{ values.deviceFarm }}'

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test-suites/${{ values.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: test-suites/${{ values.name }}/package.json

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      # These tests drive an app build — something only the team can provide.
      # Until APP_PATH is set, skip them with a notice instead of failing every
      # run of a freshly scaffolded suite.
      - name: Check an app is configured
        id: app
        env:
          APP_PATH: ${{ '${{ vars.APP_PATH }}' }}
        run: |
          if [ -z "$APP_PATH" ]; then
            echo "::notice title=Mobile tests skipped::No app to test yet. Set the APP_PATH repository variable (Settings → Secrets and variables → Actions → Variables) to the .apk/.ipa path or URL, or your device farm's app id, and re-run."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
{%- if values.deviceFarm === 'local-emulator' %}

      - name: Start Appium server
        if: steps.app.outputs.configured == 'true'
        run: npx appium &
        env:
          APPIUM_LOG_LEVEL: error

      - name: Wait for Appium
        if: steps.app.outputs.configured == 'true'
        run: npx wait-on http://localhost:4723/status --timeout 30000
{%- endif %}

      - name: Run mobile tests
        if: steps.app.outputs.configured == 'true'
        run: npm test
        env:
          # wdio.config.ts reads this; it was never passed before.
          APP_PATH: ${{ '${{ vars.APP_PATH }}' }}
{%- if values.deviceFarm !== 'local-emulator' %}
{%- if values.deviceFarm === 'browserstack' %}
          BROWSERSTACK_USERNAME: ${{ '${{ secrets.BROWSERSTACK_USERNAME }}' }}
          BROWSERSTACK_ACCESS_KEY: ${{ '${{ secrets.BROWSERSTACK_ACCESS_KEY }}' }}
{%- elif values.deviceFarm === 'sauce-labs' %}
          SAUCE_USERNAME: ${{ '${{ secrets.SAUCE_USERNAME }}' }}
          SAUCE_ACCESS_KEY: ${{ '${{ secrets.SAUCE_ACCESS_KEY }}' }}
{%- else %}
          LT_USERNAME: ${{ '${{ secrets.LT_USERNAME }}' }}
          LT_ACCESS_KEY: ${{ '${{ secrets.LT_ACCESS_KEY }}' }}
{%- endif %}
{%- endif %}

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-results-${{ values.name }}
          path: test-suites/${{ values.name }}/reports/
          retention-days: 30
