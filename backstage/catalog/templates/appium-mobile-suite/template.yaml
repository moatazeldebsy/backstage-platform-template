apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: appium-mobile-suite
  title: Appium Mobile Test Suite
  description: Scaffold an Appium + WebdriverIO mobile test suite for iOS and Android
  tags:
    - appium
    - mobile
    - testing
    - qa
spec:
  owner: qa-team
  type: test-suite

  parameters:
    - title: Suite Details
      required:
        - name
        - description
        - owner
        - targetService
      properties:
        name:
          title: Suite Name
          type: string
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
          ui:autofocus: true
        description:
          title: Description
          type: string
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        targetService:
          title: Target Service / App
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: Component

    - title: Configuration
      properties:
        platform:
          title: Platform
          type: string
          default: android
          enum:
            - android
            - ios
            - both
          enumNames:
            - 'Android'
            - 'iOS'
            - 'Both'
        appiumServer:
          title: Appium Server URL
          type: string
          description: Local or remote Appium server endpoint
          default: 'http://localhost:4723'

    - title: Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: GitHub Repository
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - moatazeldebsy

  steps:
    - id: fetch-template
      name: Fetch Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          targetService: ${{ parameters.targetService }}
          platform: ${{ parameters.platform }}
          appiumServer: ${{ parameters.appiumServer }}
          githubOrg: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          repoName: ${{ (parameters.repoUrl | parseRepoUrl).repo }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        gitCommitMessage: "chore: initial scaffold via IDP"
        topics:
          - appium
          - mobile-testing
          - qa

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
