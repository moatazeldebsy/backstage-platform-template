name: Store Deploy

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Release track"
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
  push:
    branches:
      - release/**

permissions:
  contents: read
  id-token: write  # required for AWS OIDC (code signing)

env:
  VERSION_NAME: "${{ values.versionName }}"
  VERSION_CODE: "${{ values.versionCode }}"
  PLATFORM: "${{ values.platform }}"

{% if values.platform === 'google_play' or values.platform === 'both' %}
jobs:
  deploy-google-play:
    name: Deploy to Google Play
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A release cannot happen without these; say which are missing up front
      # instead of failing later inside an AWS or store API call.
      - name: Check release secrets
        env:
          AWS_ROLE_ARN: ${{ '${{ secrets.AWS_ROLE_ARN }}' }}
          ANDROID_KEYSTORE_SECRET_ID: ${{ '${{ secrets.ANDROID_KEYSTORE_SECRET_ID }}' }}
          KEYSTORE_STORE_PASSWORD: ${{ '${{ secrets.KEYSTORE_STORE_PASSWORD }}' }}
          KEYSTORE_KEY_ALIAS: ${{ '${{ secrets.KEYSTORE_KEY_ALIAS }}' }}
          KEYSTORE_KEY_PASSWORD: ${{ '${{ secrets.KEYSTORE_KEY_PASSWORD }}' }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}' }}
          ANDROID_PACKAGE_NAME: ${{ '${{ secrets.ANDROID_PACKAGE_NAME }}' }}
        run: |
          missing=""
          for s in AWS_ROLE_ARN ANDROID_KEYSTORE_SECRET_ID KEYSTORE_STORE_PASSWORD KEYSTORE_KEY_ALIAS KEYSTORE_KEY_PASSWORD GOOGLE_PLAY_SERVICE_ACCOUNT_JSON ANDROID_PACKAGE_NAME; do [ -n "${!s}" ] || missing="$missing $s"; done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — see the mobile-app-store-deploy PR description for setup."
            exit 1
          fi

      # A Flutter app keeps its Gradle project in android/; a native app (the
      # android-app template) at the repo root. This used to assume android/,
      # so it failed on every native app.
      - name: Locate Android project
        run: |
          if [ -f android/gradlew ]; then echo "ANDROID_DIR=android" >> "$GITHUB_ENV"; else echo "ANDROID_DIR=." >> "$GITHUB_ENV"; fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default list includes the obsolete "tools" package, which current
          # sdkmanager versions no longer have; the step failed on every run.
          packages: platform-tools

      - name: Configure AWS credentials (for keystore)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ '${{ secrets.AWS_ROLE_ARN }}' }}
          aws-region: ${{ '${{ secrets.AWS_REGION || ' }}'us-east-1'${{ ' }}' }}

      - name: Download keystore from AWS Secrets Manager
        run: |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "${{ '${{ secrets.ANDROID_KEYSTORE_SECRET_ID }}' }}" \
            --query 'SecretString' --output text)
          echo "$SECRET" | base64 --decode > "$ANDROID_DIR/app/release.keystore"

      - name: Build release AAB
        env:
          KEYSTORE_STORE_PASSWORD: ${{ '${{ secrets.KEYSTORE_STORE_PASSWORD }}' }}
          KEYSTORE_KEY_ALIAS: ${{ '${{ secrets.KEYSTORE_KEY_ALIAS }}' }}
          KEYSTORE_KEY_PASSWORD: ${{ '${{ secrets.KEYSTORE_KEY_PASSWORD }}' }}
        run: |
          cd "$ANDROID_DIR"
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=app/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEYSTORE_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEYSTORE_KEY_PASSWORD"

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}' }}
          packageName: ${{ '${{ secrets.ANDROID_PACKAGE_NAME }}' }}
          releaseFiles: ${{ '${{ env.ANDROID_DIR }}' }}/app/build/outputs/bundle/release/app-release.aab
          track: ${{ '${{ github.event.inputs.track || ' }}'${{ values.track }}'${{ ' }}' }}
          status: completed

      - name: Clean up keystore
        if: always()
        run: rm -f "$ANDROID_DIR/app/release.keystore"

{% endif %}
{% if values.platform === 'app_store' or values.platform === 'both' %}
  deploy-app-store:
    name: Deploy to App Store
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # A release cannot happen without these; say which are missing up front
      # instead of failing later inside an AWS or store API call.
      - name: Check release secrets
        env:
          AWS_ROLE_ARN: ${{ '${{ secrets.AWS_ROLE_ARN }}' }}
          CODE_SIGN_S3_BUCKET: ${{ '${{ secrets.CODE_SIGN_S3_BUCKET }}' }}
          APPLE_ID: ${{ '${{ secrets.APPLE_ID }}' }}
          MATCH_PASSWORD: ${{ '${{ secrets.MATCH_PASSWORD }}' }}
          ASC_API_KEY_ID: ${{ '${{ secrets.ASC_API_KEY_ID }}' }}
          ASC_API_ISSUER_ID: ${{ '${{ secrets.ASC_API_ISSUER_ID }}' }}
          ASC_API_KEY_CONTENT: ${{ '${{ secrets.ASC_API_KEY_CONTENT }}' }}
        run: |
          missing=""
          for s in AWS_ROLE_ARN CODE_SIGN_S3_BUCKET APPLE_ID MATCH_PASSWORD ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_KEY_CONTENT; do [ -n "${!s}" ] || missing="$missing $s"; done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — see the mobile-app-store-deploy PR description for setup."
            exit 1
          fi

      - name: Configure AWS credentials (for Fastlane Match)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ '${{ secrets.AWS_ROLE_ARN }}' }}
          aws-region: ${{ '${{ secrets.AWS_REGION || ' }}'us-east-1'${{ ' }}' }}

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Sync certificates
        env:
          CODE_SIGN_S3_BUCKET: ${{ '${{ secrets.CODE_SIGN_S3_BUCKET }}' }}
          APPLE_ID: ${{ '${{ secrets.APPLE_ID }}' }}
          MATCH_PASSWORD: ${{ '${{ secrets.MATCH_PASSWORD }}' }}
        run: fastlane match appstore --readonly

      - name: Deploy to App Store
        env:
          APPLE_ID: ${{ '${{ secrets.APPLE_ID }}' }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ '${{ secrets.FASTLANE_APP_SPECIFIC_PASSWORD }}' }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ '${{ secrets.ASC_API_KEY_ID }}' }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ '${{ secrets.ASC_API_ISSUER_ID }}' }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ '${{ secrets.ASC_API_KEY_CONTENT }}' }}
        run: |
          TRACK="${{ '${{ github.event.inputs.track || ' }}'${{ values.track }}'${{ ' }}' }}"
          # `fastlane run <action>` needs no Fastfile. This add-on used to ship
          # fastlane/Fastfile with these lanes, which replaced the app's own
          # Fastfile (and its test/build/distribute lanes) on merge.
          fastlane run build_app scheme:"${SCHEME:-Release}" export_method:app-store \
            clean:true output_directory:./build output_name:app.ipa
          if [ "$TRACK" = "internal" ] || [ "$TRACK" = "beta" ]; then
            fastlane run upload_to_testflight ipa:./build/app.ipa skip_waiting_for_build_processing:true
          else
            fastlane run upload_to_app_store ipa:./build/app.ipa skip_waiting_for_build_processing:true \
              submit_for_review:false force:true skip_screenshots:true skip_metadata:true
          fi

{% endif %}
