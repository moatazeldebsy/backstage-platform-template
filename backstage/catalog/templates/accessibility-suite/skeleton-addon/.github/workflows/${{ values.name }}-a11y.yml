name: ${{ values.name }} Accessibility Tests

on:
  push:
    branches: [main]
    paths:
      - 'test-suites/${{ values.name }}/**'
  pull_request:
    branches: [main]
    paths:
      - 'test-suites/${{ values.name }}/**'

env:
  BASE_URL: '${{ values.baseUrl }}'
  WCAG_LEVEL: '${{ values.wcagLevel }}'

jobs:
  a11y:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test-suites/${{ values.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Pre-flight — skip if BASE_URL is not reachable
        id: preflight
        working-directory: .
        run: |
          if [ -z "${BASE_URL}" ] || [ "${BASE_URL}" = "http://localhost:3000" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::BASE_URL not configured — first-run skip."
            exit 0
          fi
          if ! curl -fsS --max-time 5 "${BASE_URL%/}/" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::BASE_URL (${BASE_URL}) not reachable from runner — skipping."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.skip != 'true'
        with:
          node-version: '20'
          cache: 'npm'

      - if: steps.preflight.outputs.skip != 'true'
        run: npm ci
      - if: steps.preflight.outputs.skip != 'true'
        run: npx playwright install chromium --with-deps

      - name: Run accessibility tests
        if: steps.preflight.outputs.skip != 'true'
        run: npm test

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-report-${{ values.name }}
          path: test-suites/${{ values.name }}/playwright-report/
          retention-days: 30
