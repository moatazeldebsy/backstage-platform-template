name: IaC Tests

on:
  push:
    branches: [main]
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '.github/workflows/iac-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      # So the PR that adds this suite runs it; it used to contain no .tf
      # change and never triggered, leaving a broken suite unnoticed.
      - '.github/workflows/iac-tests.yml'
      - 'tests/terratest/**'
      - '.tflint.hcl'

permissions:
  contents: read
  security-events: write
  actions: read   # upload-sarif reads the workflow run; without it the upload failed
  pull-requests: write

jobs:
  fmt-and-validate:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: fmt check
        run: terraform -chdir=${{ values.terraformDir }} fmt -recursive -check
      - name: init (no backend)
        run: terraform -chdir=${{ values.terraformDir }} init -backend=false
      - name: validate
        run: terraform -chdir=${{ values.terraformDir }} validate

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - name: tflint init
        working-directory: ${{ values.terraformDir }}
        run: tflint --init
      - name: tflint
        working-directory: ${{ values.terraformDir }}
        run: tflint --format=compact

  checkov:
    name: checkov (policy + security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ values.terraformDir }}
          framework: terraform
          quiet: true
          soft_fail: false
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif
      # Code scanning needs GitHub Advanced Security on private repos, so the
      # upload is informational: checkov above is what gates the job, and its
      # findings are in the log either way.
      - name: Upload SARIF to GitHub Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results.sarif
          category: checkov
  {% if values.runTerratest %}
  terratest:
    name: terratest (real apply)
    runs-on: ubuntu-latest
    needs: [fmt-and-validate, tflint, checkov]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    env:
      AWS_REGION: ${{ '${{ vars.AWS_REGION }}' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Newest patch of a Go minor that still gets security fixes.
          go-version: '1.26.x'
          check-latest: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ '${{ vars.AWS_OIDC_ROLE_ARN }}' }}
          aws-region: ${{ '${{ vars.AWS_REGION }}' }}
      - name: go mod tidy
        working-directory: tests/terratest
        run: go mod tidy
      - name: Run Terratest
        working-directory: tests/terratest
        run: go test -v -timeout 60m ./...
  {% endif %}
