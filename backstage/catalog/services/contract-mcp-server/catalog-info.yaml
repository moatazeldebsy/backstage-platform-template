apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: contract-mcp-server
  title: Contract MCP Server
  description: >
    MCP server that powers self-describing, self-testing APIs on the IDP.
    Exposes tools for registering OpenAPI contracts, generating Pact consumer tests,
    detecting breaking changes, and validating provider/consumer compatibility.
  annotations:
    github.com/project-slug: moatazeldebsy/backstage-platform-template
    backstage.io/kubernetes-id: contract-mcp-server
    idp.io/quality-gates: coverage,static-analysis,vuln-scan,llm-eval
  tags:
    - mcp
    - contract-testing
    - ai
    - kagent
    - typescript
spec:
  type: mcp-server
  lifecycle: production
  owner: platform-team
  system: internal-developer-platform
