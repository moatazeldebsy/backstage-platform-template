apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: contract-mcp-server
  title: Contract MCP Server
  description: >
    MCP server that powers self-describing, self-testing APIs on the IDP.
    Exposes tools for registering OpenAPI contracts, generating Pact consumer tests,
    detecting breaking changes, and validating provider/consumer compatibility.
  annotations:
    github.com/project-slug: moatazeldebsy/backstage-platform-template
    backstage.io/kubernetes-id: contract-mcp-server
    # The server's documentation is the Contract Testing guide in the platform
    # docs site (docs/contract-testing.md). Show that page here rather than a
    # copy that would drift. The previous techdocs-ref pointed at
    # services/contract-mcp-server/, which has no docs/ or mkdocs.yml, so the
    # TechDocs tab always failed.
    backstage.io/techdocs-entity: system:default/internal-developer-platform
    backstage.io/techdocs-entity-path: /contract-testing/
    idp.io/quality-gates: coverage,static-analysis,vuln-scan,llm-eval
    pagerduty.com/service-id: ""
    grafana/alert-label-selector: "service=contract-mcp-server"
  tags:
    - mcp
    - contract-testing
    - ai
    - kagent
    - typescript
spec:
  type: mcp-server
  lifecycle: production
  owner: platform-team
  system: internal-developer-platform
