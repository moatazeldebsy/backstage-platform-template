sonar.projectKey=moatazeldebsy_backstage-platform-template
sonar.organization=moataz
sonar.projectName=IDP Backstage App
sonar.host.url=https://sonarcloud.io

sonar.sources=packages/app/src,packages/backend/src
sonar.tests=packages/app/src,packages/backend/src
sonar.test.inclusions=**/*.test.tsx,**/*.test.ts,**/*.spec.tsx,**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/dist-types/**,**/coverage/**,**/e2e-tests/**,**/__mocks__/**


# `yarn test --coverage` runs via `backstage-cli repo test` at the monorepo
# root, which merges every package into one report here rather than writing
# per-package coverage/lcov.info files (the previous paths never existed).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8

