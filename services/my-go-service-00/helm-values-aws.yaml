# Renamed from helm-values-dev.yaml and reshaped for AWS: the ArgoCD
# ApplicationSet reads helm-values-aws.yaml, and the original was
# nginx/ghcr/idp.local shaped. See PR #379 for the template-side fix.
replicaCount: 2

image:
  repository: ghcr.io/moatazeldebsy/my-go-service-00
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 

ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
  hosts: []   # no DNS in front of the ALB yet
  paths:
    - path: /
      pathType: Prefix

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

env:
  - name: LOG_LEVEL
    value: debug
  - name: ENVIRONMENT
    value: dev

podLabels:
  team: "team-platform"
  cost-center: ""
  environment: dev
  app.kubernetes.io/part-of: internal-developer-platform
