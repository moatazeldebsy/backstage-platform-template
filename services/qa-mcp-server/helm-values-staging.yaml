# Helm overrides for qa-mcp-server — AWS staging environment
fullnameOverride: qa-mcp-server
replicaCount: 1
image:
  # Resolved by scripts/setup.sh during personalisation, exactly like
  # hello-service. It used to be ECR_REGISTRY_PLACEHOLDER, substituted by
  # bootstrap-ai.sh on its way into helm stdin — which meant the file on
  # disk was never renderable, so ArgoCD could not deploy this service and
  # it had to be excluded from the ApplicationSets.
  repository: 967825954374.dkr.ecr.us-east-1.amazonaws.com/idp-mvp/qa-mcp-server
  tag: "038d850"
  pullPolicy: Always
service:
  type: ClusterIP
  port: 3002
  targetPort: 3002
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
  hosts:
    - host: "" # match any hostname; use ALB DNS directly
      paths:
        - path: /
          pathType: Prefix
  tls: []
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi
env:
  - name: BACKSTAGE_URL
    # Port 80, not 7007. The backstage Service is type LoadBalancer listening on
    # port 80 with targetPort 7007 — 7007 is the CONTAINER port and nothing
    # listens on it at the Service. Every call from this server to Backstage
    # therefore hung until it timed out, and the Backstage AI Assistant answered
    # "the catalog is currently unreachable" / "both search attempts timed out"
    # for anything that needed the catalog. Observed 2026-08-17.
    value: "http://backstage.backstage.svc.cluster.local"
  - name: BACKSTAGE_EXTERNAL_URL
    value: "" # set to real domain when DNS is configured
  - name: BACKSTAGE_TOKEN
    valueFrom:
      secretKeyRef:
        name: mcp-backstage-token
        key: token
  - name: PROMETHEUS_URL
    value: "http://prometheus-kube-prometheus-prometheus.monitoring:9090"
  - name: PORT
    value: "3002"
  - name: GITHUB_ORG
    value: "moatazeldebsy"
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
rbac:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["pods"]
      verbs: ["get", "list", "watch"]
  capabilities:
    drop:
      - ALL
backstage:
  kubernetesId: qa-mcp-server
podLabels:
  backstage.io/kubernetes-id: qa-mcp-server
  team: qa-team
  cost-center: CC-2000
  environment: staging
# Langfuse tracing for src/telemetry.ts. The langfuse-otel secret carries
# LANGFUSE_OTLP_ENDPOINT / LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY and is
# created per-namespace by bootstrap-ai.sh (namespaces labelled
# idp.io/langfuse=enabled). optional: true because Langfuse is opt-in — without
# it, every MCP server would fail to start on a cluster deployed without Langfuse.
envFrom:
  - secretRef:
      name: langfuse-otel
      optional: true
