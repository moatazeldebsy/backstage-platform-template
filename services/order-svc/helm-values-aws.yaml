replicaCount: 2

image:
  # Replace YOUR_AWS_ACCOUNT_ID with the output of: aws sts get-caller-identity --query Account --output text
  repository: YOUR_AWS_ACCOUNT_ID.dkr.ecr.eu-central-1.amazonaws.com/order-svc
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443},{"HTTP":80}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
  hosts:
    - host: order-svc.idp.example.com
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podLabels:
  team: platform-team

# Allow scheduling on Karpenter-managed spot nodes.
tolerations:
  - key: karpenter.sh/disruption
    operator: Exists
    effect: NoSchedule

# Prefer spreading pods across availability zones.
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: order-svc
        topologyKey: topology.kubernetes.io/zone

env:
  - name: ENVIRONMENT
    value: production
