fullnameOverride: incident-mcp-server

replicaCount: 1

image:
  repository: localhost:5003/incident-mcp-server
  tag: "0.1.0"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3008
  targetPort: 3008

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: incident-mcp-server.idp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15

  timeoutSeconds: 5
  failureThreshold: 5
readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

  timeoutSeconds: 5
  failureThreshold: 5
resources:
  requests:
    cpu: 30m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

env:
  - name: PORT
    value: "3008"
  - name: GITHUB_TOKEN
    valueFrom:
      secretKeyRef:
        name: github-mcp-server-token
        key: token
        optional: true  # warns on startup if missing; get_open_incidents/get_runbook/post_incident_update degrade gracefully
  # INCIDENT_REPO — owner/repo to read incident issues from (matches agent-event-router's config).
  - name: INCIDENT_REPO
    value: "moatazeldebsy/backstage-platform-template"
  - name: SLACK_WEBHOOK_URL
    valueFrom:
      secretKeyRef:
        name: incident-mcp-server-secrets
        key: slack-webhook-url
        optional: true  # send_notification returns sent:false if unset

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

podLabels:
  team: platform-team
  cost-center: CC-1000
  environment: local

autoscaling:
  enabled: false
