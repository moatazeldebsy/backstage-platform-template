fullnameOverride: incident-mcp-server

replicaCount: 2

image:
  repository: ECR_REGISTRY_PLACEHOLDER/incident-mcp-server
  tag: "0.1.0"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3008
  targetPort: 3008

ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
  hosts:
    - host: incident-mcp-server.internal
      paths:
        - path: /
          pathType: Prefix
  tls: []

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

env:
  - name: PORT
    value: "3008"
  - name: GITHUB_TOKEN
    valueFrom:
      secretKeyRef:
        name: github-mcp-server-token
        key: token
  - name: INCIDENT_REPO
    value: "moatazeldebsy/backstage-platform-template"
  - name: SLACK_WEBHOOK_URL
    valueFrom:
      secretKeyRef:
        name: incident-mcp-server-secrets
        key: slack-webhook-url
        optional: true

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
