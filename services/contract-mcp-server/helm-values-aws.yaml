# Helm overrides for contract-mcp-server — AWS dev environment
# ECR_REGISTRY_PLACEHOLDER and CONTRACT_MCP_IRSA_ROLE_ARN_PLACEHOLDER are
# substituted by bootstrap-ai.sh --aws (role ARN comes from
# `terraform output -raw contract_mcp_server_role_arn`).
fullnameOverride: contract-mcp-server

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: CONTRACT_MCP_IRSA_ROLE_ARN_PLACEHOLDER

replicaCount: 1

# The chart defaults autoscaling.enabled: true with minReplicas: 2, which
# overrides replicaCount above via the HPA — for this single-node-group dev
# deployment, one replica is plenty and avoids doubling pod-density pressure.
autoscaling:
  enabled: false

image:
  # Resolved by scripts/setup.sh during personalisation, exactly like
  # hello-service. It used to be ECR_REGISTRY_PLACEHOLDER, substituted by
  # bootstrap-ai.sh on its way into helm stdin — which meant the file on
  # disk was never renderable, so ArgoCD could not deploy this service and
  # it had to be excluded from the ApplicationSets.
  repository: YOUR_AWS_ACCOUNT_ID.dkr.ecr.YOUR_AWS_REGION.amazonaws.com/idp-mvp/contract-mcp-server
  tag: "0.1.0"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3003
  targetPort: 3003

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
  hosts:
    - host: ""   # match any hostname; use ALB DNS directly
      paths:
        - path: /
          pathType: Prefix
  tls: []

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

env:
  - name: BACKSTAGE_URL
    value: "http://backstage.backstage.svc.cluster.local:7007"
  - name: BACKSTAGE_EXTERNAL_URL
    value: ""   # set to real domain when DNS is configured
  - name: BACKSTAGE_TOKEN
    valueFrom:
      secretKeyRef:
        name: mcp-backstage-token
        key: token
  - name: PORT
    value: "3003"
  - name: K8S_API
    value: "https://kubernetes.default.svc"
  - name: STORAGE_TYPE
    value: "dynamodb"
  - name: DYNAMO_TABLE
    value: "contract-registry"
  - name: AWS_REGION
    value: "us-east-1"

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

rbac:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["services"]
      verbs: ["get", "list"]
  capabilities:
    drop:
      - ALL

backstage:
  kubernetesId: contract-mcp-server

podLabels:
  backstage.io/kubernetes-id: contract-mcp-server
  team: platform-team
  cost-center: CC-1000
  environment: dev

# Langfuse tracing for src/telemetry.ts. The langfuse-otel secret carries
# LANGFUSE_OTLP_ENDPOINT / LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY and is
# created per-namespace by bootstrap-ai.sh (namespaces labelled
# idp.io/langfuse=enabled). optional: true because Langfuse is opt-in — without
# it, every MCP server would fail to start on a cluster deployed without Langfuse.
envFrom:
  - secretRef:
      name: langfuse-otel
      optional: true
