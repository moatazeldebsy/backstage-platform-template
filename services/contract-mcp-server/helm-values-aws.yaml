# Helm overrides for contract-mcp-server — AWS dev environment
fullnameOverride: contract-mcp-server
serviceAccount:
  create: true
  annotations:
    # Resolved value, like image.repository above. This was previously
    # substituted by bootstrap-ai.sh on its way into helm stdin, which meant
    # ArgoCD rendered the literal placeholder -- and so did the live cluster,
    # where the ServiceAccount carried CONTRACT_MCP_IRSA_ROLE_ARN_PLACEHOLDER
    # verbatim and IRSA never actually worked.
    eks.amazonaws.com/role-arn: arn:aws:iam::967825954374:role/idp-mvp-contract-mcp-server
replicaCount: 1
# The chart defaults autoscaling.enabled: true with minReplicas: 2, which
# overrides replicaCount above via the HPA — for this single-node-group dev
# deployment, one replica is plenty and avoids doubling pod-density pressure.
autoscaling:
  enabled: false
image:
  # Resolved by scripts/setup.sh during personalisation, exactly like
  # hello-service. It used to be ECR_REGISTRY_PLACEHOLDER, substituted by
  # bootstrap-ai.sh on its way into helm stdin — which meant the file on
  # disk was never renderable, so ArgoCD could not deploy this service and
  # it had to be excluded from the ApplicationSets.
  repository: 967825954374.dkr.ecr.us-east-1.amazonaws.com/idp-mvp/contract-mcp-server
  tag: "038d850"
  pullPolicy: Always
service:
  type: ClusterIP
  port: 3003
  targetPort: 3003
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
  hosts:
    - host: "" # match any hostname; use ALB DNS directly
      paths:
        - path: /
          pathType: Prefix
  tls: []
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
env:
  - name: BACKSTAGE_URL
    # Port 80, not 7007. The backstage Service is type LoadBalancer listening on
    # port 80 with targetPort 7007 — 7007 is the CONTAINER port and nothing
    # listens on it at the Service. Every call from this server to Backstage
    # therefore hung until it timed out, and the Backstage AI Assistant answered
    # "the catalog is currently unreachable" / "both search attempts timed out"
    # for anything that needed the catalog. Observed 2026-08-17.
    value: "http://backstage.backstage.svc.cluster.local"
  - name: BACKSTAGE_EXTERNAL_URL
    value: "" # set to real domain when DNS is configured
  - name: BACKSTAGE_TOKEN
    valueFrom:
      secretKeyRef:
        name: mcp-backstage-token
        key: token
  - name: PORT
    value: "3003"
  # Node does not trust the cluster CA by default, so every call to
  # https://kubernetes.default.svc failed with UNABLE_TO_VERIFY_LEAF_SIGNATURE
  # and the Backstage AI Assistant reported "unreachable ... due to a
  # certificate verification issue" for anything touching agent memory.
  # Point Node at the ServiceAccount CA bundle rather than reaching for
  # NODE_TLS_REJECT_UNAUTHORIZED=0, which disables verification for every
  # outbound TLS connection this server makes, not just the API server.
  # Observed 2026-08-17.
  - name: NODE_EXTRA_CA_CERTS
    value: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
  - name: K8S_API
    value: "https://kubernetes.default.svc"
  - name: STORAGE_TYPE
    value: "dynamodb"
  - name: DYNAMO_TABLE
    value: "contract-registry"
  - name: AWS_REGION
    value: "us-east-1"
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
rbac:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["services"]
      verbs: ["get", "list"]
  capabilities:
    drop:
      - ALL
backstage:
  kubernetesId: contract-mcp-server
podLabels:
  backstage.io/kubernetes-id: contract-mcp-server
  team: platform-team
  cost-center: CC-1000
  environment: dev
# Langfuse tracing for src/telemetry.ts. The langfuse-otel secret carries
# LANGFUSE_OTLP_ENDPOINT / LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY and is
# created per-namespace by bootstrap-ai.sh (namespaces labelled
# idp.io/langfuse=enabled). optional: true because Langfuse is opt-in — without
# it, every MCP server would fail to start on a cluster deployed without Langfuse.
envFrom:
  - secretRef:
      name: langfuse-otel
      optional: true
