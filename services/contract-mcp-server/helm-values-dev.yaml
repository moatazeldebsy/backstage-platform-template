# Helm overrides for contract-mcp-server — AWS dev environment
# ECR_REGISTRY_PLACEHOLDER is substituted by bootstrap-ai.sh --aws
fullnameOverride: contract-mcp-server

replicaCount: 1

image:
  repository: ECR_REGISTRY_PLACEHOLDER/contract-mcp-server
  tag: "0.1.0"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3003
  targetPort: 3003

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
  hosts:
    - host: ""   # match any hostname; use ALB DNS directly
      paths:
        - path: /
          pathType: Prefix
  tls: []

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

env:
  - name: BACKSTAGE_URL
    value: "http://backstage.backstage.svc.cluster.local:7007"
  - name: BACKSTAGE_EXTERNAL_URL
    value: ""   # set to real domain when DNS is configured
  - name: BACKSTAGE_TOKEN
    valueFrom:
      secretKeyRef:
        name: mcp-backstage-token
        key: token
  - name: PORT
    value: "3003"
  - name: K8S_API
    value: "https://kubernetes.default.svc"

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

rbac:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["services"]
      verbs: ["get", "list"]
  capabilities:
    drop:
      - ALL

backstage:
  kubernetesId: contract-mcp-server

podLabels:
  backstage.io/kubernetes-id: contract-mcp-server
