# Helm overrides for idp-mcp-server — AWS dev environment
# YOUR_AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/idp-mvp is substituted by bootstrap-ai.sh --aws
fullnameOverride: idp-mcp-server

replicaCount: 1

image:
  repository: YOUR_AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/idp-mvp/idp-mcp-server
  tag: "0.1.0"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3001
  targetPort: 3001

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
  hosts:
    - host: ""   # match any hostname; use ALB DNS directly
      paths:
        - path: /
          pathType: Prefix
  tls: []

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

env:
  - name: BACKSTAGE_URL
    value: "http://backstage.backstage.svc.cluster.local:80"
  - name: BACKSTAGE_EXTERNAL_URL
    value: ""   # set to real domain when DNS is configured
  - name: BACKSTAGE_TOKEN
    valueFrom:
      secretKeyRef:
        name: mcp-backstage-token
        key: token
  - name: PROMETHEUS_URL
    value: "http://prometheus-kube-prometheus-prometheus.monitoring:9090"
  - name: K8S_API
    value: "https://kubernetes.default.svc"
  - name: PORT
    value: "3001"
  - name: GITHUB_ORG
    value: "moatazeldebsy"

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

rbac:
  create: true
  rules:
    - apiGroups: ["apps"]
      resources: ["deployments"]
      verbs: ["get", "list", "watch"]
  capabilities:
    drop:
      - ALL

backstage:
  kubernetesId: idp-mcp-server

podLabels:
  backstage.io/kubernetes-id: idp-mcp-server

# Langfuse tracing for src/telemetry.ts. The langfuse-otel secret carries
# LANGFUSE_OTLP_ENDPOINT / LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY and is
# created per-namespace by bootstrap-ai.sh (namespaces labelled
# idp.io/langfuse=enabled). optional: true because Langfuse is opt-in — without
# it, every MCP server would fail to start on a cluster deployed without Langfuse.
envFrom:
  - secretRef:
      name: langfuse-otel
      optional: true
