fullnameOverride: security-mcp-server

replicaCount: 2

image:
  repository: ECR_REGISTRY_PLACEHOLDER/security-mcp-server
  tag: "0.1.0"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3010
  targetPort: 3010

ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
  hosts:
    - host: security-mcp-server.internal
      paths:
        - path: /
          pathType: Prefix
  tls: []

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

env:
  - name: PORT
    value: "3010"
  - name: GITHUB_TOKEN
    valueFrom:
      secretKeyRef:
        name: github-mcp-server-token
        key: token

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

# Langfuse tracing for src/telemetry.ts. The langfuse-otel secret carries
# LANGFUSE_OTLP_ENDPOINT / LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY and is
# created per-namespace by bootstrap-ai.sh (namespaces labelled
# idp.io/langfuse=enabled). optional: true because Langfuse is opt-in — without
# it, every MCP server would fail to start on a cluster deployed without Langfuse.
envFrom:
  - secretRef:
      name: langfuse-otel
      optional: true
