fullnameOverride: security-mcp-server

replicaCount: 1

image:
  repository: localhost:5003/security-mcp-server
  tag: "0.1.0"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3010
  targetPort: 3010

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: security-mcp-server.idp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15

  timeoutSeconds: 5
  failureThreshold: 5
readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

  timeoutSeconds: 5
  failureThreshold: 5
resources:
  requests:
    cpu: 30m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

env:
  - name: PORT
    value: "3010"
  - name: GITHUB_TOKEN
    valueFrom:
      secretKeyRef:
        name: github-mcp-server-token
        key: token
        optional: true  # warns on startup if missing; tools degrade gracefully

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

podLabels:
  team: platform-team
  cost-center: CC-1000
  environment: local

autoscaling:
  enabled: false

# Langfuse tracing for src/telemetry.ts. The langfuse-otel secret carries
# LANGFUSE_OTLP_ENDPOINT / LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY and is
# created per-namespace by bootstrap-ai.sh (namespaces labelled
# idp.io/langfuse=enabled). optional: true because Langfuse is opt-in — without
# it, every MCP server would fail to start on a cluster deployed without Langfuse.
envFrom:
  - secretRef:
      name: langfuse-otel
      optional: true
