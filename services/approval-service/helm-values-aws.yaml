fullnameOverride: approval-service
replicaCount: 2
image:
  # Resolved by scripts/setup.sh during personalisation, exactly like
  # hello-service. It used to be ECR_REGISTRY_PLACEHOLDER, substituted by
  # bootstrap-ai.sh on its way into helm stdin — which meant the file on
  # disk was never renderable, so ArgoCD could not deploy this service and
  # it had to be excluded from the ApplicationSets.
  repository: 967825954374.dkr.ecr.us-east-1.amazonaws.com/idp-mvp/approval-service
  tag: "fb98151"
  pullPolicy: Always
service:
  type: ClusterIP
  port: 3009
  targetPort: 3009
ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
  hosts:
    - host: approval-service.internal
      paths:
        - path: /
          pathType: Prefix
  tls: []
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
env:
  - name: PORT
    value: "3009"
  # Reuses Backstage's own Aurora/RDS Postgres instance — credentials are copied
  # from the backstage-secrets secret (namespace: backstage) into
  # approval-service-db (namespace: services-dev) by bootstrap-ai.sh --adp, since
  # Kubernetes secrets can't be referenced cross-namespace directly.
  - name: POSTGRES_HOST
    valueFrom:
      secretKeyRef:
        name: approval-service-db
        key: POSTGRES_HOST
  - name: POSTGRES_PORT
    valueFrom:
      secretKeyRef:
        name: approval-service-db
        key: POSTGRES_PORT
  - name: POSTGRES_USER
    valueFrom:
      secretKeyRef:
        name: approval-service-db
        key: POSTGRES_USER
  - name: POSTGRES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: approval-service-db
        key: POSTGRES_PASSWORD
  - name: POSTGRES_DB
    valueFrom:
      secretKeyRef:
        name: approval-service-db
        key: POSTGRES_DB
  - name: POSTGRES_SSL
    value: "true"
  - name: POLICY_FILE
    value: "/etc/approval-service/policy.json"
extraVolumes:
  - name: policy
    configMap:
      name: approval-service-policy
      # optional: the ConfigMap is created only by bootstrap-ai.sh --adp. Without
      # this flag the pod sits in ContainerCreating forever on any cluster that
      # has not had --adp run, which is every core bootstrap now that ArgoCD
      # creates an Application for each services/* directory. The service falls
      # back to DEFAULT_POLICY (services/approval-service/src/policy.ts), which
      # is strictly stricter than the shipped policy.json — sync_app requires
      # approval for every target rather than auto-approving non-prod — so the
      # fallback fails safe rather than open.
      optional: true
extraVolumeMounts:
  - name: policy
    mountPath: /etc/approval-service
    readOnly: true
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
# Required by the Gatekeeper constraint require-cost-allocation-labels, which
# denies any workload missing team / cost-center / environment. Without these the
# admission webhook rejected the release outright:
#   admission webhook "validation.gatekeeper.sh" denied the request:
#   [require-cost-allocation-labels] Missing required cost label 'team'
# so this service could never deploy on AWS. Observed 2026-08-12 — 7 of 11 services
# were affected; idp/qa/contract-mcp-server and hello-service already had them.
podLabels:
  backstage.io/kubernetes-id: approval-service
  team: platform-team
  cost-center: CC-1000
  environment: dev
