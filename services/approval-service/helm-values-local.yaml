fullnameOverride: approval-service

replicaCount: 1

image:
  repository: localhost:5003/approval-service
  tag: "0.1.0"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3009
  targetPort: 3009

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: approval-service.idp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15

  timeoutSeconds: 5
  failureThreshold: 5
readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

  timeoutSeconds: 5
  failureThreshold: 5
resources:
  requests:
    cpu: 30m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

env:
  - name: PORT
    value: "3009"
  # Reuses the Backstage Postgres instance (pgvector image) rather than standing up
  # new infra — see docs/agentic-platform.md Phase 4. In local Kind, the postgres
  # container from local/backstage/docker-compose.yml is only reachable from cluster
  # pods via host.docker.internal (same pattern idp-mcp-server uses to reach Backstage).
  - name: POSTGRES_HOST
    value: "host.docker.internal"
  - name: POSTGRES_PORT
    value: "5432"
  - name: POSTGRES_USER
    value: "backstage"
  - name: POSTGRES_PASSWORD
    value: "backstage"
  - name: POSTGRES_DB
    value: "backstage"
  - name: POLICY_FILE
    value: "/etc/approval-service/policy.json"

extraVolumes:
  - name: policy
    configMap:
      name: approval-service-policy
extraVolumeMounts:
  - name: policy
    mountPath: /etc/approval-service
    readOnly: true

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

podLabels:
  team: platform-team
  cost-center: CC-1000
  environment: local

autoscaling:
  enabled: false
