fullnameOverride: cost-mcp-server

replicaCount: 2

image:
  repository: ECR_REGISTRY_PLACEHOLDER/cost-mcp-server
  tag: "0.1.0"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3007
  targetPort: 3007

ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
  hosts:
    - host: cost-mcp-server.internal
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

env:
  - name: PORT
    value: "3007"
  - name: OPENCOST_URL
    # AWS: Kubecost/OpenCost runs in opencost namespace, exposes port 9003
    value: "http://opencost.opencost.svc.cluster.local:9003"
  - name: PROMETHEUS_URL
    value: "http://prometheus-kube-prometheus-prometheus.monitoring:9090"

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
