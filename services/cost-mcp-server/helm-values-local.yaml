fullnameOverride: cost-mcp-server

replicaCount: 1

image:
  repository: localhost:5003/cost-mcp-server
  tag: "0.1.0"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3007
  targetPort: 3007

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: cost-mcp-server.idp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

resources:
  requests:
    cpu: 30m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

env:
  - name: PORT
    value: "3007"
  - name: OPENCOST_URL
    value: "http://opencost.opencost.svc.cluster.local:9003"
  - name: PROMETHEUS_URL
    value: "http://prometheus-kube-prometheus-prometheus.monitoring:9090"

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

podLabels:
  team: platform-team
  cost-center: CC-1000
  environment: local

autoscaling:
  enabled: false
