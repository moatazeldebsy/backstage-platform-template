replicaCount: 1

image:
  repository: ghcr.io/moatazeldebsy/fliutter-demo-app
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: fliutter-demo-app-dev.idp.local
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

podLabels:
  team: "android-team"
  cost-center: "eng-mobile"
  environment: dev
  app.kubernetes.io/part-of: internal-developer-platform
