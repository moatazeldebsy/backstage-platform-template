replicaCount: 1

image:
  repository: ghcr.io/moatazeldebsy/hello-react-srv
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 80

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: hello-react-srv-dev.idp.local
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

env:
  - name: ENVIRONMENT
    value: dev

podLabels:
  team: "qa-team"
  cost-center: "eng-platform"
  environment: dev
  app.kubernetes.io/part-of: internal-developer-platform
