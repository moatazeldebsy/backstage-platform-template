# Renamed from helm-values-dev.yaml and reshaped for AWS: the ArgoCD
# ApplicationSet reads helm-values-aws.yaml, and the original was
# nginx/ghcr/idp.local shaped. See PR #379 for the template-side fix.
replicaCount: 2

image:
  repository: ghcr.io/moatazeldebsy/llm-app-langfuse
  tag: "latest"
  pullPolicy: Always

service:
  port: 80
  targetPort: 8090

ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
  hosts: []   # no DNS in front of the ALB yet
  paths:
    - path: /
      pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 512Mi

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8090"
  prometheus.io/path: "/metrics"

podLabels:
  team: "ml-team"
  cost-center: "eng-platform"
  environment: dev
  app.kubernetes.io/part-of: internal-developer-platform

metrics:
  enabled: true

# See helm-values-local.yaml for what each secret is and who creates it.
envFrom:
  - secretRef:
      name: llm-app-langfuse-secrets
      optional: true
  - secretRef:
      name: langfuse-otel
      optional: true

env:
  - name: LOG_LEVEL
    value: info
  - name: ENVIRONMENT
    value: dev
  - name: OTEL_SERVICE_NAME
    value: "llm-app-langfuse"
  - name: LANGFUSE_CAPTURE_IO
    value: "true"
  - name: LANGFUSE_SAMPLE_RATE
    value: "1"

labels:
  backstage.io/kubernetes-id: llm-app-langfuse
