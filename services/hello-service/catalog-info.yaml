apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: hello-service
  description: Reference Go service
  annotations:
    # Match resources by the chart-set label backstage.io/kubernetes-id=<name>,
    # independent of helm release name (which may be hello-service or
    # hello-service-local depending on how it was installed).
    backstage.io/kubernetes-id: hello-service
    backstage.io/kubernetes-namespace: services-dev
    backstage.io/techdocs-ref: dir:.
    grafana/alert-label-selector: service=hello-service
    idp.io/slo-availability-target: "99.5"
    idp.io/slo-latency-target: "99.0"
    idp.io/sloth-service: hello-service
    # No datadoghq.com/* or langfuse.com/service-name here, deliberately.
    #
    # Both were set so their entity tabs would render on this reference service.
    # They are claims about the service, and both were false: hello-service is a
    # Go hello-world (src/main.go, one test) with no LLM client of any kind, and
    # no Datadog dashboard was ever created for it. The tabs appeared, found
    # nothing, and fell back to sample data — so the demo they enabled was of the
    # fallback, not of the integration.
    #
    # Both tabs are still reachable from any service that genuinely has the
    # integration: the llm-app-langfuse, ai-agent-kagent, mcp-server and
    # mlflow-experiment skeletons set langfuse.com/service-name, and the
    # "Enable Datadog APM & Monitoring" template sets the datadoghq.com ones.
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: internal-developer-platform
  # Links the API entity in backstage/catalog/apis/hello-service-api.yaml to
  # this component. The API was catalogued and browsable under /api-docs, but
  # without this relation Backstage had nothing to show on the component's API
  # tab, and the API page listed no providing component.
  providesApis:
    - hello-service-api
