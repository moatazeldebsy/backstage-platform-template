apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: hello-service
  description: Reference Go service
  annotations:
    # Match resources by the chart-set label backstage.io/kubernetes-id=<name>,
    # independent of helm release name (which may be hello-service or
    # hello-service-local depending on how it was installed).
    backstage.io/kubernetes-id: hello-service
    backstage.io/kubernetes-namespace: services-dev
    backstage.io/techdocs-ref: dir:.
    grafana/alert-label-selector: service=hello-service
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: internal-developer-platform
