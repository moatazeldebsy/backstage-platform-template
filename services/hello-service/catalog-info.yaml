apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: hello-service
  description: Reference Go service
  annotations:
    # Match resources by the chart-set label backstage.io/kubernetes-id=<name>,
    # independent of helm release name (which may be hello-service or
    # hello-service-local depending on how it was installed).
    backstage.io/kubernetes-id: hello-service
    backstage.io/kubernetes-namespace: services-dev
    backstage.io/techdocs-ref: dir:.
    grafana/alert-label-selector: service=hello-service
    idp.io/slo-availability-target: "99.5"
    idp.io/slo-latency-target: "99.0"
    idp.io/sloth-service: hello-service
    # Datadog tab (backstage/app/packages/app/src/extensions.tsx) — added per
    # the "Enable Datadog APM & Monitoring" scaffolder template's documented
    # convention (skeleton-addon/common/datadog/README.md). No dashboard-url:
    # no dashboard has been created for this reference service yet.
    datadoghq.com/monitor-tag: service:hello-service
    datadoghq.com/site: app.datadoghq.eu
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: internal-developer-platform
