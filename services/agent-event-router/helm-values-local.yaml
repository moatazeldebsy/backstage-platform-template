fullnameOverride: agent-event-router

replicaCount: 1

image:
  repository: localhost:5003/agent-event-router
  tag: "0.1.0"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3004
  targetPort: 3004

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: agent-event-router.idp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15

  timeoutSeconds: 5
  failureThreshold: 5
readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

  timeoutSeconds: 5
  failureThreshold: 5
resources:
  requests:
    cpu: 30m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

env:
  # Measured on the live incident-agent: a trivial prompt takes 4.3s, a real
  # multi-tool triage 42.9s. The shared 5s HTTP_TIMEOUT_MS aborted even the
  # trivial case. 60s then also failed, because KAgent's message/send is
  # synchronous and concurrent alerts serialise behind each other.
  - name: AGENT_TIMEOUT_MS
    value: "180000"
  - name: PORT
    value: "3004"
  - name: KAGENT_A2A_URL
    value: "http://kagent-ui.kagent.svc.cluster.local:8080"
  # GITHUB_WEBHOOK_SECRET — required; /webhook/github returns 503 if unset.
  # Secret created by bootstrap-ai.sh from GITHUB_WEBHOOK_SECRET in local/.env.
  - name: GITHUB_WEBHOOK_SECRET
    valueFrom:
      secretKeyRef:
        name: agent-event-router-secrets
        key: github-webhook-secret
        optional: true  # warns on startup if missing; fail-closed on /webhook/github only
  # WEBHOOK_TOKEN — bearer token for alertmanager/argocd webhook endpoints.
  - name: WEBHOOK_TOKEN
    valueFrom:
      secretKeyRef:
        name: agent-event-router-secrets
        key: webhook-token
        optional: true  # optional locally; required in AWS
  # GITHUB_TOKEN — used to open/close incident-tracking issues on critical alerts.
  # Without it, incident-issue automation is silently disabled (AI triage still works).
  - name: GITHUB_TOKEN
    valueFrom:
      secretKeyRef:
        name: agent-event-router-secrets
        key: github-token
        optional: true
  # INCIDENT_REPO — owner/repo where auto-created incident issues are filed.
  - name: INCIDENT_REPO
    value: "moatazeldebsy/backstage-platform-template"
  # Which severities get a tracked issue. Critical only by default — set to
  # "critical,warning" to also file P2s, but be sure the alert volume warrants it.
  - name: INCIDENT_SEVERITIES
    value: "critical"
  # Optional PagerDuty cross-linking. Without these an incident is still filed,
  # it just carries no link to the PD incident that paged the on-call engineer.
  - name: PAGERDUTY_TOKEN
    valueFrom:
      secretKeyRef:
        name: agent-event-router-secrets
        key: pagerduty-token
        optional: true
  - name: PAGERDUTY_SERVICE_IDS
    value: ""

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

autoscaling:
  enabled: false

podLabels:
  team: platform-team
  cost-center: CC-1000
  environment: local
