# Helm overrides for agent-event-router — AWS EKS
# ECR_REGISTRY_PLACEHOLDER is substituted by bootstrap-ai.sh --aws
fullnameOverride: agent-event-router
replicaCount: 1
image:
  repository: 967825954374.dkr.ecr.us-east-1.amazonaws.com/idp-mvp/agent-event-router
  tag: "latest"
  pullPolicy: Always
service:
  type: ClusterIP
  port: 3004
  targetPort: 3004
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
resources:
  requests:
    cpu: 30m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
env:
  # A KAgent A2A call is an LLM turn, often several once the agent starts calling
  # MCP tools. The generic HTTP_TIMEOUT_MS of 5s aborted them — measured against
  # the live incident-agent, a single-sentence answer with no tool calls took
  # 4.3s, so it was passing by 700ms and any real triage failed.
  - name: AGENT_TIMEOUT_MS
    value: "60000"
  - name: PORT
    value: "3004"
  - name: KAGENT_A2A_URL
    value: "http://kagent-ui.kagent.svc.cluster.local:8080"
  - name: GITHUB_WEBHOOK_SECRET
    valueFrom:
      secretKeyRef:
        name: agent-event-router-secrets
        key: github-webhook-secret
  - name: WEBHOOK_TOKEN
    valueFrom:
      secretKeyRef:
        name: agent-event-router-secrets
        key: webhook-token
  # GITHUB_TOKEN — used to open/close incident-tracking issues on critical alerts.
  # Without it, incident-issue automation is silently disabled (AI triage still works).
  - name: GITHUB_TOKEN
    valueFrom:
      secretKeyRef:
        name: agent-event-router-secrets
        key: github-token
        optional: true
  # INCIDENT_REPO — owner/repo where auto-created incident issues are filed.
  - name: INCIDENT_REPO
    value: "moatazeldebsy/backstage-platform-template"
  # Which severities get a tracked issue. Critical only by default — set to
  # "critical,warning" to also file P2s, but be sure the alert volume warrants it.
  - name: INCIDENT_SEVERITIES
    value: "critical"
  # Optional PagerDuty cross-linking. Without these an incident is still filed,
  # it just carries no link to the PD incident that paged the on-call engineer.
  - name: PAGERDUTY_TOKEN
    valueFrom:
      secretKeyRef:
        name: agent-event-router-secrets
        key: pagerduty-token
        optional: true
  - name: PAGERDUTY_SERVICE_IDS
    value: ""
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
autoscaling:
  enabled: false
# Required by the Gatekeeper constraint require-cost-allocation-labels, which
# denies any workload missing team / cost-center / environment. Without these the
# admission webhook rejected the release outright:
#   admission webhook "validation.gatekeeper.sh" denied the request:
#   [require-cost-allocation-labels] Missing required cost label 'team'
# so this service could never deploy on AWS. Observed 2026-08-12 — 7 of 11 services
# were affected; idp/qa/contract-mcp-server and hello-service already had them.
podLabels:
  backstage.io/kubernetes-id: agent-event-router
  team: platform-team
  cost-center: CC-1000
  environment: dev
