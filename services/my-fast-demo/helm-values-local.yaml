replicaCount: 1

image:
  repository: localhost:5003/my-fast-demo
  tag: "local"
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8002

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
  hosts:
    - host: my-fast-demo.idp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 64Mi

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8002"
  prometheus.io/path: "/metrics"

podLabels:
  team: "platform-team"
  cost-center: "eng-platform"
  environment: local
  app.kubernetes.io/part-of: internal-developer-platform

metrics:
  enabled: true

env:
  - name: LOG_LEVEL
    value: debug
  - name: ENVIRONMENT
    value: local

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]

# nginx-unprivileged writes cache/run files — mount writable emptyDirs
extraVolumeMounts:
  - name: nginx-cache
    mountPath: /var/cache/nginx
  - name: nginx-run
    mountPath: /var/run

extraVolumes:
  - name: nginx-cache
    emptyDir: {}
  - name: nginx-run
    emptyDir: {}

labels:
  backstage.io/kubernetes-id: my-fast-demo
