fullnameOverride: argocd-mcp-server

replicaCount: 2

image:
  # Resolved by scripts/setup.sh during personalisation, exactly like
  # hello-service. It used to be ECR_REGISTRY_PLACEHOLDER, substituted by
  # bootstrap-ai.sh on its way into helm stdin — which meant the file on
  # disk was never renderable, so ArgoCD could not deploy this service and
  # it had to be excluded from the ApplicationSets.
  repository: YOUR_AWS_ACCOUNT_ID.dkr.ecr.YOUR_AWS_REGION.amazonaws.com/idp-mvp/argocd-mcp-server
  tag: "0.1.0"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3006
  targetPort: 3006

ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
  hosts:
    - host: argocd-mcp-server.internal
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

env:
  - name: PORT
    value: "3006"
  - name: ARGOCD_URL
    value: "http://argocd-server.argocd.svc.cluster.local"
  - name: ARGOCD_TOKEN
    valueFrom:
      secretKeyRef:
        name: argocd-mcp-server-token
        key: token
        # optional: true so a missing token DEGRADES the server instead of
        # preventing it from starting. bootstrap-ai.sh only creates this secret
        # when ARGOCD_TOKEN is exported, and otherwise warns
        #   "argocd-mcp-server will start without an ArgoCD token
        #    (all ArgoCD tools will fail)"
        # — which was untrue: a non-optional secretKeyRef left every replica in
        # CreateContainerConfigError ("secret argocd-mcp-server-token not found")
        # and the deployment never became Available, so the helm release failed and
        # its ALB served 503 indefinitely. Matches the pattern already used for the
        # langfuse-otel envFrom. Observed 2026-08-12.
        optional: true

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

# Langfuse tracing for src/telemetry.ts. The langfuse-otel secret carries
# LANGFUSE_OTLP_ENDPOINT / LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY and is
# created per-namespace by bootstrap-ai.sh (namespaces labelled
# idp.io/langfuse=enabled). optional: true because Langfuse is opt-in — without
# it, every MCP server would fail to start on a cluster deployed without Langfuse.
envFrom:
  - secretRef:
      name: langfuse-otel
      optional: true

# Required by the Gatekeeper constraint require-cost-allocation-labels, which
# denies any workload missing team / cost-center / environment. Without these the
# admission webhook rejected the release outright:
#   admission webhook "validation.gatekeeper.sh" denied the request:
#   [require-cost-allocation-labels] Missing required cost label 'team'
# so this service could never deploy on AWS. Observed 2026-08-12 — 7 of 11 services
# were affected; idp/qa/contract-mcp-server and hello-service already had them.
podLabels:
  backstage.io/kubernetes-id: argocd-mcp-server
  team: platform-team
  cost-center: CC-1000
  environment: dev
