# Dependabot version updates are DISABLED (open-pull-requests-limit: 0).
#
# Why: Dependabot was auto-bumping transitive dependencies (e.g. uuid → v10)
# that broke working configurations requiring manual patches (material-table,
# scaffolder extension point imports). Re-enable when ready to audit and test
# dependency upgrades manually.
#
# Dependabot SECURITY ALERTS remain active via GitHub repository settings —
# they are not controlled by this file.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backstage/app
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    # react-router is held at v6 on purpose — see the Known Accepted Risks
    # table in SECURITY.md. `open-pull-requests-limit: 0` does not suppress
    # *security* update PRs, so without this ignore Dependabot keeps
    # reopening an unmergeable bump (last one: #195).
    #
    # Such a PR cannot work even if rebased: the root package.json pins
    # `react-router: ^6.30.4` under `resolutions`, so a bumped dependency
    # declaration resolves back to 6.x anyway (verified — 0 lockfile entries
    # for react-router 8 after a real yarn install).
    #
    # @azure/msal-node is likewise blocked upstream (SECURITY.md): the fix is
    # 7.1.0, but even the latest @azure/identity depends on msal-node ^6, so
    # every security update run fails to resolve. Remove this entry together
    # with the SECURITY.md row once @azure/identity accepts msal-node ^7.1.0.
    ignore:
      - dependency-name: react-router
      - dependency-name: react-router-dom
      - dependency-name: "@azure/msal-node"

  - package-ecosystem: npm
    directory: /services/idp-mcp-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /services/qa-mcp-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /backstage/catalog/templates/react-frontend/skeleton
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: gomod
    directory: /services/hello-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: gomod
    directory: /cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /backstage/app/packages/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
