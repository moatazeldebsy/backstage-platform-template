name: Auto-merge service onboarding PRs

# Triggered by the publish:github:pull-request step in every service template.
# All such PRs are titled "feat: onboard <name> to GitOps" and only add
# services/<name>/helm-values-aws.yaml — a safe, bounded change.
# Once this workflow approves and enables auto-merge, the PR lands as soon
# as CI passes and the ArgoCD ApplicationSet auto-discovers the new service.
#
# Prerequisite: enable "Allow auto-merge" in the repo's Settings → General.
#
# GitHub App setup (preferred over GH_PAT):
#   1. Create a GitHub App at github.com/settings/apps/new (personal) or
#      github.com/organizations/<org>/settings/apps/new (org).
#   2. Permissions: Contents=Write, Pull requests=Write, Metadata=Read.
#   3. Install the App on this repo.
#   4. Add two repo secrets: APP_ID (numeric) and APP_PRIVATE_KEY (PEM content).
#   5. Remove the legacy GH_PAT secret.

'on':
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: "startsWith(github.event.pull_request.title, 'feat: onboard ')"
    steps:
      - uses: actions/checkout@v6

      # Generate a short-lived token from the GitHub App (preferred).
      # Falls back gracefully when APP_ID / APP_PRIVATE_KEY are absent.
      - name: Generate GitHub App token
        id: app-token
        if: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Verify only GitOps values files changed
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh pr view "$PR_NUMBER" --json files --jq '[.files[].path] | join("\n")')
          echo "Changed files:"
          echo "$files"

          unsafe=$(echo "$files" | grep -vE '^services/[^/]+(/[^/]+)?/helm-values[^/]*\.yaml$' || true)
          if [ -n "$unsafe" ]; then
            echo "::error::PR touches files outside services/**/helm-values-*.yaml — manual review required, skipping auto-merge"
            echo "$unsafe"
            exit 1
          fi
          echo "All changed files are safe GitOps values files."

      - name: Approve PR
        # Uses GitHub App token (no rate-limit risk, no rotation needed).
        # Falls back to legacy GH_PAT if App secrets are absent.
        # If neither is set, skips — PR requires manual approval.
        env:
          # App token takes precedence; fall back to PAT; fall back to empty
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GH_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No approval token configured (set APP_ID+APP_PRIVATE_KEY or GH_PAT) — skipping auto-approval."
            exit 0
          fi
          gh pr review "$PR_NUMBER" --approve \
            --body "Auto-approved: PR only adds Helm values under \`services/\`. ArgoCD ApplicationSet will discover and deploy the service once this merges."

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch \
            --subject "feat: onboard service to GitOps (auto-merged)"
