name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'mkdocs.site.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      # Same versions as the techdocs-build job in ci.yml (the Backstage image's),
      # so a page that renders here also renders in the Backstage Docs tab.
      - name: Install MkDocs dependencies
        run: pip install mkdocs==1.6.1 mkdocs-techdocs-core==1.7.1 mkdocs-material==9.7.7

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force --clean -f mkdocs.site.yml
