name: Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'services/**'
      - '.github/workflows/build-and-deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'services/**'

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: idp-mvp
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Concurrency: one active run per service per branch. A new push cancels any
# in-progress run for the same service, preventing queue build-up at scale.
concurrency:
  group: build-deploy-${{ github.ref }}-${{ github.event.inputs.service || 'all' }}
  cancel-in-progress: true

jobs:
  # ─── Detect which service changed ───────────────────────────────────────────
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # required by dorny/paths-filter@v4 on PRs
    outputs:
      services: ${{ steps.filter.outputs.changes }}
      staging_promoted: ${{ steps.staging-filter.outputs.staging_promoted }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            hello-service:
              - 'services/hello-service/**'

      # Separate boolean-only filter: true when this push is itself the merge of a
      # staging promotion PR (i.e. it touched helm-values-staging.yaml). Used to gate
      # smoke-test-staging / promote-to-production so they only run on that trigger,
      # not on every ordinary source-code push.
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: staging-filter
        with:
          filters: |
            staging_promoted:
              - 'services/*/helm-values-staging.yaml'

  # ─── Lint and test ──────────────────────────────────────────────────────────
  test:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' }}
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Detect runtime
        id: runtime
        run: |
          if [ -f "go.mod" ]; then echo "runtime=go" >> "$GITHUB_OUTPUT"
          elif [ -f "package.json" ]; then echo "runtime=node" >> "$GITHUB_OUTPUT"
          elif [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; then echo "runtime=python" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: steps.runtime.outputs.runtime == 'go'
        with:
          go-version-file: services/${{ matrix.service }}/go.mod

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.runtime.outputs.runtime == 'node'
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.runtime.outputs.runtime == 'python'
        with:
          python-version: '3.12'

      - name: Run tests (Go)
        if: steps.runtime.outputs.runtime == 'go'
        run: go test ./... -coverprofile=coverage.out

      - name: Run tests (Node)
        if: steps.runtime.outputs.runtime == 'node'
        run: npm ci && npm test

      - name: Run tests (Python)
        if: steps.runtime.outputs.runtime == 'python'
        run: pip install -r requirements.txt && pytest

  # ─── Build and push to ECR ──────────────────────────────────────────────────
  build-and-push:
    needs: [detect-changes, test]
    if: ${{ github.ref == 'refs/heads/main' && needs.detect-changes.outputs.services != '[]' }}
    timeout-minutes: 30
    strategy:
      max-parallel: 5   # cap concurrent Docker builds to avoid runner exhaustion at scale
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # Required for OIDC and Cosign keyless signing
      contents: read
      security-events: write  # Required for uploading Trivy SARIF results
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check AWS_ROLE_ARN secret
        id: guard
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "AWS_ROLE_ARN secret is not set — skipping ECR push."
            echo "Set it from: cd terraform && terraform output github_actions_role_arn"
            echo "has_aws=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_aws=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.guard.outputs.has_aws == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        if: steps.guard.outputs.has_aws == 'true'
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Set up Docker Buildx
        if: steps.guard.outputs.has_aws == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Ensure ECR repository exists
        if: steps.guard.outputs.has_aws == 'true'
        run: |
          aws ecr describe-repositories \
            --repository-names "${{ env.EKS_CLUSTER_NAME }}/${{ matrix.service }}" \
            --region "${{ env.AWS_REGION }}" 2>/dev/null || \
          aws ecr create-repository \
            --repository-name "${{ env.EKS_CLUSTER_NAME }}/${{ matrix.service }}" \
            --region "${{ env.AWS_REGION }}" \
            --image-scanning-configuration scanOnPush=true

      - name: Docker metadata
        id: meta
        if: steps.guard.outputs.has_aws == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.EKS_CLUSTER_NAME }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        if: steps.guard.outputs.has_aws == 'true'
        id: build-push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Trivy vulnerability scan ──────────────────────────────────────────
      - name: Run Trivy vulnerability scan
        id: trivy
        if: steps.guard.outputs.has_aws == 'true'
        continue-on-error: true  # upload SARIF even when findings cause exit-code 1
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.EKS_CLUSTER_NAME }}/${{ matrix.service }}:${{ steps.meta.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        if: steps.guard.outputs.has_aws == 'true' && !cancelled() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: trivy-results.sarif

      # ── Cosign keyless image signing ──────────────────────────────────────
      - name: Install Cosign
        if: steps.guard.outputs.has_aws == 'true'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image with Cosign (keyless via OIDC)
        if: steps.guard.outputs.has_aws == 'true'
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ env.EKS_CLUSTER_NAME }}/${{ matrix.service }}"
          cosign sign --yes "${IMAGE}@${DIGEST}"

  # ─── GitOps: write image tag to git, ArgoCD deploys ────────────────────────
  # CI no longer calls helm directly. It commits the new image tag into
  # services/<name>/helm-values-aws.yaml. ArgoCD detects the change and syncs.
  # Promotion to staging/prod is done by opening a PR that updates those files.
  update-image-tag:
    needs: [detect-changes, build-and-push]
    if: ${{ github.ref == 'refs/heads/main' && needs.detect-changes.outputs.services != '[]' }}
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write   # needed to push the image tag commit
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ secrets.IDP_PLATFORM_TOKEN }}   # push back to repo
          fetch-depth: 0

      - name: Check AWS_ROLE_ARN secret
        id: guard
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "AWS_ROLE_ARN secret is not set — skipping image tag update."
            echo "has_aws=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_aws=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.guard.outputs.has_aws == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        if: steps.guard.outputs.has_aws == 'true'
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Update image tag in helm-values-aws.yaml
        if: steps.guard.outputs.has_aws == 'true'
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          IMAGE_REPO: ${{ steps.login-ecr.outputs.registry }}/${{ env.EKS_CLUSTER_NAME }}/${{ matrix.service }}
        run: |
          yq -i ".image.repository = \"${IMAGE_REPO}\"" \
            services/${{ matrix.service }}/helm-values-aws.yaml
          yq -i ".image.tag = \"${IMAGE_TAG}\"" \
            services/${{ matrix.service }}/helm-values-aws.yaml

      - name: Commit and push image tag
        if: steps.guard.outputs.has_aws == 'true'
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          git config user.name "idp-bot"
          git config user.email "idp-bot@platform"
          git add services/${{ matrix.service }}/helm-values-aws.yaml
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(gitops): ${{ matrix.service }} → ${IMAGE_TAG} [dev] [skip ci]"
          git push

      - name: Notify Slack on success
        if: success()
        continue-on-error: true   # non-blocking until SLACK_BOT_TOKEN is configured
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ secrets.SLACK_CHANNEL_ID }}"
            text: ":arrows_counterclockwise: *`${{ matrix.service }}`* image tag updated to `${{ needs.build-and-push.outputs.image_tag }}` — ArgoCD syncing dev\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"

      - name: Notify Slack on failure
        if: failure()
        continue-on-error: true   # non-blocking until SLACK_BOT_TOKEN is configured
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ secrets.SLACK_CHANNEL_ID }}"
            text: ":x: *GitOps tag update failed for `${{ matrix.service }}`*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"

  # ─── Smoke test dev before promoting to staging ────────────────────────────
  # Waits for ArgoCD to finish syncing dev, then hits /healthz to confirm the
  # new image is live and healthy before opening a staging promotion PR.
  smoke-test-dev:
    needs: [detect-changes, update-image-tag]
    if: ${{ github.ref == 'refs/heads/main' && needs.detect-changes.outputs.services != '[]' }}
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check AWS_ROLE_ARN secret
        id: guard
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "has_aws=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_aws=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.guard.outputs.has_aws == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        if: steps.guard.outputs.has_aws == 'true'
        env:
          CLUSTER: ${{ env.EKS_CLUSTER_NAME }}
          REGION: ${{ env.AWS_REGION }}
        run: aws eks update-kubeconfig --name "$CLUSTER" --region "$REGION"

      - name: Wait for ArgoCD sync (dev)
        if: steps.guard.outputs.has_aws == 'true'
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          kubectl rollout status "deployment/${SERVICE}" \
            -n services-dev --timeout=5m 2>/dev/null || \
          kubectl rollout status "rollout/${SERVICE}" \
            -n services-dev --timeout=5m 2>/dev/null || true

      - name: Smoke test /healthz
        if: steps.guard.outputs.has_aws == 'true'
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          kubectl port-forward "svc/${SERVICE}" 8080:80 \
            -n services-dev &>/tmp/pf.log &
          PF_PID=$!
          sleep 3
          HTTP_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8080/healthz || echo "000")
          kill $PF_PID 2>/dev/null || true
          echo "Health check status: ${HTTP_STATUS}"
          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "::error::Smoke test failed — /healthz returned ${HTTP_STATUS}"
            exit 1
          fi

      - name: Check DD_API_KEY secret
        id: dd-guard
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: |
          if [ -z "$DD_API_KEY" ]; then
            echo "has_datadog=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_datadog=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Datadog deployment marker (dev)
        # Deployment Tracking — annotates Datadog dashboards/APM with the exact
        # moment this revision went live in dev, so incidents can be correlated
        # with "which deploy caused it." Non-blocking: observability, not a gate.
        # Docs: https://docs.datadoghq.com/deployment_tracking/
        if: steps.guard.outputs.has_aws == 'true' && steps.dd-guard.outputs.has_datadog == 'true'
        continue-on-error: true
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_SITE: datadoghq.eu
        run: |
          npx --yes @datadog/datadog-ci@2.18.0 deployment mark \
            --env dev \
            --service "${{ matrix.service }}" \
            --revision "${{ needs.build-and-push.outputs.image_tag }}" \
            --no-fail || echo "::warning::Datadog deployment marker failed — non-blocking. Verify DD_API_KEY and current datadog-ci CLI syntax (https://docs.datadoghq.com/deployment_tracking/)."

  # ─── Promote to staging (open PR) ──────────────────────────────────────────
  # Opens a PR updating helm-values-staging.yaml with the new image tag.
  # A human reviews and merges; ArgoCD deploys to the staging namespace.
  promote-to-staging:
    needs: [detect-changes, build-and-push, smoke-test-dev]
    if: ${{ github.ref == 'refs/heads/main' && needs.detect-changes.outputs.services != '[]' }}
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ secrets.IDP_PLATFORM_TOKEN }}
          fetch-depth: 0

      - name: Check AWS_ROLE_ARN secret
        id: guard
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "has_aws=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_aws=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.guard.outputs.has_aws == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        if: steps.guard.outputs.has_aws == 'true'
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Create staging promotion PR
        if: steps.guard.outputs.has_aws == 'true'
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          IMAGE_REPO: ${{ steps.login-ecr.outputs.registry }}/${{ env.EKS_CLUSTER_NAME }}/${{ matrix.service }}
          GH_TOKEN: ${{ secrets.IDP_PLATFORM_TOKEN }}
        run: |
          BRANCH="promote/${SERVICE}-${IMAGE_TAG}-staging"
          git config user.name "idp-bot"
          git config user.email "idp-bot@platform"
          git checkout -b "${BRANCH}"

          # Copy dev values file to staging if it doesn't exist yet
          if [ ! -f "services/${SERVICE}/helm-values-staging.yaml" ]; then
            cp "services/${SERVICE}/helm-values-aws.yaml" \
               "services/${SERVICE}/helm-values-staging.yaml"
            sed -i 's/ENVIRONMENT: dev/ENVIRONMENT: staging/' \
              "services/${SERVICE}/helm-values-staging.yaml" 2>/dev/null || true
          fi

          yq -i ".image.repository = \"${IMAGE_REPO}\"" \
            "services/${SERVICE}/helm-values-staging.yaml"
          yq -i ".image.tag = \"${IMAGE_TAG}\"" \
            "services/${SERVICE}/helm-values-staging.yaml"

          git add "services/${SERVICE}/helm-values-staging.yaml"
          git diff --staged --quiet && echo "No staging changes to promote." && exit 0
          git commit -m "chore(gitops): promote ${SERVICE} → ${IMAGE_TAG} [staging] [skip ci]"
          git push origin "${BRANCH}"

          {
            echo "## Staging Promotion"
            echo ""
            echo "**Service:** \`${SERVICE}\`"
            echo "**Image tag:** \`${IMAGE_TAG}\`"
            echo "**Promoted from:** dev (smoke test passed ✅)"
            echo ""
            echo "### What this PR does"
            echo "Updates \`helm-values-staging.yaml\` with the new image tag."
            echo "ArgoCD will deploy to \`services-staging\` namespace after merge."
            echo ""
            echo "### Pre-merge checklist"
            echo "- [ ] Dev smoke test passed (automated above)"
            echo "- [ ] No open P1/P2 incidents on this service"
            echo "- [ ] DORA change failure rate is acceptable"
            echo ""
            echo "_Opened automatically by the GitOps promotion pipeline._"
          } > /tmp/pr-body.md
          gh pr create \
            --title "chore(promote): ${SERVICE} → ${IMAGE_TAG} to staging" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "${BRANCH}" \
            --label "gitops-promotion"

      - name: Notify Slack — staging PR opened
        if: steps.guard.outputs.has_aws == 'true' && success()
        continue-on-error: true
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}/pulls
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ secrets.SLACK_CHANNEL_ID }}"
            text: ":rocket: *`${{ env.SERVICE }}`* dev smoke test passed — staging promotion PR opened for `${{ env.IMAGE_TAG }}`\n<${{ env.REPO_URL }}|View PRs>"

  # ─── Smoke test staging before promoting to production ────────────────────
  # Only runs when this push IS the merge of a promote-to-staging PR (detected via
  # the staging_promoted path filter above) — not on every ordinary source push.
  smoke-test-staging:
    needs: [detect-changes, build-and-push]
    if: ${{ github.ref == 'refs/heads/main' && needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.staging_promoted == 'true' }}
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check AWS_ROLE_ARN secret
        id: guard
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "has_aws=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_aws=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.guard.outputs.has_aws == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        if: steps.guard.outputs.has_aws == 'true'
        env:
          CLUSTER: ${{ env.EKS_CLUSTER_NAME }}
          REGION: ${{ env.AWS_REGION }}
        run: aws eks update-kubeconfig --name "$CLUSTER" --region "$REGION"

      - name: Wait for ArgoCD sync (staging)
        if: steps.guard.outputs.has_aws == 'true'
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          kubectl rollout status "deployment/${SERVICE}" \
            -n services-staging --timeout=5m 2>/dev/null || \
          kubectl rollout status "rollout/${SERVICE}" \
            -n services-staging --timeout=5m 2>/dev/null || true

      - name: Smoke test /healthz
        if: steps.guard.outputs.has_aws == 'true'
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          kubectl port-forward "svc/${SERVICE}" 8080:80 \
            -n services-staging &>/tmp/pf.log &
          PF_PID=$!
          sleep 3
          HTTP_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8080/healthz || echo "000")
          kill $PF_PID 2>/dev/null || true
          echo "Health check status: ${HTTP_STATUS}"
          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "::error::Smoke test failed — /healthz returned ${HTTP_STATUS} in staging"
            exit 1
          fi

      - name: Check DD_API_KEY secret
        id: dd-guard
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: |
          if [ -z "$DD_API_KEY" ]; then
            echo "has_datadog=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_datadog=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Datadog deployment marker (staging)
        if: steps.guard.outputs.has_aws == 'true' && steps.dd-guard.outputs.has_datadog == 'true'
        continue-on-error: true
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_SITE: datadoghq.eu
        run: |
          npx --yes @datadog/datadog-ci@2.18.0 deployment mark \
            --env staging \
            --service "${{ matrix.service }}" \
            --revision "${{ needs.build-and-push.outputs.image_tag }}" \
            --no-fail || echo "::warning::Datadog deployment marker failed — non-blocking. Verify DD_API_KEY and current datadog-ci CLI syntax (https://docs.datadoghq.com/deployment_tracking/)."

  # ─── Promote to production (open PR) ───────────────────────────────────────
  # Mirrors promote-to-staging: opens a PR updating helm-values-prod.yaml. A human
  # reviews and merges (see docs/sre-reliability.md — prod requires manual approval,
  # no auto-merge); ArgoCD (idp-services-prod ApplicationSet) deploys on merge.
  promote-to-production:
    needs: [detect-changes, build-and-push, smoke-test-staging]
    if: ${{ github.ref == 'refs/heads/main' && needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.staging_promoted == 'true' }}
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ secrets.IDP_PLATFORM_TOKEN }}
          fetch-depth: 0

      - name: Check AWS_ROLE_ARN secret
        id: guard
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "has_aws=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_aws=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.guard.outputs.has_aws == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        if: steps.guard.outputs.has_aws == 'true'
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Create production promotion PR
        if: steps.guard.outputs.has_aws == 'true'
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          IMAGE_REPO: ${{ steps.login-ecr.outputs.registry }}/${{ env.EKS_CLUSTER_NAME }}/${{ matrix.service }}
          GH_TOKEN: ${{ secrets.IDP_PLATFORM_TOKEN }}
        run: |
          BRANCH="promote/${SERVICE}-${IMAGE_TAG}-production"
          git config user.name "idp-bot"
          git config user.email "idp-bot@platform"
          git checkout -b "${BRANCH}"

          # Copy staging values file to prod if it doesn't exist yet
          if [ ! -f "services/${SERVICE}/helm-values-prod.yaml" ]; then
            cp "services/${SERVICE}/helm-values-staging.yaml" \
               "services/${SERVICE}/helm-values-prod.yaml"
            sed -i 's/ENVIRONMENT: staging/ENVIRONMENT: prod/' \
              "services/${SERVICE}/helm-values-prod.yaml" 2>/dev/null || true
          fi

          yq -i ".image.repository = \"${IMAGE_REPO}\"" \
            "services/${SERVICE}/helm-values-prod.yaml"
          yq -i ".image.tag = \"${IMAGE_TAG}\"" \
            "services/${SERVICE}/helm-values-prod.yaml"

          git add "services/${SERVICE}/helm-values-prod.yaml"
          git diff --staged --quiet && echo "No production changes to promote." && exit 0
          git commit -m "chore(gitops): promote ${SERVICE} → ${IMAGE_TAG} [production] [skip ci]"
          git push origin "${BRANCH}"

          {
            echo "## Production Promotion"
            echo ""
            echo "**Service:** \`${SERVICE}\`"
            echo "**Image tag:** \`${IMAGE_TAG}\`"
            echo "**Promoted from:** staging (smoke test passed ✅)"
            echo ""
            echo "### What this PR does"
            echo "Updates \`helm-values-prod.yaml\` with the new image tag."
            echo "ArgoCD (\`idp-services-prod\` ApplicationSet) will deploy to \`services-prod\` after merge."
            echo "Note: production sync has \`selfHeal: false\` — an incident rollback via"
            echo "\`argocd app rollback\` will stick until this PR (or a fix) is re-synced."
            echo ""
            echo "### Pre-merge checklist"
            echo "- [ ] Staging smoke test passed (automated above)"
            echo "- [ ] Adequate bake-in time in staging (recommended: 24h+)"
            echo "- [ ] No open P1/P2 incidents on this service"
            echo "- [ ] On-call is aware of this deploy window"
            echo ""
            echo "_Opened automatically by the GitOps promotion pipeline. Requires manual merge — no auto-merge to production._"
          } > /tmp/pr-body.md
          gh pr create \
            --title "chore(promote): ${SERVICE} → ${IMAGE_TAG} to production" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "${BRANCH}" \
            --label "gitops-promotion" \
            --label "production"

      - name: Notify Slack — production PR opened
        if: steps.guard.outputs.has_aws == 'true' && success()
        continue-on-error: true
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}/pulls
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ secrets.SLACK_CHANNEL_ID }}"
            text: ":large_blue_circle: *`${{ env.SERVICE }}`* staging smoke test passed — *production* promotion PR opened for `${{ env.IMAGE_TAG }}`\n<${{ env.REPO_URL }}|View PRs>"

  # ─── Cost context on PRs ────────────────────────────────────────────────────
  # Posts the current services-dev namespace cost (7d window, via OpenCost — the
  # same source cost-mcp-server queries) as a PR comment, so reviewers see cost
  # context before merge instead of only in Grafana after the fact. This is
  # namespace-level, not per-service: OpenCost/cost-mcp-server don't currently
  # support per-service cost attribution, only per-namespace and per-team.
  cost-context:
    needs: detect-changes
    if: ${{ github.event_name == 'pull_request' && needs.detect-changes.outputs.services != '[]' }}
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check AWS_ROLE_ARN secret
        id: guard
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "has_aws=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_aws=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.guard.outputs.has_aws == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        if: steps.guard.outputs.has_aws == 'true'
        env:
          CLUSTER: ${{ env.EKS_CLUSTER_NAME }}
          REGION: ${{ env.AWS_REGION }}
        run: aws eks update-kubeconfig --name "$CLUSTER" --region "$REGION"

      - name: Query current dev namespace cost (OpenCost)
        if: steps.guard.outputs.has_aws == 'true'
        id: cost
        run: |
          kubectl port-forward svc/opencost -n opencost 9003:9003 &>/tmp/pf-opencost.log &
          PF_PID=$!
          sleep 3
          RESPONSE=$(curl -sf "http://localhost:9003/allocation/compute?window=7d&aggregate=namespace&accumulate=true" || echo '{}')
          kill $PF_PID 2>/dev/null || true
          TOTAL=$(echo "$RESPONSE" | jq -r '.data[0]["services-dev"].totalCost // empty')
          if [ -z "$TOTAL" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "total_7d=$(printf '%.2f' "$TOTAL")" >> "$GITHUB_OUTPUT"
          fi

      - name: Post cost context PR comment
        if: steps.guard.outputs.has_aws == 'true' && steps.cost.outputs.found == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          SERVICE: ${{ matrix.service }}
          TOTAL_7D: ${{ steps.cost.outputs.total_7d }}
        with:
          script: |
            const service = process.env.SERVICE;
            const total = process.env.TOTAL_7D;
            const body = `## 💰 Cost Context — \`${service}\`\n\n` +
              `\`services-dev\` namespace total compute cost (last 7 days, all services): **$${total}**\n\n` +
              `<sub>Namespace-level only — cost-mcp-server doesn't yet support per-service cost attribution. ` +
              `See the [FinOps dashboard](http://grafana.idp.local/d/idp-finops) for team-level budget status.</sub>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
