name: LLM Eval (DeepEval)

on:
  push:
    branches: ['**']
    paths:
      - 'test-suites/test-deepeval/**'
      - 'kubernetes/kagent/idp-agent.yaml'
      - '.github/workflows/eval.yml'
  pull_request:
    branches: [main]
    paths:
      - 'test-suites/test-deepeval/**'
      - 'kubernetes/kagent/idp-agent.yaml'
      - '.github/workflows/eval.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deepeval:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: test-suites/test-deepeval

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check API key
        run: |
          if [[ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]]; then
            echo "ANTHROPIC_API_KEY secret is not set — skipping eval."
            echo "skip=true" >> $GITHUB_ENV
          fi

      - name: Set up Python
        if: env.skip != 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: test-suites/test-deepeval/requirements.txt

      - name: Install dependencies
        if: env.skip != 'true'
        run: pip install -r requirements.txt

      - name: Run DeepEval suite
        if: env.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPEVAL_TELEMETRY_OPT_OUT: 'YES'
        run: |
          deepeval test run tests/test_idp_assistant.py \
            --exit-on-first-failure \
            --junitxml=results/report.xml \
            --html=results/report.html \
            --self-contained-html

      # always(), so a failing eval still publishes its scores — a metric that
      # dropped below threshold is exactly the point worth having on the trend
      # line. Skips silently unless LANGFUSE_HOST is configured; a cluster-local
      # Langfuse is not reachable from a GitHub-hosted runner, so this only does
      # anything against Langfuse Cloud or the AWS ALB.
      - name: Push eval scores to Langfuse
        if: env.skip != 'true' && always()
        env:
          LANGFUSE_HOST:       ${{ secrets.LANGFUSE_HOST }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: |
          if [[ -z "${LANGFUSE_HOST}" ]]; then
            echo "::notice::LANGFUSE_HOST not set — skipping the Langfuse push."
            exit 0
          fi
          pip install --quiet 'langfuse>=3'
          python scripts/push_to_langfuse.py

      - name: Upload test report
        if: env.skip != 'true' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deepeval-report
          path: test-suites/test-deepeval/results/
          retention-days: 30
