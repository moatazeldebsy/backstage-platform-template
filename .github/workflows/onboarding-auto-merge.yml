name: Auto-merge service onboarding PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: startsWith(github.event.pull_request.title, 'feat(onboard)')
    steps:
      - uses: actions/checkout@v4

      - name: Verify safe files and auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh pr view "$PR_NUMBER" --json files --jq '[.files[].path] | join("\n")')
          unsafe=$(echo "$files" | grep -vE '^services/[^/]+/helm-values[^/]*\.yaml$' || true)
          if [ -n "$unsafe" ]; then
            echo "::error::PR touches files outside helm-values -- manual review required"
            exit 1
          fi
          gh pr review "$PR_NUMBER" --approve --body "Auto-approved: only GitOps values files changed."
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch
