name: CI

on:
  push:
    branches: ['**']
    paths:
      - 'services/**'
      - 'helm/**'
      - 'kubernetes/**'
      - 'terraform/**'
      - 'backstage/app/**'
      - 'backstage/app-config*.yaml'
      - 'backstage/Dockerfile'
      - 'backstage/catalog/**'
      - 'observability/**'
      - 'local/observability/**'
      - 'aws/observability/**'
      - 'cli/**'
      - '.github/workflows/ci.yml'
      # Weakening an allowlist here changes what secrets-scan will catch, so it
      # has to re-run the scan rather than ride in on an unrelated push.
      - '.gitleaks.toml'
  # No `paths:` filter here, deliberately. `main` requires helm-lint, k8s-dry-run
  # and backstage-compile to pass, and a required check that never *starts* is
  # reported as pending forever — so a path filter on the trigger made every
  # docs-only PR permanently unmergeable. Instead the workflow always starts and
  # the `changes` job below decides which jobs actually do work. Jobs skipped by
  # an `if:` condition report a "skipped" conclusion, which branch protection
  # accepts as success.
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Works out which areas a PR touches, so the expensive jobs below can skip
  # themselves without the whole workflow being filtered out of existence.
  # Uses plain git rather than a paths-filter action to avoid adding a
  # third-party dependency to a workflow that pins every action by SHA.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      go-service: ${{ steps.filter.outputs.go-service }}
      cli: ${{ steps.filter.outputs.cli }}
      helm: ${{ steps.filter.outputs.helm }}
      k8s: ${{ steps.filter.outputs.k8s }}
      backstage: ${{ steps.filter.outputs.backstage }}
      catalog: ${{ steps.filter.outputs.catalog }}
      terraform: ${{ steps.filter.outputs.terraform }}
      python-obs: ${{ steps.filter.outputs.python-obs }}
      contract-mcp: ${{ steps.filter.outputs.contract-mcp }}
      mcp-servers: ${{ steps.filter.outputs.mcp-servers }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Collect changed files
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin "$BASE_REF"
            files=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          elif [[ -n "${BEFORE_SHA:-}" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] \
               && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BEFORE_SHA" "${{ github.sha }}")
          else
            # New branch, force-push, or shallow history — run everything rather
            # than risk skipping a job that should have run.
            files=$(git ls-files)
          fi

          echo "Changed files:"
          echo "$files" | sed 's/^/  /'

          # A change to the workflow itself re-runs everything.
          if grep -qx '.github/workflows/ci.yml' <<<"$files"; then
            echo "ci.yml changed — running all jobs."
            for k in go-service cli helm k8s backstage catalog terraform python-obs contract-mcp mcp-servers scripts; do
              echo "$k=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi

          match() { grep -qE "$1" <<<"$files" && echo true || echo false; }

          {
            echo "go-service=$(match '^services/hello-service/')"
            echo "cli=$(match '^cli/')"
            echo "helm=$(match '^helm/')"
            # observability/alertmanager/ holds AlertmanagerConfig and PrometheusRule
            # CRs. It matched only python-obs, which runs py_compile and never parses
            # YAML, so those manifests were never validated by anything.
            echo "k8s=$(match '^(kubernetes/|observability/alertmanager/|aws/argo-workflows/)')"
            echo "backstage=$(match '^backstage/(app/|app-config.*\.yaml|Dockerfile)')"
            # This filter is deliberately wider than backstage/catalog/:
            #  - kubernetes/kagent/modelconfig*.yaml, because check 7 compares
            #    those manifests against the allow-list in the ai-agent-kagent
            #    skeleton's CI. Without it, adding a ModelConfig touches no
            #    catalog path and the drift ships green.
            #  - the rest of kubernetes/kagent/, aws/kagent/, the scaffolder
            #    action modules and bootstrap-ai.sh, because check 8 validates
            #    every kagent.dev apiVersion in those against the CRD versions
            #    the pinned KAgent chart actually serves.
            #  - test-suites/test-deepeval/tests/ and sync-agent-prompts.py,
            #    because the eval suite keeps a verbatim copy of idp-agent.yaml's
            #    systemMessage. When that copy drifts, CI grades a prompt that is
            #    not deployed and passing evals mean nothing — which had already
            #    happened (25 lines here vs 50 in the CRD).
            echo "catalog=$(match '^(backstage/catalog/|kubernetes/kagent/|aws/kagent/|backstage/app/packages/backend/src/modules/|test-suites/test-deepeval/tests/|scripts/(bootstrap-ai\.sh|validate-catalog-templates\.py|sync-agent-prompts\.py))')"
            echo "terraform=$(match '^terraform/')"
            echo "python-obs=$(match '^(observability/|local/observability/|aws/observability/)')"
            echo "contract-mcp=$(match '^services/contract-mcp-server/')"
            # Every MCP server except contract (which has its own job above), plus
            # agent-event-router and approval-service. Those two are not named
            # "*-mcp-server" and so matched no filter at all: they have a tsc build,
            # jest.config.js and src/__tests__/, and every change to them ran zero
            # jobs and reported green. Observed 2026-08-13.
            echo "mcp-servers=$(match '^services/((idp|qa|github|argocd|cost|incident|security)-mcp-server|agent-event-router|approval-service)/')"
            echo "scripts=$(match '^scripts/.*\.sh$')"
          } >> "$GITHUB_OUTPUT"

  # backstage/catalog/ matched no filter at all, so a PR touching only
  # scaffolder templates ran zero jobs and still reported green — template
  # YAML was never parsed and tier/registration drift was never caught.
  catalog-lint:
    needs: changes
    if: needs.changes.outputs.catalog == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Validate scaffolder catalog
        run: python3 scripts/validate-catalog-templates.py

      # The DeepEval suite grades a copy of idp-agent.yaml's systemMessage.
      # If the copy drifts, the evals are scoring a prompt that is not deployed.
      - name: Check agent prompt / eval-suite drift
        run: python3 scripts/sync-agent-prompts.py --check-evals

  # Shell scripts had no CI coverage at all — scripts/ was absent from the old
  # path filter, so bootstrap-local.sh and friends were never even parsed.
  shell-lint:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Parse every script (bash -n)
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "::error file=$f::bash -n failed"; fail=1; }
          done < <(find scripts -name '*.sh' -type f | sort)
          exit $fail

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC1091: sourced files aren't followed in CI.
          # Warnings are advisory for now; errors fail the build.
          find scripts -name '*.sh' -type f -print0 \
            | xargs -0 shellcheck --severity=error --exclude=SC1091

  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Scan for secrets with gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-hello-service:
    needs: changes
    if: needs.changes.outputs.go-service == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: services/hello-service/go.mod

      - name: Run tests with coverage
        working-directory: services/hello-service
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-coverage
          path: services/hello-service/coverage.out
          retention-days: 1

  test-cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: cli/go.mod

      - name: Build CLI
        working-directory: cli
        run: go build ./...

      - name: Vet CLI
        working-directory: cli
        run: go vet ./...

      - name: Test CLI
        working-directory: cli
        run: go test ./...

  python-observability-checks:
    needs: changes
    if: needs.changes.outputs.python-obs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Syntax check observability scripts
        run: |
          python -m py_compile local/observability/dora/dora-exporter.py
          python -m py_compile aws/observability/dora/dora-exporter.py
          python -m py_compile observability/tech-insights-exporter/exporter.py
          python -m py_compile observability/flaky-test-exporter/exporter.py

  helm-lint:
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.17.0

      - name: Lint service-template chart
        run: helm lint helm/service-template

      - name: Lint with required values
        run: helm lint helm/service-template --set image.repository=test --set image.tag=abc1234

  k8s-dry-run:
    needs: changes
    if: needs.changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install kubeconform
        run: |
          curl -sSLO "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz"
          curl -sSLO "https://github.com/yannh/kubeconform/releases/download/v0.6.7/CHECKSUMS"
          grep "kubeconform-linux-amd64.tar.gz" CHECKSUMS | sha256sum -c
          tar -xz -f kubeconform-linux-amd64.tar.gz && sudo mv kubeconform /usr/local/bin/

      - name: Validate namespace manifests
        run: kubeconform -strict -summary kubernetes/namespaces/

      - name: Validate RBAC manifests
        run: kubeconform -strict -summary kubernetes/rbac/

      - name: Validate monitoring manifests
        run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            kubernetes/monitoring/

      - name: Validate kagent manifests
        run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -ignore-missing-schemas \
            -ignore-filename-pattern 'values-.*\.yaml' \
            kubernetes/kagent/

      # These four directories are all CRD-backed and none of them were validated:
      # the Argo Rollouts AnalysisTemplate, the Argo Workflows RBAC, the ML platform
      # manifests and the Alertmanager/Prometheus CRs could ship malformed and CI
      # stayed green. The ignore pattern covers both values-*.yaml and *-values.yaml,
      # which are Helm inputs rather than manifests.
      - name: Validate Argo Rollouts and Argo Workflows manifests
        run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -ignore-missing-schemas \
            -ignore-filename-pattern '.*values\.yaml' \
            kubernetes/argo-rollouts/ kubernetes/argo-workflows/ aws/argo-workflows/

      - name: Validate ML platform manifests
        run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -ignore-missing-schemas \
            -ignore-filename-pattern '.*values\.yaml' \
            kubernetes/ml-platform/

      - name: Validate Alertmanager and Prometheus rules
        run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -ignore-missing-schemas \
            observability/alertmanager/

  backstage-compile:
    needs: changes
    if: needs.changes.outputs.backstage == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        working-directory: backstage/app
        run: yarn install --immutable

      # Runs before the build, and is the only real type gate here: the
      # backstage-cli build transpiles rather than type-checks, so the bundle
      # compiled happily for a long time while `tsc` reported 85 errors. Among
      # them were a scaffolder action referencing an undefined variable, an
      # authorization guard that swallowed its own denial, and a fact retriever
      # reading a context field that no longer exists — all invisible to the
      # build and to the tests.
      - name: Type-check
        working-directory: backstage/app
        run: yarn tsc

      - name: Build backend bundle
        working-directory: backstage/app
        env:
          CI: ''
        run: yarn build:backend

      - name: Build Docker image (local, no push)
        run: docker build -t backstage:ci -f backstage/Dockerfile backstage/app

  contract-mcp-server-build:
    needs: changes
    if: needs.changes.outputs.contract-mcp == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/contract-mcp-server/package.json

      - name: Install dependencies
        working-directory: services/contract-mcp-server
        run: npm ci

      - name: TypeScript compile
        working-directory: services/contract-mcp-server
        run: npm run build

  # Until this job existed, contract-mcp-server was the ONLY Node service with
  # CI coverage — the other seven MCP servers were never compiled or tested, so
  # a type error or a broken test in any of them shipped green. That became
  # untenable once src/telemetry.ts started being copied across all eight.
  mcp-servers-build:
    needs: changes
    if: needs.changes.outputs.mcp-servers == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - idp-mcp-server
          - qa-mcp-server
          - github-mcp-server
          - argocd-mcp-server
          - cost-mcp-server
          - incident-mcp-server
          - security-mcp-server
          # Not MCP servers, but same Node/tsc/jest shape and same gate.
          - agent-event-router
          - approval-service
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package.json

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm ci

      - name: TypeScript compile
        working-directory: services/${{ matrix.service }}
        run: npm run build

      - name: Test
        working-directory: services/${{ matrix.service }}
        run: npm test

  # src/telemetry.ts is copied verbatim into every MCP server (see the header
  # comment in that file for why a shared package is not workable here). This
  # is what stops the copies silently diverging.
  mcp-telemetry-drift:
    needs: changes
    # contract-mcp-server carries a copy too, but is excluded from the
    # mcp-servers filter because it has its own build job — so it needs naming
    # here as well, or editing only that copy would skip the drift check.
    if: needs.changes.outputs.mcp-servers == 'true' || needs.changes.outputs.contract-mcp == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Compare telemetry.ts checksums
        run: |
          set -euo pipefail
          mapfile -t files < <(find services -name telemetry.ts -path '*/src/*' | sort)
          if [[ ${#files[@]} -lt 2 ]]; then
            echo "Only ${#files[@]} telemetry.ts found — nothing to compare."
            exit 0
          fi
          printf '%s\n' "${files[@]}"
          if [[ $(sha256sum "${files[@]}" | awk '{print $1}' | sort -u | wc -l) -ne 1 ]]; then
            echo "::error::services/*/src/telemetry.ts copies have diverged."
            sha256sum "${files[@]}"
            first="${files[0]}"
            for f in "${files[@]:1}"; do diff -u "$first" "$f" || true; done
            exit 1
          fi
          echo "All ${#files[@]} telemetry.ts copies are identical."

  terraform-check:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Cache Terraform providers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: terraform/.terraform
          key: terraform-${{ hashFiles('terraform/.terraform.lock.hcl') }}
          restore-keys: terraform-

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: '1.10.5'

      - name: terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: terraform init (no backend)
        working-directory: terraform
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: terraform
        run: terraform validate
