name: CI

on:
  push:
    branches: ['**']
    paths:
      - 'services/**'
      - 'helm/**'
      - 'kubernetes/**'
      - 'terraform/**'
      - 'backstage/app/**'
      - 'backstage/app-config*.yaml'
      - 'backstage/Dockerfile'
      - 'observability/**'
      - 'local/observability/**'
      - 'aws/observability/**'
      - 'cli/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/**'
      - 'helm/**'
      - 'kubernetes/**'
      - 'terraform/**'
      - 'backstage/app/**'
      - 'backstage/app-config*.yaml'
      - 'backstage/Dockerfile'
      - 'observability/**'
      - 'local/observability/**'
      - 'aws/observability/**'
      - 'cli/**'
      - '.github/workflows/ci.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Scan for secrets with gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-hello-service:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: services/hello-service/go.mod

      - name: Run tests with coverage
        working-directory: services/hello-service
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-coverage
          path: services/hello-service/coverage.out
          retention-days: 1

  test-cli:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: cli/go.mod

      - name: Build CLI
        working-directory: cli
        run: go build ./...

      - name: Vet CLI
        working-directory: cli
        run: go vet ./...

      - name: Test CLI
        working-directory: cli
        run: go test ./...

  python-observability-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Syntax check observability scripts
        run: |
          python -m py_compile local/observability/dora/dora-exporter.py
          python -m py_compile aws/observability/dora/dora-exporter.py
          python -m py_compile observability/tech-insights-exporter/exporter.py
          python -m py_compile observability/flaky-test-exporter/exporter.py

  helm-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.17.0

      - name: Lint service-template chart
        run: helm lint helm/service-template

      - name: Lint with required values
        run: helm lint helm/service-template --set image.repository=test --set image.tag=abc1234

  k8s-dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install kubeconform
        run: |
          curl -sSLO "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz"
          curl -sSLO "https://github.com/yannh/kubeconform/releases/download/v0.6.7/CHECKSUMS"
          grep "kubeconform-linux-amd64.tar.gz" CHECKSUMS | sha256sum -c
          tar -xz -f kubeconform-linux-amd64.tar.gz && sudo mv kubeconform /usr/local/bin/

      - name: Validate namespace manifests
        run: kubeconform -strict -summary kubernetes/namespaces/

      - name: Validate RBAC manifests
        run: kubeconform -strict -summary kubernetes/rbac/

      - name: Validate monitoring manifests
        run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            kubernetes/monitoring/

      - name: Validate kagent manifests
        run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -ignore-missing-schemas \
            -ignore-filename-pattern 'values-.*\.yaml' \
            kubernetes/kagent/

  backstage-compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        working-directory: backstage/app
        run: yarn install --immutable

      - name: Build backend bundle
        working-directory: backstage/app
        env:
          CI: ''
        run: yarn build:backend

      - name: Build Docker image (local, no push)
        run: docker build -t backstage:ci -f backstage/Dockerfile backstage/app

  contract-mcp-server-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/contract-mcp-server/package.json

      - name: Install dependencies
        working-directory: services/contract-mcp-server
        run: npm ci

      - name: TypeScript compile
        working-directory: services/contract-mcp-server
        run: npm run build

  terraform-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Cache Terraform providers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: terraform/.terraform
          key: terraform-${{ hashFiles('terraform/.terraform.lock.hcl') }}
          restore-keys: terraform-

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: '1.10.5'

      - name: terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: terraform init (no backend)
        working-directory: terraform
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: terraform
        run: terraform validate
