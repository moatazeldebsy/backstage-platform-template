# Argo Workflows Helm values for local Kind deployment
# Install: helm upgrade --install argo-workflows argo/argo-workflows --namespace argo-workflows --create-namespace -f local/argo-workflows/values.yaml --wait

server:
  extraArgs:
    - "--auth-mode=server"  # Disable SSO for local dev
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - argo-workflows.idp.local
    # server.ingress.paths is a list of PATH STRINGS, with pathType as a
    # sibling scalar — not a list of {path, pathType} objects. The object form
    # renders as `path: map[path:/ pathType:Prefix]` and the API server rejects
    # the Ingress with "must be an absolute path", which failed the whole
    # `helm install argo-workflows` and took the ML training pipeline, the LLM
    # eval pipeline and the DR failover runbook down with it. Fixed on the AWS
    # side 2026-08-16; this local copy was missed. Observed 2026-08-18.
    paths:
      - /
    pathType: Prefix
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false

controller:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false

executor:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

persistence:
  enabled: true
  storageClassName: standard
  size: 1Gi

workflow:
  rbac:
    create: true

artifactRepository:
  s3:
    bucket: argo-workflows-artifacts
    endpoint: minio:9000
    insecure: true
    useSDKCreds: true
  archiveLogs: false
