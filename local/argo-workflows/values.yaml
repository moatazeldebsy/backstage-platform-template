# Argo Workflows Helm values for local Kind deployment
# Install: helm upgrade --install argo-workflows argo/argo-workflows --namespace argo-workflows --create-namespace -f local/argo-workflows/values.yaml --wait

server:
  extraArgs:
    - "--auth-mode=server"  # Disable SSO for local dev
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - argo-workflows.idp.local
    paths:
      - path: /
        pathType: Prefix
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false

controller:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false

executor:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

persistence:
  enabled: true
  storageClassName: standard
  size: 1Gi

workflow:
  rbac:
    create: true

artifactRepository:
  s3:
    bucket: argo-workflows-artifacts
    endpoint: minio:9000
    insecure: true
    useSDKCreds: true
  archiveLogs: false
