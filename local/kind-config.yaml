kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: idp-mvp

# K8s 1.33 — tested stable on macOS ARM64 with Docker Desktop
# Registry mirrors are configured post-creation via bootstrap-local.sh
# using the hosts.toml approach (compatible with containerd v1 and v2).
nodes:
  - role: control-plane
    image: kindest/node:v1.33.1
    # node-labels via kind native label (kubelet flag removed in K8s 1.27)
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  # Single worker — the control-plane + 2 workers footprint was oversubscribing
  # an 8 CPU / 16GB Docker Desktop host (docker stats showed ~6.7 cores in use
  # just for the 3 Kind node containers + Backstage), which made kube-apiserver
  # calls start timing out under load and cascaded into CrashLoopBackOffs
  # (argocd-repo-server, prometheus-operator, kagent-kmcp-controller-manager)
  # and intermittent 503s through nginx (Grafana, kagent UI).
  - role: worker
    image: kindest/node:v1.33.1
