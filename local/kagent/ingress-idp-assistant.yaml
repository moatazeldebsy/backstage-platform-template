apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: idp-assistant
  namespace: kagent
  labels:
    app: idp-assistant
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: idp-assistant.idp.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: idp-assistant
                port:
                  number: 8080
