# KAgent Helm values for local Kind cluster — uses Anthropic Claude API.
# Requires a Kubernetes Secret: kagent-anthropic (key: ANTHROPIC_API_KEY)
# Create it with: scripts/bootstrap-ai.sh  (reads from local/.env)

providers:
  default: anthropic
  anthropic:
    provider: Anthropic
    model: claude-haiku-4-5-20251001
    apiKeySecretRef: kagent-anthropic
    apiKeySecretKey: ANTHROPIC_API_KEY

ui:
  enabled: true
  service:
    type: ClusterIP
  # backendInternalUrl sets BACKEND_INTERNAL_URL in the Next.js container.
  # Next.js server actions use this as the base URL for all SSR API calls.
  # Routing through 127.0.0.1:8080 (nginx inside the pod) avoids direct
  # in-cluster DNS calls from Node.js that cause Next.js to crash.
  # Nginx forwards /api/* → kagent-controller:8083/api/* correctly.
  backendInternalUrl: "http://127.0.0.1:8080/api"

# ── Built-in agents that cannot function on this cluster ─────────────────────
# The chart ships an agent per ecosystem it knows about and enables them all by
# default. Five of them have nothing to talk to here: the local Kind cluster
# uses kindnet (not Cilium), and neither Istio nor kgateway is installed. They
# start, idle, and never do anything.
#
# Measured on a running local cluster: 866Mi RSS and 5 pods, ~24% of the kagent
# namespace's total memory. The idle CPU is small (21m), but the cost that
# matters is the startup burst — five more Python/ADK agents booting at once on
# a 6-CPU VM. That contention is what pushed etcd into "request timed out" and
# took the API server down during a --adp run.
#
# Re-enable any of these by flipping the flag if you add the matching component.
kgateway-agent:
  enabled: false
istio-agent:
  enabled: false
cilium-policy-agent:
  enabled: false
cilium-manager-agent:
  enabled: false
cilium-debug-agent:
  enabled: false

postgres:
  # Enable pgvector so the controller can create the memory table (vector(768)).
  vectorEnabled: true
  bundled:
    image:
      registry: docker.io
      repository: pgvector
      name: pgvector
      # pgvector-enabled Postgres 18 (multi-arch: amd64 + arm64)
      tag: "pg18"
