# KAgent Helm values for local Kind cluster — uses Anthropic Claude API.
# Requires a Kubernetes Secret: kagent-anthropic (key: ANTHROPIC_API_KEY)
# Create it with: scripts/bootstrap-ai.sh  (reads from local/.env)

providers:
  default: anthropic
  anthropic:
    provider: Anthropic
    model: claude-haiku-4-5-20251001
    apiKeySecretRef: kagent-anthropic
    apiKeySecretKey: ANTHROPIC_API_KEY

ui:
  enabled: true
  service:
    type: ClusterIP
  # backendInternalUrl sets BACKEND_INTERNAL_URL in the Next.js container.
  # Next.js server actions use this as the base URL for all SSR API calls.
  # Routing through 127.0.0.1:8080 (nginx inside the pod) avoids direct
  # in-cluster DNS calls from Node.js that cause Next.js to crash.
  # Nginx forwards /api/* → kagent-controller:8083/api/* correctly.
  backendInternalUrl: "http://127.0.0.1:8080/api"

# ── Built-in agents that cannot function on this cluster ─────────────────────
# The chart ships an agent per ecosystem it knows about and enables them all by
# default. Five of them have nothing to talk to here: the local Kind cluster
# uses kindnet (not Cilium), and neither Istio nor kgateway is installed. They
# start, idle, and never do anything.
#
# Measured on a running local cluster: 866Mi RSS and 5 pods, ~24% of the kagent
# namespace's total memory. The idle CPU is small (21m), but the cost that
# matters is the startup burst — five more Python/ADK agents booting at once on
# a 6-CPU VM. That contention is what pushed etcd into "request timed out" and
# took the API server down during a --adp run.
#
# Re-enable any of these by flipping the flag if you add the matching component.
kgateway-agent:
  enabled: false
istio-agent:
  enabled: false
cilium-policy-agent:
  enabled: false
cilium-manager-agent:
  enabled: false
cilium-debug-agent:
  enabled: false

# ── Generic chart agents, disabled for capacity ──────────────────────────────
# These five DO have something to talk to here, unlike the five above -- they
# are simply more than this machine can run. On a 6-CPU / 13GiB VM (75% of an
# 8-core / 16GiB Mac, with the host itself at load average 10-13) the full set
# never converges: the agents' containers start, log one line, and never open
# :8080, so readiness probes fail with "connection refused" indefinitely.
# Measured 2026-08-18 after a full bootstrap-ai run: 11 of 19 kagent pods ready,
# flat for over five minutes, with the Kind worker pinned at 300-490% CPU.
#
# What is kept is the platform's OWN agents, declared in kubernetes/kagent/
# (idp, platform, qa, contract, cost, incident, onboarding, release, security) --
# those are the golden path. What is dropped is the generic per-ecosystem set the
# chart ships, whose ground is already covered by the MCP servers: k8s/helm by
# idp-mcp-server, promql/observability by the Grafana and Prometheus integrations,
# argo-rollouts by argocd-mcp-server.
#
# NOTE: the chart key is argo-rollouts-agent; the pod it creates is named
# argo-rollouts-conversion-agent. Setting the pod name here would silently do
# nothing.
#
# These are safe to re-enable on AWS or on a larger local machine.
k8s-agent:
  enabled: false
helm-agent:
  enabled: false
promql-agent:
  enabled: false
observability-agent:
  enabled: false
argo-rollouts-agent:
  enabled: false

# Grafana MCP server. Two chart defaults are wrong for this platform and the
# combination leaves the RemoteMCPServer stuck at ACCEPTED=False, so
# grafana-agent has no tools:
#
#  1. mcp-grafana runs DNS-rebinding protection over its HTTP transport and
#     --allowed-hosts "defaults to loopback variants of --address". The KAgent
#     controller dials the Service name, so every initialize is answered
#     "403 forbidden: host not allowed" — and the server logs nothing for a
#     rejected request, so the pod looks perfectly healthy.
#  2. The chart's default GRAFANA_URL is grafana.kagent:3000/api, which is a
#     Grafana that does not exist here. Ours is the kube-prometheus-stack one
#     in the monitoring namespace, same as on AWS.
#
# Fixed on the AWS side 2026-08-17 (aws/kagent/values.yaml); this local copy was
# missed, and the defect applies identically — verified on the live local
# cluster, where the deployment's args were just ["--transport","streamable-http"]
# with no --allowed-hosts. Observed 2026-08-18.
grafana-mcp:
  args:
    # Named hosts rather than "*": the flag's own help warns that disabling
    # validation is only safe behind a trusted reverse proxy that rewrites Host.
    - --allowed-hosts
    - kagent-grafana-mcp.kagent:8000,kagent-grafana-mcp.kagent.svc:8000,kagent-grafana-mcp.kagent.svc.cluster.local:8000,kagent-grafana-mcp:8000,localhost:8000,127.0.0.1:8000
  grafana:
    url: "http://prometheus-grafana.monitoring/api"
    # NOTE: no token is wired here. The AWS file sets
    # `secretRef: kagent-grafana-mcp`, but the external-secret manifest its
    # comment points at (kubernetes/kagent/external-secret-grafana-mcp.yaml)
    # does not exist, so that secret is empty on both targets. Locally
    # bootstrap-local.sh already provisions a Grafana service-account token
    # (GRAFANA_TOKEN in local/backstage/.env) that could populate it. Wiring
    # that up is tracked separately; the two defects above are what block the
    # RemoteMCPServer from being ACCEPTED at all.

postgres:
  # Enable pgvector so the controller can create the memory table (vector(768)).
  vectorEnabled: true
  bundled:
    image:
      registry: docker.io
      repository: pgvector
      name: pgvector
      # pgvector-enabled Postgres 18 (multi-arch: amd64 + arm64)
      tag: "pg18"
