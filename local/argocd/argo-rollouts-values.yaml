# Argo Rollouts controller — local Kind
# helm repo add argo https://argoproj.github.io/argo-helm
# helm upgrade --install argo-rollouts argo/argo-rollouts \
#   -n argo-rollouts --create-namespace \
#   -f local/argocd/argo-rollouts-values.yaml

# Enable the dashboard (read-only UI at http://argo-rollouts.idp.local)
dashboard:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
    hosts:
      - argo-rollouts.idp.local

controller:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Metrics for Prometheus scraping
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: prometheus
