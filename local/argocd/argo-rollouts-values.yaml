# Argo Rollouts controller — local Kind
# helm repo add argo https://argoproj.github.io/argo-helm
# helm upgrade --install argo-rollouts argo/argo-rollouts \
#   -n argo-rollouts --create-namespace \
#   -f local/argocd/argo-rollouts-values.yaml

# Enable the dashboard (read-only UI at http://argo-rollouts.idp.local)
dashboard:
  enabled: true
  # Resource limits are REQUIRED here, not optional tuning. The dashboard ships
  # with no resources block, so it lands in BestEffort QoS with no CPU cap, and
  # it busy-loops: observed pinning a full core (100% CPU) indefinitely on an
  # idle cluster, which is ~16% of a 6-CPU local VM. That starves the API server
  # enough to break scheduler/controller-manager lease renewal. Capping it
  # dropped node load average from 112 to 36.
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
    hosts:
      - argo-rollouts.idp.local

controller:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Metrics for Prometheus scraping
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: prometheus
