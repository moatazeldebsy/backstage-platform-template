# ArgoCD ApplicationSet — local Kind variant
# Creates one Application per service per environment (local/dev/staging/prod).
# AWS equivalent: kubernetes/argocd/app-of-apps.yaml
#
# Apply: kubectl apply -f local/argocd/app-of-apps-local.yaml -n argocd
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: idp-services
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          # Generator 1: discover LEGACY flat services from services/<name>/.
          # Path convention:
          #   services/<name>/          → legacy / platform-owned services (this ApplicationSet)
          #   teams/<team>/services/<name>/  → team-owned services (per-team ApplicationSet)
          - git:
              repoURL: https://github.com/moatazeldebsy/backstage-platform-template.git
              revision: HEAD
              directories:
                - path: services/*
                # The services below are AI-stack-only: bootstrap-ai.sh builds
                # their images and creates the secrets/ConfigMaps they mount.
                # Excluding them prevents ArgoCD from auto-deploying before any
                # of that exists — and prevents the reverse problem, where a
                # Deployment already carrying an ArgoCD tracking-id forces
                # bootstrap-ai.sh to skip its own Helm install to avoid an
                # ownership conflict.
                - path: services/agent-event-router
                  exclude: true
                # bootstrap-local.sh's build loop already skips these two for
                # the same reason, so ArgoCD deployed them with images that were
                # never built → ImagePullBackOff on every fresh bootstrap.
                - path: services/idp-mcp-server
                  exclude: true
                - path: services/qa-mcp-server
                  exclude: true
                # Mounts the approval-service-policy ConfigMap, which only
                # bootstrap-ai.sh --adp creates; without it the pod is stuck in
                # ContainerCreating indefinitely.
                - path: services/approval-service
                  exclude: true
          # Generator 2: one entry per environment
          - list:
              elements:
                - env: local
                  namespace: services-dev
                  valuesFile: helm-values-local.yaml
  template:
    metadata:
      name: "{{path.basename}}-{{env}}"
      labels:
        environment: "{{env}}"
        service: "{{path.basename}}"
    spec:
      project: default
      sources:
        - repoURL: https://github.com/moatazeldebsy/backstage-platform-template.git
          targetRevision: HEAD
          path: helm/service-template
          helm:
            parameters:
              - name: backstage.kubernetesId
                value: "{{path.basename}}"
            # Optional per-service progressive-delivery overlay. A scaffolder
            # skeleton cannot merge into an existing file, which is why the
            # canary-deployment template used to emit a .patch nobody applied --
            # a second, wholly-generated values file is something it *can* write.
            # ignoreMissingValueFiles is mandatory: without it every service that
            # has no such file puts this whole ApplicationSet into ComparisonError.
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/services/{{path.basename}}/{{valuesFile}}
              - $values/services/{{path.basename}}/helm-values-rollout-{{env}}.yaml
        - repoURL: https://github.com/moatazeldebsy/backstage-platform-template.git
          targetRevision: HEAD
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
