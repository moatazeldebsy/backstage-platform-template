# ArgoCD ApplicationSet — local Kind variant
# Creates one Application per service per environment (local/dev/staging/prod).
# AWS equivalent: kubernetes/argocd/app-of-apps.yaml
#
# Apply: kubectl apply -f local/argocd/app-of-apps-local.yaml -n argocd
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: idp-services
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          # Generator 1: discover LEGACY flat services from services/<name>/.
          # Path convention:
          #   services/<name>/          → legacy / platform-owned services (this ApplicationSet)
          #   teams/<team>/services/<name>/  → team-owned services (per-team ApplicationSet)
          - git:
              repoURL: https://github.com/moatazeldebsy/backstage-platform-template.git
              revision: HEAD
              directories:
                - path: services/*
                # No exclusions — the ten AI/MCP services take the same GitOps
                # path as everything else, matching aws/argocd/app-of-apps.yaml.
                #
                # They used to be excluded here because bootstrap-ai.sh owned
                # them via Helm and two systems cannot own one release. Removing
                # the exclusions required two things on the local side that AWS
                # got for free, because ECR images outlive a cluster while the
                # local registry is recreated with it:
                #   - bootstrap-local.sh must build idp-mcp-server and
                #     qa-mcp-server (it used to skip them), or ArgoCD deploys
                #     images that were never pushed to localhost:5003.
                #   - approval-service's policy ConfigMap volume must be
                #     optional, since only bootstrap-ai.sh --adp creates it.
                # Both are in place; do not re-add exclusions without reverting
                # those, or a core bootstrap breaks.
          # Generator 2: one entry per environment
          - list:
              elements:
                - env: local
                  namespace: services-dev
                  valuesFile: helm-values-local.yaml
  template:
    metadata:
      name: "{{path.basename}}-{{env}}"
      labels:
        environment: "{{env}}"
        service: "{{path.basename}}"
    spec:
      project: default
      sources:
        - repoURL: https://github.com/moatazeldebsy/backstage-platform-template.git
          targetRevision: HEAD
          path: helm/service-template
          helm:
            parameters:
              - name: backstage.kubernetesId
                value: "{{path.basename}}"
            # Optional per-service progressive-delivery overlay. A scaffolder
            # skeleton cannot merge into an existing file, which is why the
            # canary-deployment template used to emit a .patch nobody applied --
            # a second, wholly-generated values file is something it *can* write.
            # ignoreMissingValueFiles is mandatory: without it every service that
            # has no such file puts this whole ApplicationSet into ComparisonError.
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/services/{{path.basename}}/{{valuesFile}}
              - $values/services/{{path.basename}}/helm-values-rollout-{{env}}.yaml
        - repoURL: https://github.com/moatazeldebsy/backstage-platform-template.git
          targetRevision: HEAD
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
