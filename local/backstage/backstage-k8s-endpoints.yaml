---
# Kubernetes Service + Endpoints that allow in-cluster pods to reach the Backstage
# Docker Compose container.
#
# Kind:            container IP on the shared "kind" Docker network (dynamic, set
#                  by bootstrap-local.sh --update-backstage-ip on each cluster reset)
# Rancher Desktop: 172.17.0.1 (docker0 host gateway) — kube-router iptables rules
#                  in the Lima VM block direct container IPs from k3s pods, so the
#                  host-gateway proxy via the exposed port 3000 is used instead.
apiVersion: v1
kind: Endpoints
metadata:
  name: backstage
  namespace: default
subsets:
  - addresses:
      - ip: "172.17.0.1"
    ports:
      - port: 3000
        protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: backstage
  namespace: default
  labels:
    app.kubernetes.io/name: backstage
    app.kubernetes.io/component: platform
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
  # No selector — traffic is routed via the manual Endpoints above
