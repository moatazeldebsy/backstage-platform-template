# Rancher Desktop overlay — removes the 'kind' external network dependency
# and routes postgres via host.docker.internal to work around a Rancher Desktop
# networking issue where k3s kube-router iptables rules drop SYN-ACKs for
# intra-bridge container-to-container TCP connections.
# Use with: docker compose -f docker-compose.yml -f docker-compose.rancher.yml

services:
  backstage:
    networks:
      - default
    extra_hosts:
      # Route postgres through the Docker host gateway to bypass kube-router
      # iptables rules in the Rancher Desktop Lima VM that drop intra-bridge
      # SYN-ACKs between containers on the same Docker bridge network.
      - "postgres-rdhost:host-gateway"
    environment:
      POSTGRES_HOST: postgres-rdhost

networks:
  kind:
    # Override: declare as a plain internal network instead of external=true.
    # This prevents docker compose from failing when the 'kind' Docker network
    # does not exist (Rancher Desktop does not create it).
    external: false
