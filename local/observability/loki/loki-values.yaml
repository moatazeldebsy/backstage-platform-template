# Loki single-binary (monolithic) for local Kind
# helm repo add grafana https://grafana.github.io/helm-charts
# helm upgrade --install loki grafana/loki \
#   -n monitoring --values local/observability/loki/loki-values.yaml

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  persistence:
    enabled: true
    size: 5Gi

# The chart's chunksCache/resultsCache (memcached-backed) default to several
# GB of memory requests each — fine on a real cluster, but on a local Kind
# node they alone can exceed total node memory and starve every other pod
# (observed: chunksCache requesting ~9.6Gi, resultsCache ~1.2Gi on a 12.65Gi
# node). Local dev has trivial query/write volume, so disable both caches
# rather than resize them — Loki falls back to querying storage directly.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Promtail is deployed as a separate chart
# See local/observability/loki/promtail-values.yaml

# Disable all scaled components (monolithic mode)
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Expose Loki for Grafana queries (no external ingress — internal only)
gateway:
  enabled: false
