# Loki single-binary (monolithic) for local Kind
# helm repo add grafana https://grafana.github.io/helm-charts
# helm upgrade --install loki grafana/loki \
#   -n monitoring --values local/observability/loki/loki-values.yaml

deploymentMode: SingleBinary

# The canary DaemonSet continuously writes and reads back probe logs to verify
# Loki is healthy. Pointless while Loki itself is scaled down, and it costs a
# pod per node. Already disabled on the live cluster (parked on a nodeSelector
# no node carries); turned off properly here.
lokiCanary:
  enabled: false

# The chart's validate.yaml hard-fails the render with "Helm test requires the
# Loki Canary to be enabled" if tests stay on while the canary is off, since the
# test suite queries the canary's metrics endpoint. Nothing runs `helm test`
# here, so turn it off alongside.
test:
  enabled: false

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

singleBinary:
  # NOTE: this value cannot turn Loki off, and 0 here would be a silent no-op.
  # The chart's `loki.singleBinaryReplicas` helper hardcodes $replicas := 1 and
  # only reads this field when using object storage AND replicas > 1; on
  # filesystem storage it always renders 1. The scale-down is therefore applied
  # after install by bootstrap-local.sh, not from here.
  #
  # Why it is scaled down at all: an 8CPU/16GB single-node Kind sits at ~380%
  # CPU overcommit on limits with the rest of the platform up, and adding
  # Loki + Tempo + Promtail starves the control plane — components answer
  # /healthz slowly, get probe-killed, and leader-election leases miss their 5s
  # renewal deadline. See promtail-values.yaml and ../tempo/tempo-values.yaml,
  # which can express this directly.
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  persistence:
    enabled: true
    size: 5Gi

# The chart's chunksCache/resultsCache (memcached-backed) default to several
# GB of memory requests each — fine on a real cluster, but on a local Kind
# node they alone can exceed total node memory and starve every other pod
# (observed: chunksCache requesting ~9.6Gi, resultsCache ~1.2Gi on a 12.65Gi
# node). Local dev has trivial query/write volume, so disable both caches
# rather than resize them — Loki falls back to querying storage directly.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Promtail is deployed as a separate chart
# See local/observability/loki/promtail-values.yaml

# Disable all scaled components (monolithic mode)
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Expose Loki for Grafana queries (no external ingress — internal only)
gateway:
  enabled: false
