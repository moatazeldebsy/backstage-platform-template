# Promtail DaemonSet — ships pod logs to Loki
# helm repo add grafana https://grafana.github.io/helm-charts
# helm upgrade --install promtail grafana/promtail \
#   -n monitoring --values local/observability/loki/promtail-values.yaml

config:
  clients:
    - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

  snippets:
    pipelineStages:
      - cri: {}

    scrapeConfigs: |
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: drop
            regex: 'false'
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_label_team]
            target_label: team
          - source_labels: [__meta_kubernetes_pod_label_cost_center]
            target_label: cost_center
          - replacement: /var/log/pods/*$1/*.log
            separator: /
            source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            target_label: __path__

# Disabled — see the note in loki-values.yaml. A DaemonSet has no replica count,
# so it is parked on a label no node carries, which schedules zero pods while
# leaving the release installed. This mirrors the live cluster, where promtail
# was already pinned to this exact selector out-of-band. Shipping logs to a Loki
# that is scaled to 0 would burn a pod per node for nothing.
# To re-enable, delete this nodeSelector and set singleBinary.replicas: 1 in
# loki-values.yaml.
nodeSelector:
  idp/disabled: "true"

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

tolerations:
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
