# Grafana Tempo single-binary for local Kind
# helm repo add grafana https://grafana.github.io/helm-charts
# helm upgrade --install tempo grafana/tempo \
#   -n monitoring --values local/observability/tempo/tempo-values.yaml

# Scaled to 0 — see the note in ../loki/loki-values.yaml. Tempo is installed but
# not run locally, to keep the single-node Kind cluster off its capacity ceiling.
# Set to 1 to re-enable tracing (tempo-ingress.yaml and the Grafana Tempo
# datasource stay wired, so it comes back without further changes).
replicas: 0

tempo:
  reportingEnabled: false
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    zipkin:
      endpoint: 0.0.0.0:9411

  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090/api/v1/write

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi

service:
  type: ClusterIP

persistence:
  enabled: true
  size: 5Gi

# NOTE: this belongs under `tempo:`, not at the top level. The grafana/tempo
# chart has no top-level `resources` key, so a block out here is silently
# dropped by Helm and the pod runs with no requests at all (BestEffort QoS).
# Verify with:
#   helm template tempo grafana/tempo -f local/observability/tempo/tempo-values.yaml \
#     | grep -A4 resources:
