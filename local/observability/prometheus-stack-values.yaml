# Lightweight kube-prometheus-stack for local Kind
# helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
# helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
#   -n monitoring --create-namespace -f local/observability/prometheus-stack-values.yaml

# Reduce resource footprint for local dev
prometheus:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout"
      nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "3"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    hosts:
      - prometheus.idp.local
    servicePort: 9090
  prometheusSpec:
    retention: 6h
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelector: {}
    resources:
      requests:
        cpu: 200m
        memory: 384Mi
      limits:
        cpu: 1500m
        memory: 1Gi
    # Lenient probes — same rationale as Grafana's below. The chart's default
    # liveness probe (failureThreshold=6, periodSeconds=5s = 30s grace) is far
    # shorter than WAL replay + request handling can take under local CPU
    # contention, so kubelet kills the container mid-replay, it restarts, and
    # has to replay again — a self-perpetuating crashloop (observed: 725
    # failed readiness probes / 47+ restarts over 17h+ without recovering on
    # its own, unlike other components that stabilize once load eases).
    # Overriding via `containers[]` (strategic-merge by name) since the
    # Prometheus CRD doesn't expose livenessProbe/readinessProbe directly.
    containers:
      - name: prometheus
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http-web
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 20
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: http-web
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 20
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi

alertmanager:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout"
      nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "3"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    hosts:
      - alertmanager.idp.local
  alertmanagerSpec:
    externalUrl: http://alertmanager.idp.local
    # Pick up the alertmanager-config Secret created in observability/alertmanager/alertmanager-config.yaml
    alertmanagerConfigSelector:
      matchLabels:
        app.kubernetes.io/part-of: kube-prometheus-stack
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

grafana:
  adminPassword: admin
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      jsonData:
        derivedFields:
          - datasourceName: Tempo
            datasourceUid: tempo
            matcherRegex: '"trace_id":"(\w+)"'
            name: TraceID
            url: '$${__value.raw}'
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo.monitoring.svc.cluster.local:3200
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          filterByTraceID: true
        serviceMap:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true
  # Persist Grafana's SQLite DB (service accounts, tokens, alert state) so that
  # the GRAFANA_TOKEN written to local/backstage/.env survives pod restarts and
  # helm upgrades. Without this, every Grafana pod restart wipes the DB and the
  # Backstage Grafana tab shows 401 until bootstrap re-creates the token.
  persistence:
    enabled: true
    type: pvc
    size: 500Mi
    accessModes:
      - ReadWriteOnce
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      # Retry on error, timeout, AND 503 so a restarting pod never shows to the user
      nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout http_503"
      nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "5"
      nginx.ingress.kubernetes.io/proxy-next-upstream-timeout: "10"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    hosts:
      - grafana.idp.local
  # Grafana needs ~350 Mi at steady state with dashboards loaded; give it 512 Mi
  # to avoid OOMKill during startup (which causes the readiness probe cascade and
  # the resulting 503 from nginx until the pod restarts and becomes ready again).
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi
  # Lenient probes — Grafana can be slow to start when loading dashboard ConfigMaps
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 30
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 10
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 60
    timeoutSeconds: 30
    periodSeconds: 10
    failureThreshold: 10
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: idp
          folder: IDP Services
          type: file
          options:
            path: /var/lib/grafana/dashboards/idp
        - name: dora
          folder: DORA Metrics
          type: file
          options:
            path: /var/lib/grafana/dashboards/dora
        - name: qa
          folder: QA Platform
          type: file
          options:
            path: /var/lib/grafana/dashboards/qa
        - name: ai
          folder: AI Platform
          type: file
          options:
            path: /var/lib/grafana/dashboards/ai
        - name: finops
          folder: FinOps
          type: file
          options:
            path: /var/lib/grafana/dashboards/finops
        - name: sre
          folder: SRE
          type: file
          options:
            path: /var/lib/grafana/dashboards/sre
  dashboardsConfigMaps:
    idp: grafana-dashboards-idp
    dora: grafana-dashboards-dora
    qa: grafana-qa-dashboard
    ai: grafana-dashboards-ai
    finops: grafana-dashboards-finops
    sre: grafana-dashboards-sre

kubeStateMetrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

nodeExporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 384Mi
  # Chart default is timeoutSeconds=1, failureThreshold=3 (~30s grace) — far too
  # aggressive for local CPU contention. The operator reconciles every Prometheus/
  # Alertmanager CR change into the underlying StatefulSet, so when it crashloops
  # (observed: 677 restarts over 18h), nothing else in the stack can update either
  # — including the lenient probes added to prometheusSpec/alertmanager above,
  # which is what made this the actual root blocker, not a cosmetic symptom.
  livenessProbe:
    httpGet:
      path: /healthz
      port: https
      scheme: HTTPS
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 10
  readinessProbe:
    httpGet:
      path: /healthz
      port: https
      scheme: HTTPS
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 10

# Note: Prometheus Pushgateway is installed as a separate Helm release (not a subchart of kube-prometheus-stack):
#   helm upgrade --install prometheus-pushgateway prometheus-community/prometheus-pushgateway \
#     --namespace monitoring --set serviceMonitor.enabled=true \
#     --set resources.requests.cpu=10m --set resources.requests.memory=32Mi \
#     --set resources.limits.cpu=100m --set resources.limits.memory=64Mi