# Lightweight kube-prometheus-stack for local Kind
# helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
# helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
#   -n monitoring --create-namespace -f local/observability/prometheus-stack-values.yaml

# Reduce resource footprint for local dev
prometheus:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout"
      nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "3"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    hosts:
      - prometheus.idp.local
    servicePort: 9090
  prometheusSpec:
    retention: 6h
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelector: {}
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi

alertmanager:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout"
      nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "3"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    hosts:
      - alertmanager.idp.local
  alertmanagerSpec:
    externalUrl: http://alertmanager.idp.local
    # Pick up the alertmanager-config Secret created in observability/alertmanager/alertmanager-config.yaml
    alertmanagerConfigSelector:
      matchLabels:
        app.kubernetes.io/part-of: kube-prometheus-stack
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

grafana:
  adminPassword: admin
  # Persist Grafana's SQLite DB (service accounts, tokens, alert state) so that
  # the GRAFANA_TOKEN written to local/backstage/.env survives pod restarts and
  # helm upgrades. Without this, every Grafana pod restart wipes the DB and the
  # Backstage Grafana tab shows 401 until bootstrap re-creates the token.
  persistence:
    enabled: true
    type: pvc
    size: 500Mi
    accessModes:
      - ReadWriteOnce
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      # Retry on error, timeout, AND 503 so a restarting pod never shows to the user
      nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout http_503"
      nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "5"
      nginx.ingress.kubernetes.io/proxy-next-upstream-timeout: "10"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    hosts:
      - grafana.idp.local
  # Grafana needs ~350 Mi at steady state with dashboards loaded; give it 512 Mi
  # to avoid OOMKill during startup (which causes the readiness probe cascade and
  # the resulting 503 from nginx until the pod restarts and becomes ready again).
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi
  # Lenient probes — Grafana can be slow to start when loading dashboard ConfigMaps
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 30
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 10
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 60
    timeoutSeconds: 30
    periodSeconds: 10
    failureThreshold: 10
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: idp
          folder: IDP Services
          type: file
          options:
            path: /var/lib/grafana/dashboards/idp
        - name: dora
          folder: DORA Metrics
          type: file
          options:
            path: /var/lib/grafana/dashboards/dora
        - name: qa
          folder: QA Platform
          type: file
          options:
            path: /var/lib/grafana/dashboards/qa
        - name: ai
          folder: AI Platform
          type: file
          options:
            path: /var/lib/grafana/dashboards/ai
  dashboardsConfigMaps:
    idp: grafana-dashboards-idp
    dora: grafana-dashboards-dora
    qa: grafana-qa-dashboard
    ai: grafana-dashboards-ai

kubeStateMetrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

nodeExporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

# Note: Prometheus Pushgateway is installed as a separate Helm release (not a subchart of kube-prometheus-stack):
#   helm upgrade --install prometheus-pushgateway prometheus-community/prometheus-pushgateway \
#     --namespace monitoring --set serviceMonitor.enabled=true \
#     --set resources.requests.cpu=10m --set resources.requests.memory=32Mi \
#     --set resources.limits.cpu=100m --set resources.limits.memory=64Mi